<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>水みち</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e6dcbf; --water:#6c9db5; --ochre:#9a6a3e; --moe:#8d9f4f; --shu:#c1452f; --ink:#2f2b27;
  --head:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;touch-action:none}
.screen[hidden]{display:none}
/* 地図の題箋（カルトゥーシュ）: 二重の枠 */
.cart{position:relative;width:min(340px,100%);max-height:100%;overflow:auto;background:rgba(232,222,194,.95);
  border:1.5px solid var(--ochre);outline:1px solid var(--ochre);outline-offset:-7px;
  padding:clamp(16px,3.4vh,26px) 22px clamp(14px,3vh,22px);box-shadow:2px 3px 0 rgba(47,43,39,.18)}
.cart::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;background-image:var(--grain)}
h1{font-family:var(--head);font-weight:800;font-size:clamp(46px,10vh,66px);line-height:1;letter-spacing:.12em;
  text-shadow:2px 1.5px 0 rgba(108,157,181,.55)}
.sub{font-family:var(--head);font-weight:600;font-size:15px;line-height:1.6;margin-top:clamp(6px,1.4vh,10px)}
.how{font-size:14px;line-height:1.7;margin-top:clamp(10px,2vh,16px)}
.keys{font-size:12px;line-height:1.5;margin-top:8px;color:#5c5247}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:clamp(12px,2.4vh,18px)}
button{font-family:var(--head);font-weight:800;font-size:19px;color:var(--ink);background:var(--water);border:0;
  padding:9px 20px 10px;cursor:pointer;border-radius:3px 10px 4px 8px/7px 3px 9px 4px;
  box-shadow:inset 0 0 0 1.5px rgba(47,43,39,.55),2px 2px 0 rgba(47,43,39,.5);transition:transform .07s,box-shadow .07s}
button:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 1.5px rgba(47,43,39,.55)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button.quiet{background:transparent;box-shadow:none;font-family:var(--body);font-weight:700;font-size:14px;padding:6px 2px;
  text-decoration:underline;text-underline-offset:4px}
.best{font-size:13px;font-variant-numeric:tabular-nums}
.res h2{font-family:var(--head);font-weight:800;font-size:clamp(24px,4.6vh,30px);line-height:1.2}
.res .why{font-family:var(--head);font-weight:600;font-size:15px;margin-top:4px;color:var(--shu)}
.stats{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:2px 18px;margin-top:12px;font-size:13px}
.stats dd{font-family:var(--head);font-weight:800;font-size:clamp(22px,4.2vh,28px);color:var(--shu);font-variant-numeric:tabular-nums;
  transform:rotate(-2deg);transform-origin:left bottom}
.stats .score dd{font-size:clamp(30px,6vh,40px)}
.newbest{color:var(--shu);font-weight:700}
@media (orientation:landscape) and (max-height:520px){
  .cart{width:min(560px,100%);padding:14px 22px}
  h1{font-size:48px}
  .how{margin-top:8px}
  .row{margin-top:10px}
}
@media (prefers-reduced-motion:reduce){.stats dd{transform:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="斜面の地図。なぞって水路を引く"></canvas>

<div id="title" class="screen">
  <div class="cart">
    <h1>水みち</h1>
    <p class="sub">日照りの夏、段々の田へ水を引く水番。</p>
    <p class="how">指でなぞって墨の水路を引くと、水の粒が坂を滑って田へ入る。<br>田が3枚枯れたら、その夏はおしまい。</p>
    <div class="row"><button id="go">水番をはじめる</button><span class="best" id="best1"></span></div>
    <p class="keys">PC: ドラッグで線を引く／右クリック・Zで最後の線を戻す／Mで音／Pで休む</p>
  </div>
</div>

<div id="result" class="screen" hidden>
  <div class="cart res">
    <h2>その夏の水番</h2>
    <p class="why" id="why"></p>
    <dl class="stats">
      <div><dt>収穫した穂</dt><dd id="rH">0</dd></div>
      <div><dt>守った秒数</dt><dd id="rT">0</dd></div>
      <div class="score"><dt>得点</dt><dd id="rS">0</dd></div>
    </dl>
    <p class="best" id="best2" style="margin-top:8px"></p>
    <div class="row"><button id="again">もう一回</button></div>
  </div>
</div>

<div id="pause" class="screen" hidden>
  <div class="cart">
    <h2 style="font-family:var(--head);font-weight:800;font-size:28px">ひと休み</h2>
    <p class="how">田の渇きも止まっています。</p>
    <div class="row"><button id="resume">つづける</button><button class="quiet" id="snd">音を消す</button></div>
  </div>
</div>

<script>
// <sim> ここから下はDOMに触らない（自動プレイのボットがそのまま読み込む）
var MAP_W = 360, MAP_H = 600, RIVER_Y = 574, SPRING_Y = 38;
var G = 240, FREE_VMAX = 170, LINE_VMAX = 240, FRICTION = 0.8;
var LINE_LIFE = 8, INK_MAX = 640, INK_REGEN = 64, SEG = 6, END_T = 180, MAX_WITHER = 3, PART_MAX = 260;
var SLOTS = [
  { name: "上の段", x: 22, y: 176, w: 92, h: 56, tier: 1, at: 0, dry: 0.10 },
  { name: "狐塚", x: 250, y: 146, w: 90, h: 56, tier: 1, at: 40, dry: 0 },
  { name: "柿の木", x: 26, y: 322, w: 92, h: 56, tier: 2, at: 80, dry: 0 },
  { name: "中の段", x: 242, y: 300, w: 92, h: 58, tier: 2, at: 0, dry: 0.04 },
  { name: "堰の下", x: 22, y: 462, w: 94, h: 58, tier: 3, at: 0, dry: 0 },
  { name: "川端", x: 250, y: 474, w: 90, h: 56, tier: 3, at: 120, dry: 0 }
];
function rngOf(a) {
  return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function segX(ax, ay, bx, by, cx, cy, dx, dy) {
  var rx = bx - ax, ry = by - ay, sx = dx - cx, sy = dy - cy, den = rx * sy - ry * sx;
  if (den > -1e-9 && den < 1e-9) return null;
  var qx = cx - ax, qy = cy - ay, t = (qx * sy - qy * sx) / den, u = (qx * ry - qy * rx) / den;
  if (t < 0 || t > 1 || u < 0 || u > 1) return null;
  return [t, u];
}
function Sim(seed) {
  var S = this;
  S.rng = rngOf(seed || 1); S.t = 0; S.parts = []; S.lines = []; S.ink = INK_MAX; S.score = 0; S.withers = 0;
  S.harvests = 0; S.over = false; S.reason = ""; S.evs = []; S.lid = 1; S.cur = null; S.acc = 0; S.endIn = 0; S.lost = 0;
  S.pairs = {}; S.splitSeen = {}; S.endT = 0;
  S.spring = { x: 180, tx: 180, fx: 180, move: 0, warn: 0, next: 42 };
  S.rain = { next: 66, warn: 0, on: 0 };
  S.stats = { wither: [], harvest: [], splits: 0, drawn: 0 };
  S.fields = SLOTS.map(function (s, i) {
    return { i: i, name: s.name, x: s.x, y: s.y, w: s.w, h: s.h, tier: s.tier, at: s.at, active: s.at === 0,
      dry: s.dry, growth: 0, fallow: 0, ttw: 99, combo: 0, lastDrop: -9, lastHarvest: -9, witherAt: -9 };
  });
}
Sim.prototype.ev = function (type, a, b) { this.evs.push({ type: type, a: a, b: b }); };
Sim.prototype.dryRate = function () { return 0.021 * (1 + this.t / 38); };
Sim.prototype.mult = function () { return 1 + 1.5 * Math.min(1, this.t / 150); };
Sim.prototype.spawnRate = function () { return (2.6 + this.t / 90) * (this.rain.on > 0 ? 3 : 1); };
Sim.prototype.finish = function (reason) {
  this.over = true; this.reason = reason; this.endT = Math.min(this.t, END_T); this.cur = null; this.ev("over");
};
Sim.prototype.step = function (dt) {
  var S = this, i, f;
  if (S.over) return;
  S.t += dt;
  if (S.endIn > 0) { S.endIn -= dt; if (S.endIn <= 0) { S.finish("dry"); return; } }
  else if (S.t >= END_T) { S.finish("autumn"); return; }
  for (i = 0; i < S.fields.length; i++) {
    f = S.fields[i];
    if (!f.active && S.t >= f.at) { f.active = true; f.dry = 0.12; f.growth = 0; S.ev("newfield", f); }
  }
  // 湧き口がときどき左右にずれる（2.5秒前に予告）
  var sp = S.spring;
  if (sp.move > 0) {
    sp.move = Math.max(0, sp.move - dt); var k = 1 - sp.move; k = k * k * (3 - 2 * k);
    sp.x = sp.fx + (sp.tx - sp.fx) * k;
    if (sp.move === 0) { sp.x = sp.tx; sp.next = S.t + 17 + S.rng() * 8; }
  } else if (sp.warn > 0) {
    sp.warn -= dt; if (sp.warn <= 0) { sp.warn = 0; sp.move = 1; sp.fx = sp.x; S.ev("springmove"); }
  } else if (S.t >= sp.next) {
    var nx; do { nx = 135 + S.rng() * 90; } while (Math.abs(nx - sp.x) < 30);
    sp.tx = nx; sp.warn = 2.5; S.ev("springwarn");
  }

  var r = S.rain;
  if (r.on > 0) { r.on -= dt; if (r.on <= 0) { r.on = 0; r.next = S.t + 28 + S.rng() * 10; } }
  else if (r.warn > 0) { r.warn -= dt; if (r.warn <= 0) { r.warn = 0; r.on = 10; S.ev("rain"); } }
  else if (S.t >= r.next) { r.warn = 3; S.ev("rainwarn"); }
  S.acc += S.spawnRate() * dt;
  while (S.acc >= 1) {
    S.acc -= 1;
    if (S.parts.length < PART_MAX) {
      var spread = r.on > 0 ? 18 : 5;
      S.parts.push({ x: sp.x + (S.rng() - 0.5) * spread, y: SPRING_Y + 3, vx: (S.rng() - 0.5) * 12, vy: 24,
        l: null, i: 0, u: 0, s: 0, stuck: 0, ign: null, ignT: 0 });
      S.ev("spawn");
    }
  }
  S.ink = Math.min(INK_MAX, S.ink + INK_REGEN * dt);
  for (i = S.lines.length - 1; i >= 0; i--) {
    var l = S.lines[i];
    if (l.born !== null && S.t - l.born > LINE_LIFE) { S.removeLine(l, i); S.ev("linegone", l); }
  }
  var h = dt / 2;
  for (var sub = 0; sub < 2; sub++) {
    for (i = S.parts.length - 1; i >= 0; i--) {
      var p = S.parts[i];
      if (p.ignT > 0) p.ignT -= h;
      if (p.l) S.moveLine(p, h); else S.moveFree(p, h);
      if (p.y > RIVER_Y || p.x < -8 || p.x > MAP_W + 8) { S.parts.splice(i, 1); S.lost++; continue; }
      var ff = S.fieldAt(p.x, p.y);
      if (ff) { S.parts.splice(i, 1); S.water(ff, p); }
    }
  }
  var rate = S.dryRate();
  for (i = 0; i < S.fields.length; i++) {
    f = S.fields[i];
    if (!f.active) continue;
    if (f.fallow > 0) {
      f.fallow -= dt;
      if (f.fallow <= 0) { f.fallow = 0; f.dry = 0.3; f.growth = 0; S.ev("revive", f); }
      continue;
    }
    f.dry += rate * dt;
    if (S.t < 32 && f.dry > 0.97) f.dry = 0.97;
    f.ttw = (1 - f.dry) / rate;
    if (f.dry >= 1) { if (S.endIn > 0) f.dry = 1; else S.wither(f); }
  }
};
Sim.prototype.wither = function (f) {
  var S = this;
  S.withers++; f.fallow = 10; f.dry = 1; f.growth = 0; f.witherAt = S.t; S.stats.wither.push(S.t);
  S.ev("wither", f);
  if (S.withers >= MAX_WITHER) S.endIn = 1.8;
};
Sim.prototype.fieldAt = function (x, y) {
  for (var i = 0; i < this.fields.length; i++) {
    var f = this.fields[i];
    if (f.active && f.fallow <= 0 && x > f.x + 2 && x < f.x + f.w - 2 && y > f.y + 2 && y < f.y + f.h - 2) return f;
  }
  return null;
};
Sim.prototype.water = function (f, p) {
  var S = this;
  f.dry = Math.max(0, f.dry - 0.06);
  f.combo = S.t - f.lastDrop < 0.7 ? f.combo + 1 : 0; f.lastDrop = S.t;
  f.growth += 0.055;
  S.ev("drop", f, { x: p.x, y: p.y, combo: f.combo });
  if (f.growth >= 1) S.harvest(f);
};
Sim.prototype.harvest = function (f) {
  var S = this, dual = false;
  for (var i = 0; i < S.fields.length; i++) { var g = S.fields[i]; if (g !== f && S.t - g.lastHarvest < 1.5) dual = true; }
  var pts = Math.round(10 * f.tier * S.mult()) + (dual ? 5 : 0);
  S.score += pts; S.harvests++; f.lastHarvest = S.t; f.growth = 0; f.dry = 0.35;
  S.stats.harvest.push([S.t, pts]);
  S.ev("harvest", f, { pts: pts, dual: dual });
};
Sim.prototype.moveFree = function (p, dt) {
  var S = this;
  p.vy = Math.min(FREE_VMAX, p.vy + G * dt); p.vx *= Math.pow(0.4, dt);
  var nx = p.x + p.vx * dt, ny = p.y + p.vy * dt, best = null, bt = 2;
  var minx = Math.min(p.x, nx) - 1, maxx = Math.max(p.x, nx) + 1, miny = Math.min(p.y, ny) - 1, maxy = Math.max(p.y, ny) + 1;
  for (var k = 0; k < S.lines.length; k++) {
    var l = S.lines[k];
    if (l.pts.length < 2 || (p.ign === l && p.ignT > 0)) continue;
    if (maxx < l.x0 || minx > l.x1 || maxy < l.y0 || miny > l.y1) continue;
    for (var j = 0; j < l.pts.length - 1; j++) {
      var a = l.pts[j], b = l.pts[j + 1];
      var rr = segX(p.x, p.y, nx, ny, a.x, a.y, b.x, b.y);
      if (rr && rr[0] < bt) { bt = rr[0]; best = { l: l, j: j, u: rr[1] }; }
    }
  }
  if (best) {
    var a2 = best.l.pts[best.j], b2 = best.l.pts[best.j + 1], len = best.l.len[best.j];
    var ux = (b2.x - a2.x) / len, uy = (b2.y - a2.y) / len;
    p.l = best.l; p.i = best.j; p.u = best.u; p.stuck = 0;
    p.s = (p.vx * ux + p.vy * uy) * 0.7;
    p.x = a2.x + (b2.x - a2.x) * best.u; p.y = a2.y + (b2.y - a2.y) * best.u;
  } else { p.x = nx; p.y = ny; }
};
Sim.prototype.detach = function (p, vx, vy) {
  p.ign = p.l; p.ignT = 0.4; p.l = null; p.vx = vx; p.vy = vy; p.stuck = 0;
};
Sim.prototype.moveLine = function (p, dt) {
  var S = this, l = p.l, pts = l.pts, n = pts.length - 1;
  var a = pts[p.i], b = pts[p.i + 1], len = l.len[p.i], ux = (b.x - a.x) / len, uy = (b.y - a.y) / len;
  p.s += (G * uy - FRICTION * p.s) * dt;
  if (p.s > LINE_VMAX) p.s = LINE_VMAX; else if (p.s < -LINE_VMAX) p.s = -LINE_VMAX;
  if (p.s > -12 && p.s < 12) { p.stuck += dt; if (p.stuck > 0.7) { S.detach(p, 0, 30); return; } } else p.stuck = 0;

  while (u > 1 || u < 0) {

      else { a = pts[n - 1]; b = pts[n]; len = l.len[n - 1]; p.x = b.x; p.y = b.y;
        S.detach(p, p.s * (b.x - a.x) / len, p.s * (b.y - a.y) / len); return; }
    } else {
      if (p.i > 0) { rem = -u * len; p.i--; len = l.len[p.i]; u = 1 - rem / len; }
      else { a = pts[0]; b = pts[1]; len = l.len[0]; p.x = a.x; p.y = a.y;
        S.detach(p, p.s * (b.x - a.x) / len, p.s * (b.y - a.y) / len); return; }
    }
  }

  if (l.wet[p.i] < 1) l.wet[p.i] = Math.min(1, l.wet[p.i] + 0.1);

  var minx = Math.min(ox, p.x) - 1, maxx = Math.max(ox, p.x) + 1, miny = Math.min(oy, p.y) - 1, maxy = Math.max(oy, p.y) + 1;
  for (var k = 0; k < S.lines.length; k++) {
    var m = S.lines[k];
    if (m === l || m.pts.length < 2 || (p.ign === m && p.ignT > 0)) continue;
    if (maxx < m.x0 || minx > m.x1 || maxy < m.y0 || miny > m.y1) continue;
    for (var j = 0; j < m.pts.length - 1; j++) {

        p.ign = l; p.ignT = 0.3; p.l = m; p.i = j; p.u = rr[1]; p.stuck = 0;
        p.s = (vx * (d.x - c.x) + vy * (d.y - c.y)) / ml;
        p.x = c.x + (d.x - c.x) * rr[1]; p.y = c.y + (d.y - c.y) * rr[1];
        S.stats.splits++;

};
Sim.prototype.removeLine = function (l, idx) {
  if (idx === undefined) idx = this.lines.indexOf(l);
  if (idx >= 0) this.lines.splice(idx, 1);
  l.dead = true;
  for (var i = 0; i < this.parts.length; i++) {
    var p = this.parts[i];
    if (p.l === l) { var a = l.pts[p.i], b = l.pts[p.i + 1], len = l.len[p.i];
      this.detach(p, p.s * (b.x - a.x) / len, p.s * (b.y - a.y) / len); }
  }

};
Sim.prototype.beginLine = function (x, y) {
  var S = this;
  if (S.over) return null;
  if (S.cur) S.endLine();
  if (S.ink < SEG) { S.ev("noink"); return null; }
  var l = { id: S.lid++, pts: [{ x: x, y: y }], len: [], wet: [], born: null, total: 0, full: false,
    x0: x - 2, y0: y - 2, x1: x + 2, y1: y + 2, dead: false };
  S.lines.push(l); S.cur = l; return l;
};
Sim.prototype.extendLine = function (x, y) {
  var S = this, l = S.cur;
  if (!l || l.full) return;
  var last = l.pts[l.pts.length - 1], dx = x - last.x, dy = y - last.y, d = Math.sqrt(dx * dx + dy * dy);
  if (d < SEG) return;
  var steps = Math.ceil(d / (SEG * 2)), sx = dx / steps, sy = dy / steps, sl = d / steps;
  for (var k = 0; k < steps; k++) {
    if (l.pts.length >= 200) { l.full = true; return; }
    var cost = sl, fr = 1;
    if (S.ink < cost) { fr = S.ink / cost; l.full = true; S.ev("noink"); if (fr * sl < 2) return; }
    last = l.pts[l.pts.length - 1];

      tt = i / Math.max(1, n - 1); w = base * (1.15 - 0.6 * tt);
      a = l.pts[i]; b = l.pts[i + 1];
      var ax = X(a.x) + l.jit[i][0], ay = Y(a.y) + l.jit[i][1], bx = X(b.x) + l.jit[i + 1][0], by = Y(b.y) + l.jit[i + 1][1];
      cx.strokeStyle = "rgba(108,157,181," + (0.28 * l.wet[i] * life).toFixed(3) + ")"; cx.lineWidth = w * 2.6;
      cx.beginPath(); cx.moveTo(ax + 1, ay + 1); cx.lineTo(bx + 1, by + 1); cx.stroke();
      cx.strokeStyle = "rgba(108,157,181," + (0.95 * l.wet[i] * life).toFixed(3) + ")"; cx.lineWidth = w * 0.7;
      cx.beginPath(); cx.moveTo(ax, ay); cx.lineTo(bx, by); cx.stroke();
    }
  }

  function drawSpring(now) {
    var sp = S.spring, x = X(sp.x), y = Y(SPRING_Y), r = 7 * sc, rn = S.rain;
    // にわか雨の雲
    if (rn.warn > 0 || rn.on > 0) {
      var a = rn.on > 0 ? Math.min(1, rn.on / 1.5) : Math.min(1, (3 - rn.warn) / 1.2);
      cx.fillStyle = "rgba(111,125,134," + (0.4 * a).toFixed(3) + ")";
      [[-30, -16, 20], [-8, -22, 24], [18, -17, 19], [36, -12, 13]].forEach(function (c) {
        cx.beginPath(); cx.arc(x + c[0] * sc, y + c[1] * sc, c[2] * sc, 0, 6.29); cx.fill();
      });
      if (rn.on > 0) {
        cx.strokeStyle = "rgba(79,127,152,.75)"; cx.lineWidth = 1.3;
        for (var i = 0; i < 16; i++) {
          var rx = x + ((i * 37) % 90 - 45) * sc, ry = y + (((now * 160 + i * 23) % 60) - 18) * sc;
          cx.beginPath(); cx.moveTo(rx, ry); cx.lineTo(rx - 3 * sc, ry + 9 * sc); cx.stroke();
        }
      } else {
        cx.fillStyle = C.ink; cx.font = font(Math.max(12, 13 * sc), 800); cx.textAlign = "left";
        cx.fillText("にわか雨が来る", x + 44 * sc, y - 6 * sc);
      }
    }
    // 湧き口が動く予告
    if (sp.warn > 0 && Math.sin(now * 14) > -0.3) {
      var tx = X(sp.tx);
      cx.setLineDash([3, 3]); cx.strokeStyle = C.ink; cx.lineWidth = 1.4;
      cx.beginPath(); cx.arc(tx, y, r * 1.4, 0, 6.29); cx.stroke(); cx.setLineDash([]);
      cx.beginPath(); cx.moveTo(x, y + r * 2.2); cx.lineTo(tx, y + r * 2.2);
      var dir = tx > x ? 1 : -1;
      cx.moveTo(tx - dir * 6, y + r * 2.2 - 4); cx.lineTo(tx, y + r * 2.2); cx.lineTo(tx - dir * 6, y + r * 2.2 + 4); cx.stroke();
    }
    // 湧き口（ゆっくり広がる波紋だけが、何もしていない時の動き）
    for (var k = 0; k < 2; k++) {
      var ph = (now * 0.6 + k * 0.5) % 1;
      cx.strokeStyle = "rgba(79,127,152," + (0.6 * (1 - ph)).toFixed(3) + ")"; cx.lineWidth = 1.2;
      cx.beginPath(); cx.ellipse(x, y, r + ph * 12 * sc, (r + ph * 12 * sc) * 0.6, 0, 0, 6.29); cx.stroke();
    }
    cx.fillStyle = C.water; cx.beginPath(); cx.ellipse(x + 1, y + 1, r, r * 0.62, 0, 0, 6.29); cx.fill();
    cx.strokeStyle = C.ink; cx.lineWidth = 1.3; cx.beginPath(); cx.ellipse(x, y, r, r * 0.62, 0.05, 0, 6.29); cx.stroke();
    cx.fillStyle = C.ink; cx.font = font(Math.max(12, 12 * sc), 800); cx.textAlign = "right";
    cx.fillText("湧き口", x - r - 6, y + 4);
  }

  function drawFx(now) {
    for (var i = fx.length - 1; i >= 0; i--) {
      var e = fx[i], k = (now - e.t) / e.d;
      if (k >= 1) { fx.splice(i, 1); continue; }
      var x = X(e.x), y = Y(e.y);
      if (e.k === "ring") {
        cx.strokeStyle = "rgba(79,127,152," + (0.8 * (1 - k)).toFixed(3) + ")"; cx.lineWidth = 1.2;
        cx.beginPath(); cx.ellipse(x, y, (2 + k * 9) * sc, (2 + k * 9) * sc * 0.6, 0, 0, 6.29); cx.stroke();
      } else if (e.k === "ear") {
        var pop = k < 0.15 ? k / 0.15 : 1, yy = y - (14 + k * 26) * sc, al = k > 0.75 ? (1 - k) / 0.25 : 1;
        cx.save(); cx.globalAlpha = al; cx.translate(x, yy); cx.scale(pop * sc, pop * sc);
        cx.strokeStyle = "#7d6a22"; cx.lineWidth = 1.6;
        cx.beginPath(); cx.moveTo(0, 16); cx.quadraticCurveTo(2, 2, 9, -12); cx.stroke();
        cx.fillStyle = C.gold;
        for (var j = 0; j < 6; j++) {
          cx.beginPath(); cx.ellipse(2 + j * 1.3 - 4, 8 - j * 3.6, 2.6, 4.2, -0.5, 0, 6.29); cx.fill();
          cx.beginPath(); cx.ellipse(6 + j * 1.3, 9 - j * 3.6, 2.6, 4.2, 0.5, 0, 6.29); cx.fill();
        }
        cx.restore();
        cx.globalAlpha = al; cx.fillStyle = C.ink; cx.font = font(Math.max(14, 17 * sc), 800); cx.textAlign = "left";
        cx.fillText("+" + e.pts + (e.dual ? " 分水" : ""), x + 14 * sc, yy + 4 * sc); cx.globalAlpha = 1;
      } else if (e.k === "split") {
        cx.strokeStyle = "rgba(79,127,152," + (1 - k).toFixed(3) + ")"; cx.lineWidth = 2;
        cx.beginPath(); cx.arc(x, y, (4 + k * 16) * sc, 0, 6.29); cx.stroke();
      } else if (e.k === "new") {
        cx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1; cx.fillStyle = C.ink; cx.font = font(Math.max(14, 18 * sc), 800); cx.textAlign = "center";
        cx.fillText("新田", x, y + 6); cx.globalAlpha = 1;
      }
    }
  }

  function drawSuzuri(x, y, w, h) {
    hud.suz = { x: x - 6, y: y - 6, w: w + 12, h: h + 26 };
    cx.fillStyle = "#4a433c"; cx.beginPath();
    cx.moveTo(x + 6, y); cx.lineTo(x + w - 5, y + 1); cx.quadraticCurveTo(x + w, y + 2, x + w, y + 8);
    cx.lineTo(x + w - 1, y + h - 5); cx.quadraticCurveTo(x + w - 2, y + h, x + w - 8, y + h);
    cx.lineTo(x + 5, y + h - 1); cx.quadraticCurveTo(x, y + h - 2, x + 1, y + h - 7); cx.lineTo(x, y + 6); cx.closePath(); cx.fill();
    var ix = x + 5, iy = y + 5, iw = w - 10, ih = h - 10, k = S.ink / INK_MAX;
    cx.fillStyle = "#9a9084"; cx.fillRect(ix, iy, iw, ih);
    cx.fillStyle = k < 0.15 ? "#3a2420" : "#191512"; cx.fillRect(ix, iy, iw * k, ih);
    cx.fillStyle = C.ink; cx.font = font(12, 700, FB); cx.textAlign = "center"; cx.textBaseline = "alphabetic";
    cx.textAlign = land ? "center" : "left";
    cx.fillText(land ? "墨　タップで1本戻す" : "タップで戻す", land ? x + w / 2 : x, y + h + 15);
  }
  function drawWithers(x, y, s) {
    for (var i = 0; i < MAX_WITHER; i++) {
      var bx = x + i * (s + 7);
      cx.strokeStyle = C.ink; cx.lineWidth = 1.2; cx.strokeRect(bx, y, s, s * 0.75);
      if (i < S.withers) {
        cx.strokeStyle = C.shu; cx.lineWidth = 3; cx.lineCap = "round";
        cx.beginPath(); cx.moveTo(bx + 2, y + 2); cx.lineTo(bx + s - 2, y + s * 0.75 - 2);
        cx.moveTo(bx + s - 2, y + 2); cx.lineTo(bx + 2, y + s * 0.75 - 2); cx.stroke();
      }
    }
  }
  function drawPause(x, y) {
    hud.pz = { x: x - 8, y: y - 8, w: 44, h: 44 };
    cx.strokeStyle = C.ink; cx.lineWidth = 1.3; cx.strokeRect(x, y, 28, 28);
    cx.fillStyle = C.ink; cx.fillRect(x + 8, y + 7, 4, 14); cx.fillRect(x + 16, y + 7, 4, 14);
  }
  function drawHud() {
    var left = Math.max(0, Math.ceil(END_T - S.t)), mult = S.mult().toFixed(1);
    cx.textBaseline = "alphabetic";
    if (!land) {
      var h = hud.h;
      cx.save(); cx.translate(Math.max(0, mx - 8), hud.top); W -= 2 * Math.max(0, mx - 8);
      drawSuzuri(12, 9, 78, Math.max(24, h - 38));
      cx.fillStyle = C.ink; cx.textAlign = "center"; cx.font = font(Math.min(32, h * 0.46), 800);
      cx.fillText(String(S.score), W / 2, h * 0.5);
      cx.font = font(12, 700, FB);
      cx.fillText("立秋まで" + left + "秒　季節×" + mult, W / 2, h * 0.5 + 18);
      drawWithers(W - 128, 12, 22);
      cx.font = font(12, 700, FB); cx.textAlign = "left"; cx.fillText("枯れた田", W - 128, 12 + 16 + 17);
      drawPause(W - 40, 10);
      W += 2 * Math.max(0, mx - 8); cx.restore();
      var off = Math.max(0, mx - 8);
      hud.suz.x += off; hud.suz.y += hud.top; hud.pz.x += off; hud.pz.y += hud.top;
    } else {
      var lw = mx - 10, cxl = lw / 2, rx0 = mx + MAP_W * sc + 10, cxr = rx0 + (W - rx0) / 2;
      var sw = Math.min(120, lw - 30);
      drawSuzuri(cxl - sw / 2, H * 0.3, sw, 40);
      cx.fillStyle = C.ink; cx.textAlign = "center"; cx.font = font(14, 700, FB);
      cx.fillText("立秋まで " + left + "秒", cxl, H * 0.3 + 92);
      cx.font = font(36, 800); cx.fillText(String(S.score), cxr, H * 0.32);
      cx.font = font(13, 700, FB); cx.fillText("季節×" + mult, cxr, H * 0.32 + 22);
      drawWithers(cxr - 47, H * 0.32 + 48, 26);
      cx.font = font(13, 700, FB); cx.textAlign = "center"; cx.fillText("枯れた田", cxr, H * 0.32 + 48 + 20 + 18);
      drawPause(W - 44, 12);
    }
  }

  function render() {
    var now = performance.now() / 1000, i;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.drawImage(bg, 0, 0, W, H);
    cx.drawImage(st, 0, 0, W, H);
    for (i = 0; i < S.fields.length; i++) {
      var f = S.fields[i];
      if (f.fallow > 0 && !f._wt) f._wt = now;
      if (f.fallow <= 0) f._wt = 0;
      drawField(f, now);
    }
    drawSpring(now);
    for (i = 0; i < S.lines.length; i++) drawLine(S.lines[i], now);
    var pr = Math.max(2, 2.6 * sc);
    cx.fillStyle = C.water;
    for (i = 0; i < S.parts.length; i++) { var p = S.parts[i]; cx.beginPath(); cx.arc(X(p.x), Y(p.y), pr, 0, 6.29); cx.fill(); }
    cx.strokeStyle = "rgba(79,127,152,.9)"; cx.lineWidth = 0.8;
    for (i = 0; i < S.parts.length; i++) { var q = S.parts[i]; cx.beginPath(); cx.arc(X(q.x) + 0.6, Y(q.y) + 0.5, pr, 0, 6.29); cx.stroke(); }
    drawFx(now);
    if (state !== "title") drawHud();
  }

  // ---- 進行
  function audioTick() {
    if (!AC || muted) return;
    var riding = 0, warn = false;
    if (state === "play") {
      for (var i = 0; i < S.parts.length; i++) if (S.parts[i].l) riding++;
      for (var j = 0; j < S.fields.length; j++) { var f = S.fields[j]; if (f.active && f.fallow <= 0 && f.ttw < 3) warn = true; }
    }
    slideGain.gain.setTargetAtTime(Math.min(0.05, riding * 0.004), AC.currentTime, 0.08);
    if (warn) SND.chirr();
  }
  var last = performance.now(), acc = 0;
  function frame(t) {
    var dt = Math.min(0.1, (t - last) / 1000); last = t;
    if (state === "play") {
      acc += dt;
      while (acc >= 1 / 60) { S.step(1 / 60); acc -= 1 / 60; }
      handleEvents();
      if (S.over) endGame();
    }
    render(); audioTick();
    requestAnimationFrame(frame);
  }

  function showBest() {
    $("best1").textContent = best > 0 ? "これまでの最高 " + best + "点" : "";
  }
  function start() {
    audioInit();
    S = new Sim((Math.random() * 1e9) | 0); fx = []; drawing = null; acc = 0;
    stx.clearRect(0, 0, W, H);
    $("title").hidden = true; $("result").hidden = true; $("pause").hidden = true;
    state = "play";
  }
  function endGame() {
    state = "result"; drawing = null; resultAt = performance.now();
    var isBest = S.score > best;
    if (isBest) { best = S.score; try { localStorage.setItem("wl-best", String(best)); } catch (e) {} }
    $("why").textContent = S.reason === "autumn" ? "立秋まで守った" : "田が3枚枯れた";
    $("rH").textContent = S.harvests + "本"; $("rT").textContent = Math.floor(S.endT) + "秒"; $("rS").textContent = S.score;
    $("best2").innerHTML = isBest ? '<span class="newbest">これまでで一番の夏</span>' : "これまでの最高 " + best + "点";
    $("result").hidden = false; showBest();
  }
  function pause(on) {
    if (on && state === "play") { state = "pause"; $("pause").hidden = false; if (drawing) { S.endLine(); drawing = null; } }
    else if (!on && state === "pause") { state = "play"; $("pause").hidden = true; last = performance.now(); }
  }

  // ---- 入力（なぞり）
  function toMap(e) { return { x: (e.clientX - mx) / sc, y: (e.clientY - my) / sc }; }
  function inside(r, e) { return r && e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h; }
  cv.addEventListener("pointerdown", function (e) {
    audioInit();
    if (state !== "play") return;
    e.preventDefault();
    if (e.button === 2) { S.undo(); return; }
    if (inside(hud.pz, e)) { pause(true); return; }
    if (inside(hud.suz, e)) { S.undo(); return; }
    var m = toMap(e);
    if (m.x < -6 || m.x > MAP_W + 6 || m.y < -6 || m.y > MAP_H + 6) return;
    if (S.beginLine(Math.max(0, Math.min(MAP_W, m.x)), Math.max(0, Math.min(MAP_H, m.y)))) {
      drawing = e.pointerId;
      try { cv.setPointerCapture(e.pointerId); } catch (er) {}
    }
  });
  cv.addEventListener("pointermove", function (e) {
    if (drawing !== e.pointerId || state !== "play") return;
    e.preventDefault();
    var list = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    if (!list.length) list = [e];
    for (var i = 0; i < list.length; i++) {
      var m = toMap(list[i]); S.extendLine(Math.max(0, Math.min(MAP_W, m.x)), Math.max(0, Math.min(MAP_H, m.y)));
    }
    SND.pen();
  });
  function up(e) { if (drawing === e.pointerId) { drawing = null; if (state === "play") S.endLine(); } }
  cv.addEventListener("pointerup", up);
  cv.addEventListener("pointercancel", up);
  cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

  $("title").addEventListener("click", function () { start(); });
  $("go").addEventListener("click", function (e) { e.stopPropagation(); start(); });
  $("again").addEventListener("click", function () { if (performance.now() - resultAt > 500) start(); });
  $("resume").addEventListener("click", function () { audioInit(); pause(false); });
  $("snd").addEventListener("click", function () { audioInit(); setMute(!muted); });
  window.addEventListener("keydown", function (e) {
    var k = e.code;
    if (k === "KeyM") { audioInit(); setMute(!muted); return; }
    if (state === "title" && (k === "Enter" || k === "Space")) { e.preventDefault(); start(); return; }
    if (state === "result" && (k === "Enter" || k === "Space") && performance.now() - resultAt > 600) { e.preventDefault(); start(); return; }
    if (state === "play") {
      if (k === "KeyZ") { S.undo(); return; }
      if (k === "KeyP" || k === "Escape") { pause(true); return; }
      if (k === "Space") e.preventDefault();
    } else if (state === "pause" && (k === "KeyP" || k === "Escape" || k === "Enter" || k === "Space")) { e.preventDefault(); pause(false); }
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden) pause(true); });
  window.addEventListener("resize", layout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { buildBg(); }).catch(function () {});

  setMute(muted); showBest(); layout();
  requestAnimationFrame(frame);
  window.__wl = { get sim() { return S; }, get state() { return state; } };
})();
</script>
</body>
</html>
