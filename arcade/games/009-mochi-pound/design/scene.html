<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>ぺったん二人前 代表場面</title>
<link href="https://fonts.googleapis.com/css2?family=Stick&family=Zen+Kurenaido&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#5e5952}svg{display:block}</style>
</head><body>
<svg id="s" width="390" height="844" viewBox="0 0 390 844"></svg>
<script src="paper.js"></script>
<script>
// 代表場面（修正版）: 2臼目のなかば。「ぺったんぺったん（杵・杵・返し）」の2打目の杵がぴったり入った瞬間。
// 左手（軍手）は臼の外に引いていて安全。ブルーシートは駐車場のアスファルトの上に敷いた1枚で、端・ハトメ・たたみじわが見える。
const s = document.getElementById("s");
defs(s);
setSeed(9);
// --- 地面: 駐車場のアスファルト（画面の地）と白線の切れ端 ---
piece(s, cut([[-5, 140], [395, 140], [395, 850], [-5, 850]], 0), C.asphalt, { sh: null, tex: "fib" });
piece(s, torn([[-5, 690], [60, 684], [62, 694], [-5, 701]], 1.2, 4), C.mochi, { sh: [2, 3], op: 0.75 });
// --- 奥: ブロック塀（笠木＋目地は所々だけ） ---
piece(s, torn([[-5, -5], [395, -5], [395, 166], [-5, 170]], 1, 8), C.block, { sh: [0, 4], tex: "fib" });
piece(s, torn([[-5, -5], [395, -5], [395, 16], [-5, 19]], 1.2, 6), C.blockD, { sh: [0, 4] });
marker(s, [[0, 62], [60, 61], [118, 63]], 1.6, C.blockD, 0.6);
marker(s, [[262, 57], [330, 59], [392, 56]], 1.6, C.blockD, 0.6);
marker(s, [[83, 19], [84, 61]], 1.6, C.blockD, 0.5);
marker(s, [[352, 59], [351, 108]], 1.6, C.blockD, 0.5);

// --- ブルーシート: 画面の中に端が出る1枚。たたみじわは細い直線の帯（間隔不揃い） ---
const SH = [[20, 238], [374, 230], [384, 664], [10, 680]];
piece(s, cut(SH, 1.5), C.ao, { sh: [3, 5] });
const fold = (a, b, w, col, op) => piece(s, cut([[a[0] - w, a[1]], [a[0] + w, a[1]], [b[0] + w, b[1]], [b[0] - w, b[1]]], 0.4), col, { sh: null, op });
const foldH = (a, b, w, col, op) => piece(s, cut([[a[0], a[1] - w], [b[0], b[1] - w], [b[0], b[1] + w], [a[0], a[1] + w]], 0.4), col, { sh: null, op });
// 縁の三つ折りの縫い代（内側に細い帯）
piece(s, cut([[20, 238], [374, 230], [374.5, 237], [20.5, 245]], 0.3), C.aoD, { sh: null, op: 0.55 });
piece(s, cut([[10, 673], [384, 657], [384, 664], [10, 680]], 0.3), C.aoD, { sh: null, op: 0.55 });
piece(s, cut([[20, 238], [27, 238], [17, 680], [10, 680]], 0.3), C.aoD, { sh: null, op: 0.55 });
// たたみじわは2本だけ（谷の線＋山の細い明るい線。間隔も傾きもそろえない）
fold([128, 240], [118, 670], 1.1, C.aoD, 0.5); fold([131, 240], [121, 670], 0.8, C.aoL, 0.55);
foldH([24, 382], [378, 371], 1.1, C.aoD, 0.5); foldH([24, 385], [378, 374], 0.8, C.aoL, 0.55);
// ハトメ（角に3つ。銀の小さな輪）
for (const [x, y] of [[30, 248], [366, 241], [24, 666]]) {
  el("ellipse", { cx: x + 1.5, cy: y + 2, rx: 6, ry: 4.4, fill: C.sumi, opacity: 0.45 }, s);
  el("ellipse", { cx: x, cy: y, rx: 6, ry: 4.4, fill: C.blockL, stroke: C.blockD, "stroke-width": 1.2 }, s);
  el("ellipse", { cx: x + 0.5, cy: y + 0.3, rx: 2.4, ry: 1.6, fill: C.asphalt }, s);
}
// 取り粉の粉だまり（白を薄く。青のちぎり片は置かない）
piece(s, torn(ell(304, 612, 18, 6, 14, 0, Math.PI * 2, 0.2), 2, 3), C.mochi, { sh: [1.5, 2], op: 0.9 });
piece(s, torn(ell(226, 650, 10, 4, 12, 0, Math.PI * 2, 0.25), 2, 3), C.mochi, { sh: [1.5, 2], op: 0.9 });

// --- 見物人と太鼓（顔は1人ずつ手で切った形。目は黒い紙の小さな楕円） ---
const eye = (g, x, y, rx, ry) => piece(g, smooth(ell(x, y, rx, ry, 6, 0, Math.PI * 2, 0.12)), C.sumi, { sh: null });
const ear = (g, x, y, r) => piece(g, smooth(ell(x, y, r * 0.7, r, 6, 0, Math.PI * 2, 0.1)), C.usudai, { sh: [1.5, 2] });
const boot = (g, x, y, col, w = 15) => piece(g, cut([[x, y - 14], [x + w * 0.6, y - 14], [x + w * 0.65, y - 4], [x + w, y - 3], [x + w, y + 3], [x, y + 3]], 0.8), col, { sh: [2, 2.5] });
// 太鼓の人（左）: 灰のダウン、面長、口を開けて掛け声。手は毛糸の茶の手袋
const tg = el("g", {}, s);
piece(tg, cut([[18, 190], [92, 186], [94, 250], [16, 254]], 1), C.dai, { line: C.sumi, lw: 2 }); // ビールケース
piece(tg, cut([[36, 202], [72, 200], [72, 214], [36, 216]], 0.8), C.sumi, { sh: null, op: 0.75 });
marker(tg, [[22, 230], [88, 227]], 1.6, C.sumi, 0.6).setAttribute("opacity", 0.55);
boot(tg, 26, 262, C.keyakiD, 17); boot(tg, 56, 263, C.keyakiD, 17);
piece(tg, torn([[30, 112], [84, 108], [96, 192], [20, 196]], 1.4, 5), C.asphalt, { tex: "fib" }); // ダウン
piece(tg, torn([[24, 150], [94, 146], [95, 156], [23, 160]], 1, 4), "#77716a", { sh: [1.5, 2] }); // ダウンの段
piece(tg, cut([[36, 166], [52, 165], [52, 180], [36, 181]], 0.8), C.block, { sh: [1.5, 2] }); // ポケット
piece(tg, torn([[38, 104], [76, 102], [74, 118], [40, 120]], 1, 3), C.block, { sh: [1.5, 2] }); // 襟
ear(tg, 34, 82, 7);
piece(tg, smooth([[38, 70], [56, 62], [74, 70], [76, 92], [68, 106], [56, 110], [44, 104], [36, 90]]), C.usudai, { sh: [2.5, 3], tex2: "fib" });
eye(tg, 48, 82, 2.6, 3.4); eye(tg, 64, 80, 2.2, 3);
piece(tg, smooth(ell(57, 97, 5, 3.5, 7)), C.sumi, { sh: null });
piece(tg, torn([[34, 70], [40, 50], [58, 44], [76, 52], [80, 70], [62, 64], [46, 66]], 1.2, 4), C.keyakiL, { tex: "fib" }); // 毛糸の帽子
// 太鼓
piece(tg, smooth([[96, 150], [104, 132], [150, 128], [158, 148], [152, 196], [104, 200], [96, 182]]), C.keyakiD, { tex: "wood", tex2: "fib" });
piece(tg, smooth(ell(157, 165, 9, 34, 12)), C.blockL, { line: C.sumi, lw: 2 });
for (const [x, y] of [[106, 142], [118, 135], [134, 134], [147, 138], [108, 190], [125, 194], [143, 191]]) el("circle", { cx: x + j(1), cy: y + j(1), r: 1.8, fill: C.keyakiL }, tg);
piece(tg, cut([[110, 200], [146, 198], [150, 238], [106, 240]], 1), C.keyaki, { tex2: "fib" }); // 台
piece(tg, cut([[84, 118], [130, 84], [134, 89], [88, 123]], 0.5), C.keyakiL, { sh: [2, 3] }); // 撥
gunte(tg, 86, 120, 0.5, 40, { knit: true });
// 見物人A: 長い黒のコート、濃い青のマフラー、冬のマスク
const pa = el("g", {}, s);
boot(pa, 176, 236, C.sumi, 16); boot(pa, 204, 238, C.sumi, 16);
piece(pa, torn([[176, 112], [222, 108], [232, 226], [168, 228]], 1.3, 5), C.sumi, { tex: "fib" });
piece(pa, cut([[194, 160], [210, 159], [211, 174], [195, 175]], 0.8), "#4a3a2e", { sh: [1.5, 2] }); // ポケット
piece(pa, torn([[180, 108], [218, 104], [222, 122], [176, 126]], 1.2, 4), C.aoD, { tex: "fib" });
piece(pa, cut([[204, 120], [216, 118], [220, 152], [208, 154]], 0.8), C.aoD, { tex: "fib" });
piece(pa, torn([[180, 76], [186, 56], [204, 52], [218, 62], [220, 90], [214, 76], [184, 84]], 1, 4), C.keyakiD); // 髪
piece(pa, smooth([[184, 70], [200, 64], [216, 72], [214, 94], [200, 104], [186, 94]]), C.usudai, { sh: [2.5, 3] });
eye(pa, 193, 78, 2, 2.6); eye(pa, 207, 77.5, 2.3, 2.4);
piece(pa, smooth([[184, 86], [200, 84], [216, 86], [212, 100], [200, 104], [188, 99]]), C.mochi, { sh: [1.5, 2] }); // マスク
marker(pa, [[184, 87], [178, 82]], 1.2); marker(pa, [[216, 87], [221, 82]], 1.2);
// 見物人B: 子ども（濃い青のフード、下ぶくれ、頬は顔の紙の2枚重ね）
const pb = el("g", {}, s);
boot(pb, 242, 230, C.keyaki, 13); boot(pb, 262, 231, C.keyaki, 13);
piece(pb, torn([[240, 152], [276, 150], [282, 218], [236, 220]], 1.3, 4), C.aoD, { tex: "fib" });
piece(pb, cut([[246, 186], [270, 185], [271, 196], [247, 197]], 0.8), C.ao, { sh: [1.5, 2] }); // ポケット
piece(pb, smooth([[236, 128], [244, 104], [272, 102], [282, 126], [276, 148], [242, 150]]), C.aoD, { tex: "fib" });
piece(pb, smooth([[248, 118], [258, 112], [270, 118], [272, 134], [260, 142], [246, 134]]), C.usudai, { sh: [2, 2.5] });
piece(pb, smooth(ell(250, 132, 3.5, 2.5, 6)), C.hoho, { sh: null }); piece(pb, smooth(ell(268, 131, 3.5, 2.5, 6)), C.hoho, { sh: null });
eye(pb, 254, 124, 1.7, 2.2); eye(pb, 264, 125, 1.9, 2.4);
marker(pb, [[256, 134], [259, 136], [262, 134]], 1.4);
// 見物人C: ハンチングのおじいさん（角ばった顔、眼鏡、腕組み）
const pc = el("g", {}, s);
boot(pc, 290, 232, C.sumi, 16); boot(pc, 314, 233, C.sumi, 16);
piece(pc, smooth([[290, 114], [308, 108], [326, 114], [336, 134], [334, 222], [282, 222], [280, 134]]), C.keyaki, { tex: "fib" });
piece(pc, cut([[296, 112], [320, 112], [314, 128], [302, 128]], 0.6), C.keyakiD, { sh: [1.5, 2] }); // 襟
piece(pc, smooth([[284, 146], [312, 152], [332, 140], [334, 156], [310, 168], [282, 160]]), C.keyakiD, { sh: [2, 3], tex2: "fib" });
piece(pc, smooth([[290, 140], [300, 136], [306, 142], [298, 148]]), C.usudai, { sh: [1, 1.5] });
piece(pc, smooth([[318, 148], [326, 144], [330, 150], [322, 154]]), C.usudai, { sh: [1, 1.5] });
ear(pc, 293, 92, 6); ear(pc, 323, 92, 6);
piece(pc, cut([[294, 76], [322, 75], [324, 102], [312, 110], [298, 108], [293, 100]], 0.8), C.usudai, { sh: [2.5, 3] });
eye(pc, 303, 90, 1.6, 1.8); eye(pc, 315, 89.5, 1.8, 1.7);
marker(pc, [[297, 89], [303, 86], [309, 89]], 1.3); marker(pc, [[310, 89], [316, 86], [322, 89]], 1.3); // 眼鏡
marker(pc, [[303, 101], [313, 101.5]], 1.6);
piece(pc, cut([[288, 78], [300, 64], [322, 64], [330, 76], [338, 80], [290, 82]], 0.8), C.blockD, { tex: "fib" });

// --- 蒸籠（右上）と湯気 ---
const sg = el("g", {}, s);
piece(sg, cut([[300, 238], [386, 236], [388, 300], [298, 302]], 0.8), C.keyakiL, { tex: "wood", tex2: "fib", line: C.sumi, lw: 2 });
piece(sg, cut([[300, 264], [388, 262], [388, 272], [300, 274]], 0.6), C.keyaki, { sh: [1.5, 2] });
piece(sg, cut([[306, 214], [380, 212], [386, 238], [300, 240]], 0.8), C.keyaki, { tex: "wood", tex2: "fib", line: C.sumi, lw: 2 });
piece(sg, torn([[312, 210], [372, 206], [380, 226], [354, 222], [330, 230], [308, 224]], 1.3, 4), C.mochi);
piece(sg, torn([[324, 206], [344, 194], [348, 176], [340, 160], [354, 146], [368, 160], [364, 186], [352, 206]], 2, 5), C.mochi, { sh: null, op: 0.6 });
piece(sg, torn([[356, 150], [366, 132], [382, 124], [380, 142], [368, 154]], 1.8, 4), C.mochi, { sh: null, op: 0.42 });

// --- シートの上の小物: 布巾の山（左上）、脱いだ長靴（右下）、手水のボウル（左下） ---
// 布巾の山（たたんだ晒しを2枚）
piece(s, torn([[150, 632], [196, 628], [198, 646], [152, 650]], 1.4, 4), C.mochi, { tex: "fib" });
piece(s, torn([[156, 622], [192, 619], [194, 633], [154, 636]], 1.4, 4), C.mochi, { tex: "fib" });
marker(s, [[160, 630], [188, 627]], 1.2, C.grain, 0.4);
// 脱いだ長靴（1本は立ち、1本は倒れる）
const boot2 = (x, y, rot) => {
  const b = el("g", { transform: `translate(${x},${y}) rotate(${rot})` }, s);
  piece(b, cut([[-9, -40], [9, -40], [10, -6], [26, -4], [28, 6], [-10, 6]], 0.8), C.sumi, { tex: "fib" });
  piece(b, cut([[-10, 2], [28, 2], [28, 7], [-10, 7]], 0.5), C.keyakiD, { sh: [1, 1.5] }); // 底
  piece(b, cut([[-10, -42], [10, -42], [10, -36], [-10, -36]], 0.5), "#5a4a3c", { sh: [1, 1.5] }); // 履き口
};
boot2(346, 652, 0); boot2(292, 664, -80);
const bg = el("g", {}, s);
piece(bg, smooth(ell(62, 626, 48, 23, 16)), C.blockD, { sh: [3, 5] });
piece(bg, smooth(ell(62, 622, 48, 21, 16)), C.blockL, { sh: [0, 2] });
piece(bg, smooth(ell(63, 624, 40, 16, 16)), "#8fb3da", { sh: [1, -1.5] });
piece(bg, cut([[40, 617], [62, 614], [60, 618], [42, 621]], 0.5), "#ffffff", { sh: null });

// --- 臼・縄・杵・手 ---
usu(s, 196, 432, 1.04, { grains: 0.42, dent: true, glossK: 0.65 });
nawa(s, 198, 566, 150, 42, 3);
piece(s, torn([[-8, 528], [34, 516], [42, 550], [-8, 566]], 1.4, 5), C.sumi, { tex: "fib" }); // 袖
piece(s, cut([[26, 518], [38, 515], [46, 548], [34, 551]], 0.6), C.aoD, { sh: [1.5, 2] }); // 袖口
gunte(s, 56, 536, 1.05, 66);
kine(s, 238, 438, 1.02, 22, { len: 200, grip: true });
for (const [x, y, r] of [[302, 380, 7], [318, 400, 5], [296, 356, 4]]) piece(s, torn(ell(x, y, r, r * 0.75, 8), 1, 3), C.mochi, { sh: [2, 3] });
marker(s, [[214, 312], [218, 328]], 2.4); marker(s, [[234, 308], [236, 324]], 2.4);
kiriMoji(s, "ぺったん", 262, 334, 30, { tilt: 7, bob: 4 });

// --- 掛け声の吹き出し（太鼓の人から）。いまの打の語の下に橙の帯（橙は「いま」だけ） ---
setSeed(31);
const kg = el("text", { x: 86, y: 285, "font-family": "Stick, sans-serif", "font-size": 22, fill: C.sumi }, s);
kg.textContent = "ぺったん ぺったん はいっ";
const kb = kg.getBBox();
const bal = el("g", {}, null); s.insertBefore(bal, kg);
fukidashi(bal, kb.x - 16, 254, kb.width + 32, 46, [64, 314]);
const q = kg.getSubStringLength(0, 5), q2 = kg.getSubStringLength(5, 4);
piece(s, cut([[kb.x + q, 291], [kb.x + q + q2, 290], [kb.x + q + q2, 295], [kb.x + q, 296]], 0.5), C.dai, { sh: [1, 1.5] });

// --- 上の札: 手形（軍手3枚・1枚は失って点線）と点数 ---
gunte(s, 22, 36, 0.62, -8);
gunte(s, 50, 37, 0.62, 6);
gunte(s, 78, 36, 0.62, -3, { flip: true });
const sc = el("g", {}, s);
piece(sc, torn([[250, 16], [380, 12], [382, 58], [252, 62]], 1.3, 4), C.mochi);
el("text", { x: 372, y: 53, "text-anchor": "end", "font-family": "Stick, sans-serif", "font-size": 30, fill: C.sumi, style: "font-variant-numeric:tabular-nums" }, sc).textContent = "4,280";
el("text", { x: 260, y: 34, "font-family": "'Zen Kurenaido', sans-serif", "font-size": 14, fill: C.sumi }, sc).textContent = "2臼目";

// --- もろぶた（下。全高の約15%）: 縁の立った木の箱。縁4本は別の帯で貼り、四隅の継ぎ目が見える ---
const ng = el("g", {}, s);
const X0 = 14, Y0 = 716, X1 = 376, Y1 = 850;
piece(ng, cut([[X0, Y0], [X1, Y0 - 3], [X1 + 2, Y1], [X0 - 2, Y1]], 0.8), C.keyakiL, { tex: "wood", tex2: "fib", sh: [4, 6] });
piece(ng, torn([[268, Y0 + 14], [X1 - 14, Y0 + 10], [X1 - 10, Y1], [252, Y1]], 1.6, 4), C.mochi, { tex: "fib", sh: [2, 3] }); // 晒しの布巾（右の隅に寄せる）
marker(ng, [[276, Y0 + 40], [310, Y0 + 44], [350, Y0 + 40]], 1.2, C.grain, 0.5);
piece(ng, torn(ell(140, 790, 120, 34, 18, 0, Math.PI * 2, 0.22), 2.2, 3), C.mochi, { sh: null, op: 0.4 }); // 取り粉
piece(ng, cut([[X0 - 4, Y0 - 8], [X1 + 4, Y0 - 11], [X1 + 4, Y0 + 2], [X0 - 4, Y0 + 5]], 0.6), C.keyaki, { tex: "wood", tex2: "fib", sh: [0, 4] }); // 奥の縁
piece(ng, cut([[X0 - 8, Y0 - 6], [X0 + 6, Y0 - 6], [X0 + 4, Y1], [X0 - 10, Y1]], 0.6), C.keyaki, { tex2: "fib", sh: [3, 2] }); // 左の縁
piece(ng, cut([[X1 - 6, Y0 - 9], [X1 + 8, Y0 - 9], [X1 + 10, Y1], [X1 - 4, Y1]], 0.6), C.keyakiD, { tex2: "fib", sh: [-3, 2] }); // 右の縁
marker(ng, [[X0 + 140, Y0 + 2], [X0 + 141, Y0 + 30]], 1, C.keyakiD, 0.4).setAttribute("opacity", 0.6);
for (const [x, y, rx, ry] of [[84, 778, 44, 25], [190, 792, 48, 26]]) {
  piece(ng, smooth(ell(x, y, rx, ry, 14, 0, Math.PI * 2, 0.03)), C.mochi, { sh: [3, 5] });
  piece(ng, cut([[x - rx * 0.6, y - ry * 0.45], [x - rx * 0.1, y - ry * 0.75], [x, y - ry * 0.65], [x - rx * 0.5, y - ry * 0.3]], 0.5), "#ffffff", { sh: null });
  piece(ng, smooth([[x - rx * 0.2, y + ry * 0.55], [x + rx * 0.6, y + ry * 0.2], [x + rx * 0.7, y + ry * 0.55], [x + rx * 0.1, y + ry * 0.85]]), C.mochiS, { sh: null });
}
piece(ng, torn(ell(220, 744, 24, 7, 12, 0, Math.PI * 2, 0.25), 2, 3), C.mochi, { sh: null, op: 0.45 }); // 取り粉

</script>
