<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ぺったん二人前</title>
<link href="https://fonts.googleapis.com/css2?family=Stick&family=Zen+Kurenaido&display=swap" rel="stylesheet">
<style>
:root{--ao:#2b6cb5;--block:#b8b1a3;--keyaki:#8b5632;--mochi:#fcfbf6;--dai:#e8761f;--sumi:#33251c;--asphalt:#5e5952}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--asphalt);color:var(--sumi);
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:"Zen Kurenaido","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;touch-action:none}
.layer{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;pointer-events:none}
.layer.on{display:flex}
.layer>*{pointer-events:auto}
.shade{filter:drop-shadow(3px 4px 0 rgba(51,37,28,.45))}
.paper{background:var(--mochi);padding:16px 20px 18px;max-width:340px;width:100%}
.logo{font-family:Stick,"Zen Kurenaido",sans-serif;font-size:min(46px,11.5vw);white-space:nowrap;flex-wrap:nowrap;line-height:1.1;color:var(--mochi);display:flex;justify-content:center;gap:0 2px;margin:0;font-weight:400}
.logo span{display:inline-block;text-shadow:3px 4px 0 rgba(51,37,28,.55),-1px -1px 0 var(--mochi)}
.lead{font-size:16px;line-height:1.7;margin:0 0 6px}
.keys{font-size:13px;line-height:1.6;margin:0 0 10px;opacity:.85}
.best{font-size:14px;margin:0 0 10px;font-variant-numeric:tabular-nums}
.btn{font-family:Stick,"Zen Kurenaido",sans-serif;font-size:24px;color:var(--mochi);background:var(--sumi);border:0;padding:10px 26px 12px;cursor:pointer;display:block;margin:0 auto;touch-action:manipulation}
.btn:focus-visible,.tag:focus-visible,.mini:focus-visible{outline:3px solid var(--dai);outline-offset:3px}
.btn.sub{font-size:18px;background:transparent;color:var(--sumi);border:2px solid var(--sumi);padding:6px 16px 8px}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.score{font-family:Stick,"Zen Kurenaido",sans-serif;font-size:54px;line-height:1;margin:4px 0 6px;font-variant-numeric:tabular-nums;text-align:center}
.score small{font-family:"Zen Kurenaido",sans-serif;font-size:18px;margin-left:6px}
.res-h{font-family:Stick,"Zen Kurenaido",sans-serif;font-size:24px;margin:0 0 4px;text-align:center;font-weight:400}
.res-why{font-size:15px;margin:0 0 6px;text-align:center;line-height:1.5}
.res-st{font-size:14px;margin:0 0 12px;text-align:center;font-variant-numeric:tabular-nums}
.tagw{position:fixed;display:none;z-index:3}.tagw.on{display:block}
.tag{font-family:"Zen Kurenaido",sans-serif;font-size:14px;color:var(--sumi);background:var(--mochi);border:0;padding:6px 10px 7px;cursor:pointer;display:block;box-shadow:inset 0 0 0 2px var(--sumi);touch-action:manipulation;min-width:64px}
.mini{font-family:Stick,sans-serif;font-size:22px;width:44px;height:40px;border:2px solid var(--sumi);background:var(--mochi);color:var(--sumi);cursor:pointer;touch-action:manipulation}
#calib{font-family:Stick,sans-serif;font-size:24px;min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
#result{justify-content:flex-start;padding-top:9vh}
body.wide #result{align-items:flex-end;justify-content:center;padding-top:16px;padding-right:4vw}
body.wide #title{flex-direction:row;gap:28px}
body.wide .logo{flex-direction:column;font-size:46px;max-height:330px;align-content:center}
@media (prefers-reduced-motion:reduce){.logo span{transform:none!important}}
</style>
</head>
<body>
<canvas id="cv" aria-label="餅つきの臼と杵"></canvas>
<div id="title" class="layer on">
  <h1 class="logo" id="logo" aria-label="ぺったん二人前"></h1>
  <div class="shade"><div class="paper torn">
    <p class="lead">右で杵をつき、左で餅を返す。吹き出しの掛け声どおりに、拍に合わせて。<br>「まって」の拍は手が臼の中。杵を下ろさない。</p>
    <p class="keys">スマホ: 画面の右をタップ＝杵、左＝返し（「みず」は左を長押し）<br>PC: J・→＝杵、F・←＝返し（長押しで水）　M 音　P 一時停止</p>
    <p class="best" id="bestT"></p>
    <button class="btn" id="startB">つきはじめる</button>
  </div></div>
</div>
<div id="result" class="layer">
  <div class="shade"><div class="paper torn">
    <h2 class="res-h" id="resH"></h2>
    <p class="res-why" id="resWhy"></p>
    <div class="score" id="resS"></div>
    <p class="res-st" id="resSt"></p>
    <div class="row"><button class="btn" id="againB">もう一回</button></div>
  </div></div>
</div>
<div id="pause" class="layer">
  <div class="shade"><div class="paper torn">
    <h2 class="res-h">とまっています</h2>
    <p class="res-why">拍ずれ調整（いつも遅れて判定されるなら＋）</p>
    <div class="row" style="margin-bottom:14px"><button class="mini" id="calM" aria-label="調整を減らす">－</button><span id="calib">0ms</span><button class="mini" id="calP" aria-label="調整を増やす">＋</button></div>
    <div class="row"><button class="btn" id="resumeB">つづける</button><button class="btn sub" id="quitB">やめる</button></div>
  </div></div>
</div>
<div class="tagw shade" id="muteW"><button class="tag torn" id="muteB">音 あり</button></div>
<div class="tagw shade" id="pauseW"><button class="tag torn" id="pauseB">とめる</button></div>
<script>
//SIM-START
// ---- 遊びの中身（描画と無関係。自動プレイでもそのまま使う）。時刻はすべて秒（拍の時計） ----
const SIM = (() => {
  const BPM = [92, 104, 116, 128, 140, 152]; // 臼ごとに一段ずつ速くなる
  const KPER = 14; // ひと臼でつく回数（杵の拍の数）
  const GAP = 2.6; // ひと臼つき上がってから次の臼まで
  const HOLD_W = 0.18; // 水: 左をこれ以上押さえる
  const LOOSE = 0.42; // 水でない拍にこれ以上押さえると餅がゆるむ
  // 4拍の型。K=杵 H=返し W=水 R=ひと休み M=まって（手が臼にある拍）
  const PATS = { A: "KHKH", B: "KKHM", C: "KWKH", D: "KHRR", E: "HMKK", F: "KHMK", G: "RKHM", H: "KRKH", I: "WKHM" };
  const WEIGHT = [
    { A: 4, H: 2, D: 1, C: 1, B: 1.2 },
    { A: 3, B: 2, C: 1, D: 1, F: 1.4, H: 1 },
    { A: 2, B: 2, C: 2, D: 1, F: 2, E: 1.2, H: 1 },
    { A: 1, B: 2, C: 2.5, D: 2, E: 2, F: 2, G: 1.6, I: 1 },
    { A: 1, B: 2, C: 2.5, D: 2, E: 2, F: 2, G: 2, I: 1.5 },
    { A: 0.6, B: 2, C: 2.5, D: 2, E: 2.4, F: 2.4, G: 2.4, I: 2 },
  ];
  const WORD = { K: "ぺったん", H: "はいっ", W: "みず", R: "やすみ", M: "まって" };
  const COUNT = ["いち", "に", "さん", "し"];
  function rnd(S) { // mulberry32（状態は数値で持つ＝複製できる）
    let t = (S.rs = (S.rs + 0x6d2b79f5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function create(seed, t0 = 0) {
    const S = {
      rs: seed | 0, u: -1, lives: 3, score: 0, combo: 0, maxCombo: 0, beats: [], bi: 0,
      phase: "gap", next: t0 + 0.6, usuEnd: 0, b: 0.6, endT: 0, over: "",
      hand: { where: "rest", from: -9, out: -9, down: -9, holding: false, wBeat: -1, loose: false, mBeat: -1 },
      lastK: -9, dryLeft: 0, cracks: 0, kPts: 0, kSlots: 0, mochi: [], ev: [], lastPun: -1,
      st: { perfect: 0, good: 0, miss: 0, stop: 0, swing: 0, dry: 0, loose: 0, wait: 0 },
      log: [], // [t, 点] 得点の時刻
    };
    return S;
  }
  const ev = (S, type, t, o) => S.ev.push(Object.assign({ type, t }, o || {}));
  const UM = [1, 1.4, 1.9, 2.5, 3.2, 4.1];
  const um = (S) => UM[Math.max(0, S.u)];
  const cm = (S) => (S.combo >= 16 ? 2 : S.combo >= 8 ? 1.5 : 1);
  function add(S, pts, t) { S.score = Math.max(0, S.score + Math.round(pts)); S.log.push([t, Math.round(pts)]); }
  function win(S) { const u = Math.max(0, S.u); return { p: 0.075 - 0.006 * u, g: 0.15 - 0.011 * u, late: 0.02 }; }
  function pick(S) {
    const w = WEIGHT[S.u]; let sum = 0;
    for (const k in w) sum += w[k];
    let r = rnd(S) * sum;
    for (const k in w) { r -= w[k]; if (r <= 0) return k; }
    return "A";
  }
  function startUsu(S, t0) {
    S.u++; S.b = 60 / BPM[S.u]; S.beats = []; S.bi = 0; S.kPts = 0; S.kSlots = 0; S.cracks = 0; S.dryLeft = 0;
    const b = S.b;
    for (let i = 0; i < 4; i++) S.beats.push({ t: t0 + i * b, s: "C", w: COUNT[i], bar: 0, i });
    let k = 0, bar = 1, prev = "";
    while (k < KPER) {
      let p = S.u === 0 && bar <= 2 ? "A" : pick(S);
      if (p === prev && rnd(S) < 0.5) p = pick(S);
      prev = p;
      for (let j = 0; j < 4; j++) {
        const s = PATS[p][j];
        if (s === "K") k++;
        S.beats.push({ t: t0 + (bar * 4 + j) * b, s, w: WORD[s], bar, i: S.beats.length, p });
      }
      bar++;
    }
    S.kSlots = k; S.bars = bar;
    S.usuEnd = S.beats[S.beats.length - 1].t + b;
    S.phase = "play";
    ev(S, "usuStart", t0, { u: S.u });
  }
  // いちばん近い、その手がまだ使っていない拍（判定幅の中）
  function findBeat(S, t, hand) {
    const W = win(S); let best = null, bd = 9;
    for (let i = Math.max(0, S.bi - 2); i < S.beats.length; i++) {
      const bt = S.beats[i]; const d = t - bt.t;
      if (d < -W.g) break;
      if (d > W.g + W.late) continue;
      if (hand === "K" ? bt.kU : bt.hU) continue;
      if (Math.abs(d) < bd) { bd = Math.abs(d); best = bt; }
    }
    return best;
  }
  function beatAt(S, t) { // 罰を数える拍（いちばん近い拍）
    let best = null, bd = 9;
    for (const bt of S.beats) { const d = Math.abs(t - bt.t); if (d < bd) { bd = d; best = bt; } }
    return best ? best.i : -1;
  }
  function pun(S, t) { const i = beatAt(S, t) + 1000 * S.u; if (S.lastPun === i) return false; S.lastPun = i; return true; }
  function handIn(S, t) { const h = S.hand; return h.where === "usu" && t >= h.from && t < h.out; } // 押さえ続けても、手が臼にあるのは返す動作の時間だけ
  function grade(S, d, dryK) {
    const W = win(S); const k = dryK ? 0.6 : 1;
    if (Math.abs(d) <= W.p * k) return "p";
    if (d <= (W.g + W.late) * k && d >= -W.g * k) return "g";
    return "";
  }
  function press(S, hand, t) {
    if (S.phase === "over") return;
    update(S, t);
    if (hand === "K") {
      if (t - S.lastK < 0.09) return;
      S.lastK = t;
      if (handIn(S, t)) { // 杵は手の前でぴたっと止まる。札が1枚減る
        S.hand.where = "rest"; S.hand.out = t; S.hand.holding = false; S.combo = 0;
        const bt = findBeat(S, t, "K"); if (bt) bt.kU = true;
        const near = S.beats[Math.max(0, beatAt(S, t))];
        const warm = S.phase !== "play" || !near || near.s === "C"; // 数え始め（いち・に・さん・し）の間は札を減らさない
        if (!warm && pun(S, t)) {
          S.lives--; S.st.stop++;
          ev(S, "stop", t, { lives: S.lives });
          if (S.lives <= 0) { S.phase = "over"; S.over = "hand"; S.endT = t; }
        } else ev(S, "stopSoft", t);
        return;
      }
      const bt = findBeat(S, t, "K");
      if (bt && bt.s === "K") {
        const g = grade(S, t - bt.t, S.dryLeft > 0);
        if (g) {
          bt.kU = true; bt.ok = true;
          if (S.dryLeft > 0) S.dryLeft--;
          const v = g === "p" ? 1 : 0.6;
          S.kPts += v;
          if (g === "p") { S.combo++; S.st.perfect++; } else S.st.good++;
          S.maxCombo = Math.max(S.maxCombo, S.combo);
          add(S, (g === "p" ? 100 : 50) * um(S) * cm(S), t);
          ev(S, "hit", t, { g, combo: S.combo });
          if (g === "p" && S.combo > 0 && S.combo % 8 === 0) ev(S, "cheer", t);
          return;
        }
      }
      // 空振り（拍外れ・型にない拍）: 餅が冷える。終わりにはならない
      if (bt) bt.kU = true;
      if (bt && bt.s === "C") { ev(S, "swing", t, { soft: true }); return; }
      S.combo = 0; S.st.swing++;
      if (bt && bt.s !== "K" && pun(S, t)) add(S, -20 * um(S), t);
      ev(S, "swing", t);
      return;
    }
    // 左手
    const h = S.hand;
    if (h.holding) return;
    h.holding = true; h.down = t; h.loose = false;
    const bt = findBeat(S, t, "H");
    if (bt && bt.s === "W") { // 手水のボウルへ
      bt.hU = true; h.where = "bowl"; h.from = t; h.wBeat = bt.i; h.wG = grade(S, t - bt.t, false) || "g";
      ev(S, "dip", t);
      return;
    }
    let out = t + 0.5 * S.b; h.mBeat = -1;
    if (bt && bt.s === "H") {
      const g = grade(S, t - bt.t, false);
      bt.hU = true;
      if (g) {
        bt.ok = true;
        if (g === "p") { S.combo++; S.st.perfect++; } else S.st.good++;
        S.maxCombo = Math.max(S.maxCombo, S.combo);
        add(S, (g === "p" ? 30 : 15) * um(S) * cm(S), t);
        if (g === "p" && S.combo % 8 === 0) ev(S, "cheer", t);
      }
      const nx = S.beats[bt.i + 1];
      if (nx && nx.s === "M") { out = nx.t + 0.45 * S.b; h.mBeat = nx.i; }
    } else if (bt && bt.s === "M") {
      bt.hU = true; out = bt.t + 0.45 * S.b; h.mBeat = bt.i;
    } else {
      if (bt) bt.hU = true;
      if (!bt || bt.s !== "C") S.combo = 0;
    }
    h.where = "usu"; h.from = t; h.out = out;
    ev(S, "turn", t, { long: h.mBeat >= 0 });
  }
  function release(S, hand, t) {
    if (hand !== "H" || S.phase === "over") return;
    update(S, t);
    const h = S.hand;
    if (!h.holding) return;
    h.holding = false;
    if (h.where === "bowl") {
      if (h.wBeat >= 0) waterResult(S, t, t - h.down >= HOLD_W);
      h.where = "rest"; h.out = t;
    }
  }
  function waterResult(S, t, ok) {
    const bt = S.beats[S.hand.wBeat]; S.hand.wBeat = -1;
    if (!bt) return;
    bt.done = true;
    if (ok) {
      bt.ok = true;
      if (S.hand.wG === "p") { S.combo++; S.st.perfect++; } else S.st.good++;
      S.maxCombo = Math.max(S.maxCombo, S.combo);
      add(S, 40 * um(S) * cm(S), t);
      S.dryLeft = 0;
      ev(S, "water", t);
    } else dry(S, t);
  }
  function dry(S, t) {
    S.combo = 0;
    if (!pun(S, t)) return;
    S.dryLeft = 2; S.cracks++; S.st.dry++;
    add(S, -40 * um(S), t);
    ev(S, "dry", t);
  }
  function update(S, t) {
    if (S.phase === "over") return;
    if (S.phase === "gap") { if (t >= S.next) startUsu(S, S.next); else return; }
    const W = win(S), h = S.hand;
    if (h.where === "bowl" && h.holding && h.wBeat >= 0 && t - h.down >= HOLD_W) waterResult(S, t, true);
    if (h.where === "usu" && h.holding && !h.loose && t - h.down >= LOOSE && h.mBeat < 0) {
      h.loose = true; S.st.loose++;
      if (pun(S, t)) { add(S, -30 * um(S), t); ev(S, "loose", t); }
    }
    if (h.where === "usu" && !h.holding && t >= h.out) h.where = "rest";
    while (S.bi < S.beats.length && S.beats[S.bi].t + W.g + W.late < t) {
      const bt = S.beats[S.bi];
      if (bt.s === "K" && !bt.ok) { S.combo = 0; S.st.miss++; ev(S, "miss", bt.t); }
      if (bt.s === "H" && !bt.ok) { S.combo = 0; S.st.miss++; }
      if (bt.s === "W" && !bt.hU) dry(S, bt.t + W.g);
      if (bt.s === "M" && !bt.kU) { S.st.wait++; add(S, 20 * um(S), bt.t); ev(S, "wait", bt.t); }
      S.bi++;
    }
    if (t >= S.usuEnd) {
      const q = Math.max(0, Math.min(1, S.kPts / S.kSlots - 0.06 * S.cracks));
      add(S, 600 * q * um(S), t);
      S.mochi.push({ q, u: S.u, cracks: S.cracks });
      ev(S, "usuDone", t, { q });
      if (S.u >= BPM.length - 1) { S.phase = "over"; S.over = "done"; S.endT = t; }
      else { S.phase = "gap"; S.next = t + GAP; }
    }
  }
  // いま見えている拍（今の小節と次の小節）だけを返す。ボットも画面もこれだけを読む
  function visible(S, t) {
    if (S.phase !== "play") return [];
    let cur = S.beats[0].bar;
    for (const bt of S.beats) if (bt.t - S.b / 2 <= t) cur = bt.bar;
    return S.beats.filter((bt) => bt.bar === cur || bt.bar === cur + 1);
  }
  function grains(S) { return S.kSlots ? Math.max(0, 1 - S.kPts / S.kSlots) : 1; }
  return { create, press, release, update, visible, handIn, grains, win, BPM, KPER, GAP, HOLD_W, WORD };
})();
if (typeof module !== "undefined") module.exports = SIM;
//SIM-END
// ===== 色画用紙の切り貼り絵の道具（canvas。ロード時・画面の大きさが変わった時に1回だけ描く） =====
// 借りる物: 公民館の駐車場で開く町内会の餅つきの会場の道具（ブルーシート・ビールケース・軍手・手水ボウル・蒸籠・ブロック塀・もろぶた）
//   を、子ども会の色画用紙の切り貼り絵で。紙片は「影（茶黒を3〜4pxずらす）→ 塗り → 紙の目」の順。ctx.filter・shadowBlur は使わない
const C = {
  ao: "#2b6cb5", aoL: "#4f8bd0", aoD: "#1d5193", block: "#b8b1a3", blockD: "#958e80", blockL: "#d9d5cc",
  keyaki: "#8b5632", keyakiL: "#b07a4c", keyakiD: "#5f3a20", mochi: "#fcfbf6", mochiS: "#dfe8f2", grain: "#c9d5e3",
  dai: "#e8761f", usudai: "#f3c7a4", hoho: "#e9a77f", asphalt: "#5e5952", sumi: "#33251c",
};
const FH = 'Stick, "Zen Kurenaido", sans-serif', FB = '"Zen Kurenaido", sans-serif';
let seedV = 9;
const setSeed = (s) => (seedV = s);
const rnd = () => (seedV = (seedV * 16807) % 2147483647) / 2147483647;
const j = (a) => (rnd() * 2 - 1) * a;
const f1 = (n) => n.toFixed(1);
const ptsD = (p, close = true) => p.map((q, i) => `${i ? "L" : "M"}${f1(q[0])},${f1(q[1])}`).join("") + (close ? "Z" : "");
const cut = (pts, amt = 1) => ptsD(pts.map((p) => [p[0] + j(amt), p[1] + j(amt)]));
function densify(pts, step = 4, amp = 1.5) {
  const out = [], n = pts.length;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
    const k = Math.max(1, Math.round(len / step)), nx = -dy / len, ny = dx / len;

function toTitle() { state = "title"; setView(); S = null; V = newV(); updateBest(); show("title"); }
function updateBest() { $("bestT").textContent = best ? `ベスト ${best.toLocaleString("ja-JP")} てん` : ""; }
function setMute(m) { muted = m; if (master) master.gain.value = m ? 0 : 0.8; $("muteB").textContent = m ? "音 なし" : "音 あり"; }
function setCalib(v) { calib = Math.max(-100, Math.min(200, v)); $("calib").textContent = (calib > 0 ? "+" : "") + calib + "ms"; try { localStorage.setItem(CAL_KEY, String(calib)); } catch (e) {} }

// ---- 入力（時刻で判定。押した瞬間の timeStamp を拍の時計に直す） ----
const evTime = (e) => simNow() - Math.max(0, Math.min(0.2, (performance.now() - (e.timeStamp || performance.now())) / 1000));
const ptrHand = new Map();
function onDown(e) {
  if (e.target.closest && e.target.closest("button")) return;
  if (state !== "play") return;
  e.preventDefault();
  audioInit();
  const hand = e.clientX < VW / 2 ? "H" : "K";
  ptrHand.set(e.pointerId, hand);
  SIM.press(S, hand, evTime(e));
}
function onUp(e) {
  const hand = ptrHand.get(e.pointerId); ptrHand.delete(e.pointerId);
  if (hand === "H" && state === "play") SIM.release(S, "H", evTime(e));
}
addEventListener("pointerdown", onDown, { passive: false });
addEventListener("pointerup", onUp); addEventListener("pointercancel", onUp);
addEventListener("contextmenu", (e) => e.preventDefault());
addEventListener("dblclick", (e) => e.preventDefault());
addEventListener("touchstart", (e) => { if (!(e.target.closest && e.target.closest("button"))) e.preventDefault(); }, { passive: false });
const KK = ["KeyJ", "ArrowRight", "KeyK"], KH = ["KeyF", "ArrowLeft", "KeyD"];
addEventListener("keydown", (e) => {
  const c = e.code;
  if (c === "KeyM") { setMute(!muted); return; }
  if (state === "title" && (c === "Enter" || c === "Space") && document.activeElement !== $("startB")) { e.preventDefault(); start(); return; }
  if (state === "play") {
    if (c === "KeyP" || c === "Escape") { pause(); return; }
    if (e.repeat) { if (KK.includes(c) || KH.includes(c)) e.preventDefault(); return; }
    if (KK.includes(c)) { e.preventDefault(); audioInit(); SIM.press(S, "K", evTime(e)); }
    else if (KH.includes(c)) { e.preventDefault(); audioInit(); SIM.press(S, "H", evTime(e)); }
  } else if (state === "pause" && (c === "KeyP" || c === "Escape")) resume();
});
addEventListener("keyup", (e) => { if (state === "play" && KH.includes(e.code) && !KH.some((k) => k !== e.code && heldKeys.has(k))) SIM.release(S, "H", evTime(e)); });
const heldKeys = new Set();
addEventListener("keydown", (e) => heldKeys.add(e.code), true); addEventListener("keyup", (e) => heldKeys.delete(e.code), true);
document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
$("startB").addEventListener("click", start);
$("againB").addEventListener("click", start);
$("resumeB").addEventListener("click", resume);
$("quitB").addEventListener("click", () => { pausedTotal += performance.now() - pauseAt; if (ac) ac.resume().catch(() => {}); toTitle(); });
$("muteB").addEventListener("click", () => setMute(!muted));
$("pauseB").addEventListener("click", pause);
$("calM").addEventListener("click", () => setCalib(calib - 10));
$("calP").addEventListener("click", () => setCalib(calib + 10));

// ---- はじまり ----
(function init() {
  const logo = $("logo"); setSeed(17);
  for (const ch of "ぺったん二人前") { const sp = document.createElement("span"); sp.textContent = ch; sp.style.transform = `rotate(${f1(j(6))}deg) translateY(${f1(j(3))}px)`; logo.appendChild(sp); }
  document.querySelectorAll(".torn").forEach((el, i) => tornClip(el, 50 + i * 11));
  V = newV(); updateBest(); setMute(false);
  layout(); show("title");
  let rt = 0; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layout, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout());
  if (document.fonts) document.fonts.addEventListener && document.fonts.addEventListener("loadingdone", () => layout());
  requestAnimationFrame(frame);
  window.__game = { get S() { return S; }, get state() { return state; }, fps() { const n = fpsLog.length; return n > 10 ? ((n - 1) * 1000) / (fpsLog[n - 1] - fpsLog[0]) : 0; }, fpsLog, simNow, start };
})();
</script>
