<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>朝つゆの網</title>
<meta name="description" content="イギリスの家庭菜園で、庭の蜘蛛になって豆の支柱に糸を渡すミニゲーム">
<link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Yomogi&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#c3c9bd;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:Yomogi,"Hiragino Maru Gothic ProN",sans-serif}

</style>

<body>
<canvas id="c" role="img" aria-label="朝つゆの網。まち針を2つ押して糸を渡し、虫を捕まえる"></canvas>
<script id="logic">
// ===== 遊びの中身（描画に依存しない。自動プレイのボットもこれを読む） =====
const WORLD = { w: 390, h: 692 };
// ハシバミの支柱（x1,y1 = 地面, x2,y2 = 上の端）。4本目の右に鉢、5本目は左の1本
const POLES = [[56, 640, 192, 66], [330, 650, 202, 64], [168, 672, 198, 60], [372, 520, 344, 156], [30, 584, 50, 196]];
const PIN_AT = [[0, .18], [0, .42], [0, .66], [0, .86], [1, .16], [1, .40], [1, .64], [1, .86], [2, .30], [2, .62], [3, .12], [3, .5], [4, .18], [4, .52], [4, .9]];
// 虫の通り道（左右に横切るゆるい S 字）。sky=生垣より上
const ROUTES = [
  { a: 92, b: 112, m: 8, p: 0, sky: 1 }, { a: 132, b: 84, m: 10, p: 2, sky: 1 }, { a: 190, b: 160, m: 12, p: 1, sky: 1 },
  { a: 262, b: 300, m: 14, p: 3 }, { a: 340, b: 318, m: 12, p: 5 }, { a: 420, b: 380, m: 14, p: 4 },
  { a: 470, b: 524, m: 12, p: 1 }, { a: 566, b: 540, m: 10, p: 2 }, { a: 150, b: 500, m: 16, p: 0 }, { a: 560, b: 220, m: 16, p: 3 },
];
const SPEC = {
  fly: { pts: 1, ret: 50, v: 1.0 }, moth: { pts: 3, ret: 110, v: 0.8 }, beetle: { pts: 8, ret: 190, v: 0.72 },
  lady: { pts: -3, ret: 0, v: 0.75 }, bee: { pts: 0, ret: 0, v: 0.85 }, wasp: { pts: 0, ret: 0, v: 1.7 },
};
function routeY(r, x) { const u = Math.max(0, Math.min(1, x / 390)); return Math.max(26, Math.min(670, r.a + (r.b - r.a) * u + r.m * Math.sin(x / 390 * Math.PI * 2 + r.p))); }
function routePts(r, x0 = -40, x1 = 430, st = 10) { const o = []; for (let x = x0; x <= x1 + 0.1; x += st) o.push([x, routeY(r, x)]); return o; }
function segX(ax, ay, bx, by, cx, cy, dx, dy) { // 交われば [u(1本目), v(2本目)]
  const d = (bx - ax) * (dy - cy) - (by - ay) * (dx - cx); if (Math.abs(d) < 1e-9) return null;
  const u = ((cx - ax) * (dy - cy) - (cy - ay) * (dx - cx)) / d, v = ((cx - ax) * (by - ay) - (cy - ay) * (bx - ax)) / d;
  return u >= 0 && u <= 1 && v >= 0 && v <= 1 ? [u, v] : null;
}
function routeCrosses(r, A, B) { const P = routePts(r, -40, 430, 15); let n = 0; for (let i = 1; i < P.length; i++) if (segX(P[i - 1][0], P[i - 1][1], P[i][0], P[i][1], A.x, A.y, B.x, B.y)) n++; return n; }

function makeGame(seed) {
  let s = (seed >>> 0) || 1;
  const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  const G = {
    t: 0, dur: 120, score: 0, silk: 1000, silkMax: 1000, tears: 0, over: false, reason: "", anchors: [], threads: [], bugs: [], events: [],
    combo: 0, lastCatch: -9, nid: 1, bid: 1, wind: { st: 0, t0: 0, next: 46 }, nextSpawn: 1.0, nextWasp: 23, wasp: null, lastHaz: -9,
    stats: { fly: 0, moth: 0, beetle: 0, lady: 0, bee: 0, knot: 0 }, lost: [], xs: [-40, 430], pen: [], earn: [], routes: ROUTES,
  };
  POLES.forEach(() => 0);
  for (const [pi, t] of PIN_AT) { const p = POLES[pi]; G.anchors.push({ id: G.anchors.length, kind: "pin", x: p[0] + (p[2] - p[0]) * t, y: p[1] + (p[3] - p[1]) * t, poles: [pi], alive: true }); }
  G.anchors.push({ id: G.anchors.length, kind: "pin", x: 196, y: 76, poles: [0, 1, 2], alive: true, top: 1 });
  G.anchors.push({ id: G.anchors.length, kind: "pin", x: 336, y: 140, poles: [3], alive: true, pot: 1 });
  const ev = (type, o = {}) => { o.type = type; o.t = G.t; G.events.push(o); };
  const thr = (id) => G.threads.find((t) => t.id === id);
  G.thread = thr;
  G.knotsOn = (id) => { let n = 0; for (const k of G.anchors) if (k.alive && k.kind === "knot" && k.parents.includes(id)) n++; return n; };
  function sharesLine(A, B) {
    const par = (K) => (K.kind === "knot" ? K.parents : []);
    for (const pid of par(A)) { const T = thr(pid); if (T && (T.a === B.id || T.b === B.id)) return true; if (par(B).includes(pid)) return true; }
    for (const pid of par(B)) { const T = thr(pid); if (T && (T.a === A.id || T.b === A.id)) return true; }
    return false;
  }
  G.canLink = (ia, ib) => {
    const A = G.anchors[ia], B = G.anchors[ib];
    if (!A || !B || !A.alive || !B.alive || ia === ib) return "none";
    if (A.poles.some((p) => B.poles.includes(p)) || sharesLine(A, B)) return "same";
    if (G.threads.some((t) => (t.a === ia && t.b === ib) || (t.a === ib && t.b === ia))) return "dup";
    const len = Math.hypot(B.x - A.x, B.y - A.y);
    if (len < 36) return "short";
    if (G.threads.length >= 18) return "full";
    if (G.silk < len) return "silk";
    return "";
  };
  G.link = (ia, ib) => {
    if (G.over) return "over";
    const why = G.canLink(ia, ib); if (why) { ev("nolink", { why, a: ia, b: ib }); return why; }
    const A = G.anchors[ia], B = G.anchors[ib], len = Math.hypot(B.x - A.x, B.y - A.y);
    G.silk -= len;
    const T = { id: G.nid++, a: ia, b: ib, len, born: G.t, seed: (rnd() * 1e9) >>> 0, bowT: -9, vibT: G.t };
    for (const O of G.threads.slice()) {
      const OA = G.anchors[O.a], OB = G.anchors[O.b], r = segX(A.x, A.y, B.x, B.y, OA.x, OA.y, OB.x, OB.y);
      if (!r || r[0] < 0.05 || r[0] > 0.95 || r[1] < 0.05 || r[1] > 0.95) continue;
      const x = A.x + (B.x - A.x) * r[0], y = A.y + (B.y - A.y) * r[0];
      if (G.anchors.some((k) => k.alive && Math.hypot(k.x - x, k.y - y) < 12)) continue;
      G.anchors.push({ id: G.anchors.length, kind: "knot", x, y, poles: [], parents: [T.id, O.id], u: [r[0], r[1]], alive: true, born: G.t });
      O.vibT = G.t;
    }
    G.threads.push(T); ev("link", { id: T.id, len });
    return "";
  };
  G.cut = (id, by, quiet) => {
    const i = G.threads.findIndex((t) => t.id === id); if (i < 0) return 0;
    const T = G.threads[i]; G.threads.splice(i, 1); let n = 1;
    if (by !== "player") G.lost.push({ a: T.a, b: T.b, by });
    if (by === "player") G.silk = Math.min(G.silkMax, G.silk + T.len * 0.5);
    for (const b of G.bugs) if (b.th === id && (b.st === "caught" || b.st === "thrash" || b.st === "held")) { b.st = "flee"; if (b.sp !== "bee" && b.sp !== "lady") ev("escape", { x: b.x, y: b.y, sp: b.sp }); }
    for (const b of G.bugs) if (b.th === id && b.st === "cocoon") b.st = "drop";
    const A = G.anchors[T.a], B = G.anchors[T.b];
    ev("cut", { by, ax: A.x, ay: A.y, bx: B.x, by2: B.y, len: T.len, id, seed: T.seed, quiet: !!quiet });
    for (const K of G.anchors) if (K.alive && K.kind === "knot" && K.parents.includes(id)) {
      // ミツバチは1本だけ切る: 結び目はもう1本の糸の上に残る（つながる糸は落ちない）
      if (by === "bee" && K.parents.length > 1) { const j = K.parents.indexOf(id); K.parents.splice(j, 1); K.u.splice(j, 1); continue; }
      K.alive = false;
      for (const t2 of G.threads.filter((t) => t.a === K.id || t.b === K.id)) n += G.cut(t2.id, by, true);
    }
    return n;
  };
  // 切ると一緒に落ちる糸（結び目の連鎖）。長押し中の予告に使う
  G.cutSet = (id) => {
    const out = new Set(), dead = new Set(), go = (tid) => {
      if (out.has(tid) || !thr(tid)) return; out.add(tid);
      for (const K of G.anchors) if (K.alive && K.kind === "knot" && !dead.has(K.id) && K.parents.includes(tid)) {
        dead.add(K.id); for (const t2 of G.threads) if (t2.a === K.id || t2.b === K.id) go(t2.id);
      }
    };
    go(id); return out;
  };
  G.pickAnchor = (x, y, r = 26) => { let best = -1, bd = r; for (const a of G.anchors) if (a.alive) { const d = Math.hypot(a.x - x, a.y - y); if (d < bd) { bd = d; best = a.id; } } return best; };
  G.pickThread = (x, y, r = 16) => {
    let best = -1, bd = r;
    for (const T of G.threads) {
      const A = G.anchors[T.a], B = G.anchors[T.b], dx = B.x - A.x, dy = B.y - A.y, L2 = dx * dx + dy * dy;
      const u = Math.max(0, Math.min(1, ((x - A.x) * dx + (y - A.y) * dy) / L2)), sag = Math.min(7, T.len * 0.03) * 4 * u * (1 - u);
      const d = Math.hypot(A.x + dx * u - x, A.y + dy * u + sag - y); if (d < bd) { bd = d; best = T.id; }
    }
    return best;
  };
  G.threatIds = () => {
    const o = new Set(); if (!G.wasp || G.wasp.st === "gone" || G.wasp.torn) return o;
    const R = ROUTES[G.wasp.ri]; for (const T of G.threads) if (routeCrosses(R, G.anchors[T.a], G.anchors[T.b])) o.add(T.id); return o;
  };
  // 近くに糸が2本以上あるときは、スズメバチの予告が付いた糸を先に選ぶ（予告の付いた糸は 1.5 倍の幅で拾う）
  G.pickThreadPref = (x, y, r = 16) => {
    const th = G.threatIds(); if (!th.size) return G.pickThread(x, y, r);
    const keep = G.threads; G.threads = keep.filter((T) => th.has(T.id)); const t1 = G.pickThread(x, y, r * 1.5); G.threads = keep;
    return t1 >= 0 ? t1 : G.pickThread(x, y, r);
  };
  function tear(T) {
    const ends = [T.a, T.b]; let n = G.cut(T.id, "wasp");
    for (const t2 of G.threads.slice()) { if (n >= 3) break; if (ends.includes(t2.a) || ends.includes(t2.b)) n += G.cut(t2.id, "wasp", true); }
    G.tears++; G.pen.push({ t: G.t, k: "tear" });
    const A = G.anchors[T.a], B = G.anchors[T.b];
    ev("tear", { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2, n, tears: G.tears });
    if (G.tears >= 3) end("torn");
  }
  function end(reason) {
    if (G.over) return;
    if (reason === "dusk") for (const b of G.bugs) if (b.st === "caught") { // 日暮れに巻きかけの虫は巻き終える
      const S = SPEC[b.sp], pts = S.pts * b.mult + (b.kb || 0); b.st = "cocoon"; b.ct = 6; G.score += pts; G.stats[b.sp]++; if (b.kb) G.stats.knot++; G.earn.push({ t: G.t, p: pts }); ev("wrap", { sp: b.sp, pts, x: b.x, y: b.y, th: b.th });
    }
    G.over = true; G.reason = reason; ev("end", { reason }); }
  const lerp = (a, b, k) => a + (b - a) * k;
  function pickRoute(w) { let tot = 0; for (const x of w) tot += x; let q = rnd() * tot; for (let i = 0; i < w.length; i++) { q -= w[i]; if (q <= 0) return i; } return w.length - 1; }
  function spawn(sp, ri, pre) {
    const dir = rnd() < 0.5 ? 1 : -1, R = ROUTES[ri], p = G.t / G.dur;
    const x = dir > 0 ? G.xs[0] : G.xs[1];
    const v = (46 + 44 * p) * SPEC[sp].v * (0.9 + rnd() * 0.2);
    const b = { id: G.bid++, sp, ri, dir, x, y: routeY(R, x), v, st: "pre", pt: pre, pre, ph: rnd() * 6, pass: new Set(), born: G.t, th: -1, u: 0, wt: 0 };
    G.bugs.push(b); return b;
  }
  function hit(b, T, u) {
    b.pass.add(T.id);
    if (b.sp === "wasp") { if (!b.torn) { b.torn = 1; tear(T); } return; }
    if (G.wind.st === 2 && T.len > 170 && rnd() < 0.5) { ev("slip", { x: b.x, y: b.y, wind: 1 }); return; }
    const kn = G.knotsOn(T.id);
    if ((b.sp === "fly" && kn === 0 && rnd() < 0.35) || (b.sp === "moth" && kn === 0 && rnd() < 0.3)) { ev("slip", { x: b.x, y: b.y }); return; }
    if (b.sp === "beetle" && kn === 0) { G.cut(T.id, "beetle"); G.pen.push({ t: G.t, k: "beetle" }); ev("break", { x: b.x, y: b.y }); b.st = "flee"; return; }
    b.th = T.id; b.u = u; T.bowT = G.t; T.vibT = G.t;
    for (const O of G.threads) if (O !== T) O.vibT = G.t + 0.05;
    if (b.sp === "lady") { b.st = "held"; b.ht = 0.8; G.score += SPEC.lady.pts; G.stats.lady++; G.pen.push({ t: G.t, k: "lady" }); G.earn.push({ t: G.t, p: SPEC.lady.pts }); ev("lady", { x: b.x, y: b.y }); return; }
    if (b.sp === "bee") { b.st = "thrash"; b.ht = 0.9; G.stats.bee++; ev("bee", { x: b.x, y: b.y }); return; }
    b.st = "caught"; b.wt = 0; b.kb = (b.sp === "moth" || b.sp === "beetle") && kn > 0 ? Math.min(3, kn) : 0;
    G.combo = G.t - G.lastCatch <= 1.2 ? G.combo + 1 : 1; G.lastCatch = G.t; b.mult = G.combo >= 2 ? 2 : 1;
    ev("catch", { x: b.x, y: b.y, sp: b.sp, combo: G.combo, th: T.id, u });
  }
  G.step = (dt) => {
    if (G.over) return;
    G.t += dt; const t = G.t, p = Math.min(1, t / G.dur);
    // 風（昼過ぎから。葉が傾いて 1.5 秒前に予告 → 3 秒吹く）
    const W = G.wind;
    if (W.st === 0 && t >= W.next && !G.wasp && t < G.dur - 6) { W.st = 1; W.t0 = t; ev("windwarn"); }
    else if (W.st === 1 && t - W.t0 >= 1.5) { W.st = 2; W.t0 = t; ev("wind"); G.pen.push({ t, k: "wind" }); }
    else if (W.st === 2 && t - W.t0 >= 3) { W.st = 0; W.next = t + 15 + rnd() * 6; }
    // ふつうの虫
    if (t >= G.nextSpawn && t < G.dur - 1.5) {
      const ev2 = t > G.dur - 30;
      const wsp = { fly: 5, moth: t > 12 ? 2.2 + 2 * p : 0, beetle: t > 60 ? (t > G.dur - 20 ? 5.6 : ev2 ? 4.0 : 1.1) : 0, lady: t > 18 ? 0.9 : 0, bee: t > 28 ? 1.0 : 0 };
      // テントウムシ・ミツバチ（避けようのない罰）は 2.5 秒あけ、スズメバチの予告中は出さない（罰を重ねない）
      if (t - G.lastHaz < 2.5 || G.wasp) { wsp.lady = 0; wsp.bee = 0; }
      const names = Object.keys(wsp), sp = names[pickRoute(names.map((n) => wsp[n]))];
      if (sp === "lady" || sp === "bee") G.lastHaz = t;
      const rw = ROUTES.map((r, i) => (sp === "beetle" ? (i >= 3 ? 1 : 0) : r.sky ? 1.8 : 1));
      spawn(sp, pickRoute(rw), 1.2);
      G.nextSpawn = t + lerp(1.45, 0.62, Math.pow(p, 1.1)) * (t > G.dur - 20 ? 0.7 : ev2 ? 0.82 : 1) * (0.7 + rnd() * 0.6);
    }
    // スズメバチ（同時に1匹だけ。3 秒前から通り道を予告）
    if (!G.wasp && t >= G.nextWasp && W.st === 0 && t < G.dur - 5) {
      const rw = ROUTES.map((r) => { let n = 0; for (const T of G.threads) n += Math.min(1, routeCrosses(r, G.anchors[T.a], G.anchors[T.b])); return 1 + 0.4 * n; });
      G.wasp = spawn("wasp", pickRoute(rw), 3.0); ev("waspwarn", { ri: G.wasp.ri });
    }
    for (const b of G.bugs) {
      if (b.st === "pre") { b.pt -= dt; if (b.pt <= 0) { b.st = "fly"; if (b.sp === "wasp") ev("waspgo"); } continue; }
      if (b.st === "fly") {
        const ox = b.x, oy = b.y, R = ROUTES[b.ri]; b.ph += dt;
        b.x += b.dir * b.v * dt * (b.x < -20 || b.x > 410 ? 3 : 1); // 布の外（横画面の左右）は速く通り過ぎる
        const wob = b.sp === "bee" ? 13 * Math.sin(b.ph * 3.1) + 5 * Math.sin(b.ph * 7.3) : b.sp === "moth" ? 7 * Math.sin(b.ph * 4) : b.sp === "fly" ? 4 * Math.sin(b.ph * 9) : 0;
        b.y = routeY(R, b.x) + wob;
        if (b.x < G.xs[0] - 5 || b.x > G.xs[1] + 5) { b.st = "gone"; continue; }
        for (const T of G.threads.slice()) {
          if (b.pass.has(T.id) || !G.threads.includes(T)) continue;
          const A = G.anchors[T.a], B = G.anchors[T.b], r = segX(ox, oy, b.x, b.y, A.x, A.y, B.x, B.y);
          if (r) { hit(b, T, r[1]); if (b.st !== "fly") break; }
        }
      } else if (b.st === "caught") {
        b.wt += dt;
        if (b.wt >= 2.0) {
          const S = SPEC[b.sp], pts = S.pts * b.mult + (b.kb || 0); b.st = "cocoon"; b.ct = 6;
          G.score += pts; G.silk = Math.min(G.silkMax, G.silk + S.ret); G.stats[b.sp]++; if (b.kb) G.stats.knot++; G.earn.push({ t, p: pts });
          ev("wrap", { sp: b.sp, pts, x: b.x, y: b.y, th: b.th, kb: b.kb || 0 });
        }
      } else if (b.st === "held") { b.ht -= dt; if (b.ht <= 0) b.st = "flee"; }
      else if (b.st === "thrash") { b.ht -= dt; if (b.ht <= 0) { G.cut(b.th, "bee"); G.pen.push({ t, k: "bee" }); ev("beecut", { x: b.x, y: b.y }); b.st = "flee"; } }
      else if (b.st === "cocoon") { b.ct -= dt; if (b.ct <= 0) b.st = "gone"; }
      else if (b.st === "flee" || b.st === "drop") { b.ph += dt; b.y += (b.st === "drop" ? 160 : -70) * dt; b.x += b.dir * 30 * dt; if (b.y < -60 || b.y > 760) b.st = "gone"; }
    }
    if (G.wasp && G.wasp.st === "gone") { G.wasp = null; G.nextWasp = t + lerp(13, 7, p) + rnd() * 2.5; }
    G.bugs = G.bugs.filter((b) => b.st !== "gone");
    if (t >= G.dur) end("dusk");
    else if (!G.threads.length && G.silk < 36 && !G.bugs.some((b) => b.st === "caught")) end("empty");
  };
  return G;
}

// ===== 入力の判定（画面に依存しない。ボットも同じ物を使う） =====
// 同じ場所でタップ（まち針・結び目）と長押し（糸を切る）を受けるので、押した瞬間には決めない。
// まち針・結び目も離した時点で決める。近くに糸があれば、押した長さで決める: HOLD 以上 = 糸を切る / TAP 未満で離す = まち針のタップ / その間 = 切りかけ（KEEP 秒は進みが残る）
const HOLD = 0.35, TAP = 0.2, KEEP = 0.7, DRAG = 12;
function makeInput(G) {
  const I = { sel: -1, drag: -1, press: null, carry: null };
  function anchorTap(a, sure) {
    if (I.sel >= 0 && I.sel !== a && G.anchors[I.sel] && G.anchors[I.sel].alive) { if (sure) { G.link(I.sel, a); I.sel = -1; } else I.sel = a; }
    else if (I.sel === a) I.sel = -1;
    else I.sel = a;

    ctx.drawImage(SPR.titleLine, W / 2 - 112, 66, 224, 22);
    ctx.font = `16px ${FB}`; ctx.fillText("庭の蜘蛛になって、豆の支柱に糸を渡す", W / 2, 104);
    const hy = Math.min(H - 200, Lay.oy + 545 * Lay.s);

    HUD.start = { x: W / 2 - 112, y: hy + 76, w: 224, h: 48 };
  } else {
    const lx = 24; ctx.textAlign = "left"; ctx.font = `40px ${FH}`; ctx.fillText("朝つゆの網", lx, 76);
    ctx.drawImage(SPR.titleLine, lx, 80, 210, 21);
    const pw = Math.min(tw, Lay.ox - 30);
    const h1 = tapeBox(16, 100, pw, ["庭の蜘蛛になって、｜豆の支柱に糸を渡す"], `15px ${FB}`, 21, SPR.tHow);
    HUD.how = { x: 16, y: 100 + h1 + 12, w: pw, h: 62 };
    HUD.start = { x: W - Lay.ox / 2 - 112, y: H / 2 - 24, w: 224, h: 48 };

  const how = HUD.how;
  tapeBox(how.x, how.y, how.w, ["まち針を2つ押すと｜糸が渡る", "黄と黒の撚り糸の道には｜張らない"], `${Lay.land ? 14 : 15}px ${FB}`, 22, SPR.tHow);
  const st = HUD.start; ctx.drawImage(SPR.tStart, st.x - 1, st.y - 1, 232, 56);
  ctx.font = `19px ${FH}`; ctx.fillText("糸を張りはじめる", st.x + st.w / 2, st.y + st.h / 2 + 1);

}
// 結果の挿絵の下地: 支柱とまち針を淡い返し縫いの輪郭で残す（網が残っていなくても空っぽにしない）。1回だけ作る
function overBack(v) {
  const [c, g] = mkc(W, H); setSeed(91);
  g.save(); g.translate(v.ox, v.oy); g.scale(v.s, v.s);
  for (const p of POLES) { const P = bastePaths([[p[0], p[1]], [(p[0] + p[2]) / 2 + rr(-2, 2), (p[1] + p[3]) / 2], [p[2], p[3]]], 3.2, { l0: 8, l1: 15, g0: 2, g1: 5 }); strokeBaste(g, P, C.hazel, C.hazelL, 0.55, 0.25); }
  for (const [pi, t] of PIN_AT) { const p = POLES[pi], x = p[0] + (p[2] - p[0]) * t, y = p[1] + (p[3] - p[1]) * t; knot(g, x, y, 3.2, "#d9d2c0"); }
  const P = bastePaths([[-6, 692], [130, 690], [260, 694], [396, 690]], 2, { l0: 6, l1: 12, g0: 3, g1: 7 }); strokeBaste(g, P, "#8a9a6a", "#a7b585", 0.5, 0.2);
  g.restore(); return c;
}
// 破られた糸は、両端に丸まった切れ端として残す
function drawLost(G, v) {
  const seen = new Set(); ctx.lineCap = "round";
  for (const L of G.lost) {
    const key = L.a + "-" + L.b; if (seen.has(key)) continue; seen.add(key);
    const A = G.anchors[L.a], B = G.anchors[L.b], ang = Math.atan2(B.y - A.y, B.x - A.x), len = Math.min(16, Math.hypot(B.x - A.x, B.y - A.y) * 0.22) * v.s;
    for (const [P, a] of [[A, ang], [B, ang + Math.PI]]) {
      const x = v.ox + P.x * v.s, y = v.oy + P.y * v.s, ex = x + Math.cos(a) * len, ey = y + Math.sin(a) * len + len * 0.35;
      ctx.globalAlpha = 0.35; ctx.strokeStyle = C.slate; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 0.7, y + 1.1); ctx.quadraticCurveTo(x + Math.cos(a) * len * 0.6 + 0.7, y + 1.1, ex + 0.7, ey + 1.1); ctx.stroke();
      ctx.globalAlpha = 0.85; ctx.strokeStyle = L.by === "wasp" ? "#cfc9b2" : "#d8dfdd"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + Math.cos(a) * len * 0.6, y, ex, ey); ctx.stroke();
      ctx.beginPath(); ctx.arc(ex + 1.6, ey, 1.8, Math.PI, Math.PI * 2.5); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}
function drawOver(now, dt) {
  ctx.drawImage(plain, 0, 0, W, H);
  const tw = Math.min(W - 32, 360);
  let v, tx, ty;
  if (!Lay.land) { const rh = Math.min(H * 0.48, H - 400), rs = Math.min((W - 40) / 390, rh / 692); v = { s: rs, ox: (W - 390 * rs) / 2, oy: 56 }; tx = (W - tw) / 2; ty = 56 + 692 * rs + 14; }
  else { const rs = Math.min((W * 0.5 - 40) / 390, (H - 70) / 692); v = { s: rs, ox: W * 0.25 - 195 * rs, oy: 52 }; tx = W * 0.5 + Math.max(10, (W * 0.5 - tw) / 2 - 10); ty = 40; }
  ctx.fillStyle = C.slate; ctx.textAlign = Lay.land ? "left" : "center"; ctx.textBaseline = "alphabetic"; ctx.font = `24px ${FH}`;
  const head = G.reason === "torn" ? "スズメバチに網を破られた" : G.reason === "empty" ? "糸が尽きた" : "日が暮れた";
  ctx.fillText(head, Lay.land ? 24 : W / 2, 38);
  if (!SPR.over || SPR.over.k !== v.s) SPR.over = { k: v.s, c: overBack(v) };
  ctx.drawImage(SPR.over.c, 0, 0, W, H);
  drawLost(G, v);
  frameNo++; computeWeb(G, v, now, dt); drawWeb(G, v, now, { allBeads: true });
  const cs = SPR.cocoon.d * v.s / Lay.s;
  for (const b of G.bugs) if ((b.st === "cocoon" || b.st === "caught") && G.thread(b.th)) { const p = ptOn(G.thread(b.th), b.u); ctx.drawImage(SPR.cocoon.c, p[0] - cs / 2, p[1] - cs / 2 + 2, cs, cs); }
  const d = new Date(), S = G.stats;
  const why = G.reason === "torn" ? `日暮れまで あと${Math.max(1, Math.ceil(G.dur - G.t))}秒だった` : G.reason === "empty" ? "糸を使いきった" : G.tears ? `スズメバチに${G.tears}回破られた` : "一度も破られずに日暮れまで";
  const rows = [
    [`${d.getMonth() + 1}月${d.getDate()}日の網`, 32, `16px ${FB}`],
    [`ハエ ${S.fly}匹　ガ ${S.moth}匹　カナブン ${S.beetle}匹`, 32, `15px ${FB}`],
    [S.knot && (ctx.font = `15px ${FB}`, ctx.measureText(`${why}　結び目で ${S.knot}匹`).width <= tw - 20) ? `${why}　結び目で ${S.knot}匹` : why, 32, `15px ${FB}`],
    [`${G.score}`, 60, `40px ${FH}`],
    [newBest ? `自己ベストを更新　${best} てん` : `自己ベスト　${best} てん`, 32, `15px ${FB}`],
  ];
  let y = ty;
  for (const [s, h, f] of rows) {
    const img = h > 40 ? SPR.tBig : SPR.tLine; ctx.drawImage(img, tx - 1, y - 1, tw + 6, h + 8);
    ctx.fillStyle = C.slate; ctx.font = f; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (h > 40) { const w = ctx.measureText(s).width; ctx.fillText(s, tx + tw / 2 - 14, y + h / 2 + 2); ctx.font = `16px ${FB}`; ctx.fillText("てん", tx + tw / 2 + w / 2 + 4, y + h / 2 + 8); }

    y += h + 8;

  const a = HUD.again; ctx.drawImage(SPR.tStart, a.x - 1, a.y - 1, 232, 56);
  ctx.font = `19px ${FH}`; ctx.fillText("もう一回", a.x + a.w / 2, a.y + a.h / 2 + 1);
}
function frame(ms) {

  ctx.drawImage(bg, 0, 0, W, H);

  else { drawPlay(G.t, paused ? 0 : dt); drawHUD(now); drawBanner(paused ? 0 : dt); }

    const w = Math.min(W - 40, 300), x = (W - w) / 2, y = H / 2 - 30;
    ctx.drawImage(SPR.tBan, x, y, w + 6, 62); ctx.fillStyle = C.slate; ctx.font = `16px ${FB}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("とめています", x + w / 2, y + 19); ctx.fillText("押すと、つづきから", x + w / 2, y + 40);
  }
  requestAnimationFrame(frame);
}
layout();
if (document.fonts && document.fonts.load) { Promise.all([document.fonts.load(`40px "RocknRoll One"`), document.fonts.load(`16px Yomogi`)]).catch(() => {}); }
requestAnimationFrame(frame);
window.__game = { get G() { return G; }, get state() { return state; }, start, fps() { const n = fpsLog.length; return n > 10 ? ((n - 1) * 1000) / (fpsLog[n - 1] - fpsLog[0]) : 0; }, layout };
