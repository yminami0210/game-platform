<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>朝つゆの網 代表場面</title>
<link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Yomogi&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#c3c9bd}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script src="stitch.js"></script>
<script>
// 代表場面（修正版）: 昼前（ひと日の4割）。支柱のあいだに銀糸を5本渡し、交わった所に結び目ができている。
// ガが1本の糸にかかって糸が弓なりにしなり、露のビーズが片側へはじけた瞬間。
// 右から、スズメバチの通り道が「レモンと濃灰の2本どり」のしつけ糸で予告され、上の糸がその上にかかっている（危ない）。
// 刺繍の布であることを見せる: 麻の織り目、刺していない所、輪郭だけの株、下の端の折り返しとまつり縫い。
const W = 390, H = 844;
async function draw() {
  await document.fonts.load('40px "RocknRoll One"'); await document.fonts.load('16px "Yomogi"');
  const g = makeCanvas("c", W, H); setSeed(12);
  linen(g, W, H);
  // 雲は1つだけ（チェーンステッチの輪郭＋中に間を空けた数本の針。麻が透ける。端で切らない）
  { const cx = 262, cy = 150, pts = [];
    for (let i = 0; i <= 40; i++) { const a = i / 40 * Math.PI * 2, bump = 1 + 0.16 * Math.sin(a * 5 + 1) + 0.08 * Math.sin(a * 3), ry = Math.sin(a) > 0 ? 15 : 24; pts.push([cx + Math.cos(a) * 66 * bump, cy + Math.sin(a) * ry * bump + (Math.sin(a) > 0 ? Math.sin(a * 4) * 3 : 0)]); }
    chain(g, pts, "#a9b8b6");
    for (const [x, y, l] of [[222, 142, 30], [246, 132, 44], [270, 152, 36], [236, 160, 22], [292, 140, 26]]) stitch(g, x, y, x + l, y + rr(-1.5, 1.5), 2, "#eef1ec", { shA: 0.18 });
  }
  // 生垣の稜線（1本の不揃いな線。横一列にそろえない）
  const ridge = [[-6, 318], [30, 300], [62, 312], [96, 276], [140, 290], [168, 262], [214, 272], [246, 300], [282, 284], [318, 252], [352, 270], [396, 262]];
  // 生垣: こんもりは15個。奥は大きく暗く、手前は小さく明るい。2つは輪郭だけ、間に麻の地が残る
  const bush = [
    [190, 380, 92, 84, 0], [46, 384, 74, 70, 0], [340, 350, 84, 82, 0], [112, 304, 36, 26, 1], [262, 300, 30, 22, 1],
    [118, 470, 56, 48, 0], [272, 462, 62, 52, 0], [380, 456, 34, 40, 0], [10, 470, 30, 36, 0],
    [200, 518, 46, 34, 0], [60, 540, 32, 26, 0], [332, 532, 40, 30, 0], [146, 552, 24, 20, 0], [250, 560, 22, 18, 0], [368, 572, 20, 16, 0],
  ];
  for (const [x, y, rx, ry, out] of bush) {
    const k = Math.min(1, Math.max(0, (rx - 20) / 72));
    clump(g, x, y, rx, ry, out ? C.yew : mix(C.yewL, darken(C.yew, 0.12), k), out ? C.yewL : (k > 0.5 ? C.yewL : "#6f8048"), { outlineOnly: !!out });
  }
  // 芝の小道（左下で広く、右奥へ細くなる斜めの道。縁は針目の不揃いな線）
  const pathTop = [[-6, 640], [80, 624], [170, 612], [260, 600], [330, 594], [396, 590]], pathBot = [[396, 604], [320, 614], [240, 634], [150, 664], [70, 696], [-6, 730]];
  const pathP = poly([...pathTop, ...pathBot]);
  g.save(); pathP(g); g.globalAlpha = 0.5; g.fillStyle = "#6f8443"; g.fill(); g.restore();
  fill(g, pathP, { box: [-6, 585, 396, 735], per: 5, ang: -1.45, jit: 0.35, l0: 4, l1: 9, w0: 1.7, w1: 2.2, col: ["#7f9450", "#93a65c", "#6a7f3e"], shA: 0.22 });
  chain(g, pathTop, "#5c7036", { s: 0.8 }); chain(g, pathBot, "#5c7036", { s: 0.8 });
  // 畝（小道の上と下の2枚。下地は薄く、短い針の向きと色をゆっくり変える）
  const nz = (x, y) => Math.sin(x / 53 + y / 31) + Math.sin(x / 23 - y / 41 + 2) * 0.6;
  const bed = (pts) => { const P = poly(pts); g.save(); P(g); g.globalAlpha = 0.6; g.fillStyle = C.hazelD; g.fill(); g.restore();
    fill(g, P, { box: [-6, 560, 396, 820], per: 6, l0: 4, l1: 10, w0: 2, w1: 2.6, shA: 0.25, angf: (x, y) => nz(x, y) * 0.5 + rr(-0.2, 0.2),
      col: (x, y) => { const v = nz(x, y) + rr(-0.5, 0.5); return vary(v > 0.7 ? C.hazelL : v > -0.2 ? C.hazel : "#5c4838"); }, dens: (x, y) => 0.7 + 0.3 * Math.abs(Math.sin(x / 70 + y / 50)) }); };
  bed([[-6, 590], [60, 596], [120, 580], [200, 588], [270, 576], [330, 584], [396, 578], [396, 590], [330, 594], [260, 600], [170, 612], [80, 624], [-6, 640]]);
  bed([[-6, 730], [70, 696], [150, 664], [240, 634], [320, 614], [396, 604], [396, 806], [300, 800], [190, 808], [80, 802], [-6, 808]]);
  // 布の下の端（折り返しとまつり縫い）
  hem(g, W, 812, 32);
  // ハシバミの支柱（三本組みの「ウィグワム」＋右に1本。上で麻ひもで縛る）
  const top = [196, 196];
  const poles = [[56, 760, top[0] - 4, top[1] - 10, 4.2], [330, 770, top[0] + 6, top[1] - 12, 4.4], [168, 792, top[0] + 2, top[1] - 16, 4], [372, 640, 344, 276, 3.4]];
  for (const p of poles) pole(g, ...p);
  const along = (p, t) => [p[0] + (p[2] - p[0]) * t, p[1] + (p[3] - p[1]) * t];
  for (const [pi, t0, t1] of [[0, 0.05, 0.75], [1, 0.08, 0.62], [2, 0.1, 0.82], [3, 0.1, 0.9]]) { const p = poles[pi], a = along(p, t0), b = along(p, t1); vine(g, a[0], a[1], b[0], b[1], 5); }
  for (const [pi, t, side, s] of [[0, 0.1, -1, 1.15], [0, 0.3, 1, 1], [0, 0.5, -1, 1.05], [0, 0.68, -1, 0.9], [1, 0.12, 1, 1.15], [1, 0.34, 1, 1], [1, 0.55, -1, 0.95],
    [2, 0.14, 1, 1.05], [2, 0.66, -1, 0.85], [3, 0.2, 1, 1], [3, 0.5, -1, 0.95], [3, 0.78, 1, 0.85], [1, 0.74, 1, 0.75]]) {
    const p = poles[pi], [x, y] = along(p, t), pa = Math.atan2(p[3] - p[1], p[2] - p[0]), la = pa + side * rr(1.0, 1.5);
    const sx = x + Math.cos(la) * 6, sy = y + Math.sin(la) * 6;
    stitch(g, x, y, sx, sy, 1.6, C.leafD, { hi: false });
    leaf(g, sx, sy, 34 * s * rr(0.9, 1.1), la + rr(-0.2, 0.2), { light: Math.sin(la) < 0 ? 1 : -1 });
  }
  twine(g, top[0] + 1, top[1] - 2, 1.1);
  potOnCane(g, 344, 270, 1.15);
  // 植え付けの木札（手で書いた品種名）
  satin(g, poly([[18, 744], [98, 740], [98, 764], [60, 792], [20, 768]]), 58, 764, 46, 1.57, ["#d8c9a6", "#cbb994"], { sp: 2 });
  text(g, "いんげん", 26, 760, '15px "Yomogi", sans-serif', C.slate, { rot: -0.05 });

  // しつけ糸（虫の通り道の予告）: ふつうの虫は銀灰の1本どり、スズメバチはレモンと濃灰の2本どり。ゆるい S 字で1針ずつ
  baste(g, sPath(-10, 440, 400, 430, 9), "#e1e6e3", 1.8, { l0: 5, l1: 13, g0: 3, g1: 9, shA: 0.55 });
  baste(g, sPath(400, 300, -10, 400, 12), C.lemon, 2.6, { l0: 6, l1: 14, g0: 3, g1: 9, shA: 0.6, ply: C.slate });

  // 張った銀糸（とめ縫い）。交わった所に結び目（銀の結び玉）
  const threads = [[[140, 460], [262, 592], 5], [[118, 596], [240, 432], 4], [[96, 652], [300, 640], 8], [[150, 352], [248, 362], 3]];
  const P = threads.map(([a, b, sag]) => curvePts(a[0], a[1], b[0], b[1], sag));
  for (const pts of P) couch(g, pts);
  const bow = curvePts(104, 528, 262, 520, 34); couch(g, bow); P.push(bow);
  for (const pts of P.slice(0, 4)) beadsOn(g, pts, 17, 1.5, 3.1);
  beadsOn(g, bow.slice(0, 9), 14, 1.6, 3);
  bead(g, 222, 514, 2.2); bead(g, 233, 502, 1.6); bead(g, 214, 496, 1.3);
  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) for (const [x, y] of crossings(P[i], P[j])) knot(g, x, y, 2.8, C.silver);
  moth(g, 196, 560, 1.25, 0.2);
  spider(g, 168, 488, 1.15, -0.55);
  wrapped(g, 248, 652, 0.9);
  for (const [x, y] of [[104, 528], [262, 520], [140, 460], [262, 592], [118, 596], [240, 432], [96, 652], [300, 640], [150, 352], [248, 362], [352, 420], [66, 714], [196, 250]]) pin(g, x, y, false);
  pin(g, 338, 254, true);
  fly(g, 44, 438, 1.05, 1.5);
  ladybird(g, 84, 604, 0.95, 0.4);
  wasp(g, 368, 306, 1.15, -1.82);
  bee(g, 70, 238, 1.15, 1.2);

  // --- 上の縁: 1日の進み（運針で縫い進む針）と名前テープの点数・糸巻き ---
  const hemY = 12;
  baste(g, [[6, hemY], [80, hemY + 1], [150, hemY]], C.slate, 1.5, { l0: 5, l1: 10, g0: 3, g1: 7, shA: 0.3 });
  needle(g, 160, hemY, -0.12);
  tape(g, 12, 28, 118, 40, { rot: -0.02 });
  text(g, "38", 24, 60, '30px "RocknRoll One", sans-serif', C.slate, { rot: -0.02 });
  text(g, "てん", 74, 58, '16px "Yomogi", sans-serif', C.slate, { rot: -0.02 });
  reel(g, 352, 58, 0.55, 1);
  tape(g, 258, 36, 66, 30, { rot: 0.02 });
  text(g, "とめる", 268, 57, '16px "Yomogi", sans-serif', C.slate, { rot: 0.02 });
  tape(g, 196, 38, 50, 30, { rot: -0.03 });
  text(g, "音", 214, 59, '16px "Yomogi", sans-serif', C.slate, { rot: -0.03 });
  document.body.dataset.ready = "1";
}
draw();
</script>
</body></html>
