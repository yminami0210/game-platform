<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>せんたく日和</title>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Kosugi+Maru&display=swap" rel="stylesheet">
<style>
:root{
  --odo:#e8c98a; --gunjo:#3f7fb8; --midori:#3d7a5a; --tomato:#d2452f; --shiro:#edf0ee; --sumire:#4a3446;
  --kage:#a890c4; --shita:#d9b778;
  --head:"Mochiy Pop One","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Kosugi Maru","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--sumire);color:var(--sumire);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* 石鹸の包み紙の札: 紙の白にトマトの二重枠（版ずれ1px）、角は切り紙の不揃い。角丸カードにしない */
.tagw{position:absolute;filter:drop-shadow(4px 5px 0 rgba(74,52,70,.32))}
.tag{position:relative;background:var(--shiro);color:var(--sumire);
  clip-path:polygon(0 4%,46% 0,100% 3%,99% 55%,100% 100%,52% 97%,1% 100%,0 50%)}
.tag::before,.tag::after{content:"";position:absolute;pointer-events:none;border:2px solid var(--tomato);inset:4px 5px 5px 4px;transform:translate(1px,-1px)}
.tag::after{border-width:1px;inset:8px 9px 9px 8px}
.pin{position:absolute;top:-9px;width:9px;height:22px;pointer-events:none;z-index:2}
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}
#hud[hidden]{display:none}
#scoreW{transform:rotate(-2.5deg);transform-origin:0 0}
#scoreW .tag{padding:12px 16px 11px 15px;min-width:118px}
#cnt{font-size:13px;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#score{font-family:var(--head);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#score small{font-family:var(--body);font-size:14px;font-weight:700;margin-left:3px}
#hintW{transform:rotate(-1deg);transition:opacity .25s;max-width:min(250px,64vw)}
#hintW.off{opacity:0}
#hintW .tag{padding:9px 13px 9px 12px;font-size:13px;line-height:1.45;font-weight:700;clip-path:polygon(0 6%,60% 0,100% 5%,99.5% 100%,40% 96%,0 100%)}
#hintW .tag::before,#hintW .tag::after{display:none}
.tbtn{pointer-events:auto;border:0;cursor:pointer;font-family:var(--body);font-weight:700;font-size:14px;color:var(--sumire);
  padding:12px 13px 11px;min-height:44px;background:var(--shiro);clip-path:polygon(0 3%,100% 0,98% 100%,2% 96%);touch-action:manipulation}
.tbtn:active{transform:translate(1px,2px)}
.tbtn:focus-visible{outline:2px dashed var(--sumire);outline-offset:-6px}
#muteB.off{text-decoration:line-through;text-decoration-thickness:2px}
#pauseW{transform:rotate(3.5deg)}
#muteW{transform:rotate(-2deg)}
#sayW{position:fixed;z-index:4;transform:rotate(2deg);transition:opacity .25s;pointer-events:none}
#sayW.off{opacity:0}
#sayW .tag{padding:9px 13px 10px;font-family:var(--head);font-size:15px;white-space:nowrap}
#sayW .tag::before,#sayW .tag::after{display:none}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;z-index:6}
.screen[hidden]{display:none}
.bw{position:relative;width:min(350px,100%);max-height:100%;display:flex;filter:drop-shadow(5px 7px 0 rgba(74,52,70,.38))}
.board{position:relative;width:100%;max-height:100%;overflow:auto;touch-action:pan-y;background:var(--shiro);padding:26px 24px 22px;
  clip-path:polygon(0 1%,38% 0,100% 1.2%,99.4% 50%,100% 99%,58% 100%,.5% 98.8%,0 52%)}
.board::before,.board::after{content:"";position:absolute;pointer-events:none;border:2.4px solid var(--tomato);inset:7px 8px 8px 7px;transform:translate(1px,-1px)}
.board::after{border-width:1px;inset:12px 13px 13px 12px}
.logo{font-family:var(--head);font-weight:400;font-size:44px;line-height:1.08;letter-spacing:.01em;color:var(--sumire);
  text-shadow:2.5px 2.5px 0 var(--tomato)}
.lead{font-size:15px;line-height:1.6;margin-top:10px;font-weight:700}
.how{font-size:14px;line-height:1.65;margin-top:10px}
.how b{font-weight:700;border-bottom:2px solid var(--odo)}
.keys{font-size:12.5px;line-height:1.55;margin-top:8px;opacity:.9}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}
.go{white-space:nowrap;font-family:var(--head);font-size:21px;color:var(--shiro);background:var(--sumire);border:0;cursor:pointer;padding:11px 20px 12px;
  clip-path:polygon(0 5%,100% 0,98% 100%,2% 95%);touch-action:manipulation}
.go:active{transform:translate(1px,2px)}
.go:focus-visible{outline:3px dashed var(--tomato);outline-offset:3px}
.best{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
#rTitle{font-family:var(--head);font-size:28px;line-height:1.15;text-shadow:2px 2px 0 var(--tomato)}
#rWhy{font-size:13.5px;margin-top:6px;line-height:1.5}
#pile{display:block;width:100%;height:170px;margin-top:6px}
#rScore{font-family:var(--head);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
#rScore small{font-family:var(--body);font-size:17px;font-weight:700;margin-left:4px}
#rList{font-size:13.5px;line-height:1.6;margin-top:6px;font-variant-numeric:tabular-nums}
#rBest{margin-top:4px}
.nb{display:inline-block;font-family:var(--head);font-size:14px;color:var(--shiro);background:var(--tomato);padding:3px 9px 4px;margin-left:6px;transform:rotate(-3deg)}
body.wide .bw{width:min(560px,100%)}
body.wide .board{padding:20px 24px 16px}
body.wide .cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;align-items:start}
@media (prefers-reduced-motion:reduce){#hintW,#sayW{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="路地の物干し"></canvas>
<div id="hud" hidden>
  <div class="tagw" id="scoreW"><svg class="pin" style="left:54px" viewBox="0 0 9 22"><path d="M1.2 1 7.6 .6 8 21 1 21.4Z" fill="#e8c98a" stroke="#4a3446" stroke-width="1.3"/><path d="M4.5 1.5V20.5" stroke="#4a3446" stroke-width=".8" opacity=".7"/><path d="M.5 9q4 2.6 8 0" stroke="#4a3446" stroke-width="1.4" fill="none"/></svg>
    <div class="tag"><div id="cnt">取りこみ 0まい</div><div id="score">0<small>てん</small></div></div></div>
  <div class="tagw off" id="hintW"><div class="tag" id="hint"></div></div>
  <div class="tagw" id="muteW"><button class="tbtn" id="muteB" aria-label="音を消す（M）">おと</button></div>
  <div class="tagw" id="pauseW"><svg class="pin" style="left:36px" viewBox="0 0 9 22"><path d="M1 .8 7.8 1 7.4 21.2 1.3 21Z" fill="#e8c98a" stroke="#4a3446" stroke-width="1.3"/><path d="M4.5 1.5V20.5" stroke="#4a3446" stroke-width=".8" opacity=".7"/><path d="M.5 9q4 2.6 8 0" stroke="#4a3446" stroke-width="1.4" fill="none"/></svg><button class="tbtn" id="pauseB" aria-label="ひと休み（P）">ひと休み</button></div>
</div>
<div class="tagw off" id="sayW"><div class="tag" id="say"></div></div>

<div class="screen" id="titleS">
  <div class="bw"><div class="board">
    <div class="cols"><div>
      <h1 class="logo">せんたく<br>日和</h1>
      <p class="lead">路地に渡した2本の綱に、濡れた洗濯物を干す。日が沈むまでに、乾いた物をかごへ。</p>
    </div><div>
      <p class="how">たらいの洗濯物をつまんで綱へ。揺れはじめたら乾いた合図、つまんでかごへ。<br><b>上の綱の色物の真下に白い物</b>を干すと色が移る。重すぎると綱が切れる。</p>
      <p class="keys">PC はマウスで同じ操作。キーなら Tab・矢印で選び Space で持つ／置く。M で音、P でひと休み</p>
    </div></div>
    <div class="row"><button class="go" id="startB">干しはじめる</button><span class="best" id="tBest"></span></div>
  </div></div>
</div>

<div class="screen" id="pauseS" hidden>
  <div class="bw"><div class="board">
    <h2 class="logo" style="font-size:32px">ひと休み</h2>
    <p class="how">太陽も綱も止まっています。</p>
    <div class="row"><button class="go" id="resumeB">つづける</button></div>
  </div></div>
</div>

<div class="screen" id="resultS" hidden>
  <div class="bw"><div class="board">
    <div class="cols"><div>
      <h2 id="rTitle">日が沈んだ</h2>
      <p id="rWhy"></p>
      <canvas id="pile" width="300" height="170" aria-label="その日のかごの中身"></canvas>
    </div><div>
      <div id="rScore">0<small>てん</small></div>
      <p id="rList"></p>
      <p class="best" id="rBest"></p>
      <div class="row"><button class="go" id="againB">もう一回干す</button></div>
    </div></div>
  </div></div>
</div>
<script>
"use strict";
// <sim> ここから下は DOM に触らない（自動プレイのボットがそのまま読み込む）
const SIM = (() => {
  const W = 390, H = 844, DUR = 100;
  // 綱の両端（滑車の位置）。0 = 上の綱、1 = 下の綱
  const ROPES = [
    { x1: 84, y1: 222, x2: 308, y2: 210 },
    { x1: 80, y1: 400, x2: 312, y2: 393 },
  ];
  const LIM = 10.5;        // 1本の綱が耐えられる濡れ物の重さ
  const RESTRING = 10;     // 切れた綱の張り直し（秒）
  const PEN_GAP = 1.2;     // 操作と無関係の罰どうしの間（秒）
  const KINDS = {
    sock:   { w: 34,  h: 54,  wt: 1.0, pt: 1, col: "r", dry: 6.5, name: "靴下" },
    shirt:  { w: 66,  h: 84,  wt: 2.0, pt: 2, col: "",  dry: 9.5, name: "シャツ" },
    shirtB: { w: 66,  h: 84,  wt: 2.0, pt: 2, col: "b", dry: 9.5, name: "青いシャツ" },
    towel:  { w: 48,  h: 82,  wt: 2.4, pt: 2, col: "",  dry: 11,  name: "タオル" },
    jeans:  { w: 70,  h: 110, wt: 3.8, pt: 3, col: "b", dry: 12,  name: "ジーンズ" },
    sheet:  { w: 118, h: 120, wt: 5.6, pt: 5, col: "",  dry: 14,  name: "シーツ" },
  };
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rnd = (S) => ((S.r = (S.r * 16807) % 2147483647) / 2147483647);

  // 影の境目: 左の手前の家の屋根の輪郭（軒・腕金・窓台の鉢・下の窓台・樋の金具）をなぞった段つき。
  // p = 0（昼すぎ）〜 1（日没）。描く絵もこの式で多角形を作る
  const STEPS = [[112, 131, 10], [198, 246, 15], [338, 366, 13], [438, 468, 15], [588, 614, 11]];
  function edgeBase(y, p) {
    const q = Math.pow(clamp(p, 0, 1), 3.2);
    const A = 66 + 262 * q, B = 198 + 236 * q;
    return A + (B - A) * clamp((y - 112) / 588, 0, 1.3);
  }
  function edgeX(y, p) { let x = edgeBase(y, p); for (const [a, b, k] of STEPS) if (y >= a && y <= b) x += k; return x; }
  const ropeMidY = (r) => (ROPES[r].y1 + ROPES[r].y2) / 2;
  function sunFrac(S, it) {
    const sx = edgeX(ropeMidY(it.rope), S.t / DUR);
    return clamp((it.x + it.w - sx) / it.w, 0, 1);
  }
  const load = (it) => it.wt * (0.3 + 0.7 * Math.min(1, it.wet)) * Math.max(1, it.wet);
  function ropeLoad(S, r) { let s = 0; for (const it of S.ropes[r].items) s += load(it); return s; }

  function newItem(S) {
    const p = clamp(S.t / DUR, 0, 1);
    const wts = { sock: 3 - 1.6 * p, shirt: 3 - 1.4 * p, towel: 2, shirtB: 0.5 + 1.6 * p, jeans: 0.7 + 2.0 * p, sheet: 0.5 + 2.3 * p };
    let kind;
    for (let tries = 0; tries < 6; tries++) {
      let tot = 0; for (const k in wts) tot += wts[k];
      let u = rnd(S) * tot; kind = "sock";
      for (const k in wts) { u -= wts[k]; if (u <= 0) { kind = k; break; } }
      if (!(S.lastKinds[0] === kind && S.lastKinds[1] === kind)) break;
    }
    S.lastKinds.unshift(kind); S.lastKinds.length = 2;
    const K = KINDS[kind];
    const wet = 1 + 0.38 * p + rnd(S) * 0.08;
    return { id: ++S.nid, kind, w: K.w, h: K.h, wt: K.wt, pt: K.pt, col: K.col, dry: K.dry, wet, wet0: wet,
      stain: 0, stained: false, stainCol: "", pegs: 2, dryFor: -1, flutter: false, flutterAt: 0, rope: -1, x: 0, seed: (rnd(S) * 1e9) | 0 };
  }

  function create(seed) {
    const S = { r: (seed % 2147483646) + 1, t: 0, dur: DUR, nid: 0, lastKinds: [], over: false, endReason: "",
      ropes: [{ items: [], broken: false, restring: 0, strain: 0 }, { items: [], broken: false, restring: 0, strain: 0 }],
      tub: { queue: [], wait: 0 }, held: null, score: 0, combo: 0, delivered: [], fallen: 0, blown: 0, stainedN: 0,
      pigeons: [], pigT: 9, lastPen: -9, grace: 0, ev: [], log: [], quiet: false };
    S.tub.queue.push(newItem(S), newItem(S));
    return S;
  }
  function emit(S, e) { e.t = S.t; S.ev.push(e); S.log.push(e); }

  function overlaps(a0, a1, b0, b1) { return Math.min(a1, b1) - Math.max(a0, b0); }
  // 置ける位置を探す（重なっていたら近くの空きへずらす）。無ければ null
  function freeSpot(S, r, x, w, ignoreId) {
    const R = ROPES[r], lo = R.x1 + 5, hi = R.x2 - 5 - w;
    if (hi < lo) return null;
    const ok = (xx) => S.ropes[r].items.every((o) => o.id === ignoreId || overlaps(xx, xx + w, o.x - 1, o.x + o.w + 1) <= 0);
    x = clamp(x, lo, hi);
    for (let d = 0; d <= 40; d += 2) {
      for (const s of d ? [x - d, x + d] : [x]) { if (s >= lo && s <= hi && ok(s)) return s; }
    }
    return null;
  }
  function pigeonAt(S, r, x0, x1) { return S.pigeons.find((p) => p.rope === r && !p.leaving && overlaps(x0, x1, p.x - 17, p.x + 17) > 0); }

  function canPlace(S, r, x) {
    const it = S.held; if (!it || S.over || S.ropes[r].broken) return null;
    return freeSpot(S, r, x, it.w);
  }
  function hang(S, it, r, x) { it.rope = r; it.x = x; S.ropes[r].items.push(it); S.ropes[r].items.sort((a, b) => a.x - b.x); }
  function place(S, r, x) {
    const it = S.held; if (!it) return false;
    const xx = canPlace(S, r, x); if (xx == null) return false;
    S.held = null; it.pegs = 2; hang(S, it, r, xx);
    emit(S, { type: "place", id: it.id, rope: r, x: xx });
    const pg = pigeonAt(S, r, xx, xx + it.w);
    if (pg) {
      pg.leaving = true; pg.leaveT = 0;
      // 羽ばたきで、いちばん近い洗濯物（無ければ今の物）の洗濯ばさみが1つ外れる
      let best = null, bd = 1e9;
      for (const o of S.ropes[r].items) { if (o.id === it.id) continue; const d = Math.abs(o.x + o.w / 2 - pg.x); if (d < bd) { bd = d; best = o; } }
      const vic = best && bd < 130 ? best : it;
      S.lastPen = S.t;
      if (vic.wet <= 0 && vic !== it) {
        // 乾いて軽い物は、片方の洗濯ばさみが外れるとそのまま路地へ落ちる
        S.ropes[r].items.splice(S.ropes[r].items.indexOf(vic), 1); S.fallen++; S.combo = 0;
        emit(S, { type: "pigeonFly", x: pg.x, rope: r, id: vic.id, item: vic, fell: true, pen: true });
      } else {
        vic.pegs = 1; vic.droopSide = vic.x + vic.w / 2 < pg.x ? 1 : -1;
        emit(S, { type: "pigeonFly", x: pg.x, rope: r, id: vic.id, pen: true });
      }
    }
    return true;
  }
  function pickTub(S) {
    if (S.held || S.over || S.tub.wait > 0 || !S.tub.queue.length) return null;
    const it = S.tub.queue.shift(); it.from = { tub: true }; S.held = it; S.tub.wait = 0.45;
    while (S.tub.queue.length < 2) S.tub.queue.push(newItem(S));
    emit(S, { type: "pick", id: it.id, tub: true });
    return it;
  }
  function pickHung(S, id) {
    if (S.held || S.over) return null;
    for (let r = 0; r < 2; r++) {
      const a = S.ropes[r].items, i = a.findIndex((o) => o.id === id);
      if (i >= 0) { const it = a.splice(i, 1)[0]; it.from = { rope: r, x: it.x }; it.rope = -1; S.held = it; emit(S, { type: "pick", id, rope: r, x: it.x, load: load(it) }); return it; }
    }
    return null;
  }
  function cancel(S) {
    const it = S.held; if (!it) return;
    S.held = null;
    const f = it.from || { tub: true };
    if (!f.tub && !S.ropes[f.rope].broken) {
      const xx = freeSpot(S, f.rope, f.x, it.w);
      if (xx != null) { hang(S, it, f.rope, xx); emit(S, { type: "back", id: it.id, rope: f.rope }); return; }
    }
    S.tub.queue.unshift(it); S.tub.wait = 0;
    emit(S, { type: "back", id: it.id, tub: true });
  }
  function toTub(S) {
    const it = S.held; if (!it) return;
    S.held = null; S.tub.queue.unshift(it); S.tub.wait = 0;
    emit(S, { type: "back", id: it.id, tub: true });
  }
  function deliver(S) {
    const it = S.held; if (!it || it.wet > 0) return false;
    S.held = null;
    const pts = it.stained ? 0 : it.pt;
    S.score += pts; S.delivered.push(it);
    if (it.stained) S.combo = 0; else S.combo++;
    emit(S, { type: "deliver", id: it.id, pts, stained: it.stained, kind: it.kind });
    // 5枚続けて色移りなし → おばあさんの拍手（続くほど大きい）
    if (!it.stained && S.combo > 0 && S.combo % 5 === 0) { const b = S.combo / 5 + 1; S.score += b; emit(S, { type: "grandma", n: S.combo, bonus: b }); }
    return true;
  }
  // 海からの風は時間とともに強まる: よく乾くが、乾いた物を放っておくと飛ばされやすい
  function windDry(p) { return 0.5 + 2.0 * p; }
  function flutterTime(p) { return 9 - 4.5 * p; }

  function snap(S, r) {
    const R = S.ropes[r];
    const lost = R.items.splice(0);
    S.fallen += lost.length; S.combo = 0;
    R.broken = true; R.restring = RESTRING; R.strain = 0;
    S.lastPen = S.t;
    emit(S, { type: "snap", rope: r, items: lost, pen: true });
    if (S.ropes[1 - r].broken) end(S, "ropes");
  }
  function end(S, why) { if (S.over) return; S.over = true; S.endReason = why; emit(S, { type: "end", why }); }

  function step(S, dt) {
    if (S.over) return;
    S.t += dt;
    const p = clamp(S.t / DUR, 0, 1);
    if (S.tub.wait > 0) S.tub.wait -= dt;
    for (let r = 0; r < 2; r++) {
      const R = S.ropes[r];
      if (R.broken) { R.restring -= dt; if (R.restring <= 0) { R.broken = false; emit(S, { type: "restrung", rope: r }); } continue; }
      for (let i = R.items.length - 1; i >= 0; i--) {
        const it = R.items[i];
        if (it.wet > 0) {
          const sun = sunFrac(S, it);
          it.wet -= dt * (1 / it.dry) * (0.2 + 0.8 * sun) * windDry(p) * (it.pegs < 2 ? 0.45 : 1);
          if (it.wet <= 0) { it.wet = 0; it.dryFor = 0; emit(S, { type: "dried", id: it.id }); }
        } else {
          it.dryFor += dt;
          if (!it.flutter && it.dryFor > flutterTime(p)) { it.flutter = true; it.flutterAt = S.t; emit(S, { type: "flutter", id: it.id }); }
          if (it.flutter && S.t - it.flutterAt >= 3 && S.t - S.lastPen >= PEN_GAP) {
            R.items.splice(i, 1); S.blown++; S.lastPen = S.t; S.combo = 0;
            emit(S, { type: "blown", id: it.id, item: it, pen: true });
          }
        }
      }
      const L = ropeLoad(S, r);
      if (L > LIM) {
        if (R.strain === 0) emit(S, { type: "creak", rope: r });

    const p = S ? clamp(S.t / S.dur, 0, 1) : 0.3;
    g.drawImage(L.sky, 0, 0, W, H);
    const eve = clamp((p - 0.55) / 0.4, 0, 1);
    if (eve > 0) { // 夕方の版は地平から上へ刷り替わる（重ねて濁らせない）
      const yl = 200 * (1 - eve);
      g.save(); g.beginPath(); g.moveTo(0, yl + EVJ[0]); for (let i = 1; i <= 8; i++) g.lineTo(W * i / 8, yl + EVJ[i]); g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.clip();
      g.drawImage(L.eve, 0, 0, W, H); g.restore(); }
    g.save(); g.clip(innerPath);
    // 太陽: 光線・光の輪は描かない。空の版を丸く抜いた紙の白（黄土の版が片側にずれて出る）
    { const sx = 150 + 222 * p, sy = 62 + 62 * Math.pow(p, 1.6);
      g.fillStyle = C.odo; g.beginPath(); g.arc(sx + 3, sy - 2, 24.5, 0, 7); g.fill();
      g.fillStyle = C.shiro; g.beginPath(); g.arc(sx, sy, 24, 0, 7); g.fill(); }
    g.drawImage(L.bld, 0, 0, W, H);
    const edge = shadowEdge(p);
    drawShadow(g, edge, 1);
    // 綱と洗濯物（下の綱 → 上の綱）
    drawRope(g, 1); drawRope(g, 0);
    if (S) {
      for (const r of [1, 0]) if (!S.ropes[r].broken) for (const it of S.ropes[r].items) drawHung(g, it);
      warnPg = null;
      for (const pg of S.pigeons) {
        if (S.ropes[pg.rope].broken && !pg.leaving) continue;
        const ry = ropeY(pg.rope, pg.x);
        if (pg.leaving) { const k = pg.leaveT; drawPigeon(g, pg.x + (pg.flip ? -1 : 1) * k * 140, ry + 1 - k * 170 - k * k * 40, pg, 1); }
        else {
          const age = (pg.age = (pg.age || 0) + dtLast), k = Math.max(0, 1 - age / 0.5);
          const warn = lastTarget && lastTarget.type === "rope" && lastTarget.r === pg.rope && S.held && SIM.pigeonAt(S, pg.rope, lastTarget.x, lastTarget.x + S.held.w) === pg ? 1 : 0;
          drawPigeon(g, pg.x - k * 60 * (pg.flip ? -1 : 1), ry + 1 - k * 90, pg, k > 0 ? 1 : 0, warn);
          if (warn) warnPg = [pg, ry];
        }
      }
      // しずく
      for (const d of drips) line(g, [[d.x, d.y], [d.x, d.y + 5]], 2.2, d.col === "r" ? C.tomato : C.gunjo, 0.8);
    }
    drawShadow(g, edge, 2);
    // おばあさん
    if (grandma.t >= 0) { const t = grandma.t, k = t < 0.4 ? t / 0.4 : t > 2.6 ? Math.max(0, 1 - (t - 2.6) / 0.4) : 1; drawGrandma(g, k); }
    // 路地に落ちた物・飛ばされた物
    for (const f of fallers) {
      g.save(); g.globalAlpha = f.mode === "fall" ? clamp(1 - (f.t - 2.4) / 0.8, 0, 1) : clamp(1 - f.t / 1.4, 0, 1);
      g.translate(f.x + f.it.w / 2, f.y); g.rotate(f.rot); g.translate(-f.it.w / 2, 0); drawLocalGarment(g, f.it); g.restore();
    }
    drawTub(g); drawBasket(g);
    // 持っている物: 6〜9°傾けて持ち上げ、平らな影版（ぼかし無し）を 12px ずらして落とす
    if (S && S.held) {
      const it = S.held, ang = -0.13 + (drag ? clamp((drag.vx || 0) * -0.002, -0.08, 0.08) : 0);
      const t = lastTarget;
      if (t && t.type === "rope") {
        // 置き先の予告: 洗濯ばさみの位置と、色移りの筋
        const lk = makeLook(it);
        g.save(); g.globalAlpha = 0.7;
        for (const px of lk.pegs) { const x = t.x + px, y = ropeY(t.r, x); g.strokeStyle = C.sumire; g.lineWidth = 1.5; g.strokeRect(x - 3, y - 7, 6, 15); }
        g.restore();
        const risk = stainRisk(it, t.r, t.x);
        for (const [x, y0, y1, c] of risk) { g.save(); g.strokeStyle = c; g.lineWidth = 2; g.setLineDash([3, 7]); g.lineDashOffset = -now * 30; g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke(); g.restore(); }
      }
      g.save(); g.translate(hx, hy); g.rotate(ang); g.translate(-it.w / 2, 0);
      const lk = makeLook(it);
      g.save(); g.globalCompositeOperation = "multiply"; g.globalAlpha = 0.85; g.fillStyle = C.kage; g.translate(12, 14);
      for (const part of lk.parts) g.fill(part.path); g.restore();
      drawLocalGarment(g, it);
      g.restore();
      // 置こうとしている所に鳩がいるときは、持っている布の手前に鳩を出して見せる
      if (warnPg) drawPigeon(g, warnPg[0].x, warnPg[1] + 1, warnPg[0], 0, 1);
    }
    // 得点の文字
    for (const f of fx) {
      const s = Math.max(20, 15 / scale);
      g.save(); g.globalAlpha = clamp(1.4 - f.t, 0, 1); g.font = `${s}px ${FONT_HEAD}`; g.textAlign = "center";
      g.fillStyle = C.tomato; g.fillText(f.text, f.x + 1.5, f.y - f.t * 30 + 1.5);
      g.fillStyle = C.sumire; g.fillText(f.text, f.x, f.y - f.t * 30); g.restore();
    }
    g.restore();
    drawFrame(g);
  }
  const FONT_HEAD = '"Mochiy Pop One","Hiragino Maru Gothic ProN",sans-serif';
  function stainRisk(it, r, x) {
    const out = [];
    if (!it.col && r === 1) for (const U of S.ropes[0].items) if (U.col && U.wet > 0.05) {
      const a = Math.max(U.x + 4, x), b = Math.min(U.x + U.w - 4, x + it.w);
      if (b > a) for (let xx = a + 3; xx < b; xx += 12) out.push([xx, ropeY(0, xx) + U.h * 0.9, ropeY(1, xx) + 10, U.col === "r" ? C.tomato : C.gunjo]);
    }
    if (it.col && it.wet > 0.05 && r === 0) for (const Lo of S.ropes[1].items) if (!Lo.col && !Lo.stained) {
      const a = Math.max(Lo.x, x + 4), b = Math.min(Lo.x + Lo.w, x + it.w - 4);
      if (b > a) for (let xx = a + 3; xx < b; xx += 12) out.push([xx, ropeY(0, xx) + it.h * 0.9, ropeY(1, xx) + 10, it.col === "r" ? C.tomato : C.gunjo]);
    }
    return out;
  }

  // ---- ループ ----
  let last = performance.now(), dtLast = 0;
  const fps = { n: 0, t: 0, v: 0 };
  function frame(ts) {
    let dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts; dtLast = dt;
    fps.n++; fps.t += dt; if (fps.t >= 1) { fps.v = fps.n / fps.t; fps.n = 0; fps.t = 0; }
    if (paused) dt = 0;
    now += dt;
    if (state === "play" && S) {
      // 持っている物の動きの速さ（傾きに使う）
      if (drag) { drag.vx = ((hx - (drag.lx ?? hx)) / Math.max(dt, 1e-3)); drag.lx = hx; }
      ghost = S.held && lastTarget && lastTarget.type === "rope" ? { r: lastTarget.r, x: lastTarget.x } : null;
      let left = dt; while (left > 1e-6) { const h = Math.min(left, 1 / 60); SIM.step(S, h); left -= h; }
      handleEvents();
      if (S.t > S.dur - 12 && !said.has("dusk")) hint("もうすぐ日が沈む。綱に残った物は点にならない", 3, "dusk");
      // 遠くのかもめとアコーディオン（日没に向けて音程が下がる）
      AU.nextMus -= dt; AU.nextGull -= dt;
      if (AU.nextMus <= 0) { sfx.accordion(); AU.nextMus = 10 + Math.random() * 6; }
      if (AU.nextGull <= 0) { sfx.gull(); AU.nextGull = 14 + Math.random() * 8; }
    } else if (state === "ending") {
      endT += dt; if (S.ev.length) handleEvents();
      if (endT > 1.6) finish();
    }
    if (dt > 0) {
      updateRopes(dt); updateDrips(dt);
      for (let i = fallers.length - 1; i >= 0; i--) {
        const f = fallers[i]; f.t += dt;
        if (f.mode === "fall") { if (f.y < 790) { f.vy += 700 * dt; f.y += f.vy * dt; f.x += f.vx * dt; f.rot += f.vr * dt; } else { f.y = 790; f.rot *= 0.9; } if (f.t > 3.2) fallers.splice(i, 1); }
        else { f.vy += -60 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt; if (f.t > 1.4) fallers.splice(i, 1); }
      }
      for (let i = fx.length - 1; i >= 0; i--) { fx[i].t += dt; if (fx[i].t > 1.4) fx.splice(i, 1); }
      if (grandma.t >= 0) { grandma.t += dt; if (grandma.t > 3) { grandma.t = -1; $("sayW").classList.add("off"); } }
      if (hintT > 0) { hintT -= dt; if (hintT <= 0) $("hintW").classList.add("off"); }
    }
    draw();
    requestAnimationFrame(frame);
  }

  addEventListener("resize", () => { resize(); });
  resize();
  newDemo();
  $("tBest").textContent = best ? `これまでの いちばん ${best} てん` : "";
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (state === "result") drawPileResult(); }).catch(() => {});
  requestAnimationFrame((t) => { last = t; frame(t); });
  window.__gs = { SIM, get S() { return S; }, get state() { return state; }, get fps() { return fps.v; }, start, finish, setPause, toScreen, toWorld, ropeY };
})();
</script>
</body>
