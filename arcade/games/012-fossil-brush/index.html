<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ひと刷けの骨</title>
<meta name="description" content="すり減っていく1本の刷毛で頁岩の板をこすり、ひびをよけて化石の骨を掘り出すミニゲーム">
<link href="https://fonts.googleapis.com/css2?family=Hina+Mincho&family=Murecho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--lino:#7a3c2e;--ink:#1d2731;--paper:#d6cdb2;--brass:#b08d3c}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#7a3c2e;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"Murecho","Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}
canvas#c,canvas#bg{position:fixed;left:0;top:0;display:block;touch-action:none}
.ov{position:fixed;inset:0;display:none;pointer-events:none}
.ov.show{display:block}
.ov>*{pointer-events:auto}
.label{position:absolute;background:var(--paper) var(--ptex);box-shadow:4px 5px 0 rgba(38,14,10,.42);padding:16px 18px 14px;box-sizing:border-box}
.label::before{content:"";position:absolute;inset:7px;border:1.6px solid rgba(29,39,49,.82);pointer-events:none}
.label::after{content:"";position:absolute;inset:10.5px 10px 10px 11px;border:.6px solid rgba(29,39,49,.8);pointer-events:none}
h1{margin:6px 0 8px;font:400 40px/1.15 "Hina Mincho","Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.04em}
.how{margin:0 0 4px;font-size:14px;line-height:1.6;font-weight:500;word-break:auto-phrase}
.small{margin:8px 0 0;font-size:12px;line-height:1.5;font-weight:500}
.tagbtn{position:absolute;border:0;padding:0;background:none;cursor:pointer;font:inherit;color:var(--ink);touch-action:manipulation}
.tagbtn .sh,.tagbtn .face{position:absolute;inset:0;clip-path:polygon(10px 0,100% 1px,99.5% 100%,10px 99%,0 calc(100% - 10px),0 10px)}
.tagbtn .sh{background:rgba(38,14,10,.45);transform:translate(3px,4px)}
.tagbtn .face{background:var(--paper) var(--ptex);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-left:40px;text-align:left}
.tagbtn .face::before{content:"";position:absolute;left:10px;top:calc(50% - 6px);width:12px;height:12px;border-radius:50%;background:var(--brass);box-shadow:inset 0 0 0 3px #b08d3c,inset 0 0 0 6px #6e5420}
.tagbtn b{font-size:21px;font-weight:700;line-height:1.2}
.tagbtn small{font-size:12px;font-weight:500;opacity:.85}
.tagbtn:active .face,.tagbtn.on .face{transform:translate(2px,3px)}
.tagbtn:focus-visible{outline:3px solid #efeee6;outline-offset:4px}
.num{font:400 44px/1.1 "Hina Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.k{font-size:13px;font-weight:500}
.row{font-size:14px;font-weight:500;line-height:1.55;font-variant-numeric:tabular-nums}
#title .label{transform:rotate(-1.2deg)}
#result .label{transform:rotate(.8deg)}
#pause .label{transform:rotate(-.6deg)}
.P #title .label{left:16px;bottom:112px;width:calc(100% - 32px);max-width:360px}
.P #bStart{left:calc(50% - 90px);bottom:34px;width:180px;height:64px;transform:rotate(1.5deg)}
.L #title .label{left:14px;top:14px;width:300px;padding:12px 14px 10px}
.L h1{font-size:32px;margin:2px 0 6px}
.L .how{font-size:13px;line-height:1.5}
.L #bStart{right:40px;bottom:40px;width:180px;height:64px;transform:rotate(1.5deg)}
.P #result .label{left:16px;bottom:118px;width:calc(100% - 32px);max-width:360px}
.P #bAgain{left:calc(50% - 90px);bottom:30px;width:180px;height:64px;transform:rotate(-1.2deg)}
.L #result .label{right:24px;top:16px;width:260px}
.L #bAgain{right:60px;bottom:26px;width:180px;height:64px;transform:rotate(-1.2deg)}
#pause .label{left:calc(50% - 130px);top:calc(50% - 60px);width:260px;text-align:center}
@media (prefers-reduced-motion:reduce){.tagbtn .face{transition:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="c" aria-label="作業台の上の頁岩の板"></canvas>
<div id="title" class="ov show">
  <div class="label">
    <h1>ひと刷けの骨</h1>
    <p class="how">板をこすって化石の骨を出す。白い線の内側はひび、こすると割れる。</p>
    <p class="how" id="howAct">骨が明るくなったら上へ払って収める。ただの石は下へ払って捨てる。</p>
    <p class="small">刷毛の毛が尽きたら終わり。ベスト <span id="tBest">まだ無し</span><br>PC: ドラッグでこする。↑ か Enter で収める、↓ か Backspace で捨てる</p>
  </div>
  <button class="tagbtn" id="bStart"><span class="sh"></span><span class="face"><b>はじめる</b><small>Enter でも始まる</small></span></button>
</div>
<div id="result" class="ov">
  <div class="label">
    <div class="k">得点</div>
    <div class="num" id="rScore">0</div>
    <div class="row" id="rDetail"></div>
    <div class="row" id="rBest"></div>
  </div>
  <button class="tagbtn" id="bAgain"><span class="sh"></span><span class="face"><b>もう一回</b><small>新しい刷毛で</small></span></button>
</div>
<div id="pause" class="ov">
  <div class="label"><div class="row" style="font-size:16px;font-weight:700">一時停止</div><div class="row">P か Esc で続ける</div></div>
</div>

// ---------- タイトルの見本（骨に沿った軌跡でこすって、上半分ほど掘った板） ----------
