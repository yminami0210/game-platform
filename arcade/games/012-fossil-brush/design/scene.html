<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>ひと刷けの骨 代表場面</title>
<link href="https://fonts.googleapis.com/css2?family=Hina+Mincho&family=Murecho:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#7a3c2e}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script src="shale.js"></script>
<script>
// 代表場面: 夜の標本整理室の作業台（弁柄のリノリウム）。7枚目の油頁岩の板を半分ほど掘ったところ。
// ながくびとかげの「胴」。左上の椎骨と肋骨は出ている（椎骨1つは骨の上をこすりすぎて引っかき傷）。右下はまだ上の層の下で、影だけ見える。
// ひびは2本: 左下の細いひび（ダーマトの白い線で両脇を囲ってある）と、右上の伸びたひび（剥がれが出ている）。
const W = 390, H = 844;
async function draw() {
  await Promise.all([document.fonts.load('34px "Hina Mincho"'), document.fonts.load('700 20px "Murecho"'), document.fonts.load('500 12px "Murecho"')]);
  const g = mountCanvas("c", W, H);

  // ---- 作業台 ----
  blit(g, linoTex(W, H, 41));
  // リノリウムの継ぎ目（斜めの切れ目1本）
  setSeed(5); g.strokeStyle = "rgba(40,16,12,0.55)"; g.lineWidth = 1.1; g.beginPath(); g.moveTo(-5, 652); g.lineTo(140, 640); g.lineTo(395, 618); g.stroke();
  g.strokeStyle = "rgba(170,110,90,0.35)"; g.lineWidth = 0.7; g.beginPath(); g.moveTo(-5, 653.4); g.lineTo(140, 641.4); g.lineTo(395, 619.4); g.stroke();

  // ---- 板の形 ----
  const ang = -0.06, cx = 197, cy = 393;
  setSeed(77);
  const slab = rot(chipped([[-162, -226], [148, -238], [170, -90], [166, 218], [24, 236], [-164, 214], [-176, -36]], 9, 2.2, 0.12, 7), cx, cy, ang);
  const slabP = pathOf(slab);
  // 台に落ちる影（ぼかさない。濃さ2段）
  g.fillStyle = "rgba(38,14,10,0.30)"; g.fill(pathOf(slab.map(([x, y]) => [x + 12, y + 15])));
  g.fillStyle = "rgba(38,14,10,0.35)"; g.fill(pathOf(slab.map(([x, y]) => [x + 6, y + 8])));
  // 板の厚み（割れた層の段が右下に2枚）
  g.fillStyle = "#283233"; g.fill(pathOf(slab.map(([x, y]) => [x + 5, y + 7])));
  setSeed(12); g.fillStyle = "#56615f"; g.fill(pathOf(chipped(slab, 14, 1.5, 0.2, 4).map(([x, y]) => [x + 3.5, y + 4.6])));
  g.fillStyle = "#353f40"; g.fill(pathOf(slab.map(([x, y]) => [x + 2, y + 2.6])));

  // ---- 骨の形 ----
  const sp = quad([92, 212], [92, 540], [330, 600], 200);
  const parts = [], pits = [], vcent = [];
  const pick = (t) => { const i = Math.round(t * 200), a = sp[Math.max(0, i - 1)], b = sp[Math.min(200, i + 1)]; return [sp[i], Math.atan2(b[1] - a[1], b[0] - a[0])]; };
  const arc = [0]; for (let i = 1; i <= 200; i++) arc.push(arc[i - 1] + Math.hypot(sp[i][0] - sp[i - 1][0], sp[i][1] - sp[i - 1][1]));
  const atLen = (d) => { let i = 0; while (i < 200 && arc[i] < d) i++; return i / 200; };
  let d = 22;
  for (let i = 0; i < 11; i++) {
    const len = 46 - i * 1.5, hgt = 30 - i * 0.85;
    let [[x, y], a] = pick(atLen(d + len / 2));
    if (i === 9) { x += 8; y += 14; a += 0.4; d += 8; } // ずれて外れた椎骨
    vcent.push([x, y, a, hgt]);
    parts.push(...vertebra(x, y, a, len, hgt, 300 + i, -1));
    setSeed(400 + i); pits.push([x + rr(-8, 8), y + rr(-3, 3), rr(0.9, 1.7)]);
    d += len + 3 + (i === 4 ? 6 : 0);
  }
  // 肋骨: カーブの内側（右上）へ扇に開く。長さ・反り・向きを1本ずつ変える。2本目は折れてずれ、1本は外れて斜めに転がる
  const ribs = [[0, 96, 10, -1, -0.32, 0.9], [1, 118, 11, 0.52, -0.12, 1.2], [2, 124, 11.5, -1, 0.05, 0.7], [3, 110, 10.6, -1, 0.22, 1.35], [5, 92, 9.4, 0.62, 0.3, 0.8], [6, 84, 8.8, -1, 0.42, 1.1], [7, 74, 8.2, -1, 0.5, 0.9], [8, 60, 7.4, -1, 0.62, 1.2]];
  ribs.forEach(([vi, L, w, brk, da, bend], k) => {
    const [x, y, a0, hgt] = vcent[vi], a = a0 + da, nx = Math.sin(a), ny = -Math.cos(a), tx = Math.cos(a), ty = Math.sin(a);
    const p0 = [x + nx * hgt * 0.42 + tx * 8, y + ny * hgt * 0.42 + ty * 8], p2 = [x + nx * L - tx * 30 * bend, y + ny * L - ty * 30 * bend], p1 = [x + nx * L * 0.5 + tx * 16 * bend, y + ny * L * 0.5 + ty * 16 * bend];
    parts.push(...rib(p0, p1, p2, w, 500 + k, brk, [6, -7]));
  });
  parts.push(...rib([206, 470], [246, 420], [292, 430], 9.4, 520)); // 外れて転がった肋骨（他の肋骨と向きが違う）
  setSeed(530); for (let k = 0; k < 4; k++) { const x = rr(232, 300), y = rr(318, 392), a = rr(0, 3); parts.push(ribbon(quad([x, y], [x + Math.cos(a) * 10, y + Math.sin(a) * 10 + 3], [x + Math.cos(a) * 21, y + Math.sin(a) * 21], 8), (t) => 3.6 * (1 - t * 0.5))); } // 腹肋の細い棒
  const mask = boneMask(W, H, parts);
  const bones = boneLayer(mask, 61, pits);
  // 椎骨どうしの関節のすき間（椎体の端に暗い線。少し曲げる）
  { const jt = makeCanvas(W, H); vcent.forEach(([x, y, a, hgt], i) => { const len = 46 - i * 1.5, tx = Math.cos(a), ty = Math.sin(a), nx = -ty, ny = tx; for (const e of [-1, 1]) { const ex = x + tx * (len / 2 + e * 0.5) * e, ey = y + ty * (len / 2 + e * 0.5) * e; jt.strokeStyle = 'rgba(60,30,12,0.95)'; jt.lineWidth = 1.6; jt.beginPath(); jt.moveTo(ex - nx * hgt * 0.5, ey - ny * hgt * 0.5); jt.quadraticCurveTo(ex + tx * 2 * e, ey + ty * 2 * e, ex + nx * hgt * 0.5, ey + ny * hgt * 0.5); jt.stroke(); } });
    jt.globalCompositeOperation = 'destination-in'; blit(jt, mask); blit(bones, jt); }
  // こすりすぎた椎骨（2つ目）: 細い明るい引っかき傷と、くすみ
  { const [x, y] = vcent[1]; const sc = makeCanvas(W, H); setSeed(88); sc.fillStyle = "rgba(120,110,96,0.35)"; sc.beginPath(); sc.ellipse(x, y, 20, 15, 0.8, 0, 7); sc.fill();
    for (let k = 0; k < 14; k++) { const ox = x + rr(-14, 10), oy = y + rr(-10, 10), a = 0.55 + rr(-0.15, 0.15), l = rr(8, 20); sc.strokeStyle = `rgba(246,226,190,${rr(0.5, 0.9)})`; sc.lineWidth = rr(0.4, 0.8); sc.beginPath(); sc.moveTo(ox, oy); sc.lineTo(ox + Math.cos(a) * l, oy + Math.sin(a) * l); sc.stroke(); }
    sc.globalCompositeOperation = "destination-in"; blit(sc, mask); blit(bones, sc); }

  // ---- 板の中身 ----
  const S = makeCanvas(W, H);
  blit(S, shaleTex(W, H, 23, ang));
  // こすった道（ジグザグの往復）
  const zig = (x, y, a, len, wid, n, j) => { setSeed(j); const o = []; const tx = Math.cos(a), ty = Math.sin(a), nx = -ty, ny = tx; for (let i = 0; i <= n; i++) { const s = (i % 2 ? 1 : -1) * len / 2 * rr(0.75, 1.05), q = -wid / 2 + wid * i / n + rr(-2, 2); o.push([x + tx * s + nx * q, y + ty * s + ny * q]); } return o; };
  const strokes = [
    [zig(112, 250, 0.3, 110, 110, 16, 1), 0.6], [zig(112, 330, -0.2, 100, 80, 12, 2), 0.55], [zig(160, 280, 1.2, 80, 70, 10, 3), 0.5],
    [zig(150, 400, 0.9, 110, 80, 12, 4), 0.6], [zig(196, 452, 0.2, 100, 64, 10, 5), 0.55], [zig(214, 300, -0.5, 110, 80, 11, 6), 0.42],
    [zig(196, 226, 0.1, 90, 44, 7, 7), 0.45], [zig(262, 352, 0.6, 70, 50, 7, 8), 0.26], [zig(250, 430, -0.3, 60, 40, 6, 9), 0.3],
  ];
  for (const [p, s] of strokes) brushTracks(S, p, 26, 70 + p.length);
  blit(S, tint(spread(mask, 2.6), "#263031", 0.6));
  blit(S, bones);
  // 上の層（こする前の面）＋骨の影
  const crust = crustTex(W, H, 31, ang);
  flakeSteps(crust, 200, 400, 150, 210, ang, 16, 33);
  { crust.globalCompositeOperation = "source-atop"; blit(crust, tint(spread(mask, 2.2, 10), "#5b5448", 0.22)); blit(crust, tint(mask, "#6b5d48", 0.38)); crust.globalCompositeOperation = "source-over"; }
  const stamps = bristleStamps(26);
  for (const [p, s] of strokes) scrape(crust, stamps, p, Math.min(0.95, s * 1.5));
  { const sh = makeCanvas(W, H); blit(sh, crust, 2, 2.6); sh.globalCompositeOperation = 'destination-out'; blit(sh, crust); const t2 = tint(sh, '#1b2324', 0.55); blit(S, t2); }
  blit(S, crust);
  for (const [p, s] of strokes) dustPiles(S, p, 26, 90 + p.length, s * 0.32);
  // ひび
  const crA = crackPath(36, 560, -0.38, 158, 7, 0.45);
  const useA = drawCrack(S, crA, 7, 0.3, [[crA[9][0], crA[9][1], 0.9, 18, 3]]);
  const crB = crackPath(318, 168, 1.95, 118, 9, 0.55);
  const useB = drawCrack(S, crB, 9, 0.85, [[crB[7][0], crB[7][1], 1.2, 26, 5], [crB[13][0], crB[13][1], 2.6, 16, 6]]);
  // ダーマトの白: ひびの両脇の帯（指1本分）。閉じない、端は小さく曲げる
  const side = (pts, d, t0, t1, smooth = 6) => { const s = []; const r = pts.slice(Math.round(pts.length * t0), Math.round(pts.length * t1)); for (let i = 0; i < r.length; i += 1) { const a = r[Math.max(0, i - smooth)], b = r[Math.min(r.length - 1, i + smooth)]; let nx = -(b[1] - a[1]), ny = b[0] - a[0]; const n = Math.hypot(nx, ny) || 1; s.push([r[i][0] + nx / n * d, r[i][1] + ny / n * d]); } const sm = s.filter((_, i) => i % 3 === 0); return sm; };
  wax(S, side(crA, 13, 0.05, 0.92), 2.4, 3, C.wax, 0.95);
  wax(S, side(crA, -13, 0.12, 1.0), 2.4, 4, C.wax, 0.85);
  wax(S, side(crB, 14, 0.0, 0.8), 2.4, 5, C.wax, 1);
  wax(S, side(crB, -13, 0.1, 0.7), 2.2, 6, C.wax, 0.8);
  // 板の番号
  waxText(S, "07", 44, 180, 1.35, 11, -0.08);
  wax(S, [[40, 216], [62, 214.5], [86, 215.5]], 2.6, 12);
  // 板の形で切り抜き
  S.globalCompositeOperation = "destination-in"; S.fill(slabP); S.globalCompositeOperation = "source-over";
  // 欠けた縁の明るい面（左上の光）
  const edge = makeCanvas(W, H); edge.fill(slabP); const er = tint(rim(edge, 1.6, 1.8), "#9aa29a", 0.75); blit(S, er);
  blit(g, S);

  // 台の上の粉と小さな欠片（板の右下に寄る）
  setSeed(140); for (let k = 0; k < 140; k++) { const t = Math.pow(rnd(), 1.6), x = 220 + t * 160 * rr(0.5, 1), y = 632 + rr(-8, 22) * (1 - t) + rr(-6, 6), s = rr(0.6, 1.8); g.fillStyle = css(rgb(rnd() < 0.7 ? C.dust : "#8d958d"), rr(0.5, 0.95)); g.fillRect(x, y, s, s * rr(0.6, 1)); }
  setSeed(141); for (const [x, y, s] of [[350, 640, 7], [328, 652, 4.5], [368, 628, 3.5]]) { const p = chipped([[0, 0], [s, -1], [s * 1.2, s * 0.8], [s * 0.2, s]], 2, 0.5).map(([a, b]) => [a + x, b + y]); g.fillStyle = "rgba(30,12,8,0.45)"; g.fill(pathOf(p.map(([a, b]) => [a + 1.5, b + 2]))); g.fillStyle = "#56615f"; g.fill(pathOf(p)); g.fillStyle = "#8e978f"; g.fill(pathOf(p.slice(0, 3).concat([[x + s * 0.5, y + s * 0.3]]))); }

  // ---- 左上: 標本トレー（頭・胴・尾の3つの区画、綿） ----
  g.save(); g.translate(14, 22); g.rotate(-0.025);
  const tray = paperTex(176, 96, 15);
  const trayShape = chipped([[0, 0], [176, 0], [176, 96], [0, 96]], 8, 0.4, 0, 0);
  g.fillStyle = "rgba(38,14,10,0.4)"; g.fill(pathOf(trayShape.map(([x, y]) => [x + 4, y + 5])));
  g.save(); g.clip(pathOf(trayShape)); g.drawImage(tray.canvas, 0, 0, 176, 96);
  g.fillStyle = "rgba(90,74,44,0.25)"; g.fillRect(0, 0, 176, 4); g.fillRect(0, 0, 4, 96);
  for (let k = 0; k < 3; k++) { const x0 = 8 + k * 55; // 区画の綿
    const cot = pixelTex(50, 58, (x, y, px, py) => { const f = fbm(x * 0.12, y * 0.12, 200 + k, 4), w = fbm(x * 0.5, y * 0.5, 210 + k, 2); const v = 206 + f * 40 + (w - 0.5) * 18; return [v, v - 2, v - 9, 1]; });
    const cs = chipped([[0, 0], [50, 0], [50, 58], [0, 58]], 5, 1.6, 0.1, 3); g.save(); g.translate(x0, 8); g.fillStyle = "rgba(80,66,40,0.35)"; g.fill(pathOf(cs.map(([a, b]) => [a + 1.5, b + 2]))); g.clip(pathOf(cs)); g.drawImage(cot.canvas, 0, 0, 50, 58); g.restore();
    if (k < 2) { g.fillStyle = "rgba(60,44,20,0.5)"; g.fillRect(x0 + 52, 4, 1.4, 88); }
  }
  // 収めた「頭」のかけら: 歯の並ぶあごの骨
  { const jm = makeCanvas(176, 96); jm.fillStyle = "#fff";
    // 下あご（横向き）: 後ろが高く（筋突起のこぶ）、前へ細くなる。歯は前の2/3だけ、太く短く不揃い
    setSeed(231); const jaw = chipped([[11, 44], [16, 41], [30, 40], [42, 37], [48, 30], [53, 31], [56, 38], [57, 47], [52, 50], [36, 50], [20, 49], [12, 48]], 2.5, 0.4, 0, 0);
    jm.save(); jm.translate(33, 45); jm.rotate(-0.12); jm.translate(-33, -45); jm.fill(pathOf(jaw));
    [[14, 3.2, 3.4], [18.5, 4.2, 3.8], [23, 2.4, 3], [27, 4.6, 4], [32, 3.6, 3.6], [36.5, 0, 0], [39, 3, 3.2]].forEach(([x, h, w]) => { if (!h) return; const y = 41.5 - (x - 14) * 0.08; jm.beginPath(); jm.moveTo(x - w / 2, y + 1); jm.quadraticCurveTo(x - w * 0.35, y - h * 0.8, x + rr(0, 0.8), y - h); jm.quadraticCurveTo(x + w * 0.45, y - h * 0.5, x + w / 2, y + 1); jm.fill(); });
    jm.restore();
    const jl = boneLayer(jm, 62, [[54, 44, 1.1]]); g.drawImage(jl.canvas, 0, 0, 176, 96); }
  g.fillStyle = C.ink; g.font = '700 12px "Murecho", sans-serif'; g.textAlign = "center";
  g.fillText("頭", 33, 85); g.fillText("胴", 88, 85); g.fillText("尾", 143, 85);
  g.restore();
  // いま掘っている区画（胴）を鉄紺の手書きの丸で
  g.strokeStyle = "rgba(29,39,49,0.85)"; g.lineWidth = 1.3; g.beginPath(); { setSeed(4); for (let i = 0; i <= 30; i++) { const a = -1.2 + i / 30 * 6.9, r = 10 + i * 0.06 + rr(-0.4, 0.4); const x = 87 + Math.cos(a) * r * 1.15, y = 80 + Math.sin(a) * r * 0.9; i ? g.lineTo(x, y) : g.moveTo(x, y); } } g.stroke();
  g.restore();

  // ---- 右上: 標本ラベル（得点） ----
  g.save(); g.translate(214, 24); g.rotate(0.03);
  const lab = paperTex(162, 88, 18), ls = chipped([[0, 0], [162, 0], [162, 88], [0, 88]], 9, 0.4, 0, 0);
  g.fillStyle = "rgba(38,14,10,0.4)"; g.fill(pathOf(ls.map(([x, y]) => [x + 3, y + 4])));
  g.save(); g.clip(pathOf(ls)); g.drawImage(lab.canvas, 0, 0, 162, 88); g.restore();
  // 刷った枠（太細の二重。版が 1.5px ずれる）
  g.strokeStyle = "rgba(29,39,49,0.8)"; g.lineWidth = 1.6; g.strokeRect(7.5, 7, 147, 74); g.lineWidth = 0.6; g.strokeRect(10.8, 10.4, 141, 67);
  g.fillStyle = C.ink; g.font = '500 12px "Murecho", sans-serif'; g.textAlign = "left"; g.fillText("得点", 18, 29); g.fillText("ベスト 2,310", 72, 29);
  g.font = '34px "Hina Mincho", serif'; g.fillStyle = C.ink; g.fillText("1,284", 18, 68);
  g.fillStyle = "rgba(29,39,49,0.9)"; g.fillRect(18, 35, 126, 0.7);
  g.restore();

  // ---- 刷毛（毛の残り = 絵の長さ） ----
  brush(g, 30, 702, -0.09, 0.52, 3);

  // ---- 下: 札のボタン ----
  const tag = (x, y, w, h, a, main, sub, seed) => {
    g.save(); g.translate(x, y); g.rotate(a);
    const ts = tagShape(w, h, 10), tx = paperTex(w, h, seed);
    g.fillStyle = "rgba(38,14,10,0.45)"; g.fill(pathOf(ts.map(([p, q]) => [p + 3, q + 4])));
    g.save(); g.clip(pathOf(ts)); g.drawImage(tx.canvas, 0, 0, w, h); g.restore();
    // 鳩目（真鍮）と紐
    g.fillStyle = "#b08d3c"; g.beginPath(); g.arc(16, h / 2, 6, 0, 7); g.fill(); g.fillStyle = "#6e5420"; g.beginPath(); g.arc(16.6, h / 2 + 0.6, 3, 0, 7); g.fill(); g.fillStyle = C.lino; g.beginPath(); g.arc(16, h / 2, 2.6, 0, 7); g.fill();
    setSeed(seed); g.strokeStyle = "rgba(215,205,180,0.9)"; g.lineWidth = 1.2; g.beginPath(); g.moveTo(16, h / 2); g.bezierCurveTo(-10, h / 2 + rr(4, 10), -14, h + 6, -2 + rr(-6, 6), h + 20); g.stroke();
    g.fillStyle = C.ink; g.textAlign = "left"; g.font = '700 21px "Murecho", sans-serif'; g.fillText(main, 34, h / 2 + 2);
    g.font = '500 12px "Murecho", sans-serif'; g.fillStyle = "rgba(29,39,49,0.85)"; g.fillText(sub, 35, h / 2 + 20);
    g.restore();
  };
  tag(14, 752, 162, 62, -0.035, "すてる", "板を下へ払う", 51);
  tag(206, 746, 170, 62, 0.025, "おさめる", "板を上へ払う", 52);
}
draw().then(() => { document.title += " ok"; window.__done = true; });
</script>
</body></html>
