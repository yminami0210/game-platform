<body>
<canvas id="c" role="img" aria-label="炉ばたの一吹き。竿の先の熱いガラスを広げたりつまんだりして、黒板の注文どおりの形にする"></canvas>
<div id="frame">
  <div id="title" class="ov">

    <div id="bestT" class="slip"></div>

<script id="logic">
// ===== 遊びの中身（描画に依存しない。自動プレイのボットもこれを読む） =====
const N = 20, GH = 236;
// 注文の形: 竿の口（上）から底（下）までの半径 20 点。底はどれも平ら
const SHAPES = {
  cup:  { val: 1, name: "コップ", lines: ["コップ"], p: [12, 19, 25, 29, 31, 32, 33, 33, 34, 34, 34, 35, 35, 35, 36, 36, 36, 36, 35, 34] },
  bud:  { val: 1.2, name: "一輪挿し", lines: ["一輪挿し"], p: [11, 11, 12, 12, 13, 13, 14, 15, 17, 21, 26, 32, 37, 40, 42, 42, 41, 39, 36, 33] },
  bulb: { val: 1.3, name: "電球型の瓶", lines: ["電球型", "の瓶"], p: [12, 14, 18, 25, 33, 41, 47, 51, 53, 54, 54, 53, 50, 46, 41, 35, 30, 27, 25, 24] },
  tok:  { val: 1.5, name: "とっくり", lines: ["とっくり"], p: [11, 11, 12, 14, 18, 24, 31, 38, 44, 48, 51, 53, 54, 54, 53, 51, 48, 45, 41, 37] },
  twin: { val: 1.7, name: "ふた瘤の花びん", lines: ["ふた瘤の", "花びん"], p: [11, 14, 20, 26, 30, 32, 30, 25, 20, 18, 22, 32, 44, 52, 57, 59, 59, 57, 54, 50] },
  bowl: { val: 1.6, name: "ふちの開いた鉢", lines: ["ふちの", "開いた鉢"], p: [46, 43, 40, 37, 35, 34, 34, 35, 36, 37, 38, 38, 38, 38, 37, 36, 35, 33, 31, 29] },
};
function maxCoins(key, late) { return Math.round(Math.round(10 * SHAPES[key].val) * (late ? 1.5 : 1)); }
const G0 = [11, 14, 17, 20, 22, 24, 25, 26, 26, 26, 26, 26, 26, 26, 26, 25, 25, 24, 23, 22];
const T = { DAY: 120, LATE: 90, MATCH: 3, THIN: 8, BURST: 14, TEAR: 4.5, COLD: 0.15, WARN: 0.3, GRACE: 0.35, SIG: 1.1 };
function coolSec(t) { return 13 - 6.5 * Math.min(1.2, t / T.DAY); } // 熱い→冷えきるまでの秒数（時間とともに短く。頭打ちしない）
function bubbleP(t) { return t < 8 ? 0 : 0.1 + 0.26 * t / T.DAY; }
function orderPool(t, n) {
  if (n === 0) return ["cup"];
  if (t < 18) return ["cup", "bud"];
  if (t < 40) return ["bud", "bulb", "cup"];
  if (t < 65) return ["bulb", "tok", "bud", "twin"];
  return ["tok", "twin", "bowl", "bulb"];

function gradeCoins(fit) { return fit >= 90 ? 5 : fit >= 80 ? 4 : fit >= 70 ? 3 : fit >= 60 ? 2 : fit >= 45 ? 1 : 0; }

function makeSim(seed) {
  let s = (seed >>> 0) || 1;
  const R = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  const S = { t: 0, coins: 0, breaks: 0, over: false, reason: "", phase: "gap", gapT: 0.5, ev: [], order: null, orderN: 0, g: null,
    made: [], log: [], pen: [], rejects: 0, late: false, warned: false };
  const ev = (type, o = {}) => { o.type = type; o.t = S.t; S.ev.push(o); return o; };
  function newOrder() {
    const pool = orderPool(S.t, S.orderN);
    let k = pool[Math.floor(R() * pool.length)];
    if (S.order && k === S.order.key && pool.length > 1) k = pool[(pool.indexOf(k) + 1) % pool.length];
    const sc = 0.95 + R() * 0.1;
    S.order = { key: k, name: SHAPES[k].name, lines: SHAPES[k].lines, t: SHAPES[k].p.map((v, i) => Math.round((i === 0 ? v : v * sc) * 10) / 10), id: ++S.orderN };
    ev("order");
  }
  function newGob() {
    const bub = S.orderN > 1 && R() < bubbleP(S.t);
    S.g = { r: G0.map((v) => v + (R() - 0.5) * 1.4), heat: 1, bubble: bub, wr: 0, reheated: false, coldAt: -1, matchedAt: new Array(N).fill(-1), workY: 0.5, born: S.t, lastShape: -9, puff: -9 };
    S.phase = "work";
    updateMatch();
    ev("gob", { bubble: bub });
  }
  function dev(i) { return S.g.r[i] - S.order.t[i]; }
  function fit() {
    if (!S.g) return 0;
    let a = 0;
    for (let i = 0; i < N; i++) a += Math.max(0, Math.min(1, 1 - Math.max(0, Math.abs(dev(i)) - 2) / 12));
    return Math.max(0, a / N * 100 - Math.min(8, S.g.wr));
  }
  function updateMatch() {
    const g = S.g; let all = true;
    for (let i = 0; i < N; i++) {
      const m = Math.abs(dev(i)) <= T.MATCH;
      if (m && g.matchedAt[i] < 0) g.matchedAt[i] = S.t; else if (!m) { g.matchedAt[i] = -1; all = false; }
    }
    return all;
  }
  function brk(reason) {
    const g = S.g; S.breaks++; S.pen.push(S.t);
    ev("break", { reason, r: g.r.slice(), heat: g.heat, order: S.order });
    S.made.push({ broken: true, key: S.order.key });
    S.phase = "gap"; S.gapT = 1.3; S.next = "order";
    if (S.breaks >= 3) end("break");
  }
  function score(auto) {
    const g = S.g, f = fit();
    let c = gradeCoins(f); const mei = f >= 90;
    if (mei) c *= 2;
    c = Math.round(c * SHAPES[S.order.key].val);
    const hot = c > 0 && !g.reheated && g.heat < 0.45;
    if (hot) c += 1;
    const late = S.t >= T.LATE;
    if (late) c = Math.round(c * 1.5);
    S.coins += c;
    S.log.push({ t: S.t, c, fit: f });
    S.made.push({ key: S.order.key, t: S.order.t.slice(), r: g.r.slice(), fit: f, mei, coins: c });

  }

    if (S.over) return; S.over = true; S.reason = reason; ev("end", { reason });

    S, fit, dev,
    step(dt) {
      if (S.over) return;
      S.t += dt;
      if (!S.late && S.t >= T.LATE) { S.late = true; ev("bell", { late: true }); }
      if (S.t >= T.DAY) {
        if ((S.phase === "work" || S.phase === "furnace") && S.g && !S.g.bubble && fit() >= 45) score(true);
        ev("bell", { late: false }); end("time"); return;
      }
      if (S.phase === "gap") {
        S.gapT -= dt;
        if (S.gapT <= 0) { if (!S.order || S.next === "order") newOrder(); S.next = null; newGob(); }
        return;
      }
      const g = S.g;
      if (S.phase === "work") {
        const h0 = g.heat;
        g.heat = Math.max(0, g.heat - dt / coolSec(S.t));
        if (h0 >= T.WARN && g.heat < T.WARN) ev("creak");
        if (h0 >= T.COLD && g.heat < T.COLD) g.coldAt = S.t;
      } else if (S.phase === "furnace") {
        g.heat = Math.min(1, g.heat + dt * 0.75);
        if (g.heat > T.COLD) g.coldAt = -1;
      }
    },
    // y: 0..1（竿の口から底）, du: 中心での半径の変化（+ふくらます / −つまむ）
    shape(y, du) {
      if (S.over) return "over";
      if (S.phase === "furnace") { api.furnace(); return "pulled"; }
      if (S.phase !== "work") return "gap";
      const g = S.g;
      du = Math.max(-4, Math.min(4, du));
      if (Math.abs(du) < 1e-4) return "none";
      g.workY = Math.max(0, Math.min(1, y));
      if (g.bubble) { brk("bubble"); return "break"; }
      if (g.heat < T.COLD && g.coldAt >= 0 && S.t - g.coldAt > T.GRACE) { brk("cold"); return "break"; }
      const c = g.workY * (N - 1);
      for (let i = 0; i < N; i++) {
        const w = Math.exp(-((i - c) ** 2) / (2 * T.SIG * T.SIG));
        g.r[i] = Math.max(2, g.r[i] + du * w);
      }
      if (du < 0) g.wr += -du * 0.04; else g.puff = S.t;
      g.lastShape = S.t;
      for (let i = 0; i < N; i++) {
        if (dev(i) > T.BURST) { brk("thin"); return "break"; }
        if (g.r[i] < T.TEAR) { brk("tear"); return "break"; }
      }
      if (updateMatch()) { score(false); S.phase = "gap"; S.gapT = 1.1; S.next = "order"; }
      return "ok";
    },
    furnace() {
      if (S.over) return false;
      if (S.phase === "work") { S.phase = "furnace"; S.g.reheated = true; ev("door", { open: true }); return true; }
      if (S.phase === "furnace") { S.phase = "work"; ev("door", { open: false }); if (S.g.heat < T.COLD) S.g.coldAt = S.t; return true; }
      return false;
    },
    cut() {
      if (S.over || S.phase !== "work" && S.phase !== "furnace") return false;
      if (S.g.bubble) { brk("bubble"); return true; }
      score(false); S.phase = "gap"; S.gapT = 1.1; S.next = "order"; return true;
    },
    reject() {
      if (S.over || S.phase !== "work") return false;
      S.rejects++;
      ev("reject", { bubble: S.g.bubble });
      S.phase = "gap"; S.gapT = 0.9; S.next = null; return true;
    },
    thinAt(i) { return S.g ? dev(i) - T.THIN : -1; },
  };
  return api;
}
if (typeof module !== "undefined") module.exports = { maxCoins, makeSim, SHAPES, N, GH, T, G0, coolSec };

</script>
<script>
"use strict";
// ===== 描く道具（鳩羽色のパステル紙に、ソフトパステルと木炭）。動かない物は起動時に1回だけ描く =====
const C = {
  paper: "#8a8291", brick: "#c7a98a", hot: "#e8662a", core: "#ffd29a", ember: "#8e2f22", cold: "#6c6670",
  teal: "#1f7a72", chalk: "#f6f3ea", gold: "#e0b04a", charcoal: "#2d2629", slate: "#363a3f", iron: "#4a4650",
  day: "#dfe6e2", wood: "#8a6247", slip: "#ebe6dc",
};
const FH = '"Zen Antique", "Hiragino Mincho ProN", "Yu Mincho", serif';
const FB = '"BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif';
let _s = 1;
function setSeed(s) { _s = s >>> 0 || 1; }
function rnd() { _s ^= _s << 13; _s >>>= 0; _s ^= _s >>> 17; _s ^= _s << 5; _s >>>= 0; return _s / 4294967296; }
function rr(a, b) { return a + (b - a) * rnd(); }
function pick(a) { return a[Math.floor(rnd() * a.length)]; }
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgb(r, g, b, a = 1) { return `rgba(${r | 0},${g | 0},${b | 0},${a})`; }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join(""); }
function jitterCol(h, k = 0.08) { const [r, g, b] = hex2rgb(h); const f = 1 + rr(-k, k); return rgb(Math.min(255, r * f), Math.min(255, g * f), Math.min(255, b * f)); }
function vnoise(x, y, seed = 7) {
  const h = (i, j) => { let n = i * 374761393 + j * 668265263 + seed * 2147483647; n = (n ^ (n >> 13)) * 1274126177; return ((n ^ (n >> 16)) >>> 0) / 4294967296; };
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, s = (t) => t * t * (3 - 2 * t);
  const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
  return a + (b - a) * s(xf) + (c - a) * s(yf) + (a - b - c + d) * s(xf) * s(yf);
}
function mk(w, h) { const c = document.createElement("canvas"); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function ctx2(cv) { const g = cv.getContext("2d"); g.lineCap = "round"; g.lineJoin = "round"; return g; }
// 紙の目（凹み）。512px の1枚を作り置き、並べて使う
let TOOTH = null;
function toothTile() {
  if (TOOTH) return TOOTH;
  const w = 512, cv = mk(w, w), t = cv.getContext("2d"), sv = _s; setSeed(901);
  for (let i = 0; i < w * w / 34; i++) {
    const x = rnd() * w, y = rnd() * w, d = vnoise(x / 120, y / 120, 3);
    if (rnd() > 0.35 + d * 0.6) continue;
    t.fillStyle = `rgba(0,0,0,${rr(0.5, 1)})`; t.beginPath(); t.ellipse(x, y, rr(0.7, 2.0), rr(0.6, 1.6), rr(0, 3.14), 0, 7); t.fill();
  }
  _s = sv; TOOTH = cv; return cv;
}
function toothOut(L, k, ox = 0, oy = 0) {
  const T = toothTile(), w = L.canvas.width, h = L.canvas.height;
  L.save(); L.setTransform(1, 0, 0, 1, 0, 0); L.globalCompositeOperation = "destination-out"; L.globalAlpha = k;
  for (let ty = Math.floor(oy / 512) * 512; ty < oy + h; ty += 512) for (let tx = Math.floor(ox / 512) * 512; tx < ox + w; tx += 512) L.drawImage(T, tx - ox, ty - oy);
  L.restore();
}
// 層は「描く範囲だけ」の大きさで作る（同じ変換。合成時に元の位置へ）
function layer(g, bb) {
  const m = g.getTransform(), cw = g.canvas.width, ch = g.canvas.height;
  let x0 = 0, y0 = 0, x1 = cw, y1 = ch;
  if (bb) {
    const P = [[bb[0], bb[1]], [bb[0] + bb[2], bb[1]], [bb[0], bb[1] + bb[3]], [bb[0] + bb[2], bb[1] + bb[3]]].map(([x, y]) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f]);
    x0 = Math.max(0, Math.floor(Math.min(...P.map((p) => p[0]))) - 3); y0 = Math.max(0, Math.floor(Math.min(...P.map((p) => p[1]))) - 3);
    x1 = Math.min(cw, Math.ceil(Math.max(...P.map((p) => p[0]))) + 3); y1 = Math.min(ch, Math.ceil(Math.max(...P.map((p) => p[1]))) + 3);

function paper(g, x0, y0, w, h) {

  const step = 6;
  for (let y = Math.floor(y0 / step) * step; y < y0 + h; y += step) for (let x = Math.floor(x0 / step) * step; x < x0 + w; x += step) {
    const v = vnoise(x / 140, y / 140, 11) - 0.5, ww = vnoise(x / 30, y / 30, 5) - 0.5, k = v * 0.16 + ww * 0.04;
    g.fillStyle = k > 0 ? `rgba(255,248,250,${k})` : `rgba(40,30,45,${-k})`; g.fillRect(x, y, step, step);
  }
}
function pastel(g, path, col, o = {}) {
  const bb = o.bb || [0, 0, g.W, g.H], L = layer(g, bb);
  if (L.empty) return;
  const ang = o.ang ?? -0.9, len = o.len ?? [6, 16], wid = o.wid ?? [1.6, 3.2], dens = o.dens ?? 1, a = o.a ?? [0.55, 0.95];

const TW = 180, TY = -24, TH = 304;
function texCanvas(q, w, h, x0, y0) { const cv = mk(w * q, h * q), g = ctx2(cv); g.setTransform(q, 0, 0, q, -x0 * q, -y0 * q); g.W = w; g.H = h; return { cv, g }; }
function strokeWrap(g, x, y, an, l, bw, wrap) {
  for (const dx of [0, -TW, TW]) {
    if (dx && !wrap) continue;
    if (dx < 0 && x < TW - 24) continue; if (dx > 0 && x > 24) continue;
    const X = x + dx;
    g.beginPath(); g.moveTo(X - Math.cos(an) * l / 2, y - Math.sin(an) * l / 2);
    g.quadraticCurveTo(X - Math.sin(an) * bw, y + Math.cos(an) * bw, X + Math.cos(an) * l / 2, y + Math.sin(an) * l / 2); g.stroke();
  }
}

  const { cv, g } = texCanvas(q, TW, TH, 0, TY); setSeed(o.seed);
  if (o.base) { g.globalAlpha = o.base; g.fillStyle = cols[0]; g.fillRect(0, TY, TW, TH); }
  const n = Math.floor(TW * TH / 14 * (o.dens || 1.25));
  for (let i = 0; i < n; i++) {
    const x = rnd() * TW, y = TY + rnd() * TH;
    if (o.mottle && rnd() < o.mottle * vnoise(x / 18, y / 18, o.seed) * 1.6) continue;
    g.strokeStyle = jitterCol(pick(cols), 0.07); g.globalAlpha = rr(o.a[0], o.a[1]); g.lineWidth = rr(o.wid ? o.wid[0] : 1.6, o.wid ? o.wid[1] : 3);
    strokeWrap(g, x, y, 0.04 + rr(-0.1, 0.1), rr(8, 20), rr(-1.8, 1.8), true);
  }
  toothOut(g, o.tooth ?? 0.16);
  return cv;
}

  const ok = () => A && !muted;
  function noise() { const b = A.createBuffer(1, A.sampleRate * 1.5, A.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
  function burst(f, q, dur, gain, type = "bandpass", t0 = 0) { if (!ok()) return; const s = A.createBufferSource(); s.buffer = NB; const fl = A.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const g = A.createGain(), t = A.currentTime + t0; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + Math.min(0.03, dur / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(fl).connect(g).connect(M); s.start(t, Math.random()); s.stop(t + dur + 0.05); }
  function tone(f, dur, gain, type = "sine", t0 = 0, f2) { if (!ok()) return; const o = A.createOscillator(), g = A.createGain(), t = A.currentTime + t0; o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g).connect(M); o.start(t); o.stop(t + dur + 0.05); }
  let lastPuff = 0, lastSq = 0;
  return {
    start() {
      if (A) { if (A.state === "suspended") A.resume(); return; }
      try { A = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { A = null; return; }
      M = A.createGain(); M.gain.value = muted ? 0 : 0.6; M.connect(A.destination); NB = noise();
      const s = A.createBufferSource(); s.buffer = NB; s.loop = true; const f = A.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 160; const g = A.createGain(); g.gain.value = 0.11; s.connect(f).connect(g).connect(M); s.start(); roar = g;
    },
    mute(m) { if (M) M.gain.value = m ? 0 : 0.6; },
    puff(a) { const n = performance.now(); if (n - lastPuff < 140) return; lastPuff = n; burst(380, 0.8, 0.35, 0.12 + Math.min(0.15, a * 0.05)); },
    squeak(a) { const n = performance.now(); if (n - lastSq < 160) return; lastSq = n; tone(1100, 0.09, 0.05, "triangle", 0, 1500); },
    pishi() { burst(3800, 3, 0.12, 0.5, "highpass"); tone(2600, 0.06, 0.12, "square", 0, 1800); },
    pachin() { burst(2500, 1, 0.18, 0.6, "highpass"); for (let i = 0; i < 6; i++) tone(2400 + Math.random() * 3000, 0.12, 0.05, "sine", 0.05 + i * 0.05); },
    chin(big) { tone(2093, big ? 1.6 : 0.9, 0.16, "sine"); tone(3136, big ? 1.2 : 0.6, 0.08, "sine", 0.01); if (big) tone(4186, 0.8, 0.05, "sine", 0.02); },
    thud() { tone(160, 0.2, 0.15, "sine", 0, 90); },
    door() { burst(300, 2, 0.25, 0.18, "bandpass"); tone(90, 0.2, 0.08, "sawtooth", 0, 70); },
    creak() { tone(420, 0.25, 0.05, "triangle", 0, 380); burst(5000, 4, 0.08, 0.08, "highpass", 0.05); },
    blub() { tone(300, 0.12, 0.06, "sine", 0, 520); },
    bell() { for (const [f, g] of [[220, 0.2], [440, 0.12], [587, 0.08], [880, 0.05]]) tone(f, 2.2, g, "sine"); },
  };
})();

// ---------- 起動 ----------
function loop(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - (lastT || ts)) / 1000)); lastT = ts;
  fpsLog.push(ts); if (fpsLog.length > 240) fpsLog.shift();
  if (state === "play" && !window.__freeze) { continuous(dt); sim.step(dt); handleEvents(); rot += dt; if (performance.now() > hintUntil && $("hint").style.display !== "none") $("hint").style.display = "none"; }
  else if (state === "title") rot += dt;
  const S = sim && sim.S, target = state === "title" || !S ? 0 : (S.phase === "furnace" || (S.phase === "gap" && !anim)) ? 1 : 0;
  furnA += (target - furnA) * Math.min(1, dt / 0.12);
  if (Math.abs(target - furnA) < 0.01) furnA = target;
  const r0 = performance.now(); render(ts); rtAvg = rtAvg * 0.95 + (performance.now() - r0) * 0.05;
  requestAnimationFrame(loop);
}
let rz = 0, rtAvg = 0;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { resize(); }, 120); });
resize();
showOv("title");
$("bestT").textContent = `これまでの最高 銀貨 ${best} 枚`; $("bestT").style.display = best ? "block" : "none";
if (window.matchMedia && matchMedia("(pointer: coarse)").matches) setTouch(true);
$("how").innerHTML = touchUI ? "2本の指を広げるとふくらみ、つまむと細くなる。石盤の形に合ったら下へ払って切り離す。<br>冷えて白い筋が出たガラスは触らずに炉へ。気泡の玉は上へ払って替える。" : "ホイールか → ← でふくらます・細くする（高さはマウスか ↑↓）。合ったら Enter か右クリック。<br>冷えて白い筋が出たら触らずに炉（クリックか R）へ。気泡の玉は Backspace で替える。";
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { SLATE = null; OL = null; });
requestAnimationFrame(loop);
window.__fx = { rt: () => rtAvg,
  toScreen(lx, ly) { const pos = glassPos(), c = Math.cos(pos.rot), s = Math.sin(pos.rot), X = pos.x + (lx * c - ly * s) * pos.s, Y = pos.y + (lx * s + ly * c) * pos.s; return { x: offX + X * fit, y: offY + Y * fit }; },
  logicalToScreen(x, y) { return { x: offX + x * fit, y: offY + y * fit }; }, flush: () => handleEvents(), get sim() { return sim; }, get state() { return state; }, fps() { const n = fpsLog.length; return n > 1 ? (n - 1) / ((fpsLog[n - 1] - fpsLog[0]) / 1000) : 0; }, get workY() { return workY; }, lay: () => lay, glassPos, toLocal, GH, start: startGame };
