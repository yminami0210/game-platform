<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポイ一枚</title>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --tutan:#8cc3c9; --hi:#e0482a; --usugami:#e9ece3; --rantou:#f2c14e; --sabi:#8a4b2d; --sumi:#233038;
  --kage:#5f9aa2; --board:#c9a56f; --ita:#4a3a30; --light:#efe6d6;
  --head:"Yusei Magic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --grain:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ita);color:var(--sumi);font-family:var(--body);font-weight:700;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* ボール紙: はさみで切った縁（角ごとに違う）。角丸にしない */
.cut{background-color:var(--board);background-image:var(--grain);color:var(--sumi)}
.tagw{position:relative;filter:drop-shadow(2px 3px 0 rgba(35,48,56,.38))}
.tape{position:absolute;width:46px;height:13px;background:rgba(232,226,196,.58);pointer-events:none}
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;padding:8px 10px 0;z-index:3;pointer-events:none}
#hud[hidden]{display:none}
#scoreTag .cut{clip-path:polygon(0 3%,42% 0,100% 2%,99% 52%,100% 100%,55% 97%,1% 100%,0 46%);padding:4px 18px 6px 14px;transform:rotate(-1.2deg);
  display:flex;align-items:baseline;gap:4px;min-width:132px}
#score{font-family:var(--head);font-size:44px;line-height:1;color:var(--hi);-webkit-text-stroke:3px var(--sumi);paint-order:stroke fill;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.unit{font-family:var(--head);font-size:22px;color:var(--sumi)}
#scoreTag .tape{left:42px;top:-5px;transform:rotate(-4deg)}
.sp{flex:1}
#price .cut{clip-path:polygon(2% 0,100% 4%,98% 100%,47% 97%,0 100%,1% 40%);padding:7px 12px 6px;transform:rotate(2deg);margin-top:8px;
  font-family:var(--head);font-size:21px;line-height:1.1;box-shadow:inset 0 0 0 2px rgba(138,75,45,.75)}
#tools{display:flex;gap:8px}
.tbtn{pointer-events:auto;border:0;cursor:pointer;font-family:var(--head);font-size:24px;line-height:1;color:var(--sumi);min-width:46px;height:46px;padding:0 9px;
  clip-path:polygon(3% 1%,100% 0,97% 98%,0 100%)}
.tbtn:active{transform:translate(1px,2px)}
.tbtn:focus-visible{outline:3px dashed var(--light);outline-offset:-6px}
#pauseB{transform:rotate(-2deg);letter-spacing:-.04em}
#muteB{transform:rotate(1.5deg);font-size:19px}
#muteB.off{text-decoration:line-through;text-decoration-thickness:2px}
#hint{position:fixed;left:0;right:0;top:auto;bottom:0;padding:6px 16px 0;color:var(--light);font-size:15px;line-height:1.35;z-index:3;pointer-events:none;
  letter-spacing:.04em;text-align:center}
#hint[hidden]{display:none}
#hint.warn{color:#f6d68a}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.screen[hidden]{display:none}
.board{position:relative;width:100%;max-height:100%;overflow:auto;touch-action:pan-y;padding:22px 22px 18px;
  clip-path:polygon(0 1%,38% 0,100% 1.5%,99.2% 48%,100% 99%,60% 100%,0.6% 98.5%,0 52%)}
.bw{position:relative;filter:drop-shadow(3px 4px 0 rgba(35,48,56,.4));width:min(340px,100%);max-height:100%;display:flex}
.bw .tape{left:50%;top:-4px;transform:translateX(-50%) rotate(-3deg);width:58px;z-index:2}
h1{font-family:var(--head);font-weight:400;font-size:46px;line-height:1.05;letter-spacing:.02em}
.sub{font-size:14px;margin-top:6px;line-height:1.5}
.how{font-size:15px;line-height:1.65;margin-top:12px;word-break:keep-all;overflow-wrap:anywhere}
.keys{font-size:12.5px;line-height:1.55;margin-top:8px;opacity:.85}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.go{white-space:nowrap;font-family:var(--head);font-size:24px;color:var(--light);background:var(--sumi);border:0;cursor:pointer;padding:9px 20px 10px;
  clip-path:polygon(0 4%,100% 0,98% 100%,2% 96%);touch-action:manipulation}
.go:active{transform:translate(1px,2px)}
.go:focus-visible{outline:3px dashed var(--sumi);outline-offset:3px;clip-path:none}
.best{font-size:14px;font-variant-numeric:tabular-nums}
.res .big{font-family:var(--head);font-size:56px;line-height:1;color:var(--hi);-webkit-text-stroke:3px var(--sumi);paint-order:stroke fill;font-variant-numeric:tabular-nums}
.res .big small{font-size:26px;color:var(--sumi);-webkit-text-stroke:0}
.res canvas{display:block;width:100%;height:auto;margin-top:10px}
.res dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;line-height:1.55;margin-top:10px;font-variant-numeric:tabular-nums}
.res dt{opacity:.8}
.why{font-size:14px;line-height:1.5;margin-top:8px}
.new{font-family:var(--head);font-size:18px;margin-top:4px}
@media (orientation:landscape) and (max-height:520px){
  .bw{width:min(720px,100%)}
  #price{display:none}
  #tools{flex-direction:column;gap:10px}
  #scoreTag .cut{min-width:0;padding:3px 12px 5px 10px}
  .board{padding:14px 20px 12px}
  h1{font-size:36px}.how{font-size:14px;line-height:1.5;margin-top:6px}.row{margin-top:10px}.sub{margin-top:2px}
  .res{display:grid;grid-template-columns:1.25fr 1fr;gap:0 20px;align-items:start}
  .res canvas{margin-top:0}
  .res .big{font-size:44px}
  #score{font-size:34px}.unit{font-size:18px}#price .cut{font-size:18px;margin-top:4px}
  .tbtn{height:40px;min-width:42px;font-size:21px}
  #hint{font-size:13px;padding-top:3px}
}
@media (prefers-reduced-motion:reduce){.go:active,.tbtn:active{transform:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="金魚すくいの水槽"></canvas>
<div id="hud" hidden>
  <div class="tagw" id="scoreTag"><div class="cut"><span id="score">0</span><span class="unit">点</span></div><i class="tape"></i></div>
  <div class="sp"></div>
  <div class="tagw" id="price"><div class="cut">1回 50円</div></div>
  <div id="tools">
    <div class="tagw"><button class="tbtn cut" id="muteB" aria-label="音を消す（M）">音</button></div>
    <div class="tagw"><button class="tbtn cut" id="pauseB" aria-label="一時停止（P）">II</button></div>
  </div>
</div>
<div id="hint" hidden></div>

<div class="screen" id="title">
  <div class="bw"><div class="board cut">
    <h1>ポイ一枚</h1>
    <p class="sub">夜店の金魚すくい。紙が破れるまでが1回。</p>
    <p class="how">押さえるとポイが沈み、離すとすくう。<br>乗ったら、お椀をタップして入れる。<br>速く動かす・浸けっぱなし・主の影の上で離す、は紙が傷む。</p>
    <p class="keys">PC: マウスで同じ操作。矢印で動かし、スペース長押しで沈める。E で入れる、Q で逃がす、M 音、P 一時停止</p>
    <div class="row"><button class="go" id="startB">ポイをもらう</button><span class="best" id="bestT"></span></div>
  </div><i class="tape"></i></div>
</div>

<div class="screen" id="pause" hidden>
  <div class="bw"><div class="board cut">
    <h1 style="font-size:34px">一休み</h1>
    <p class="how">紙は水から上げてあるので、止めている間は傷みません。</p>
    <div class="row"><button class="go" id="resumeB">続ける</button></div>
  </div><i class="tape"></i></div>
</div>

<div class="screen" id="result" hidden>
  <div class="bw"><div class="board cut res">
    <div>
      <div class="big"><span id="rScore">0</span><small>点</small></div>
      <p class="new" id="rNew"></p>
      <p class="why" id="rWhy"></p>
      <dl id="rList"></dl>
    </div>
    <div>
      <canvas id="bag" width="560" height="300" aria-label="持ち帰りの袋と破れたポイ"></canvas>
      <div class="row"><button class="go" id="againB">もう一回</button><span class="best" id="rBest"></span></div>
    </div>
  </div><i class="tape"></i></div>
</div>

<script>
"use strict";
// <sim> ここから下は DOM に触らない（自動プレイのボットがそのまま読み込む）
const SIM = (() => {
  const KINDS = {
    koaka:   { pt: 10,  w: 1.0, spd: 50, len: 34, startle: 0.5,  name: "小赤" },
    sarasa:  { pt: 25,  w: 2.0, spd: 36, len: 42, startle: 0.35, name: "更紗" },
    demekin: { pt: 40,  w: 3.2, spd: 19, len: 40, startle: 0.15, name: "出目金" },
    kin:     { pt: 100, w: 1.3, spd: 64, len: 33, startle: 0.6,  name: "金色" },
  };
  // 紙の傷み: 浸けている時間・水中で速く動かした量・乗せた重さ・浸けた回数・空気中の乾き。
  // どれも「経過時間で脆くなる係数 age」を掛ける（上限なし＝難易度が頭打ちしない）
  const K = { R: 34, BOWL_R: 46, SOAK: 0.0019, DIP: 0.002, V0: 95, MOVE: 0.0004, LIFT: 0.0052, AIR: 0.001, EDGE: 0.004,
    NUSHI: 0.42, AGE: 70, DRY_AIR: 0.01, DRY_CARRY: 0.005, DRY_WAIT: 6, CATCH: 0.6, NFISH: 7, OH_HP: 0.4, OH_PT: 40, SET_PT: 30, KINDS };
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  function rnd(S) {
    let t = (S.r = (S.r + 0x6d2b79f5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const age = (S) => 1 + S.t / K.AGE;
  function create(seed, TW, TH) {
    const S = { r: seed | 0, t: 0, TW, TH, hp: 1, score: 0, over: false, reason: "", endT: 0, fish: [], nextFish: 0, nushi: null, nextNushi: 9, ev: [], id: 0,
      poi: { x: TW * 0.42, y: TH * 0.5, tx: TW * 0.42, ty: TH * 0.5, st: "air", vs: 0, under: 0, load: [], hpLift: 1, tb: 0, fx: 0, fy: 0, fastT: 0, warnSoak: false, crackT: 0, brittle: false, brittleT: 0 },
      bowl: { x: TW - 60, y: TH - 62, r: K.BOWL_R }, streak: { k: "", n: 0 }, caught: [], heavy: null, best: { pts: 0, t: 0 }, dmg: {},
      stats: { dips: 0, lifts: 0, edge: 0, nushi: 0, multi: 0, letgo: 0, oh: 0, set: 0, fast: 0, crack: 0 } };
    ["koaka", "koaka", "koaka", "koaka", "sarasa", "sarasa", "demekin"].forEach((k) => addFish(S, k, true));
    return S;
  }
  function pickKind(S) {
    const t = S.t, u = rnd(S), kins = S.fish.filter((f) => f.kind === "kin").length;
    const pk = kins < 1 + Math.floor(t / 80) ? Math.min(0.35, Math.max(0, t - 15) / 260) : 0, pd = Math.min(0.36, 0.14 + t / 800);
    if (u < pk) return "kin";
    if (u < pk + pd) return "demekin";
    if (u < pk + pd + 0.3) return "sarasa";
    return "koaka";
  }
  function addFish(S, kind, init) {
    const P = S.poi, B = S.bowl, kd = KINDS[kind];
    let x, y, n = 0;
    do { x = 26 + rnd(S) * (S.TW - 52); y = 26 + rnd(S) * (S.TH - 52); n++; }
    while (n < 30 && (Math.hypot(x - P.x, y - P.y) < 90 || Math.hypot(x - B.x, y - B.y) < B.r + 34));
    S.fish.push({ id: ++S.id, kind, x, y, a: rnd(S) * 6.283, turn: 0, flee: 0, mood: rnd(S), depth: rnd(S), ph: rnd(S) * 6.28, spd: 0,
      len: kd.len * (0.9 + rnd(S) * 0.2), seed: 1 + Math.floor(rnd(S) * 1e6), fade: init ? 1 : 0 });
  }
  function hurt(S, d, why) {
    if (d <= 0 || S.over) return;
    S.hp -= d; S.dmg[why] = (S.dmg[why] || 0) + d;
    if (S.hp <= 0) tear(S, why);
  }
  function tear(S, why) {
    if (S.over) return;
    const P = S.poi;
    S.hp = 0; S.over = true; S.reason = why; S.endT = S.t;
    for (const f of P.load) { f.x = clamp(P.x + (rnd(S) - 0.5) * 14, 8, S.TW - 8); f.y = clamp(P.y + (rnd(S) - 0.5) * 14, 8, S.TH - 8); f.flee = 1; S.fish.push(f); }
    S.ev.push({ k: "tear", why, x: P.x, y: P.y, n: P.load.length });
    P.dropped = P.load.length; P.load = [];
  }
  const inBowl = (S, x, y) => Math.hypot(x - S.bowl.x, y - S.bowl.y) < S.bowl.r + 8;
  function moveTo(S, x, y) {
    const P = S.poi;
    if (P.st === "toBowl") return;
    P.tx = clamp(x, K.R * 0.4, S.TW - K.R * 0.4); P.ty = clamp(y, K.R * 0.4, S.TH - K.R * 0.4);
  }
  function dip(S) {
    const P = S.poi;
    if (S.over || P.st !== "air" || inBowl(S, P.tx, P.ty)) return false;
    P.x = P.tx; P.y = P.ty; P.st = "water"; P.under = 0; P.vs = 0; P.fastT = 0; P.warnSoak = false; S.stats.dips++;
    S.ev.push({ k: "dip", x: P.x, y: P.y });
    for (const f of S.fish) if (Math.hypot(f.x - P.x, f.y - P.y) < K.R * 0.95 && rnd(S) < KINDS[f.kind].startle) f.flee = 0.7;
    // 乾いて縮み切った紙は、次に浸けた瞬間に裂ける（最後の一押しはプレイヤーの手で起きる）
    if (P.brittle) { tear(S, "dryDip"); return true; }
    hurt(S, K.DIP * age(S), "dip");
    return true;
  }
  function segDist(px, py, ax, ay, bx, by) {
    const vx = bx - ax, vy = by - ay, u = clamp(((px - ax) * vx + (py - ay) * vy) / (vx * vx + vy * vy || 1), 0, 1);
    return Math.hypot(px - ax - vx * u, py - ay - vy * u);
  }
  function overNushi(S, x, y) {
    const n = S.nushi;
    if (!n || n.vis < 0.25) return false;
    const ex = n.x - Math.cos(n.a) * n.len * 0.85, ey = n.y - Math.sin(n.a) * n.len * 0.85;
    return segDist(x, y, n.x, n.y, ex, ey) < n.len * 0.09 + K.R * 0.45;
  }
  function lift(S) {
    const P = S.poi;
    if (S.over || P.st !== "water") return null;
    S.stats.lifts++;
    const m = age(S), on = [], edge = [];
    for (const f of S.fish) {
      const d = Math.hypot(f.x - P.x, f.y - P.y);
      if (d < K.R * K.CATCH) on.push(f); else if (d < K.R) edge.push(f);
    }
    let dmg = 0;
    const res = { on: on.length, edge: edge.length, nushi: false };
    // 端にかかった金魚は跳ねて逃げる（紙の傷みは1回のすくいで1回分だけ）
    for (const f of edge) { f.flee = 0.8; f.a = Math.atan2(f.y - P.y, f.x - P.x); S.ev.push({ k: "edge", x: f.x, y: f.y, kind: f.kind, first: f === edge[0] }); }
    if (edge.length) { dmg += K.EDGE * m; S.stats.edge++; }
    dmg += K.LIFT * m * on.reduce((s, f) => s + KINDS[f.kind].w, 0);
    if (overNushi(S, P.x, P.y)) { dmg += K.NUSHI; res.nushi = true; S.stats.nushi++; S.ev.push({ k: "nushiHit", x: P.x, y: P.y }); }
    if (on.length > 1) S.stats.multi++;
    S.fish = S.fish.filter((f) => !on.includes(f));
    P.load = on; P.st = on.length ? "carry" : "air";
    S.ev.push({ k: "lift", n: on.length, x: P.x, y: P.y, multi: on.length > 1 });
    hurt(S, dmg, res.nushi ? "nushi" : on.length ? "lift" : "edge");
    if (!S.over) P.hpLift = S.hp;
    return res;
  }
  // 一時停止用: 紙を傷めずに水から上げるだけ（すくいは成立しない）
  function raise(S) {
    const P = S.poi;
    if (S.over || P.st !== "water") return false;
    P.st = "air"; P.under = 0; P.vs = 0; P.fastT = 0;
    return true;
  }
  function deliver(S) {
    const P = S.poi;
    if (S.over || P.st !== "carry") return false;
    P.st = "toBowl"; P.tb = 0; P.fx = P.x; P.fy = P.y;
    return true;
  }
  function letgo(S) {
    const P = S.poi;
    if (S.over || P.st !== "carry") return false;
    for (const f of P.load) { f.x = clamp(P.x + (rnd(S) - 0.5) * 12, 8, S.TW - 8); f.y = clamp(P.y + (rnd(S) - 0.5) * 12, 8, S.TH - 8); f.flee = 0.6; S.fish.push(f); }
    S.stats.letgo++; S.ev.push({ k: "letgo", x: P.x, y: P.y, n: P.load.length });
    P.load = []; P.st = "air";
    return true;
  }
  function finishBowl(S) {
    const P = S.poi, items = [];
    let gained = 0;
    for (const f of P.load) {
      const kd = KINDS[f.kind];
      let pts = kd.pt, oh = false, set = false;
      if (kd.w >= 3 && P.hpLift < K.OH_HP) { pts += K.OH_PT; oh = true; S.stats.oh++; }
      if (S.streak.k === f.kind) S.streak.n++; else { S.streak.k = f.kind; S.streak.n = 1; }
      if (S.streak.n >= 3) { pts += K.SET_PT; set = true; S.streak.n = 0; S.streak.k = ""; S.stats.set++; }
      gained += pts;
      S.caught.push({ kind: f.kind, t: S.t, pts, seed: f.seed, len: f.len });
      items.push({ kind: f.kind, pts, oh, set });
      const wet = 1 - P.hpLift;
      if (!S.heavy || kd.w > S.heavy.w || (kd.w === S.heavy.w && wet > S.heavy.wet)) S.heavy = { kind: f.kind, w: kd.w, wet };
    }
    S.score += gained;
    if (gained > S.best.pts) S.best = { pts: gained, t: S.t };
    S.ev.push({ k: "bowl", pts: gained, items, x: S.bowl.x, y: S.bowl.y });
    P.load = []; P.st = "air";
    P.tx = P.x = P.fx; P.ty = P.y = P.fy;
  }
  function moveFish(S, f, dt) {
    const kd = KINDS[f.kind], P = S.poi, B = S.bowl;
    f.fade = Math.min(1, f.fade + dt * 0.8);
    f.turn = clamp(f.turn + (rnd(S) - 0.5) * dt * 6, -1.3, 1.3);
    f.mood = clamp(f.mood + (rnd(S) - 0.5) * dt * 0.8, 0, 1);
    f.depth = clamp(f.depth + (rnd(S) - 0.5) * dt * 0.5, 0, 1);
    let dx = Math.cos(f.a), dy = Math.sin(f.a);
    const m = 30;
    if (f.x < m) dx += ((m - f.x) / m) * 2;
    if (f.x > S.TW - m) dx -= ((f.x - S.TW + m) / m) * 2;
    if (f.y < m) dy += ((m - f.y) / m) * 2;
    if (f.y > S.TH - m) dy -= ((f.y - S.TH + m) / m) * 2;
    const bd = Math.hypot(f.x - B.x, f.y - B.y) || 1;
    if (bd < B.r + 30) { dx += ((f.x - B.x) / bd) * 1.5; dy += ((f.y - B.y) / bd) * 1.5; }
    if (P.st === "water" && P.vs > 70 && Math.hypot(f.x - P.x, f.y - P.y) < K.R + 50) f.flee = Math.max(f.flee, 0.9);
    const grow = 1 + S.t / 300;
    let spd = kd.spd * grow * (0.45 + 0.75 * f.mood), rate = 2.2;
    if (f.flee > 0) {
      f.flee -= dt;
      const pd = Math.hypot(f.x - P.x, f.y - P.y) || 1;
      dx += ((f.x - P.x) / pd) * 2.5; dy += ((f.y - P.y) / pd) * 2.5;
      spd = kd.spd * grow * 2; rate = 6;
    }
    const want = Math.atan2(dy, dx) + f.turn * 0.6;
    const da = ((want - f.a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    f.a += clamp(da, -rate * dt, rate * dt);
    f.x = clamp(f.x + Math.cos(f.a) * spd * dt, 8, S.TW - 8);

    const [wx, wy] = toWorld(e.clientX, e.clientY), P = S.poi;
    if (drag && drag.id === e.pointerId) {
      e.preventDefault();
      if (drag.mode === "water" && P.st === "water") SIM.moveTo(S, wx, wy);
      if (drag.mode === "carry" && P.st === "carry") { if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 12) drag.moved = true; if (drag.moved) SIM.moveTo(S, wx, wy); }
    } else if (e.pointerType === "mouse" && (P.st === "air" || P.st === "carry")) SIM.moveTo(S, wx, wy);
  });
  const up = (e) => {
    if (!drag || drag.id !== e.pointerId) return;
    const d = drag; drag = null;
    if (state !== "play" || paused || !S || S.over) return;
    const P = S.poi;
    if (d.mode === "water" && P.st === "water") SIM.lift(S);
    else if (d.mode === "carry" && P.st === "carry") {
      const [wx, wy] = toWorld(e.clientX, e.clientY);
      if (SIM.inBowl(S, wx, wy)) SIM.deliver(S);
      else if (!d.moved) SIM.letgo(S);
    }
  };
  cv.addEventListener("pointerup", up);
  cv.addEventListener("pointercancel", up);
  cv.addEventListener("contextmenu", (e) => e.preventDefault());

  addEventListener("keydown", (e) => {
    const k = e.code;
    if (k === "KeyM") { setMute(!muted); return; }
    if (state === "title" && (k === "Enter" || k === "Space")) { e.preventDefault(); start(); return; }
    if (state === "result" && (k === "Enter" || k === "Space")) { e.preventDefault(); if (now - resultAt > 0.8) start(); return; }
    if (state !== "play") return;
    if (k === "KeyP" || k === "Escape") { setPause(!paused); return; }
    if (paused) { if (k === "Enter" || k === "Space") setPause(false); return; }
    audioInit();
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "KeyW", "KeyA", "KeyS", "KeyD", "Space"].includes(k)) e.preventDefault();
    keys[k] = true;
    if (S.over) return;
    if (k === "Space" && !e.repeat && !spaceDown) { spaceDown = true; if (S.poi.st === "air") SIM.dip(S); }
    if (k === "KeyE" || k === "Enter") SIM.deliver(S);
    if (k === "KeyQ") SIM.letgo(S);
  });
  addEventListener("keyup", (e) => {
    keys[e.code] = false;
    if (e.code === "Space") { spaceDown = false; if (state === "play" && !paused && S && S.poi.st === "water") SIM.lift(S); }
  });
  function setPause(p) {
    if (state !== "play" || (S && S.over)) return;
    paused = p; $("pause").hidden = !p;
    // 止めるときは紙を水から上げる（止めている間に傷まないように）
    if (p && S.poi.st === "water") SIM.raise(S);
    drag = null; spaceDown = false; keys = {};
    if (p) $("resumeB").focus();
    if (AC) { if (p) AC.suspend(); else AC.resume(); }
  }
  $("startB").onclick = () => start();
  $("againB").onclick = () => start();
  $("resumeB").onclick = () => setPause(false);
  $("pauseB").onclick = () => setPause(!paused);
  $("muteB").onclick = () => { audioInit(); setMute(!muted); };
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play" && !paused) setPause(true); });
  addEventListener("resize", layout);

  // ---- 出来事 → 音・演出・ひとこと ----
  const WHY = {
    lift: "ふやけた紙に、重すぎる金魚を乗せた",
    nushi: "主の影の上で離して、紙が大きく破れた",
    move: "水の中で速く動かして、紙が裂けた",
    soak: "浸けたまま待つうちに、紙が溶けた",
    dip: "浸けた瞬間に、紙が限界を越えた",
    edge: "跳ねて逃げた金魚に、紙を裂かれた",
    dry: "乾いて縮んだ紙を、浸けずに放っておいたら裂けた",
    dryDip: "乾いて縮んだ紙が、浸けたとたんに裂けた",
  };
  function splash(x, y, n, big) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, v = (big ? 40 : 26) + Math.random() * 30;
      fx.push({ k: "drop", x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t0: now, life: 0.45 + Math.random() * 0.2, r: 1.6 + Math.random() * 2.2, rj: jit(Math.random, 7, 0.3) });
    }
  }
  function handleEvents() {
    for (const e of S.ev) {
      if (e.k === "dip") { play("dip"); splash(e.x, e.y, 3, false); }
      else if (e.k === "lift") { play("lift"); liftT = now; if (e.n) splash(e.x, e.y, 4, false); if (e.multi) hint("2匹乗った。点は倍、重さも倍"); }
      else if (e.k === "edge") { play("edge"); splash(e.x, e.y, 3, false); hint("端にかかって跳ねて逃げた。体の真ん中で受けると乗る"); }
      else if (e.k === "nushiHit") { hint("主の影の上で離した。重さで紙が大きく破れる", 3); }
      else if (e.k === "nushiIn") { play("nushi"); if (!nushiTold) { nushiTold = true; hint("底をゆく影は主。上で離すと紙が大きく破れる", 3.2); } }
      else if (e.k === "fast") { play("fast"); hint("水の中で速く動かすと、紙が傷む"); }
      else if (e.k === "soakLong") hint("浸けっぱなしは紙がふやける。水から上げて待つ");
      else if (e.k === "letgo") { play("pochan"); splash(e.x, e.y, 3, false); }
      else if (e.k === "crack") { play("crack"); hint(S.poi.brittle ? "紙が縮み切った。次に浸けると裂ける" : "紙が乾いて縮んでいる。今のうちにすくう", 1.6); }
      else if (e.k === "brittle") { play("crack"); hint("紙が縮み切った。次に浸けると裂ける", 2.4); }
      else if (e.k === "bowl") {
        play("bowl"); bump = 1; splash(e.x, e.y - 10, 4, true);
        let dy = 0;
        for (const it of e.items) {
          pops.push({ txt: "+" + it.pts, x: e.x - 30, y: e.y - 56 - dy, t0: now, big: it.pts >= 80 });
          if (it.oh) { pops.push({ txt: "おっ", x: e.x - 70, y: e.y - 100 - dy, t0: now + 0.12, tag: true }); play("hyoshigi"); }
          if (it.set) pops.push({ txt: "揃い", x: e.x - 60, y: e.y - 84 - dy, t0: now + 0.2, tag: true });
          dy += 22;
        }
        S.caught.slice(-e.items.length).forEach((f) => bowlSpin.set(f.seed, -Math.PI * 2));
        $("score").textContent = String(S.score);
      }
      else if (e.k === "tear") {
        play("tear"); poiLook.hole = makeHole(e.why === "nushi");
        if (e.n) { play("pochan"); splash(e.x, e.y, 5, true); }
        overT = now; hint(WHY[e.why] || "紙が破れた", 9);
      }
    }
    S.ev.length = 0;
  }

  // ---- 結果: 持ち帰りの袋と、破れたポイ ----
  function finish() {
    state = "result"; resultAt = now;
    let isNew = false;
    if (S.score > best) { best = S.score; isNew = S.score > 0; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }
    $("rScore").textContent = String(S.score);
    $("rNew").textContent = isNew ? "これまでで一番" : "";
    $("rWhy").textContent = WHY[S.reason] || "";
    const n = S.caught.length, h = S.heavy;
    const rows = [["すくった金魚", n + "匹"], ["遊んだ時間", Math.round(S.endT) + "秒"]];
    if (h) rows.push(["いちばん重い一匹", `${KINDS[h.kind].name}（紙の透け ${Math.round(h.wet * 100)}%）`]);
    if (S.stats.set) rows.push(["揃い", S.stats.set + "回"]);
    $("rList").innerHTML = rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join("");
    $("rBest").textContent = "ベスト " + best + "点";
    drawBag();
    $("hud").hidden = true; $("hint").hidden = true; $("result").hidden = false;
    $("againB").focus();
  }
  function drawBag() {
    const bc = $("bag"), g = bc.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, bc.width, bc.height);
    const keepS = s; s = 0.55;
    // 袋（ビニール）: 口を輪ゴムで縛って吊るす
    const bx = 150, top = 30;
    g.save();
    g.strokeStyle = C.sumi; g.lineWidth = 3; g.globalAlpha = 0.8;
    g.beginPath(); g.moveTo(bx, 2); g.lineTo(bx + 2, top + 14); g.stroke();
    const bag = [[bx - 14, top + 16], [bx + 14, top + 16], [bx + 40, top + 70], [bx + 92, top + 150], [bx + 104, top + 210], [bx + 80, top + 252], [bx, top + 264], [bx - 80, top + 252], [bx - 104, top + 210], [bx - 92, top + 150], [bx - 40, top + 70]];
    g.globalAlpha = 0.5; g.fillStyle = C.usugami; g.beginPath(); smoothPath(g, bag, true); g.fill();
    g.save(); g.beginPath(); smoothPath(g, bag, true); g.clip();
    g.globalAlpha = 0.85; g.fillStyle = C.tutan; g.beginPath(); g.moveTo(0, top + 112); g.bezierCurveTo(bx - 40, top + 106, bx + 40, top + 118, 400, top + 110); g.lineTo(400, 300); g.lineTo(0, 300); g.fill();
    g.globalAlpha = 0.6; g.strokeStyle = "#f4f7f2"; g.lineWidth = 2; g.beginPath(); g.moveTo(0, top + 112); g.bezierCurveTo(bx - 40, top + 106, bx + 40, top + 118, 400, top + 110); g.stroke();
    g.globalAlpha = 1;
    const list = S.caught.slice(-10);
    list.forEach((f, i) => {
      const a = (f.seed % 628) / 100, col = i % 3, row = Math.floor(i / 3);
      g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
      g.translate(bx - 52 + col * 50 + ((f.seed >> 2) % 14), top + 150 + row * 34 + ((f.seed >> 4) % 10)); g.scale(1.25, 1.25);
      drawFish(g, { x: 0, y: 0, a: a, len: f.len, ph: i * 1.3, kind: f.kind, seed: f.seed, depth: 0.7, shadow: false });
      g.restore();
    });
    g.restore();
    g.globalAlpha = 0.9; g.strokeStyle = "#f4f7f2"; g.lineWidth = 2.5; g.beginPath(); smoothPath(g, bag.slice(2, 6).map(([x, y]) => [x - 12, y]), false); g.stroke();
    // ビニールのしわ: 口から下へ伸びる折れ（長さも曲がりも1本ずつ違う）
    [[[bx - 6, top + 22], [bx - 16, top + 58], [bx - 30, top + 96]], [[bx + 5, top + 22], [bx + 12, top + 50], [bx + 9, top + 74], [bx + 22, top + 104]], [[bx + 58, top + 128], [bx + 70, top + 170], [bx + 66, top + 200]]].forEach((w, i) => {
      g.globalAlpha = 0.5; g.strokeStyle = "#f4f7f2"; g.lineWidth = 1.6 - i * 0.3; g.beginPath(); smoothPath(g, w, false); g.stroke();
      g.globalAlpha = 0.28; g.strokeStyle = C.sumi; g.lineWidth = 1; g.beginPath(); smoothPath(g, w.map(([x, y]) => [x + 2, y + 1]), false); g.stroke();
    });
    g.globalAlpha = 0.6; g.strokeStyle = C.sumi; g.lineWidth = 1.5; g.beginPath(); smoothPath(g, bag, true); g.stroke();
    // 結び目のねじれ: 口の上に絞ったビニールの房
    g.globalAlpha = 0.55; g.fillStyle = C.usugami; g.beginPath(); smoothPath(g, [[bx - 9, top + 18], [bx - 15, top + 6], [bx - 6, top - 2], [bx + 1, top + 4], [bx + 8, top - 4], [bx + 15, top + 5], [bx + 9, top + 18]], true); g.fill();
    g.globalAlpha = 0.6; g.strokeStyle = C.sumi; g.lineWidth = 1.2; g.stroke();
    g.globalAlpha = 0.45; g.lineWidth = 1; g.beginPath(); g.moveTo(bx - 7, top + 15); g.quadraticCurveTo(bx - 2, top + 8, bx - 4, top + 1); g.moveTo(bx + 6, top + 15); g.quadraticCurveTo(bx + 2, top + 9, bx + 7, top); g.stroke();
    // 輪ゴム（茶色の輪ゴム。2重に巻いて少しずれる）
    g.globalAlpha = 1; g.strokeStyle = "#a9733e"; g.lineWidth = 4; g.beginPath(); g.ellipse(bx, top + 18, 17, 5, 0.05, 0, 7); g.stroke();
    g.lineWidth = 2.5; g.beginPath(); g.ellipse(bx + 1, top + 14, 13, 4, -0.08, 0, 7); g.stroke();
    g.restore();
    // 破れたポイ（終わったときの紙の透け）
    g.save(); g.translate(400, 150); g.scale(1.8, 1.8);
    s = 0.55;
    drawPoi(g, 0, 0, "air", 1, now + 1, 0);
    g.restore();
    s = keepS;
  }

  // ---- 描く ----
  function render(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    if (!S) return;
    ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * ox, dpr * oy);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, TW, TH); ctx.clip();
    if (S.nushi) drawNushi(ctx, S.nushi);
    const P = S.poi, wet = Math.min(1, (1 - S.hp) * 1.08), showPoi = state === "play";
    const lf = (now - liftT) / 0.22;
    if (showPoi && P.st === "water") drawPoi(ctx, disp.x, disp.y, "water", wet, t, 0);
    for (const f of S.fish) drawFish(ctx, { x: f.x, y: f.y, a: f.a, len: f.len, ph: f.ph, kind: f.kind, seed: f.seed, depth: f.depth, alpha: f.fade, flee: f.flee > 0 });
    drawReflect(ctx, t);
    ctx.restore();
    drawBowl(ctx, S.bowl, t, bump);
    // しぶき（不揃いな粒）
    for (let i = fx.length - 1; i >= 0; i--) {
      const q = fx[i], u = (now - q.t0) / q.life;
      if (u >= 1) { fx.splice(i, 1); continue; }
      const x = q.x + q.vx * u * q.life, y = q.y + q.vy * u * q.life;
      ctx.globalAlpha = 0.8 * (1 - u); ctx.fillStyle = "#f4f7f2"; ctx.beginPath(); smoothPath(ctx, blob(x, y, q.r, q.r * 0.8, q.vx, q.rj), true); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (showPoi && P.st !== "water") {
      // 乾いて縮む予兆（残り14%から）。縮み切ると次に浸けた瞬間に裂ける
      const shrink = S.hp < 0.14 ? 0.035 + 0.075 * Math.min(1, (0.14 - S.hp) / 0.13) : 0;
      drawPoi(ctx, disp.x, disp.y, P.st, wet, t, lf < 1 ? lf : 0, shrink);
      P.load.forEach((f, i) => {
        const hop = lf < 1 ? Math.sin(lf * Math.PI) * 3 : 0, wig = Math.sin(now * 9 + i) * 0.12;
        drawFish(ctx, { x: disp.x + (i ? 7 : 0) - (P.load.length > 1 ? 4 : 0), y: disp.y - hop + (i ? 6 : 0) - 2, a: (f.a || 0) + wig, len: f.len, ph: f.ph + (lf < 1 ? lf * 6 : 0), kind: f.kind, seed: f.seed, depth: 0.1, shadow: false, flee: true });
      });
    }
    // 得点と「おっ」
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let i = pops.length - 1; i >= 0; i--) {
      const p = pops[i], u = (now - p.t0) / 1.3;
      if (u < 0) continue;
      if (u >= 1) { pops.splice(i, 1); continue; }
      const y = p.y - u * 18, a = u < 0.7 ? 1 : (1 - u) / 0.3;
      ctx.globalAlpha = a;
      if (p.tag) {
        ctx.save(); ctx.translate(p.x, y); ctx.rotate(-0.06);
        ctx.fillStyle = C.board; ctx.beginPath(); ctx.moveTo(-30, -15); ctx.lineTo(29, -14); ctx.lineTo(31, 15); ctx.lineTo(-29, 14); ctx.closePath(); ctx.fill();
        ctx.fillStyle = C.sumi; ctx.font = `22px "Yusei Magic","Hiragino Maru Gothic ProN",sans-serif`; ctx.fillText(p.txt, 0, 1); ctx.restore();
      } else {
        ctx.font = `${p.big ? 30 : 24}px "Yusei Magic","Hiragino Maru Gothic ProN",sans-serif`;
        ctx.lineJoin = "round"; ctx.strokeStyle = C.sumi; ctx.lineWidth = 3 / s * 0.9; ctx.strokeText(p.txt, p.x, y);
        ctx.fillStyle = C.hi; ctx.fillText(p.txt, p.x, y);
      }
    }
    ctx.globalAlpha = 1;
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    const t = ts / 1000, dt = Math.min(0.05, last ? t - last : 0.016);
    last = t; now = t;
    if (S && !paused) {
      if (state === "play") {
        // キーボードでポイを動かす（水中では速すぎない速さ）
        const kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0), ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
        if ((kx || ky) && !S.over) { const sp = S.poi.st === "water" ? 80 : 190, l = Math.hypot(kx, ky); SIM.moveTo(S, S.poi.tx + (kx / l) * sp * dt, S.poi.ty + (ky / l) * sp * dt); }
        let left = dt;
        while (left > 1e-6) { const h = Math.min(left, 1 / 60); SIM.step(S, h); left -= h; }
        handleEvents();
        setHintBase();
        if (S.over && now - overT > 1.5) finish();
      } else if (state === "title") { S.poi.st = "air"; SIM.step(S, dt); S.t = 0; S.hp = 1; S.ev.length = 0; }
      const P = S.poi, k = P.st === "water" || P.st === "toBowl" ? 1 : Math.min(1, dt * 22);
      disp.x += (P.x - disp.x) * k; disp.y += (P.y - disp.y) * k;
      bump = Math.max(0, bump - dt * 4);
      for (const [key, v] of bowlSpin) { const nv = v * Math.max(0, 1 - dt * 3); if (Math.abs(nv) < 0.01) bowlSpin.delete(key); else bowlSpin.set(key, nv); }
    }
    music();
    render(t);
  }

  layout();
  newDemo();
  setMute(muted);
  $("bestT").textContent = best ? "ベスト " + best + "点" : "";
  requestAnimationFrame(frame);
  window.__gs = { SIM, get S() { return S; }, get state() { return state; }, get view() { return { ox, oy, s }; }, start, finish };
})();
</script>
</body>
</html>
