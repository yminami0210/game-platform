<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポイ一枚 見本帳</title>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#4a3a30}
  svg{display:block}
  .mg{font-family:"Yusei Magic","Hiragino Maru Gothic ProN",sans-serif}
  .rd{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif}
  .num{font-variant-numeric:tabular-nums}
</style></head>
<body>
<svg id="s" width="1200" height="960" viewBox="0 0 1200 960"></svg>
<script src="print.js"></script>
<script>
const svg = document.getElementById("s");
defs(svg);
const T = (g, x, y, str, o = {}) => { const t = el("text", { x, y, class: o.cls || "rd", "font-size": o.size || 14, "font-weight": o.w || 500, fill: o.fill || C.sumi, "text-anchor": o.anchor || "start" }, g); t.textContent = str; return t; };
// 地: 屋台の台の板
el("rect", { x: 0, y: 0, width: 1200, height: 960, fill: C.ita }, svg);
el("rect", { x: 0, y: 0, width: 1200, height: 960, fill: "#000", filter: "url(#wood)", opacity: 0.9 }, svg);

// ---- 左上: 水槽の底の切れ端（形の見本は水越しに見せる） ----
setSeed(5);
const pan = [[24, 24], [700, 20], [706, 590], [28, 596]];
el("path", { d: path(pan, 1), fill: "#9fcbcf" }, svg);
const cpw = el("clipPath", { id: "pw" }, svg); el("path", { d: path([[36, 36], [690, 33], [694, 580], [40, 584]], 0.5) }, cpw);
const w = el("g", { "clip-path": "url(#pw)" }, svg);
el("rect", { x: 0, y: 0, width: 720, height: 600, fill: C.tutan }, w);
el("path", { d: blob(620, 560, 260, 160, 12, 0.2), fill: C.kage, opacity: 0.6, filter: "url(#soft30)" }, w);
el("path", { d: blob(90, 80, 200, 120, 12, 0.2), fill: C.terasu, opacity: 0.8, filter: "url(#soft30)" }, w);
el("rect", { x: 0, y: 0, width: 720, height: 600, fill: "#000", filter: "url(#hake)", opacity: 0.45 }, w);


// 金魚4種: 大きさ・速さの違いを形で見せる（数字は点）
const kinds = [
  { kind: "koaka", x: 120, len: 54, bend: 0.35, s: 11, name: "小赤", pt: "10", note: "速い・軽い" },
  { kind: "sarasa", x: 270, len: 66, bend: -0.3, s: 12, name: "更紗", pt: "25", note: "ふつう" },
  { kind: "demekin", x: 430, len: 72, bend: 0.2, s: 13, name: "出目金", pt: "40", note: "のろい・重い" },
  { kind: "kin", x: 585, len: 52, bend: -0.5, s: 14, name: "金色", pt: "100", note: "速い・まれ" },
];
kinds.forEach((k) => {
  fish(w, { x: k.x, y: 150 + k.len * 0.15, ang: Math.PI / 2, len: k.len, bend: k.bend, kind: k.kind, s: k.s, depth: [0.3, 0.5, 0.8, 0.2][kinds.indexOf(k)] });
  T(w, k.x - 40, 226, k.name, { cls: "mg", size: 22 });
  T(w, k.x - 40, 254, k.pt + "点", { cls: "mg num", size: 22 });
  T(w, k.x - 40, 274, k.note, { size: 12.5, w: 700 });
});
// 主（触ってはいけない）: 影だけ
nushi(w, 410, 350, 0.04, 230, 4, 0.55, 0.22);
T(w, 470, 324, "主（大きな黒い鯉）", { size: 13, w: 700 });
T(w, 470, 342, "影だけ。上で離すと紙が大きく破れる", { size: 12.5, w: 700 });

// ポイの4段階（ゲージは無い。紙の透けとシワと裂け目だけ）
const st = [["新しい", 0, false], ["ふやけた", 0.4, false], ["透けた", 0.78, false], ["破れた", 0.85, true]];
st.forEach(([lb, wet, torn], i) => {
  const x = 100 + i * 160, y = 462;
  fish(w, { x: x + 14, y: y + 6, ang: 2.4 + i * 0.3, len: 44, bend: 0.3 - i * 0.2, kind: i === 3 ? "demekin" : "koaka", s: 40 + i });
  poi(w, { x, y, r: 50, ang: 0.75, wet, torn, s: 60 + i, handle: 0.55 });
  T(w, x - 50, y + 92, lb, { size: 14, w: 700 });
});

// ---- 右上: 文字（ボール紙の値札） ----
const bb = board(svg, 730, 28, 446, 330, 0.8, 71);
T(bb, 756, 66, "Yusei Magic", { size: 13, w: 700 });
T(bb, 756, 104, "得点・値札・結果だけ。マジックで書いた屋台の字", { size: 12.5, w: 700 });
const sc = T(bb, 756, 186, "", { cls: "mg num", size: 76, fill: C.hi }); sc.setAttribute("stroke", C.sumi); sc.setAttribute("stroke-width", 4.5); sc.setAttribute("paint-order", "stroke"); sc.setAttribute("stroke-linejoin", "round"); sc.innerHTML = '135<tspan font-size="38" fill="#233038" stroke="none" dx="6">点</tspan>';
T(bb, 756, 236, "1回 50円　揃い +30", { cls: "mg", size: 28 });
el("path", { d: path([[750, 258], [1150, 262]], 0.8, false), stroke: C.sabi, "stroke-width": 1.4, fill: "none", opacity: 0.8 }, bb);
T(bb, 756, 286, "M PLUS Rounded 1c 700（説明・操作の手引き）", { size: 13, w: 700 });
T(bb, 756, 312, "水面を押さえるとポイが沈む。離すとすくう。", { size: 16, w: 700 });
T(bb, 756, 336, "金魚が寄るまでは、水から上げて待つ。", { size: 16, w: 700 });
tape(svg, 920, 20, 70, -2);

// ---- 右中: 手の跡（版ずれ・剥げと錆・電球の映り込み） ----
const hb = board(svg, 730, 380, 446, 210, -0.6, 72);
const z = el("g", { transform: "translate(752,400)" }, hb);
const zc = el("clipPath", { id: "zc" }, svg); el("rect", { x: 752, y: 402, width: 130, height: 130 }, zc);
const zg = el("g", { "clip-path": "url(#zc)" }, hb);
el("rect", { x: 752, y: 402, width: 130, height: 130, fill: C.tutan }, zg);
fish(zg, { x: 818, y: 515, ang: Math.PI / 2 + 0.1, len: 110, bend: 0.2, kind: "koaka", s: 81 });
T(hb, 752, 556, "緋の版ずれ 1〜1.5px", { size: 12.5, w: 700 });
T(hb, 752, 574, "輪郭は所々切れる", { size: 12.5, w: 700 });
const zc2 = el("clipPath", { id: "zc2" }, svg); el("rect", { x: 900, y: 402, width: 120, height: 130 }, zc2);
const zg2 = el("g", { "clip-path": "url(#zc2)" }, hb);
el("rect", { x: 900, y: 402, width: 120, height: 130, fill: "#9fcbcf" }, zg2);
el("rect", { x: 900, y: 402, width: 120, height: 130, fill: "#000", filter: "url(#grain)", opacity: 0.45 }, zg2);
el("path", { d: "M900,420L1020,424", stroke: C.sumi, "stroke-width": 1.4, opacity: 0.5 }, zg2); peel(zg2, 912, 432, 1004, 434, 8, 91, 1); peel(zg2, 936, 500, 992, 498, 5, 93, -1);
T(hb, 900, 556, "剥げと錆", { size: 12.5, w: 700 });
T(hb, 900, 574, "縁と継ぎ目に寄せる", { size: 12.5, w: 700 });
const zc3 = el("clipPath", { id: "zc3" }, svg); el("rect", { x: 1036, y: 402, width: 120, height: 130 }, zc3);
const zg3 = el("g", { "clip-path": "url(#zc3)" }, hb);
el("rect", { x: 1036, y: 402, width: 120, height: 130, fill: C.tutan }, zg3);
el("rect", { x: 1036, y: 402, width: 120, height: 130, fill: C.terasu, opacity: 0.6 }, zg3);
reflect(zg3, 1094, 456, 95, 1.3);
T(hb, 1036, 556, "電球の映り込み", { size: 12.5, w: 700 });
T(hb, 1036, 574, "割れた筋。グローなし", { size: 12.5, w: 700 });

// ---- 下: 色（水槽の縁から剥がしたペンキ片のような色見本） ----
const cols = [
  ["トタンの水浅葱", C.tutan, "地（水槽の底）", "約25%＋影・光の重ね"],
  ["金魚の緋", C.hi, "主役（金魚・得点）", "2%未満"],
  ["ポイの薄紙", C.usugami, "紙・お椀の白", "2%前後"],
  ["裸電球の卵黄", C.rantou, "映り込み・金色", "1%未満"],
  ["錆の赤茶", C.sabi, "縁の錆・値札の枠", "1%前後"],
  ["夜店の墨藍", C.sumi, "輪郭・文字・出目金", "2%前後"],
];
cols.forEach(([nm, hx, role, area], i) => {
  const x = 30 + i * 192, y = 618;
  setSeed(120 + i);
  el("path", { d: path(blobPts(x + 82, y + 64, 80, 52, 14, 0.12, j(0.2)), 2), fill: hx, stroke: i === 2 ? "#b9c1bb" : "none" }, svg);
  el("path", { d: path(blobPts(x + 82, y + 64, 80, 52, 14, 0.12), 0), fill: "#000", filter: "url(#grain)", opacity: 0.35 }, svg);
  const lb = board(svg, x, y + 128, 176, 96, j(1.2), 130 + i);
  T(lb, x + 10, y + 154, nm, { size: 15, w: 700 });
  T(lb, x + 10, y + 176, hx, { size: 13, w: 700 });
  T(lb, x + 10, y + 196, role, { size: 12.5, w: 700 });
  T(lb, x + 10, y + 214, area, { size: 12.5, w: 700 });
});
// 重ね色の注記
T(svg, 30, 940, "重ね色（新しい色ではない）: 庇の影 #5f9aa2 ／ 隅の深み #4d8790 ／ 電球の光 #c4dcc4 ／ 亜鉛の地 #a9b5ad ／ ボール紙 #c9a56f ／ 台の板 #4a3a30", { size: 13, w: 700, fill: "#efe6d6" });
</script>
</body></html>
