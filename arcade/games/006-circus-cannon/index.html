<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>とんでけ大砲</title>
<link href="https://fonts.googleapis.com/css2?family=Rampart+One&family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --hanpu:#c4b184; --hinata:#dccb9b; --ogakuzu:#cf9358; --midori:#23574a; --midori2:#3d6e5f;
  --sumi:#1f302a; --botan:#a8336a; --yamabuki:#e9b021; --kage:#9b8d68; --ita:#8a6a45;
  --head:"Rampart One","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --body:"Kiwi Maru","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--hanpu);color:var(--sumi);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#c.pulling{cursor:grabbing}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:4}
.screen[hidden]{display:none}
/* 道具馬車の側板: 深緑の板地に筆の木目、縁は日なた色の細い筆線 */
.board{position:relative;width:min(340px,100%);max-height:100%;overflow:auto;touch-action:pan-y;
  background:var(--midori);color:var(--hinata);
  border-radius:5px 3px 6px 2px/3px 6px 2px 5px;
  box-shadow:3px 2.5px 0 rgba(31,48,42,.75);
  padding:clamp(16px,3vh,24px) 22px clamp(14px,2.6vh,20px)}
.board::before{content:"";position:absolute;inset:6px 7px 7px 6px;border:1.3px solid rgba(220,203,155,.55);
  border-radius:3px 2px 4px 2px;pointer-events:none}
.board::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--grain);opacity:.5;mix-blend-mode:soft-light}
h1,.sign{font-family:var(--head);font-weight:400;color:var(--yamabuki);text-shadow:.06em .06em 0 var(--sumi)}
h1{font-size:clamp(30px,min(10vw,7.4vh),46px);line-height:1.1;letter-spacing:.02em;white-space:nowrap}
.sub{font-size:15px;font-weight:500;margin-top:4px}
.how{font-size:15px;line-height:1.7;margin-top:clamp(10px,2vh,14px)}
.keys{font-size:13px;line-height:1.6;margin-top:6px;opacity:.92}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:clamp(12px,2.2vh,18px)}
button{font-family:var(--body);font-weight:500;font-size:18px;color:var(--sumi);background:var(--hinata);border:0;
  padding:9px 20px 10px;cursor:pointer;border-radius:3px 6px 2px 5px/5px 2px 6px 3px;
  box-shadow:inset 0 0 0 1.5px var(--sumi),2.5px 2.5px 0 var(--sumi);transition:transform .06s,box-shadow .06s}
button:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 1.5px var(--sumi)}
button:focus-visible{outline:3px solid var(--hinata);outline-offset:3px}
.best{font-size:14px;font-variant-numeric:tabular-nums}
.res .sign{font-size:clamp(26px,5vh,32px);line-height:1.15}
.res .score{font-family:var(--head);color:var(--yamabuki);text-shadow:.06em .06em 0 var(--sumi);
  font-size:clamp(40px,8vh,54px);line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.res canvas{display:block;width:100%;height:auto;margin-top:10px;border-radius:2px 4px 3px 2px;box-shadow:0 0 0 1.5px var(--sumi)}
.res dl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:14px;line-height:1.6;margin-top:10px;font-variant-numeric:tabular-nums}
.res dd{font-weight:500;color:#efe3bd}
.res .new{font-size:15px;font-weight:500;margin-top:6px}
#tools{position:fixed;top:2px;right:6px;display:flex;gap:2px;z-index:3}
#tools[hidden]{display:none}
#tools button{font-size:13px;background:transparent;box-shadow:none;padding:6px 7px;color:var(--sumi);
  text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
@media (max-height:500px){
  .board{width:min(560px,100%);padding:12px 18px}
  h1{font-size:32px}.how{font-size:14px;line-height:1.55;margin-top:6px}.row{margin-top:8px}
  .res{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-items:start}
  .res .score{font-size:38px}.res dl{margin-top:4px;font-size:13px}
}
@media (prefers-reduced-motion: reduce){button{transition:none}}
</style>

<body>
<canvas id="c" aria-label="昼の天幕の中。左に大砲、右に網を背負った象"></canvas>

<div id="tools" hidden>
  <button id="bMute" type="button">音を消す</button>
  <button id="bPause" type="button">一時停止</button>
</div>

<section class="screen" id="title">
  <div class="board">
    <h1>とんでけ大砲</h1>
    <p class="sub">旅回りの一座の大砲係</p>
    <p class="how">大砲を後ろへ引いて離すと、曲芸師が飛びます。象の網のど真ん中へ。綱渡りと砂袋には当てず、引きすぎると暴発します。</p>
    <p class="keys">帽子3つを落としたら興行終わり。PCはドラッグ、または ↑↓で角度・スペース長押しで火薬。</p>
    <div class="row"><button id="bStart" type="button">興行をはじめる</button><span class="best" id="bestT"></span></div>
  </div>
</section>

<section class="screen" id="pause" hidden>
  <div class="board">
    <p class="sign" style="font-size:30px">一時停止</p>
    <p class="how">曲芸師は大砲の中で待っています。</p>
    <div class="row"><button id="bResume" type="button">続ける</button></div>
  </div>
</section>

<section class="screen" id="result" hidden>
  <div class="board res">
    <div>
      <p class="sign">本日の興行</p>
      <p class="score" id="rScore">0</p>
      <canvas id="rTent" width="320" height="200" aria-label="今日の天幕と煤の跡"></canvas>
    </div>
    <div>
      <dl>
        <dt>飛ばした曲芸師</dt><dd id="rShots">0人</dd>
        <dt>ど真ん中</dt><dd id="rCenter">0回</dd>
        <dt>最高の連続</dt><dd id="rStreak">0</dd>
        <dt>天幕の煤の跡</dt><dd id="rSoot">0</dd>
        <dt>興行の長さ</dt><dd id="rTime">0秒</dd>
        <dt>これまでの最高</dt><dd id="rBest">0</dd>
      </dl>
      <p class="new" id="rNew" hidden>これまでで一番の興行</p>
      <div class="row"><button id="bAgain" type="button">もう一回</button></div>
    </div>
  </div>
</section>

<script>
"use strict";

// <sim> ここから下は DOM に触らない（自動プレイのボットがそのまま読み込む）
const SIM = (() => {
  const D = Math.PI / 180;
  const K = {
    W: 420, H: 780, G: 1000, PX: 64, PY: 626, BARREL: 72, AMIN: 58 * D, AMAX: 86 * D, VMIN: 330, VMAX: 900,
    NET_Y: 560, FLOOR: 676, CEIL: 20, EMIN: 222, EMAX: 350, AC_R: 9, BAG_R: 15, ROPES: [232, 312], KICK: 3, TICK: 5,
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function rnd(S) { S.seed = (S.seed * 16807) % 2147483647; return S.seed / 2147483647; }
  // 経過時間で厳しくなる（象の速さ・網の幅・障害物）と同時に、火の輪も増える。
  // 2段目（HOT 秒から）: 筒が焼けて弾がぶれ始め（狙いの点もにじむ）、網はさらに縮み、象も砂袋も退屈も厳しくなり続ける。頭打ちにしない
  const HOT = 105;
  function diff(t) {
    const o = Math.max(0, t - HOT);
    return {
      eleSp: Math.min(30 + t * 0.62, 112) + Math.min(Math.max(0, t - 132) * 0.55, 48),
      netW: Math.max(Math.max(128 - t * 0.4 - Math.max(0, t - 70) * 0.36, 58) - o * 0.5, 22),
      turn: Math.min(0.05 + t * 0.0022, 0.38),
      bags: t < 28 ? 1 : t < 65 ? 2 : t < 125 ? 3 : 4,
      walkers: t < 14 ? 0 : t < 80 ? 1 : 2,
      walkSp: Math.min(36 + t * 0.26, 84) + o * 0.3,
      ringGap: Math.max(1.8, 9.5 - t * 0.075),
      ringMax: t < 45 ? 1 : t < 90 ? 2 : 3,
      jit: 1 + o * 0.07,
      tick: t < 120 ? K.TICK : Math.max(3.4, K.TICK - (t - 120) * 0.04),
    };
  }
  function create(seed, ringR) {
    const S = {
      seed: (Math.abs(seed | 0) % 2147483646) + 1, t: 0, score: 0, hats: 3, misses: 0, bore: 0, wait: 0,
      phase: "ready", pt: 0, hold: 0, ang: 72 * D, ac: null,
      ele: { x: 330, dir: -1, pause: 0, walk: 0 },
      bags: [], walkers: [], rings: [], ringT: 5, ringR: ringR || 28, rid: 0,
      shots: 0, lands: 0, centers: 0, streak: 0, bestStreak: 0, bestShot: 0, bestShotT: 0, penalties: [],
      ev: [], over: false, peek: false, noJit: false,
    };
    addBag(S);
    S.bags[0].drop = 1;
    return S;
  }
  function addBag(S) {
    let x = 200;
    for (let k = 0; k < 14; k++) {
      x = 140 + rnd(S) * 200;
      if (S.bags.every((b) => Math.abs(b.x - x) > 70) && S.rings.every((r) => Math.abs(r.x - x) > 44)) break;
    }
    const base = 288 + rnd(S) * 38;
    // 振れ幅いっぱいでも袋の下端（+20）が客席の上端（y=396）にかからない
    S.bags.push({ x, base, amp: Math.min(34 + rnd(S) * 32, 376 - base), per: 4.5 + rnd(S) * 2.5, ph: rnd(S) * 6.28,
      drop: 0, life: 16 + rnd(S) * 14, up: false, sw: 0, swv: 0 });
  }
  function bagY(S, b) { return b.base + b.amp * Math.sin(b.ph + (S.t * 6.2832) / b.per); }
  function addRing(S) {
    let x = 0, y = 0, ok = false;
    for (let k = 0; k < 12 && !ok; k++) {
      x = 150 + rnd(S) * 200; y = 186 + rnd(S) * 160;
      ok = S.bags.every((b) => b.up || Math.abs(b.x - x) > 52) && S.rings.every((r) => Math.hypot(r.x - x, r.y - y) > 90);
    }
    if (!ok) return;
    const max = 6 + rnd(S) * 4;
    S.rings.push({ id: ++S.rid, x, y, r: S.ringR, life: max, max, fire: rnd(S) < 0.62, k: Math.floor(rnd(S) * 1e6) });
  }
  function fade(r) { return Math.max(0, Math.min(1, (r.max - r.life) / 0.5, r.life / 0.5)); }
  function muzzle(a) { return [K.PX + Math.cos(a) * K.BARREL, K.PY - Math.sin(a) * K.BARREL]; }
  function speed(p) { return K.VMIN + (K.VMAX - K.VMIN) * clamp(p, 0, 1); }

  function stepEle(S, h, d) {
    const e = S.ele;
    if (e.pause > 0) { e.pause -= h; if (e.pause <= 0) e.dir *= -1; return; }
    e.x += e.dir * d.eleSp * h; e.walk += d.eleSp * h;
    if (e.x < K.EMIN) { e.x = K.EMIN; e.dir = 1; }
    if (e.x > K.EMAX) { e.x = K.EMAX; e.dir = -1; }
    // ときどき立ち止まって鼻を上げ（予兆 0.5秒）、向きを変える
    if (!S.peek && e.x > K.EMIN + 24 && e.x < K.EMAX - 24 && rnd(S) < d.turn * h) e.pause = 0.5;
  }
  // 象が今の速さのまま歩いたら ahead 秒後にどこにいるか（気まぐれの方向転換は含まない）
  function eleAt(S, ahead) {
    let x = S.ele.x, dir = S.ele.dir, pause = S.ele.pause, t = S.t;
    const h = 1 / 60;
    for (let s = 0; s < ahead; s += h) {
      t += h;
      if (pause > 0) { pause -= h; if (pause <= 0) dir *= -1; continue; }
      x += dir * diff(t).eleSp * h;
      if (x < K.EMIN) { x = K.EMIN; dir = 1; }
      if (x > K.EMAX) { x = K.EMAX; dir = -1; }
    }
    return x;
  }
  function stepBags(S, h, d) {
    for (const b of S.bags) {
      b.swv += (-b.sw * 7 - b.swv * 0.9) * h; b.sw += b.swv * h;
      if (!b.up) { b.drop = Math.min(1, b.drop + h / 1.6); b.life -= h; if (b.life <= 0) b.up = true; }
      else b.drop -= h / 1.6;
    }
    S.bags = S.bags.filter((b) => !(b.up && b.drop <= 0));
    if (S.bags.filter((b) => !b.up).length < d.bags) addBag(S);
  }
  function stepWalkers(S, h, d) {
    while (S.walkers.length < d.walkers) S.walkers.push({ rope: S.walkers.length, x: -40, dir: 1, cling: 0, step: 0 });
    for (const w of S.walkers) {
      if (w.cling > 0) { w.cling -= h; continue; }
      const sp = d.walkSp * (w.rope ? 0.78 : 1);
      w.x += w.dir * sp * h; w.step += sp * h;
      if (w.x > 392 && w.dir > 0) w.dir = -1;
      if (w.x < 28 && w.dir < 0) w.dir = 1;
    }
  }
  function stepRings(S, h, d) {
    for (const r of S.rings) r.life -= h;
    S.rings = S.rings.filter((r) => r.life > 0);
    S.ringT -= h;
    if (S.ringT <= 0) { S.ringT = d.ringGap + rnd(S) * 2; if (S.rings.length < d.ringMax) addRing(S); }
  }

  function fire(S, a, p) {
    if (S.over || S.phase !== "ready") return false;
    a = clamp(a, K.AMIN, K.AMAX); S.ang = a;
    const [mx, my] = muzzle(a);
    S.shots++; S.wait = 0;
    const ac = { x: mx, y: my, vx: 0, vy: 0, spin: 0, got: [], fire: false, fall: null, boom: p > 1, t: 0, landDx: 0 };
    if (p > 1) { ac.vx = Math.cos(a) * 160; ac.vy = -1500; }
    else {
      let v = speed(p), aa = a;
      if (!S.noJit) { const j = diff(S.t).jit; v *= 1 + (rnd(S) - 0.5) * 0.03 * j; aa += (rnd(S) - 0.5) * 0.8 * D * j; }
      ac.vx = Math.cos(aa) * v; ac.vy = -Math.sin(aa) * v;
    }
    S.ac = ac; S.phase = "fly"; S.pt = 0;
    S.ev.push({ k: "boom", x: mx, y: my, a, over: p > 1 });
    return true;
  }
  function lose(S, why) {
    S.hats--; S.misses++; S.streak = 0; S.penalties.push(S.t);
    S.phase = "miss"; S.pt = 0; S.hold = 1.5;
    S.ev.push({ k: "miss", why, x: S.ac ? S.ac.x : 0, y: S.ac ? S.ac.y : 0 });
  }
  function land(S, dx, nw) {
    const a = S.ac, center = Math.abs(dx) <= nw * 0.17;
    const mult = 2 ** a.got.length;
    let bonus = 0;
    if (center) { S.streak++; S.centers++; if (S.streak >= 2) bonus = (S.streak - 1) * 100; if (S.bore > 0) S.bore--; }
    else S.streak = 0;
    S.bestStreak = Math.max(S.bestStreak, S.streak);
    const pts = (center ? 300 : 100) * mult + bonus;
    S.score += pts; S.lands++;
    if (pts >= S.bestShot) { S.bestShot = pts; S.bestShotT = S.t; }
    a.landDx = dx; S.phase = "land"; S.pt = 0; S.hold = center ? 1.45 : 1.0;
    S.ev.push({ k: "land", center, pts, mult, fire: a.fire, streak: S.streak, dx, bonus });
  }
  function fly(S, h, d) {
    const a = S.ac; a.t += h;
    const py = a.y;
    if (a.boom) {
      a.x += a.vx * h; a.y += a.vy * h;
      if (a.y < K.CEIL) { S.ev.push({ k: "tear", x: a.x }); lose(S, "over"); }
      return;
    }
    a.vy += K.G * h; a.x += a.vx * h; a.y += a.vy * h; a.spin += h * (a.fall ? 2.5 : 8);
    if (!a.fall) {
      for (const r of S.rings) {
        if (fade(r) < 0.6 || a.got.includes(r.id)) continue;
        if (Math.hypot(a.x - r.x, a.y - r.y) < r.r * 0.8) {
          a.got.push(r.id); if (r.fire) a.fire = true;
          S.ev.push({ k: "ring", id: r.id, fire: r.fire, n: a.got.length });
        }
      }
      for (const b of S.bags) {
        if (b.drop < 1 || b.up) continue;
        if (Math.hypot(a.x - b.x, a.y - (bagY(S, b) + 4)) < K.BAG_R + K.AC_R) {
          b.swv += a.vx * 0.012; a.fall = "bag"; a.vx = 0; a.vy = Math.max(a.vy, 160);
          S.ev.push({ k: "hit", what: "bag", x: a.x, y: a.y });
          break;
        }
      }
      if (!a.fall) for (const w of S.walkers) {
        const dx = (a.x - w.x) / 26, dy = (a.y - (K.ROPES[w.rope] - 20)) / 22;
        if (dx * dx + dy * dy < 1) {
          a.fall = "walker"; a.vx *= 0.1; a.vy = Math.max(a.vy, 80); w.cling = 1.6;
          S.ev.push({ k: "hit", what: "walker", x: a.x, y: a.y });
          break;
        }
      }
    }
    if (!a.fall && a.vy > 0 && py < K.NET_Y && a.y >= K.NET_Y) {
      const dx = a.x - S.ele.x, nw = d.netW;
      if (Math.abs(dx) <= nw / 2) { land(S, dx, nw); return; }
    }
    if (a.y >= K.FLOOR || a.x > K.W + 34) { a.y = Math.min(a.y, K.FLOOR); lose(S, a.fall || (a.x > K.W + 34 ? "out" : "floor")); }
  }
  function tick(S, h) {
    if (S.t < HOT && S.t + h >= HOT) S.ev.push({ k: "hot" });
    S.t += h; S.pt += h;
    const d = diff(S.t);
    stepEle(S, h, d); stepBags(S, h, d); stepWalkers(S, h, d); stepRings(S, h, d);
    if (S.phase === "ready") {
      S.wait += h;
      if (S.wait >= d.tick) {
        S.wait = 0; S.bore++;
        S.ev.push({ k: "bore", n: S.bore });
        if (S.bore >= 3) { S.bore = 0; lose(S, "bore"); }
      }
    } else if (S.phase === "fly") fly(S, h, d);
    else if (S.phase === "land" || S.phase === "miss") {
      if (S.pt >= S.hold) {
        if (S.hats <= 0) { S.over = true; S.phase = "over"; S.ev.push({ k: "over" }); }
        else { S.phase = "ready"; S.pt = 0; S.wait = 0; S.ac = null; S.ev.push({ k: "load" }); }
      }
    }
  }
  function step(S, dt) {
    while (dt > 1e-6 && !S.over) { const h = Math.min(dt, 1 / 120); tick(S, h); dt -= h; }
  }
  return { K, D, HOT, clamp, diff, create, step, fire, muzzle, speed, bagY, fade, eleAt };
})();
// </sim>

    X.setTransform(dpr * s, 0, 0, dpr * s, dpr * (ox + (Math.random() - 0.5) * shk), dpr * (oy + (Math.random() - 0.5) * shk));
    if (!S) return;
    const wl = -ox / s - 4, wr = K.W + ox / s + 4, wt = -oy / s - 4;
    // 揺れる張り綱（何もしていないときの動きはこれ1種類だけ）
    rs = 401;
    const sw = Math.sin(now * 0.8) * 3;
    rope(X, seg([304, wt + 30], [wr + 10, 360], 14, 8 + sw), 2.2, C.ita);
    rope(X, seg([296, wt + 60], [wl + 30, 410], 14, 12 - sw * 0.7), 1.8, C.ita);
    S.walkers.forEach(drawTightrope);
    S.rings.forEach(drawRing);
    S.bags.forEach(drawBag);
    // 象と網
    const e = S.ele, dS = SIM.diff(S.t);
    drawElephant(e.x, e.dir > 0 ? -1 : 1, e.pause > 0, e.walk);
    drawNet(e.x, dS.netW, 16 + netSag * 0.3);
    const a = S.ac;
    if (S.phase === "land" && a) {
      let y = K.NET_Y + 2 + netSag * 0.25, pose = "spread", rot = 0.1;
      if (S.hold > 1.2) { const t = S.pt; if (t < 0.75) y -= Math.sin((t / 0.75) * Math.PI) * 48; pose = "star"; rot = t < 0.75 ? t * 8.4 : 0; }
      drawAcrobat(e.x + a.landDx, y - 14, rot, pose);
    }
    // 大砲
    const ai = aimInfo(), loaded = S.phase === "ready" && state !== "result";
    const over = ai.p > 1, shakeA = ai.p > 1 ? 2.6 + (ai.p - 1) * 6 : ai.p > 0.7 ? (ai.p - 0.7) * 2 : 0;
    drawCannon(ai.ang, ai.p, shakeA, loaded, S.wait > K.KICK && state === "play");
    // 筒が焼けている（2段目）: 弾込め中の筒口から細い煙。狙いの点も焼け具合だけにじむ
    if (loaded && !over && dS.jit > 1 && Math.random() < dt * Math.min(9, (dS.jit - 1) * 5)) { const [mx, my] = SIM.muzzle(ai.ang); fx.push({ k: "smoke", t0: now, x: mx, y: my, vx: (Math.random() - 0.5) * 10, seed: 1 + Math.floor(Math.random() * 1e5) }); }
    if (over && Math.random() < dt * 22) { const [mx, my] = SIM.muzzle(ai.ang); fx.push({ k: "smoke", t0: now, x: mx + Math.random() * 4, y: my, vx: (Math.random() - 0.3) * 20, seed: 1 + Math.floor(Math.random() * 1e5) }); }
    if (aim.on && S.phase === "ready" && ai.p > 0.02) drawDots(ai.ang, ai.p, dS.jit);
    // 飛んでいる曲芸師／尻もち
    if (a && (S.phase === "fly" || (S.phase === "miss" && !a.boom))) {
      if (S.phase === "miss" && a.y >= K.FLOOR - 1) drawAcrobat(a.x, K.FLOOR - 14, 0, "sit");
      else if (!a.boom || a.y > 0) drawAcrobat(a.x, a.y, a.spin, "spread");
    }
    drawFx(dt);
    drawSigns();
    drawHUD();
  }
  function drawDots(ang, p, jit = 1) {
    const [mx, my] = SIM.muzzle(ang), v = SIM.speed(Math.min(p, 1)), vx = Math.cos(ang) * v, vy = Math.sin(ang) * v;
    const tTot = (vy + Math.sqrt(vy * vy + 2 * K.G * (my - K.NET_Y))) / K.G;
    const n = 9, over = p > 1;
    X.fillStyle = C.sumi;
    for (let i = 1; i <= n; i++) {
      const t = (tTot / 3) * Math.pow(i / n, 0.85);
      let x = mx + vx * t, y = my - vy * t + 0.5 * K.G * t * t;
      if (over) { x += (Math.random() - 0.5) * 9; y += (Math.random() - 0.5) * 9; }
      rs = 421 + i; X.globalAlpha = over ? 0.4 : 0.85;
      X.fill(P(blob(x, y, 2.9 - i * 0.12, 2.5 - i * 0.1, 7, 0.2), 0.3));
      // 焼けた筒: 点のまわりに、ぶれる幅だけ薄いにじみ（先の点ほど広い）
      if (!over && jit > 1.05) { const r = 2.6 + (jit - 1) * i * 0.55; X.globalAlpha = 0.18; X.fill(P(blob(x, y, r, r * 0.85, 9, 0.25), 0.4)); }
    }
    X.globalAlpha = 1;
  }

  // ---------- 操作 ----------
  function creak() {
    if (now - aim.lastCreak > 0.09 && aim.p > 0.03) { aim.lastCreak = now; sfx.creak(Math.min(aim.p, 1.2)); }
  }
  function cancelAim() { aim.on = false; aim.key = false; aim.id = null; aim.p = 0; cv.classList.remove("pulling"); }
  // 引っぱりは表示ピクセルで測る（横画面で世界が小さくなっても、指の移動量は縦と同じ）
  const PULL0 = 14, PULL_OK = 110;
  function updatePull(px, py) {
    const fx2 = aim.sx - px, fy = py - aim.sy, L = Math.min(Math.hypot(fx2, fy), PULL0 + PULL_OK * 1.25);
    if (L < PULL0) { aim.p = 0; return; }
    aim.ang = clamp(Math.atan2(fy, fx2), K.AMIN, K.AMAX);
    aim.p = (L - PULL0) / PULL_OK;
    creak();
  }
  cv.addEventListener("pointerdown", (ev) => {
    audioInit();
    if (state !== "play" || paused || !S || S.phase !== "ready" || aim.key) return;
    ev.preventDefault();
    aim.on = true; aim.id = ev.pointerId; aim.sx = ev.clientX; aim.sy = ev.clientY; aim.p = 0; aim.ang = S.ang;
    cv.classList.add("pulling");
    try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  cv.addEventListener("pointermove", (ev) => { if (aim.on && ev.pointerId === aim.id) { ev.preventDefault(); updatePull(ev.clientX, ev.clientY); } });
  const release = (ev) => {
    if (!aim.on || ev.pointerId !== aim.id) return;
    updatePull(ev.clientX, ev.clientY);
    const p = aim.p, ang = aim.ang;
    cancelAim();
    if (p > 0.02 && state === "play" && !paused) SIM.fire(S, ang, p);
  };
  cv.addEventListener("pointerup", release);
  cv.addEventListener("pointercancel", () => cancelAim());
  addEventListener("keydown", (ev) => {
    const k = ev.code;
    if (k === "KeyM") { toggleMute(); return; }
    if (state === "title" || state === "result") {
      if ((k === "Enter" || k === "Space") && !ev.repeat) { ev.preventDefault(); if (state === "result" && now < overAt + 0.8) return; start(); }
      return;
    }
    if (k === "KeyP" || k === "Escape") { togglePause(); return; }
    if (paused) { if (k === "Enter" || k === "Space") { ev.preventDefault(); togglePause(); } return; }
    if (k === "ArrowUp" || k === "KeyW") { keys.up = true; ev.preventDefault(); }
    if (k === "ArrowDown" || k === "KeyS") { keys.down = true; ev.preventDefault(); }
    if (k === "Space") {
      ev.preventDefault();
      if (!ev.repeat && !aim.on && S.phase === "ready") { audioInit(); aim.key = true; aim.on = true; aim.p = 0; aim.ang = S.ang; }
    }
  });
  addEventListener("keyup", (ev) => {
    const k = ev.code;
    if (k === "ArrowUp" || k === "KeyW") keys.up = false;
    if (k === "ArrowDown" || k === "KeyS") keys.down = false;
    if (k === "Space" && aim.key) {
      const p = aim.p, ang = aim.ang; cancelAim();
      if (state === "play" && !paused) SIM.fire(S, ang, p);
    }
  });

  // ---------- 画面の流れ ----------
  function showOnly(id) {
    ["title", "pause", "result"].forEach((n) => ($(n).hidden = n !== id));
  }
  function start() {
    audioInit();
    S = SIM.create((Math.random() * 2147483646) | 0, ringR());
    for (const k in ringLook) delete ringLook[k];
    soots = [0, 1, 2].map((i) => ({ x: [70, 190, 352][i] + Math.random() * 20, y: [190, 140, 250][i] + Math.random() * 30, r: 9 + Math.random() * 6, k: 7 + i * 131 }));
    tears = []; fx = []; signs = []; overAt = 0; netSag = 0; netSagV = 0;
    buildBG();
    state = "play"; paused = false; cancelAim();
    showOnly(null); $("tools").hidden = false;
    cv.focus && cv.focus();
  }
  function endGame() {
    overAt = 0; state = "result"; cancelAim();
    let isNew = false;
    if (S.score > best) { best = S.score; isNew = S.score > 0; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }
    $("rScore").textContent = S.score.toLocaleString("ja-JP");
    $("rShots").textContent = `${S.shots}人`;
    $("rCenter").textContent = `${S.centers}回`;
    $("rStreak").textContent = S.bestStreak >= 2 ? `${S.bestStreak}連続` : "なし";
    $("rSoot").textContent = `${soots.length}つ`;
    $("rTime").textContent = `${Math.round(S.t)}秒`;
    $("rBest").textContent = best.toLocaleString("ja-JP");
    $("rNew").hidden = !isNew;
    // その日の天幕を煤の跡ごと刷る
    const rc = $("rTent"), rg = rc.getContext("2d");
    const keep = { W, H, ox, oy, s, dpr, side, bg };
    try {
      dpr = 2; s = 320 / K.W; W = 320; H = K.H * s; ox = 0; oy = 0; side = false;
      sootInk = true; buildBG();
      rc.width = 640; rc.height = Math.round(300 * s * 2);
      // 帆布の明るい面が白く飛ばないよう、少し締めて刷る
      try { rg.filter = "contrast(1.2) brightness(0.93)"; } catch (e) {}
      rg.drawImage(bg, 0, 40 * s * 2, 640, rc.height, 0, 0, rc.width, rc.height);
      try { rg.filter = "none"; } catch (e) {}
    } catch (e) {}
    sootInk = false;
    ({ W, H, ox, oy, s, dpr, side, bg } = keep);
    overAt = now;
    showOnly("result");
    $("tools").hidden = true;
    setTimeout(() => { try { $("bAgain").focus({ preventScroll: true }); } catch (e) {} }, 50);
  }
  function togglePause() {
    if (state !== "play") return;
    paused = !paused; cancelAim();
    $("pause").hidden = !paused;
    $("bPause").textContent = paused ? "続ける" : "一時停止";
  }
  function toggleMute() {
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : 0.8;
    $("bMute").textContent = muted ? "音を出す" : "音を消す";
    try { localStorage.setItem("circus_cannon_mute", muted ? "1" : "0"); } catch (e) {}
  }
  $("bStart").addEventListener("click", start);
  $("bAgain").addEventListener("click", start);
  $("bResume").addEventListener("click", togglePause);
  $("bPause").addEventListener("click", (e) => { e.stopPropagation(); togglePause(); });
  $("bMute").addEventListener("click", (e) => { e.stopPropagation(); audioInit(); toggleMute(); });
  $("bMute").textContent = muted ? "音を出す" : "音を消す";
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play" && !paused) togglePause(); });
  addEventListener("resize", layout);
  $("bestT").textContent = best > 0 ? `これまでの最高 ${best.toLocaleString("ja-JP")}` : "";

  buildTextures();
  S = SIM.create(20261006, 28);
  soots = [{ x: 74, y: 196, r: 12, k: 7 }, { x: 196, y: 146, r: 10, k: 138 }, { x: 356, y: 262, r: 13, k: 269 }];
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (bg) buildBG(); });
  requestAnimationFrame((t) => { lastT = t; frame(t); });
  window.__cc = { SIM, get S() { return S; }, get state() { return state; }, start };
})();
</script>
</body>
</html>
