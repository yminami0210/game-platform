<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ぬるい夜</title>
<style>
:root{--ink:#ebe5d3;--dim:#a19d8c;--warn:#e8a33a;--bad:#e2553f;--ok:#82c6a2;--bg:#0c1220;
  --st:clamp(104px,15vmin,150px);--btn:clamp(66px,11vmin,92px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--stp:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;touch-action:none}
canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:calc(var(--stp) + 6px);left:calc(var(--sl) + 8px);right:calc(var(--sr) + 8px);display:flex;justify-content:space-between;align-items:flex-start;gap:6px;font-size:12px}
.box{background:rgba(8,12,20,.58);border:1px solid rgba(235,229,211,.16);border-radius:6px;padding:5px 8px;line-height:1.45;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:6px;white-space:nowrap}
.bar{width:clamp(56px,14vw,104px);height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok)}
#clock{font-size:15px;font-weight:600}
#people{text-align:right}
#people .p{display:flex;justify-content:flex-end;gap:6px;align-items:center;white-space:nowrap}
#people .e{letter-spacing:1px;font-size:12px}
#att{width:clamp(64px,10vmin,92px);height:auto}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px calc(var(--sr) + 20px) 24px calc(var(--sl) + 20px);background:rgba(8,12,20,.72);pointer-events:auto;font-size:14px}
#msg h1{font-size:clamp(30px,8vmin,46px);margin:0 0 4px;letter-spacing:.14em;font-weight:600}
#msg p{margin:3px 0;color:var(--dim);line-height:1.7;max-width:34em}
#msg .q{color:var(--ink);margin-top:10px}
#msg .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
#msg button{font:inherit;font-size:16px;padding:11px 22px;min-height:48px;border-radius:26px;border:1px solid var(--ink);background:transparent;color:var(--ink)}
#msg button small{display:block;font-size:11px;color:var(--dim)}
.btn{position:absolute;pointer-events:auto;width:var(--btn);height:var(--btn);border-radius:50%;border:2px solid rgba(235,229,211,.55);background:rgba(8,12,20,.42);color:var(--ink);font-size:15px;display:flex;align-items:center;justify-content:center;touch-action:none}
.btn.on{background:rgba(226,85,63,.5)}
.btn.ready{border-color:var(--warn);box-shadow:0 0 0 4px rgba(232,163,58,.25)}
#suck{right:calc(var(--sr) + var(--st) + 30px);bottom:calc(var(--sb) + 18px)}
#glide{left:calc(var(--sl) + var(--st) + 30px);bottom:calc(var(--sb) + 18px);width:calc(var(--btn)*.8);height:calc(var(--btn)*.8);font-size:13px}
#pause{right:calc(var(--sr) + 8px);top:calc(var(--stp) + 50%);transform:translateY(-50%);width:44px;height:44px;font-size:13px}
.stick{position:absolute;bottom:calc(var(--sb) + 14px);width:var(--st);height:var(--st);border-radius:50%;border:2px solid rgba(235,229,211,.22);background:rgba(8,12,20,.22)}
.stick i{position:absolute;left:50%;top:50%;width:42%;height:42%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(235,229,211,.38)}
.stick b{position:absolute;left:0;right:0;bottom:calc(100% + 2px);text-align:center;font-size:10px;font-weight:400;color:var(--dim)}
#stL{left:calc(var(--sl) + 14px)} #stR{right:calc(var(--sr) + 14px)}
#toast{position:absolute;left:50%;top:calc(var(--stp) + 30%);transform:translateX(-50%);font-size:14px;background:rgba(8,12,20,.6);padding:6px 14px;border-radius:16px;opacity:0;transition:opacity .3s;max-width:min(90vw,30em);text-align:center;line-height:1.5}
#talk{position:absolute;left:50%;bottom:calc(var(--sb) + var(--st) + 34px);transform:translateX(-50%);font-size:14px;color:var(--ink);opacity:0;transition:opacity .5s;white-space:nowrap}
#rot{position:absolute;left:0;right:0;top:calc(var(--stp) + 96px);text-align:center;font-size:12px;color:var(--dim);display:none}
#flash{position:absolute;inset:0;background:var(--bad);opacity:0;pointer-events:none;transition:opacity .25s}
@media (orientation:portrait){ #rot{display:block} }
@media (pointer:fine){ .stick,#glide,#suck{opacity:.55} }
</style>
</head>
<body>
<div id="hud">
  <div class="top">
    <div class="box">
      <div class="row"><span id="clock">23:00</span><span id="where" style="color:var(--dim)"></span></div>
      <div class="row">高さ <span id="alt">0</span>　速さ <span id="spd">0</span></div>
      <div class="row">血　<div class="bar"><i id="blood"></i></div></div>
      <div class="row">体力 <div class="bar"><i id="hp"></i></div></div>
      <div class="row">羽音 <div class="bar"><i id="noise"></i></div></div>
    </div>
    <canvas id="att" width="120" height="120"></canvas>
    <div class="box" id="people"></div>
  </div>
  <div id="rot">横向きにすると遊びやすい</div>
  <div id="toast"></div>
  <div id="talk"></div>
  <div class="stick" id="stL"><b>上下・向き</b><i></i></div>
  <div class="stick" id="stR"><b>前後・横</b><i></i></div>
  <div id="glide" class="btn">滑空</div>
  <div id="suck" class="btn">吸う</div>
  <div id="pause" class="btn" aria-label="一時停止">II</div>
  <div id="flash"></div>
  <div id="msg"></div>
</div>

const fwd = V(), right = V(), tmp = V(), tmp2 = V();
function step(dt){
  if(!G || G.state!=='play') return;
  G.t += dt;
  const clamp = v=>Math.max(-1, Math.min(1, v));
  const ly = clamp(sticks.L.y + axis('KeyW','KeyS')), lx = clamp(sticks.L.x + axis('KeyD','KeyA'));
  const ry = clamp(sticks.R.y + axis('ArrowUp','ArrowDown')), rx = clamp(sticks.R.x + axis('ArrowRight','ArrowLeft'));
  const suck = btnSuck || key.Space, glide = btnGlide || key.ShiftLeft || key.ShiftRight;
  const heavy = 1 - 0.35*G.blood;
  fwd.set(-Math.sin(G.yaw),0,-Math.cos(G.yaw)); right.set(Math.cos(G.yaw),0,-Math.sin(G.yaw));

  // 扇風機の風
  G.wind.set(0,0,0);
  for(const fan of fans){ if(!fan.on) continue;
    fan.phi = fan.base + Math.sin(G.t*.45 + fan.x*.01)*fan.swing;
    const d = V(Math.sin(fan.phi), 0, Math.cos(fan.phi));
    const windAt = (p, out)=>{ const rel = tmp.set(p.x-fan.x, p.y-fan.y, p.z-fan.z); const along = rel.dot(d);
      if(along<=0 || along>fan.reach) return out; const lat = rel.addScaledVector(d, -along).length(), spread = 16+along*(fan.vent?.18:.32);
      if(lat<spread) out.addScaledVector(d, fan.power*(1-along/fan.reach)*(1-lat/spread)); return out; };
    windAt(G.pos, G.wind);
    for(const s of sp) if(s.life>0){ const w = windAt(s.p, V()); s.v.addScaledVector(w, dt*.6); }   // 煙も流す
  }
  // 蚊取り線香の煙
  const lit = coils.filter(c=>c.lit);
  if(lit.length){
    G.smokeT -= dt; if(G.smokeT<=0){ G.smokeT = .12/lit.length; const c = lit[Math.floor(Math.random()*lit.length)]; const s = sp.find(q=>q.life<=0); if(s){ s.life = 9; s.p.set(c.x, 4, c.z); s.v.set(rnd(-1.5,1.5), rnd(6,9), rnd(-1.5,1.5)); } }
  }
  let inSmoke = 0;
  for(const s of sp){ if(s.life<=0) continue; s.life -= dt; s.v.multiplyScalar(1 - .25*dt); s.v.y = Math.max(s.v.y, 3);
    s.p.addScaledVector(s.v, dt); if(s.life<=0 || s.p.y>S.room.h) { s.life=0; s.p.set(0,-999,0); continue; }
    const d = s.p.distanceTo(G.pos); if(d < 13) inSmoke += (1 - d/13); }
  G.hp = Math.min(1, Math.max(0, G.hp - inSmoke*.08*dt + .025*dt));
  if(inSmoke>.3 && !G.smokeWarned){ G.smokeWarned = true; toast('煙の中は体力が減る'); }

  let noise = 0;
  if(G.landed){
    const sk = G.landed;
    // 腕がかゆくて動いたら振り落とされる
    if(sk.onArm && sk.person.alert >= 2.4){ G.landed=null; G.noLand=.6; G.vel.set(rnd(-30,30), 40, rnd(-30,30)); buzz(30); toast('腕が動いた'); }
    else if(Math.abs(ly)+Math.abs(ry)+Math.abs(rx) > 0.3){ // 飛び立つ：倒した向きにはじく
      G.landed=null; G.noLand=0.6;
      G.vel.copy(fwd).multiplyScalar(ry*60).addScaledVector(right, rx*60); G.vel.y = 25 + Math.max(0,ly)*40; }
    else if(suck){
      G.blood = Math.min(1, G.blood + sk.rate*dt);
      G.bitten.set(sk.person, sk.name);
      sk.person.alert += sk.risk*dt*(0.6 + G.blood);
    }
  }
  if(!G.landed){
    G.yaw -= lx*YAW_RATE*dt;
    const target = tmp.copy(fwd).multiplyScalar(ry*MAX_SPD*heavy).addScaledVector(right, rx*MAX_SPD*0.7*heavy);
    target.y = ly*MAX_UP*heavy - G.blood*12;
    if(glide){ G.vel.y -= 60*dt; G.vel.x *= 1-0.4*dt; G.vel.z *= 1-0.4*dt; }
    else G.vel.lerp(target, 1 - Math.exp(-4.5*heavy*dt));
    G.vel.addScaledVector(G.wind, dt*1.8);
    const prev = tmp2.copy(G.pos);
    G.pos.addScaledVector(G.vel, dt);
    for(const k of kayas) kayaBlock(k, prev, G.pos, G.vel);
    const R = S.room, m=2;
    G.pos.x = Math.max(-R.w/2+m, Math.min(R.w/2-m, G.pos.x));
    G.pos.y = Math.max(1.5, Math.min(R.h-m, G.pos.y));
    G.pos.z = Math.max(-R.d/2+m, Math.min(R.d/2-m, G.pos.z));
    if(G.pos.y<=1.5 && G.vel.y<0) G.vel.y=0;
    const spd = G.vel.length();
    noise = glide ? 0 : 0.25 + 0.75*Math.min(1, spd/MAX_SPD);
    G.noLand = (G.noLand||0) - dt;
    G.nearSkin = null;
    if(G.noLand <= 0) for(const s of skins){
      const d = tmp.copy(s.pos).sub(G.pos);
      if(d.length() < s.r*2.2) G.nearSkin = s;
      if(d.length() < s.r && Math.abs(d.y) < 4){
        if(spd < LAND_SPD){ G.landed = s; G.vel.set(0,0,0); G.pos.set(G.pos.x, s.pos.y+1, G.pos.z); G.bites++; buzz(12); AU?.land(); FX?.burst('land', G.pos); }
        else { G.vel.multiplyScalar(-0.6); s.person.alert += 0.6; G.noLand = 0.4; buzz(20); AU?.bounce(); FX?.burst('bounce', G.pos); toast('速すぎて跳ねた。ゆっくり降りる'); }
        break;
      }
    }
    if(G.pos.z > WIN.z-4 && Math.abs(G.pos.x-WIN.x) < WIN.w/2 && Math.abs(G.pos.y-WIN.y) < WIN.h/2 && G.t > 3){
      AU?.clear(); FX?.burst('clear', G.pos);
      return end(G.blood>0.02 ? 'clear' : 'empty');
    }
  }
  G.noise = 0;
  // 人ごとの警戒：耳もとの羽音・時間で少しずつ落ち着く
  for(const p of people){
    const dHead = G.pos.distanceTo(p.head);
    const near = Math.max(0, 1 - dHead/(70*p.o.hear));
    p.alert += noise*near*near*1.4*p.o.hear*dt;
    p.alert = Math.max(p.o.awake ? 1.5 : 0, p.alert - 0.12*dt);
    if(p.o.noBite && p.alert >= 3) for(const q of people) if(q!==p) q.alert += .5*dt;   // 赤ちゃんがぐずると親が起きる
    G.noise = Math.max(G.noise, noise*(0.4+0.6*near));
    // 寝言
    p.talkT -= dt;
    if(p.talkT <= 0){ p.talkT = rnd(14, 26); const st = TEXT.stages.find(s=>s.id===S.id); const pt = st && st.people && st.people.find(q=>q.role===p.o.key);
      if(p.alert < 2 && pt && pt.sleeptalk && pt.sleeptalk.length){ talk(`${p.o.label}「${pick(pt.sleeptalk)}」`); AU?.sleepTalk(); } }
  }
  // 叩く（警戒4の人がいれば）
  G.cooldown -= dt;
  if(!G.swat && G.cooldown <= 0){ const p = people.find(q=>q.alert>=4 && !q.o.noBite); if(p){ G.swat = {t:0, at:G.pos.clone(), p, delay:p.o.swatDelay, r:p.o.swatR||SWAT_R}; buzz([40,40,40]); AU?.swatWarn(); } }
  if(G.swat){
    G.swat.t += dt;
    if(G.swat.t >= G.swat.delay){
      const flat = Math.hypot(G.pos.x-G.swat.at.x, G.pos.z-G.swat.at.z);
      if(flat < G.swat.r && Math.abs(G.pos.y-G.swat.at.y) < 30){ buzz(200); AU?.slap(); FX?.burst('slap', G.pos); return end('out'); }
      AU?.miss(); FX?.burst('miss', G.swat.at);
      G.swat.p.alert = 2.6; G.swat = null; G.cooldown = 2.5;
    }
  }
  if(G.hp <= 0) return end('smoke');
  if(G.t >= NIGHT_SEC) end('dawn');
  // 練習面の案内
  if(S.id===1){
    if(G.tut===0 && G.t>4.5){ G.tut=1; toast('左の指を上で上昇、右の指を上で前進'); }
    else if(G.tut===1 && G.nearSkin){ G.tut=2; toast('オレンジの輪へゆっくり降りる'); }
    else if(G.tut===2 && G.landed){ G.tut=3; toast('「吸う」を長押し。目が赤くなる前に離れる'); }
    else if(G.tut===3 && G.blood>.3 && !G.landed){ G.tut=4; toast('光っている窓から出ればクリア'); }
  }
}

function inKaya(k, p){ return p.x>k.x0 && p.x<k.x1 && p.z>k.z0 && p.z<k.z1 && p.y<k.h; }
function kayaBlock(k, a, b, vel){
  const ia = inKaya(k, a), ib = inKaya(k, b); if(ia===ib) return;
  const o = ia ? b : a;   // 外側の点から、どの面を通ったか
  let side = null, along = 0;
  if(o.y >= k.h) side = 'top';
  else if(o.z <= k.z0){ side='n'; along = b.x - (k.x0+k.x1)/2; }
  else if(o.z >= k.z1){ side='s'; along = b.x - (k.x0+k.x1)/2; }
  else if(o.x <= k.x0){ side='w'; along = b.z - (k.z0+k.z1)/2; }
  else if(o.x >= k.x1){ side='e'; along = b.z - (k.z0+k.z1)/2; }
  const ok = k.gaps.some(g=>g.side===side && Math.abs(along-g.at) < g.width/2 && b.y>g.y0 && b.y<g.y1);
  if(ok) return;
  b.copy(a); vel.multiplyScalar(-.3);
  if(!G.kayaWarned){ G.kayaWarned = true; toast('蚊帳。赤い輪のすき間からしか入れない'); }
}
function end(kind){
  G.state = 'end'; const mg = Math.round(G.blood*5*100)/100;
  const R = TEXT.results || {};
  let morning = '';
  if(kind==='clear'){
    const st = TEXT.stages.find(s=>s.id===S.id);
    morning = [...G.bitten].map(([p, place])=>{ const pt = st && st.people && st.people.find(q=>q.role===p.o.key);
      const line = pt && pt.itch && pt.itch.length ? pick(pt.itch).replaceAll('{place}', place) : `なんか${place}がかゆい`; return `${p.o.label}「${line}」`; }).join('<br>');
    if(!best[S.id] || mg > best[S.id]){ best[S.id] = mg; saveBest(); }
  }
  const D = {
    clear:['ほどけた', `窓から出た。持ち帰った血 ${mg} mg（刺した回数 ${G.bites}）`, pick(R.clear), morning ? `次の朝<br>${morning}` : ''],
    empty:['素通り', '何も吸わずに出てしまった。', '', ''],
    out:['OUT', 'ぱちん。叩かれた。', pick(R.out), `吸った血は ${mg} mg だった。`],
    smoke:['OUT', '煙を吸いすぎて、畳に落ちた。', '', ''],
    dawn:['夜明け', '窓から出られないまま朝になった。', pick(R.dawn), ''],
  }[kind];
  if(kind==='out'){ ui('flash').style.opacity = .6; setTimeout(()=>ui('flash').style.opacity = 0, 160); }
  setTimeout(()=>show(`<h1>${D[0]}</h1><p>${D[1]}</p>${D[2]?`<p>${D[2]}</p>`:''}${D[3]?`<p class="q">${D[3]}</p>`:''}`,
    [['もうひと晩', ()=>reset(G.stage)], ...(G.stage+1<STAGES.length && kind==='clear' ? [['次の面', ()=>reset(G.stage+1)]] : []), ['面をえらぶ', title]]), kind==='out'?350:0);
}

// ============ 画面 ============
const att = ui('att').getContext('2d');
function drawAtt(roll, pitch){
  const c = att, R = 56; c.clearRect(0,0,120,120); c.save(); c.translate(60,60);
  c.beginPath(); c.arc(0,0,R,0,Math.PI*2); c.clip();
  c.rotate(roll); c.fillStyle='#2c4a78'; c.fillRect(-80,-80,160,80+pitch); c.fillStyle='#5a4630'; c.fillRect(-80,pitch,160,80);
  c.strokeStyle='#ebe5d3'; c.lineWidth=1; for(let i=-2;i<=2;i++){ if(!i) continue; c.beginPath(); c.moveTo(-12,pitch+i*12); c.lineTo(12,pitch+i*12); c.stroke(); }
  c.restore(); c.strokeStyle='#e8a33a'; c.lineWidth=3; c.beginPath(); c.moveTo(30,60); c.lineTo(50,60); c.moveTo(70,60); c.lineTo(90,60); c.stroke();
  c.strokeStyle='rgba(235,229,211,.5)'; c.lineWidth=2; c.beginPath(); c.arc(60,60,R,0,Math.PI*2); c.stroke();
}
const back = V(), want = V();
function render(now, dt){
  if(!G){ renderer.render(scene, cam); return; }
  const tt = now/1000;
  // 人：息・寝返り・かゆがる・起きる
  for(const p of people){
    const lv = alertLevel(p.alert), br = Math.sin(tt*1.6 + p.o.x)*.5+.5;
    updateKake(p, br);
    p.anim += ((lv>=1?1:0) - p.anim)*Math.min(1, dt*2);
    p.parts.head.rotation.y = Math.sin(tt*.7+p.o.x)*.03 + p.anim*.22*(p.o.arm);
    const lift = lv>=3 ? .35 : 0; p.parts.head.rotation.x += (-lift - p.parts.head.rotation.x)*Math.min(1, dt*3);
    const open = lv>=3 || p.o.awake; p.lids.forEach(l=>l.visible = !open); p.eyes.forEach(e=>e.visible = open);
    const sc = lv>=2 ? Math.sin(tt*14)*.08 + .1 : 0;   // かいている
    p.parts.arm.rotation.y += (sc*p.o.arm - p.parts.arm.rotation.y)*Math.min(1, dt*8);
    p.parts.arm.rotation.z += ((lv>=2? .12*p.o.arm : 0) - p.parts.arm.rotation.z)*Math.min(1, dt*4);
  }
  for(const fan of fans){ if(!fan.vent) fan.fan.rotation.y = fan.phi; if(fan.on) fan.blades.rotation.z -= dt*28; }
  for(const f of flickers){ const n = f.kind==='tv' ? .55 + .45*Math.abs(Math.sin(tt*7.3)*Math.sin(tt*2.1+1)) : 1; f.light.intensity = f.base*n; if(f.mat) f.mat.emissiveIntensity = 1.2*n; }
  const sa = smokeGeo.attributes.position; sp.forEach((s,i)=>sa.setXYZ(i, s.p.x, s.p.y, s.p.z)); sa.needsUpdate = true;
  // 蚊
  mos.position.copy(G.pos);
  const lv = tmp.copy(G.vel).applyAxisAngle(Y, -G.yaw);
  G.roll += ((-lv.x/MAX_SPD)*0.6 - G.roll)*0.15; G.pitch += ((lv.z/MAX_SPD)*0.4 - G.pitch)*0.15;
  mos.rotation.set(G.pitch, G.yaw, G.roll, 'YXZ');
  const flap = G.landed ? 0 : Math.sin(now*0.09)*0.7;
  wL.rotation.z = flap; wR.rotation.z = -flap;
  const bk = 0.35 + G.blood*1.05; belly.scale.set(bk, bk, 2.2*bk);
  // カメラ：後ろ上から。縦画面は少し引いて広く
  const portrait = innerWidth < innerHeight;
  back.set(Math.sin(G.yaw), 0, Math.cos(G.yaw));
  want.copy(G.pos).addScaledVector(back, portrait?18:14).add(tmp.set(0, portrait?7:5, 0));
  const R = S.room;
  want.x = Math.max(-R.w/2+3, Math.min(R.w/2-3, want.x)); want.z = Math.max(-R.d/2+3, Math.min(R.d/2-3, want.z));
  want.y = Math.max(2, Math.min(R.h-3, want.y));
  cam.position.lerp(want, 0.2); cam.lookAt(G.pos.x, G.pos.y+1, G.pos.z);
  // 影と手
  if(G.swat){
    const k = Math.min(1, G.swat.t/G.swat.delay);
    shadow.position.set(G.swat.at.x, Math.max(0.3, G.swat.at.y-12), G.swat.at.z);
    shadow.material.opacity = 0.25 + 0.45*k; shadow.scale.setScalar(G.swat.r/SWAT_R); racket.visible = G.swat.r > SWAT_R; swatHand.children.forEach(c=>c.visible = !racket.visible);
    swatHand.visible = true; swatHand.position.set(G.swat.at.x, G.swat.at.y + 70*(1-k*k) + 6, G.swat.at.z);
  } else { shadow.material.opacity = 0; swatHand.visible = false; }
  rings.forEach((m,i)=>{ const s = skins[i]; m.material.opacity = G.landed===s ? .9 : (G.nearSkin===s ? .75 : .4); });
  // 計器
  const mins = Math.floor(G.t/NIGHT_SEC*360); const hh = (23 + Math.floor(mins/60))%24, mm = mins%60;
  ui('clock').textContent = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  ui('where').textContent = G.landed ? `${G.landed.person.o.label}の${G.landed.name}` : S.short;
  ui('alt').textContent = Math.round(G.pos.y)+'cm';
  ui('spd').textContent = Math.round(G.vel.length())+'cm/s';
  ui('blood').style.width = (G.blood*100)+'%'; ui('blood').style.background = G.blood>.75 ? 'var(--bad)' : 'var(--ok)';
  ui('hp').style.width = (G.hp*100)+'%'; ui('hp').style.background = G.hp<.35 ? 'var(--bad)' : 'var(--ok)';
  ui('noise').style.width = (G.noise*100)+'%'; ui('noise').style.background = G.noise>.6 ? 'var(--warn)' : 'var(--ok)';
  let worst = 0;
  people.forEach((p,k)=>{ const l = alertLevel(p.alert); worst = Math.max(worst, l); const el = ui('e'+k); if(!el) return;
    el.textContent = '●'.repeat(l) + '○'.repeat(4-l); el.style.color = l>=3 ? 'var(--bad)' : l>=2 ? 'var(--warn)' : 'var(--ink)'; });
  ui('state').textContent = G.swat ? `${G.swat.p.o.label}が叩く` : STATE_TXT[worst];
  ui('suck').classList.toggle('ready', !!G.landed);
  drawAtt(-G.roll*1.5, G.vel.y*0.5);
  if(toastT>0){ toastT -= dt; if(toastT<=0) ui('toast').style.opacity = 0; }
  if(talkT>0){ talkT -= dt; if(talkT<=0) ui('talk').style.opacity = 0; }
  const playing = G.state==='play';
  let nearest = 0; for(const p of people) nearest = Math.max(nearest, 1 - Math.min(1, G.pos.distanceTo(p.head)/120));
  AU?.update({playing, speed01:Math.min(1, G.vel.length()/MAX_SPD), near01:nearest, landed:!!G.landed, sucking:!!(G.landed && (btnSuck||key.Space)),
    glide:btnGlide||!!key.ShiftLeft, fanOn:fans.some(f=>f.on), fanNear01: fans.reduce((m,f)=>Math.max(m, f.on ? 1 - Math.hypot(G.pos.x-f.x, G.pos.z-f.z)/250 : 0), 0),
    alertMax:worst, blood01:G.blood, hp01:G.hp});
  FX?.update(dt, {camera:cam, mosPos:G.pos, mosVel:G.vel, landed:!!G.landed, sucking:!!(G.landed && (btnSuck||key.Space)), blood01:G.blood,
    swat: G.swat ? {at:G.swat.at, k:Math.min(1, G.swat.t/G.swat.delay)} : null, alertMax:worst, time:tt});
  renderer.render(scene, cam);
}
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  step(dt); render(now, dt); requestAnimationFrame(loop);
}
// 扇風機と線香を build から受け取る
makeFan = (o)=>{ const f = _makeFan(o); fans.push(f); return f; };
makeCoil = (o)=>{ const c = _makeCoil(o); coils.push(c); return c; };
function onResize(){ renderer.setSize(innerWidth, innerHeight); cam.aspect=innerWidth/innerHeight; cam.fov = cam.aspect<1 ? 82 : 70; cam.updateProjectionMatrix(); }
addEventListener('resize', onResize); onResize();
reset(0); G.state = 'title'; title();
requestAnimationFrame(loop);
window.__G = ()=>G; window.__people = ()=>people; window.__reset = reset; window.__tick = (n=1)=>{ for(let i=0;i<n;i++) step(1/60); }; // 確認用
</script>
</body>
