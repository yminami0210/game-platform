<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ぬるい夜</title>
<style>
:root{--ink:#e9e4d4;--dim:#9a9a8c;--warn:#e8a33a;--bad:#e2553f;--ok:#7fc4a0;--bg:#0c1220}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:13px}
.box{background:rgba(8,12,20,.55);border:1px solid rgba(233,228,212,.18);border-radius:6px;padding:6px 9px;line-height:1.5;font-variant-numeric:tabular-nums}
.box b{font-weight:600}
.bar{width:110px;height:7px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;width:0;background:var(--ok)}
#eyes{font-size:15px;letter-spacing:2px}
#att{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 8px);transform:translateX(-50%)}
#msg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;font-size:15px;pointer-events:auto;max-width:min(92vw,520px)}
#msg h1{font-size:40px;margin:0 0 6px;letter-spacing:.12em;font-weight:600}
#msg p{margin:4px 0;color:var(--dim);line-height:1.7}
#msg button{margin-top:14px;font:inherit;font-size:17px;padding:10px 28px;border-radius:24px;border:1px solid var(--ink);background:transparent;color:var(--ink)}
.btn{position:absolute;pointer-events:auto;width:76px;height:76px;border-radius:50%;border:2px solid rgba(233,228,212,.5);background:rgba(8,12,20,.4);color:var(--ink);font-size:15px;display:flex;align-items:center;justify-content:center}
.btn.on{background:rgba(226,85,63,.45)}
#suck{right:calc(env(safe-area-inset-right) + 24px);bottom:170px}
#glide{left:calc(env(safe-area-inset-left) + 24px);bottom:170px;width:62px;height:62px;font-size:13px}
.stick{position:absolute;width:110px;height:110px;border-radius:50%;border:2px solid rgba(233,228,212,.25);display:none}
.stick i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(233,228,212,.35)}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 8px);left:0;right:0;text-align:center;font-size:12px;color:var(--dim)}
#ring{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none}
</style>
</head>
<body>
<div id="hud">
  <div class="top">
    <div class="box">
      <div><b id="clock">23:00</b></div>
      <div>高さ <span id="alt">0</span>cm　速さ <span id="spd">0</span>cm/s</div>
      <div>血 <div class="bar"><i id="blood"></i></div></div>
      <div>羽音 <div class="bar"><i id="noise"></i></div></div>
    </div>
    <canvas id="att" width="120" height="120"></canvas>
    <div class="box" style="text-align:right">
      <div>おじいさん</div>
      <div id="eyes">○○○○</div>
      <div id="state" style="color:var(--dim)">寝ている</div>
    </div>
  </div>
  <div id="glide" class="btn">滑空</div>
  <div id="suck" class="btn">吸う</div>
  <div class="stick" id="stL"><i></i></div>
  <div class="stick" id="stR"><i></i></div>
  <div id="hint">左：上昇下降・向き　右：前後・横　｜　キーボード：W/S 上下・A/D 向き・矢印 前後横・Space 吸う・Shift 滑空</div>
  <div id="msg"></div>
</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---- 数値（単位は cm・秒） ----
const ROOM = {w: 360, h: 240, d: 400};          // 6畳くらい
const NIGHT_SEC = 240;                          // 23:00→5:00
const MAX_SPD = 90, MAX_UP = 55, YAW_RATE = 2.2;
const LAND_SPD = 28;                            // これより速いと着陸できない
const SWAT_DELAY = 0.6, SWAT_R = 15;
const SKIN = [ // 刺せる場所：量と危険
  {name:'足首', pos:[ 17, 17, 92], r:8,  rate:0.06, risk:0.35},
  {name:'腕',   pos:[-35, 17, -6], r:10, rate:0.09, risk:0.6},
  {name:'首',   pos:[  0, 21, -59], r:7,  rate:0.14, risk:1.3},
];
const HEAD = new THREE.Vector3(0, 22, -78);

// ---- 描画 ----
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c1220);
scene.fog = new THREE.Fog(0x0c1220, 120, 620);
const cam = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.5, 2000);

renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
scene.add(new THREE.HemisphereLight(0x46587e, 0x1a1410, 0.55));
const moon = new THREE.DirectionalLight(0x9fb4e0, 0.9); moon.position.set(-120, 260, 420); moon.target.position.set(-60, 0, 0);
moon.castShadow = true; moon.shadow.mapSize.set(1024, 1024); Object.assign(moon.shadow.camera, {left:-220,right:220,top:220,bottom:-220,near:50,far:900}); scene.add(moon, moon.target);
const lamp = new THREE.PointLight(0xffa850, 2.2, 420, 1.1); lamp.position.set(140, 38, -150); lamp.castShadow = true; lamp.shadow.mapSize.set(512, 512); scene.add(lamp);

// ---- 手描きの質感（canvas テクスチャ） ----
const rnd = (a=0,b=1)=>a+Math.random()*(b-a);
function tex(w, h, draw, rx=1, ry=1){const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'), w, h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry); t.anisotropy=4; return t;}
const tatamiTex = tex(256, 512, (g,w,h)=>{g.fillStyle='#8d8a5a'; g.fillRect(0,0,w,h);
  for(let x=0;x<w;x+=2){g.fillStyle=`rgba(${rnd(90,140)|0},${rnd(100,130)|0},${rnd(50,70)|0},.55)`; g.fillRect(x,0,1.4,h);}
  for(let y=0;y<h;y+=6){g.fillStyle='rgba(40,35,15,.12)'; g.fillRect(0,y,w,1);}
  g.fillStyle='#1f1c14'; g.fillRect(0,0,14,h); g.fillRect(w-14,0,14,h);   // へり
  g.fillStyle='rgba(180,160,90,.25)'; for(let y=0;y<h;y+=10){g.fillRect(3,y,8,4); g.fillRect(w-11,y,8,4);}});
const woodTex = (base, dark) => tex(256, 256, (g,w,h)=>{g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){g.strokeStyle=`rgba(${dark},${rnd(.08,.3)})`; g.lineWidth=rnd(.5,2.5); g.beginPath(); let y=rnd(0,h); g.moveTo(0,y);
    for(let x=0;x<=w;x+=16){y+=rnd(-2,2); g.lineTo(x,y);} g.stroke();}});
const plasterTex = tex(256, 256, (g,w,h)=>{g.fillStyle='#8a7f68'; g.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){g.fillStyle=`rgba(${Math.random()<.5?'255,240,210':'40,30,20'},${rnd(.03,.12)})`; g.fillRect(rnd(0,w),rnd(0,h),rnd(1,3),rnd(1,3));}}, 3, 2);
const sheetTex = tex(128, 128, (g,w,h)=>{g.fillStyle='#e9e3d4'; g.fillRect(0,0,w,h); for(let i=0;i<1500;i++){g.fillStyle=`rgba(120,110,90,${rnd(0,.06)})`; g.fillRect(rnd(0,w),rnd(0,h),2,2);}}, 4, 4);
const kakeTex = tex(256, 256, (g,w,h)=>{g.fillStyle='#2f4a6e'; g.fillRect(0,0,w,h);           // 夏がけ：紺に白の絣
  g.fillStyle='rgba(230,230,220,.75)'; for(let y=8;y<h;y+=32) for(let x=(y/32%2)*16+8;x<w;x+=32){g.fillRect(x-5,y-1,10,2); g.fillRect(x-1,y-5,2,10);}}, 3, 3);
const yukataTex = tex(128, 128, (g,w,h)=>{g.fillStyle='#d8dde0'; g.fillRect(0,0,w,h); g.fillStyle='#3d5470'; for(let x=0;x<w;x+=16) g.fillRect(x,0,3,h);}, 2, 2);
const screenTex = tex(64, 64, (g,w,h)=>{g.strokeStyle='rgba(40,40,40,.9)'; g.lineWidth=1; for(let i=0;i<w;i+=4){g.beginPath(); g.moveTo(i,0); g.lineTo(i,h); g.moveTo(0,i); g.lineTo(w,i); g.stroke();}}, 6, 4);

const std = (o)=>new THREE.MeshStandardMaterial(Object.assign({roughness:.85, metalness:0}, o));
const mat = c => std({color:c});
function add(m, x, y, z, parent=scene){m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;}
function box(w,h,d,c,x,y,z,parent){return add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d), c.isMaterial?c:mat(c)), x,y,z,parent);}
function rbox(w,h,d,r,m,x,y,z,parent){return add(new THREE.Mesh(new RoundedBoxGeometry(w,h,d,4,r), m), x,y,z,parent);}

// ---- 部屋（6畳の和室） ----
const pillarMat = std({map:woodTex('#6a4a2c','40,25,10'), roughness:.7});
const ceilTex = woodTex('#7a6040','50,35,15'); ceilTex.repeat.set(1, 6);
const wallMat = std({map:plasterTex, roughness:.95});
const room = new THREE.Mesh(new THREE.BoxGeometry(ROOM.w, ROOM.h, ROOM.d), [wallMat, wallMat, std({map:ceilTex}), std({color:0x222}), wallMat, wallMat]);
room.material.forEach(m=>m.side=THREE.BackSide); room.position.y = ROOM.h/2; room.receiveShadow = true; scene.add(room);
// 畳6枚（90×180）
const tatamiMat = std({map:tatamiTex, roughness:.9});
[[-135,-110,1],[-45,-110,1],[45,-110,1],[135,-110,1],[-90,90,0],[90,90,0]].forEach(([x,z,rot])=>{
  const t = add(new THREE.Mesh(new THREE.PlaneGeometry(90, 180), tatamiMat), x, 0.05, z); t.rotation.set(-Math.PI/2, 0, rot?0:Math.PI/2);});
// 柱・長押・畳寄せ
for(const [x,z] of [[-1,-1],[1,-1],[-1,1],[1,1]]) box(11, ROOM.h, 11, pillarMat, x*(ROOM.w/2-5.5), ROOM.h/2, z*(ROOM.d/2-5.5));
for(const s of [-1,1]){ box(ROOM.w, 9, 4, pillarMat, 0, 180, s*(ROOM.d/2-2)); box(4, 9, ROOM.d, pillarMat, s*(ROOM.w/2-2), 180, 0);
  box(ROOM.w, 4, 2, pillarMat, 0, 2, s*(ROOM.d/2-1)); box(2, 4, ROOM.d, pillarMat, s*(ROOM.w/2-1), 2, 0);}
// 吊り下げの電灯（消えている）とひも
const pend = add(new THREE.Mesh(new THREE.CylinderGeometry(26, 30, 10, 32), std({color:0xd8d2c0, roughness:.6})), 0, ROOM.h-26, -20);
add(new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,20,6), std({color:0x333})), 0, ROOM.h-10, -20);
add(new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,70,4), std({color:0xcfc8b0})), 8, ROOM.h-66, -20);
add(new THREE.Mesh(new THREE.SphereGeometry(1.4,8,6), std({color:0xb04030})), 8, ROOM.h-102, -20);

// ---- 布団 ----
const sheetMat = std({map:sheetTex});
rbox(104, 9, 212, 4, sheetMat, 0, 4.5, 8);                                  // 敷布団
const pillow = rbox(46, 11, 28, 5, std({color:0xf0ebe0, roughness:.9}), 0, 13.5, -92);   // そばがら枕
// 夏がけ：体の形に沿わせた布
function bodyH(x, z){ // 布の下にある体の高さ
  const e = (dx,dz,rx,rz,h)=>{const q=(dx/rx)**2+(dz/rz)**2; return q<1 ? h*Math.sqrt(1-q) : 0;};
  return Math.max(e(x, z+18, 26, 34, 15), e(x-12, z-48, 9, 42, 8), e(x+10, z-46, 9, 44, 8), e(x+10, z-92, 6, 8, 12));
}
const KX0=-28, KX1=58, KZ0=-46, KZ1=88;
const kg = new THREE.PlaneGeometry(KX1-KX0, KZ1-KZ0, 70, 90); kg.rotateX(-Math.PI/2);
const kp = kg.attributes.position;
for(let i=0;i<kp.count;i++){ const x=kp.getX(i)+(KX0+KX1)/2, z=kp.getZ(i)+(KZ0+KZ1)/2;
  let y = 10 + bodyH(x, z) + Math.sin(x*.21+z*.13)*.5;
  if(x > 52) y = Math.max(1, 10 - (x-52)*1.6);  // 布団の外へ垂れる
  kp.setXYZ(i, x, y, z);}
kg.computeVertexNormals();
const kake = add(new THREE.Mesh(kg, std({map:kakeTex, side:THREE.DoubleSide})), 0, 0, 0);

// ---- 寝ているおじいさん（仰向け、頭は北） ----
const skinMat = std({color:0xc89478, roughness:.65});
const hairMat = std({color:0xb8b4ac, roughness:1});
const person = new THREE.Group(); scene.add(person);
const head = add(new THREE.Mesh(new THREE.SphereGeometry(11, 32, 24), skinMat), HEAD.x, HEAD.y-2, HEAD.z, person); head.scale.set(.92, 1, 1.12);
const hair = add(new THREE.Mesh(new THREE.SphereGeometry(11.4, 32, 16, 0, Math.PI*2, 0, Math.PI*.58), hairMat), HEAD.x, HEAD.y-2.4, HEAD.z, person);
hair.rotation.x = -Math.PI/2; hair.scale.set(.93, 1.12, 1.05);
add(new THREE.Mesh(new THREE.ConeGeometry(1.8, 4.5, 10), skinMat), 0, HEAD.y+8.6, HEAD.z+1.5, person);        // 鼻（上向き）
for(const s of [-1,1]){
  add(new THREE.Mesh(new THREE.SphereGeometry(2.4, 12, 8), skinMat), s*10.2, HEAD.y-2, HEAD.z-1, person).scale.set(.5,1.2,1); // 耳
  const brow = add(new THREE.Mesh(new THREE.CapsuleGeometry(.7, 3, 4, 6), hairMat), s*4, HEAD.y+8.4, HEAD.z+5.5, person); brow.rotation.z = Math.PI/2;
  const lid = add(new THREE.Mesh(new THREE.CapsuleGeometry(.35, 2.6, 4, 6), std({color:0x6a4a3a})), s*4, HEAD.y+8.6, HEAD.z+3.6, person); lid.rotation.z = Math.PI/2;
}
add(new THREE.Mesh(new THREE.CapsuleGeometry(.5, 3.5, 4, 6), std({color:0x8a5a4a})), 0, HEAD.y+6.8, HEAD.z+8.4, person).rotation.z = Math.PI/2; // 口
const neck = add(new THREE.Mesh(new THREE.CylinderGeometry(5.5, 6, 16, 16), skinMat), 0, 15.5, -59, person); neck.rotation.x = Math.PI/2;
const yukata = std({map:yukataTex, roughness:.9});
const collar = add(new THREE.Mesh(new THREE.TorusGeometry(8, 2.2, 8, 20, Math.PI), yukata), 0, 15, -50, person); collar.rotation.set(-Math.PI/2, 0, Math.PI);
// 布団から出た左腕（ゆかたの袖から先）
const sleeve = add(new THREE.Mesh(new THREE.CylinderGeometry(7, 8, 26, 14), yukata), -33, 13, -36, person); sleeve.rotation.x = Math.PI/2;
const fore = add(new THREE.Mesh(new THREE.CapsuleGeometry(4.2, 34, 6, 14), skinMat), -35, 12, -6, person); fore.rotation.set(Math.PI/2, 0, .05); fore.scale.set(1, 1, .85);
const palm = add(new THREE.Mesh(new RoundedBoxGeometry(8, 3, 10, 3, 1.4), skinMat), -36, 10.6, 17, person);
for(let i=0;i<4;i++){const f=add(new THREE.Mesh(new THREE.CapsuleGeometry(.9, 5, 4, 6), skinMat), -38.6+i*1.8, 10, 24.5, person); f.rotation.set(Math.PI/2+.25,0,0);}
add(new THREE.Mesh(new THREE.CapsuleGeometry(1, 3.5, 4, 6), skinMat), -32, 10.6, 19, person).rotation.set(Math.PI/2, 0, -.8);
// はみ出た右足首
const shin = add(new THREE.Mesh(new THREE.CapsuleGeometry(4.6, 14, 6, 12), skinMat), 18, 12.5, 90, person); shin.rotation.x = Math.PI/2;
const foot = add(new THREE.Mesh(new RoundedBoxGeometry(8.5, 5.5, 21, 3, 2.4), skinMat), 18, 17, 103, person); foot.rotation.x = .95; // 足先は斜め上を向く
for(let i=0;i<5;i++) add(new THREE.Mesh(new THREE.SphereGeometry(i?1:1.4, 8, 6), skinMat), 14.6+i*1.75, 25.5-i*.4, 109, person);
add(new THREE.Mesh(new THREE.SphereGeometry(2.6, 10, 8), skinMat), 14.5, 13, 99, person); // くるぶし
const skinDots = SKIN.map(s=>{const m=new THREE.Mesh(new THREE.RingGeometry(s.r-1.2, s.r, 24), new THREE.MeshBasicMaterial({color:0xe8a33a,transparent:true,opacity:.45,side:THREE.DoubleSide,depthTest:false})); m.rotation.x=-Math.PI/2; m.position.set(s.pos[0], s.pos[1]+0.3, s.pos[2]); m.renderOrder=5; scene.add(m); return m;});

// ---- 家具 ----
// 桐のたんす
const kiri = std({map:woodTex('#a07a52','60,40,20'), roughness:.75});
const tansu = new THREE.Group(); tansu.position.set(140, 0, -175); scene.add(tansu);
box(70, 90, 42, kiri, 0, 45, 0, tansu);
for(let r=0;r<4;r++){ box(64, 18, 1, kiri, 0, 12+r*21, 21.2, tansu);
  for(const s of [-1,1]){ const h=add(new THREE.Mesh(new THREE.TorusGeometry(2.6, .5, 6, 14, Math.PI), std({color:0x2a2a28, metalness:.8, roughness:.4})), s*18, 12+r*21, 22.2, tansu); h.rotation.z = Math.PI;}}
// 行灯（いちばん小さい明かり）
const andon = new THREE.Group(); andon.position.copy(lamp.position).setY(0); scene.add(andon);
const paper = std({color:0xfff0d0, emissive:0xffa040, emissiveIntensity:1.6, roughness:1, transparent:true, opacity:.92});
add(new THREE.Mesh(new THREE.BoxGeometry(20, 36, 20), paper), 0, 30, 0, andon).castShadow = false;
for(const [x,z] of [[-1,-1],[1,-1],[-1,1],[1,1]]) box(1.6, 50, 1.6, pillarMat, x*10.5, 25, z*10.5, andon);
for(const y of [12, 48]){ box(23, 1.6, 1.6, pillarMat, 0, y, 10.5, andon); box(23, 1.6, 1.6, pillarMat, 0, y, -10.5, andon); box(1.6,1.6,23,pillarMat, 10.5,y,0,andon); box(1.6,1.6,23,pillarMat,-10.5,y,0,andon);}
lamp.position.y = 30;
// 扇風機（今は止まっている）
const fan = new THREE.Group(); fan.position.set(-140, 0, -150); fan.rotation.y = .7; scene.add(fan);
const fanW = std({color:0xe8e6df, roughness:.5}), fanG = std({color:0x9aa, metalness:.7, roughness:.35, wireframe:true});
add(new THREE.Mesh(new THREE.CylinderGeometry(15, 17, 5, 24), fanW), 0, 2.5, 0, fan);
add(new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 70, 10), std({color:0xbbb, metalness:.8, roughness:.3})), 0, 38, 0, fan);
add(new THREE.Mesh(new THREE.SphereGeometry(7, 16, 12), fanW), 0, 76, -6, fan).scale.set(1,1,1.4);
add(new THREE.Mesh(new THREE.SphereGeometry(19, 20, 10, 0, Math.PI*2, 0, Math.PI*.35), fanG), 0, 76, -2, fan).rotation.x = Math.PI/2;
for(let i=0;i<3;i++){ const b=add(new THREE.Mesh(new THREE.CircleGeometry(8, 12, 0, 1.2), std({color:0x8fc0d8, transparent:true, opacity:.6, side:THREE.DoubleSide})), 0, 76, 4, fan); b.rotation.z = i*Math.PI*2/3;}
// 蚊取り線香（火はついていない。皿の上）
const coil = add(new THREE.Mesh(new THREE.TorusGeometry(5, .45, 6, 60), std({color:0x3a5a2a})), 60, 2, 120); coil.rotation.x = Math.PI/2;
add(new THREE.Mesh(new THREE.CylinderGeometry(8, 7, 1.5, 24), std({color:0x6a7070, metalness:.6, roughness:.5})), 60, .75, 120);
// うちわ
const uchiwa = add(new THREE.Mesh(new THREE.CircleGeometry(11, 24), std({color:0xe8e0c8, side:THREE.DoubleSide})), 70, 10.2, -60); uchiwa.rotation.x = -Math.PI/2;
add(new THREE.Mesh(new THREE.BoxGeometry(1.4, .8, 14), std({color:0xa08050})), 70, 10.2, -46);

// ---- ことづけ窓（出入口）：南の壁 ----
const WIN = {x:-120, y:110, z:ROOM.d/2, w:44, h:30};
const sky = add(new THREE.Mesh(new THREE.PlaneGeometry(WIN.w, WIN.h), new THREE.MeshBasicMaterial({color:0x1d3358})), WIN.x, WIN.y, WIN.z+3); sky.rotation.y = Math.PI;
add(new THREE.Mesh(new THREE.CircleGeometry(3, 16), new THREE.MeshBasicMaterial({color:0xf4ecd0})), WIN.x+10, WIN.y+6, WIN.z+2.5).rotation.y = Math.PI;
for(const s of [-1,1]){ box(WIN.w+8, 4, 8, pillarMat, WIN.x, WIN.y+s*(WIN.h/2+2), WIN.z-2); box(4, WIN.h+8, 8, pillarMat, WIN.x+s*(WIN.w/2+2), WIN.y, WIN.z-2);}
// 半分あいた網戸
const net = add(new THREE.Mesh(new THREE.PlaneGeometry(WIN.w/2, WIN.h), std({map:screenTex, transparent:true, alphaTest:.1, side:THREE.DoubleSide})), WIN.x+WIN.w/4, WIN.y, WIN.z-1); net.rotation.y = Math.PI;

// ---- 蚊（ヒトスジシマカ） ----
const mos = new THREE.Group();
const black = std({color:0x141210, roughness:.5}), white = std({color:0xe8e8e0, roughness:.5});
const thorax = add(new THREE.Mesh(new THREE.SphereGeometry(.42, 14, 10), black), 0, .05, -.25, mos); thorax.scale.set(1, .9, 1.3);
add(new THREE.Mesh(new THREE.BoxGeometry(.08, .02, .7), white), 0, .43, -.25, mos);          // 背中の白い線
const mHead = add(new THREE.Mesh(new THREE.SphereGeometry(.24, 12, 8), black), 0, 0, -.85, mos);
for(const s of [-1,1]) add(new THREE.Mesh(new THREE.SphereGeometry(.13, 8, 6), std({color:0x302020, roughness:.2})), s*.15, .05, -.9, mos);
const prob = add(new THREE.Mesh(new THREE.CylinderGeometry(.025, .04, 1.1, 5), black), 0, -.12, -1.45, mos); prob.rotation.x = Math.PI/2 + .25;
for(const s of [-1,1]){ const a=add(new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.6,4), black), s*.12, .15, -1.15, mos); a.rotation.set(Math.PI/2-.5, 0, s*.4);}
const abdomen = new THREE.Group(); abdomen.position.set(0, -.02, .35); mos.add(abdomen);
for(let i=0;i<7;i++){ const r=.3-i*.025; const seg=add(new THREE.Mesh(new THREE.CylinderGeometry(r, r-.02, .19, 12), i%2?white:black), 0, 0, i*.19, abdomen); seg.rotation.x = Math.PI/2;}
const belly = add(new THREE.Mesh(new THREE.SphereGeometry(.3, 12, 8), std({color:0x9a1810, roughness:.3, transparent:true, opacity:.85})), 0, -.06, .55, abdomen);
belly.scale.set(1, 1, 2.2);
// 脚6本（白い縞）
for(const s of [-1,1]) for(let i=0;i<3;i++){
  const leg=new THREE.Group(); leg.position.set(s*.2, -.15, -.45+i*.22); leg.rotation.set(0, s*(i-1)*.5, s*1.0); mos.add(leg);
  for(let j=0;j<4;j++){const p=add(new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.35,4), j%2?white:black), 0, -(j*.33+.17), 0, leg);}
  leg.children.forEach((p,j)=>{p.position.x = s*j*.12;});}
// 羽（翅脈入り）
const wingTex = tex(128, 48, (g,w,h)=>{g.fillStyle='rgba(210,220,235,.35)'; g.beginPath(); g.ellipse(w/2,h/2,w/2-2,h/2-2,0,0,Math.PI*2); g.fill();
  g.strokeStyle='rgba(60,60,60,.6)'; g.lineWidth=1; for(let i=0;i<5;i++){g.beginPath(); g.moveTo(4,h/2); g.quadraticCurveTo(w/2, h*(i/4), w-4, h/2+(i-2)*5); g.stroke();}});
const wingMat = new THREE.MeshBasicMaterial({map:wingTex, transparent:true, side:THREE.DoubleSide, depthWrite:false});
const wingGeo = new THREE.PlaneGeometry(1.9, .55); wingGeo.rotateX(-Math.PI/2);
const wL = new THREE.Group(), wR = new THREE.Group();
for(const [w,s] of [[wL,-1],[wR,1]]){ const m=new THREE.Mesh(wingGeo, wingMat); m.position.x = s*.95; m.rotation.y = s*-.25; w.add(m); w.position.set(s*.25, .3, -.3); mos.add(w);}
mos.scale.setScalar(1.15);
scene.add(mos);
// 叩く手と影
const shadow = new THREE.Mesh(new THREE.CircleGeometry(SWAT_R, 28), new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0,depthWrite:false}));
shadow.rotation.x = -Math.PI/2; scene.add(shadow);
const hand = new THREE.Group(); hand.visible = false; scene.add(hand);
add(new THREE.Mesh(new RoundedBoxGeometry(16, 4, 18, 3, 1.8), skinMat), 0, 0, 0, hand);
for(let i=0;i<4;i++) add(new THREE.Mesh(new THREE.CapsuleGeometry(1.6, 9, 4, 8), skinMat), -5.4+i*3.6, 0, -14, hand).rotation.x = Math.PI/2;
add(new THREE.Mesh(new THREE.CapsuleGeometry(1.8, 7, 4, 8), skinMat), 10, 0, -2, hand).rotation.set(Math.PI/2, 0, -.9);

// ---- 入力 ----
const key = {};
addEventListener('keydown', e=>{key[e.code]=true; if(e.code==='Space') e.preventDefault();});
addEventListener('keyup', e=>key[e.code]=false);
const sticks = {L:{id:null,x:0,y:0,el:document.getElementById('stL')}, R:{id:null,x:0,y:0,el:document.getElementById('stR')}};
let btnSuck=false, btnGlide=false;
function bindBtn(id, set){const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.stopPropagation();set(true);el.classList.add('on');});
  for(const t of ['pointerup','pointercancel','pointerleave']) el.addEventListener(t,()=>{set(false);el.classList.remove('on');});}
bindBtn('suck', v=>btnSuck=v); bindBtn('glide', v=>btnGlide=v);
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e=>{
  const s = e.clientX < innerWidth/2 ? sticks.L : sticks.R; if(s.id!==null) return;
  s.id=e.pointerId; s.ox=e.clientX; s.oy=e.clientY; s.x=s.y=0;
  s.el.style.display='block'; s.el.style.left=(e.clientX-55)+'px'; s.el.style.top=(e.clientY-55)+'px'; s.el.firstElementChild.style.transform='';
});
addEventListener('pointermove', e=>{for(const s of Object.values(sticks)) if(s.id===e.pointerId){
  let dx=(e.clientX-s.ox)/50, dy=(e.clientY-s.oy)/50; const l=Math.hypot(dx,dy); if(l>1){dx/=l;dy/=l;}
  s.x=dx; s.y=-dy; s.el.firstElementChild.style.transform=`translate(${dx*33}px,${-s.y*33}px)`;}});
const up = e=>{for(const s of Object.values(sticks)) if(s.id===e.pointerId){s.id=null;s.x=s.y=0;s.el.style.display='none';}};
addEventListener('pointerup', up); addEventListener('pointercancel', up);
const axis = (a,b)=>(key[a]?1:0)-(key[b]?1:0);

// ---- 状態 ----
let G;
function reset(){
  G = {t:0, pos:new THREE.Vector3(WIN.x, WIN.y, WIN.z-12), vel:new THREE.Vector3(), yaw:0, blood:0, alert:0,
       landed:null, swat:null, cooldown:0, state:'play', bites:0, roll:0, pitch:0};
}
const ui = id=>document.getElementById(id);
const msg = ui('msg');
function show(html, label, fn){msg.innerHTML = html + (label?`<br><button>${label}</button>`:''); msg.style.display='block';
  if(label) msg.querySelector('button').onclick=()=>{msg.style.display='none'; fn();};}
reset(); G.state='title';
show(`<h1>ぬるい夜</h1><p>夏の夜、あなたは1匹の蚊。<br>ことづけ窓から入って血を吸い、夜明けまでに窓から出る。</p><p>オレンジの輪が刺せる場所。ゆっくり着陸して「吸う」を長押し。<br>手の影が落ちたら、すぐ影の外へ。</p>`, 'はじめる', ()=>{reset();});

function alertLevel(a){return Math.min(4, Math.floor(a));}
const STATE_TXT = ['寝ている','寝返り','かゆい','起きた','叩く！'];

// ---- 1コマ ----
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), tmp = new THREE.Vector3();
let last = performance.now();
function step(dt){
  if(G.state!=='play') return;
  G.t += dt;
  const ly = sticks.L.y + axis('KeyW','KeyS'), lx = sticks.L.x + axis('KeyD','KeyA');
  const ry = sticks.R.y + axis('ArrowUp','ArrowDown'), rx = sticks.R.x + axis('ArrowRight','ArrowLeft');
  const suck = btnSuck || key.Space, glide = btnGlide || key.ShiftLeft || key.ShiftRight;
  const clamp = v=>Math.max(-1, Math.min(1, v));
  const heavy = 1 - 0.35*G.blood;

  let noise = 0;
  if(G.landed){
    // 着陸中：スティックを倒すと飛び立つ
    if(Math.abs(ly)+Math.abs(ry)+Math.abs(rx) > 0.3){ // 飛び立つ：倒した向きにはじく
      G.landed=null; G.noLand=0.6; fwd.set(-Math.sin(G.yaw),0,-Math.cos(G.yaw)); right.set(Math.cos(G.yaw),0,-Math.sin(G.yaw));
      G.vel.copy(fwd).multiplyScalar(ry*60).addScaledVector(right, rx*60); G.vel.y = 25 + Math.max(0,ly)*40; }
    else if(suck){
      const s = G.landed; G.blood = Math.min(1, G.blood + s.rate*dt);
      G.alert += s.risk*dt*(0.6 + G.blood);
    }
  }
  if(!G.landed){
    G.yaw -= clamp(lx)*YAW_RATE*dt;
    fwd.set(-Math.sin(G.yaw), 0, -Math.cos(G.yaw)); right.set(Math.cos(G.yaw), 0, -Math.sin(G.yaw));
    const target = tmp.copy(fwd).multiplyScalar(clamp(ry)*MAX_SPD*heavy).addScaledVector(right, clamp(rx)*MAX_SPD*0.7*heavy);
    target.y = clamp(ly)*MAX_UP*heavy - G.blood*12;  // 重いと沈む
    if(glide){ G.vel.y -= 60*dt; G.vel.x *= 1-0.4*dt; G.vel.z *= 1-0.4*dt; }
    else G.vel.lerp(target, 1 - Math.exp(-4.5*heavy*dt));  // 慣性
    G.pos.addScaledVector(G.vel, dt);
    // 壁と床
    const m=2;
    G.pos.x = Math.max(-ROOM.w/2+m, Math.min(ROOM.w/2-m, G.pos.x));
    G.pos.y = Math.max(1.5, Math.min(ROOM.h-m, G.pos.y));
    G.pos.z = Math.max(-ROOM.d/2+m, Math.min(ROOM.d/2-m, G.pos.z));
    if(G.pos.y<=1.5 && G.vel.y<0) G.vel.y=0;
    const spd = G.vel.length();
    noise = glide ? 0 : 0.25 + 0.75*spd/MAX_SPD;
    // 着陸判定
    G.noLand = (G.noLand||0) - dt;
    if(G.noLand <= 0) for(const s of SKIN){
      const d = tmp.set(...s.pos).sub(G.pos);
      if(d.length() < s.r && Math.abs(d.y) < 4){
        if(spd < LAND_SPD){ G.landed = s; G.vel.set(0,0,0); G.pos.set(G.pos.x, s.pos[1]+1, G.pos.z); G.bites++; G.lastBite = s.name; }
        else { G.vel.multiplyScalar(-0.6); G.alert += 0.6; G.noLand = 0.4; } // 跳ねる
        break;
      }
    }
    // 窓から出る
    if(G.pos.z > WIN.z-4 && Math.abs(G.pos.x-WIN.x) < WIN.w/2 && Math.abs(G.pos.y-WIN.y) < WIN.h/2 && G.t > 3){
      return end(G.blood>0.02 ? 'clear' : 'empty');
    }
  }
  // 羽音が耳もとで聞こえる
  const dHead = G.pos.distanceTo(HEAD);
  const near = Math.max(0, 1 - dHead/70);
  G.alert += noise*near*near*1.4*dt;
  G.alert = Math.max(0, G.alert - 0.12*dt);
  G.noise = noise*(0.4+0.6*near);

  // 叩く
  G.cooldown -= dt;
  if(!G.swat && G.alert >= 4 && G.cooldown <= 0){
    G.swat = {t:0, at:G.pos.clone()};
  }
  if(G.swat){
    G.swat.t += dt;
    if(G.swat.t >= SWAT_DELAY){
      const flat = Math.hypot(G.pos.x-G.swat.at.x, G.pos.z-G.swat.at.z);
      if(flat < SWAT_R && Math.abs(G.pos.y-G.swat.at.y) < 30) return end('out');
      G.swat = null; G.alert = 2.6; G.cooldown = 2.5;
    }
  }
  if(G.t >= NIGHT_SEC) end('dawn');
}

function end(kind){
  G.state = 'end'; const ml = Math.round(G.blood*5*100)/100;
  const T = {
    clear:[`ほどけた`, `窓から出た。持ち帰った血 ${ml} mg（刺した回数 ${G.bites}）`, `朝、おじいさんは「なんか${G.lastBite||'足首'}がかゆい」と言った。`],
    empty:[`素通り`, `何も吸わずに出てしまった。`, ``],
    out:[`OUT`, `ぱちん。叩かれた。`, `吸った血は ${ml} mg だった。`],
    dawn:[`夜明け`, `窓から出られないまま朝になった。`, `電気がついた。`],
  }[kind];
  show(`<h1>${T[0]}</h1><p>${T[1]}</p><p>${T[2]}</p>`, 'もうひと晩', reset);
}

// ---- 画面 ----
const att = ui('att').getContext('2d');
function drawAtt(roll, pitch){
  const c = att, R = 56; c.clearRect(0,0,120,120); c.save(); c.translate(60,60);
  c.beginPath(); c.arc(0,0,R,0,Math.PI*2); c.clip();
  c.rotate(roll); c.fillStyle='#2c4a78'; c.fillRect(-80,-80,160,80+pitch); c.fillStyle='#5a4630'; c.fillRect(-80,pitch,160,80);
  c.strokeStyle='#e9e4d4'; c.lineWidth=1; for(let i=-2;i<=2;i++){ if(!i) continue; c.beginPath(); c.moveTo(-12,pitch+i*12); c.lineTo(12,pitch+i*12); c.stroke(); }
  c.restore(); c.strokeStyle='#e8a33a'; c.lineWidth=3; c.beginPath(); c.moveTo(30,60); c.lineTo(50,60); c.moveTo(70,60); c.lineTo(90,60); c.stroke();
  c.strokeStyle='rgba(233,228,212,.5)'; c.lineWidth=2; c.beginPath(); c.arc(60,60,R,0,Math.PI*2); c.stroke();
}
function render(){
  // 蚊
  mos.position.copy(G.pos);
  const lv = tmp.copy(G.vel).applyAxisAngle(new THREE.Vector3(0,1,0), -G.yaw);
  G.roll += ((-lv.x/MAX_SPD)*0.6 - G.roll)*0.15; G.pitch += ((lv.z/MAX_SPD)*0.4 - G.pitch)*0.15;
  mos.rotation.set(G.pitch, G.yaw, G.roll, 'YXZ');
  const flap = G.landed ? 0 : Math.sin(performance.now()*0.09)*0.7;
  wL.rotation.z = flap; wR.rotation.z = -flap;
  const bk = 0.35 + G.blood*1.05; belly.scale.set(bk, bk, 2.2*bk);
  // カメラ：後ろ上から
  const back = new THREE.Vector3(Math.sin(G.yaw), 0, Math.cos(G.yaw));
  const want = G.pos.clone().addScaledVector(back, 14).add(new THREE.Vector3(0, 5, 0));
  want.x = Math.max(-ROOM.w/2+3, Math.min(ROOM.w/2-3, want.x)); want.z = Math.max(-ROOM.d/2+3, Math.min(ROOM.d/2-3, want.z));
  want.y = Math.max(2, Math.min(ROOM.h-3, want.y));
  cam.position.lerp(want, 0.2); cam.lookAt(G.pos.x, G.pos.y+1, G.pos.z);
  // 影と手
  if(G.swat){
    const k = G.swat.t/SWAT_DELAY;
    shadow.position.set(G.swat.at.x, Math.max(0.3, G.swat.at.y-12), G.swat.at.z);
    shadow.material.opacity = 0.25 + 0.45*k;
    hand.visible = true; hand.position.set(G.swat.at.x, G.swat.at.y + 70*(1-k) + 6, G.swat.at.z);
  } else { shadow.material.opacity = 0; hand.visible = false; }
  skinDots.forEach((m,i)=>m.material.opacity = G.landed===SKIN[i] ? .9 : .45);
  // 計器
  const mins = Math.floor(G.t/NIGHT_SEC*360); const hh = (23 + Math.floor(mins/60))%24, mm = mins%60;
  ui('clock').textContent = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}` + (G.landed ? `　${G.landed.name}にとまっている` : '');
  ui('alt').textContent = Math.round(G.pos.y);
  ui('spd').textContent = Math.round(G.vel.length());
  ui('blood').style.width = (G.blood*100)+'%'; ui('blood').style.background = G.blood>.75 ? 'var(--bad)' : 'var(--ok)';
  ui('noise').style.width = ((G.noise||0)*100)+'%'; ui('noise').style.background = (G.noise||0)>.6 ? 'var(--warn)' : 'var(--ok)';
  const lvA = alertLevel(G.alert);
  ui('eyes').textContent = '●'.repeat(lvA) + '○'.repeat(4-lvA);
  ui('eyes').style.color = lvA>=3 ? 'var(--bad)' : lvA>=2 ? 'var(--warn)' : 'var(--ink)';
  ui('state').textContent = G.swat ? '叩く！' : STATE_TXT[lvA];
  drawAtt(-G.roll*1.5, G.vel.y*0.5);
  renderer.render(scene, cam);
}
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  step(dt); render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
addEventListener('resize', ()=>{renderer.setSize(innerWidth, innerHeight); cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();});
window.__G = ()=>G; // 確認用
</script>
</body>
</html>
