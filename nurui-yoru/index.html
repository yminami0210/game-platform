<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ぬるい夜</title>
<style>
:root{--ink:#ebe5d3;--dim:#a19d8c;--warn:#e8a33a;--bad:#e2553f;--ok:#82c6a2;--bg:#0c1220;
  --st:clamp(104px,15vmin,150px);--btn:clamp(66px,11vmin,92px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--stp:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;touch-action:none}
canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:calc(var(--stp) + 6px);left:calc(var(--sl) + 8px);right:calc(var(--sr) + 8px);display:flex;justify-content:space-between;align-items:flex-start;gap:6px;font-size:12px}
.box{background:rgba(8,12,20,.58);border:1px solid rgba(235,229,211,.16);border-radius:6px;padding:5px 8px;line-height:1.45;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:6px;white-space:nowrap}
.bar{width:clamp(56px,14vw,104px);height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok)}
#clock{font-size:15px;font-weight:600}
#people{text-align:right}
#people .p{display:flex;justify-content:flex-end;gap:6px;align-items:center;white-space:nowrap}
#people .e{letter-spacing:1px;font-size:12px}
#att{width:clamp(64px,10vmin,92px);height:auto}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px calc(var(--sr) + 20px) 24px calc(var(--sl) + 20px);background:rgba(8,12,20,.72);pointer-events:auto;font-size:14px}
#msg h1{font-size:clamp(30px,8vmin,46px);margin:0 0 4px;letter-spacing:.14em;font-weight:600}
#msg p{margin:3px 0;color:var(--dim);line-height:1.7;max-width:34em}
#msg .q{color:var(--ink);margin-top:10px}
#msg .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
#msg button{font:inherit;font-size:16px;padding:11px 22px;min-height:48px;border-radius:26px;border:1px solid var(--ink);background:transparent;color:var(--ink)}
#msg button small{display:block;font-size:11px;color:var(--dim)}
.btn{position:absolute;pointer-events:auto;width:var(--btn);height:var(--btn);border-radius:50%;border:2px solid rgba(235,229,211,.55);background:rgba(8,12,20,.42);color:var(--ink);font-size:15px;display:flex;align-items:center;justify-content:center;touch-action:none}
.btn.on{background:rgba(226,85,63,.5)}
.btn.ready{border-color:var(--warn);box-shadow:0 0 0 4px rgba(232,163,58,.25)}
#suck{right:calc(var(--sr) + var(--st) + 30px);bottom:calc(var(--sb) + 18px)}
#glide{left:calc(var(--sl) + var(--st) + 30px);bottom:calc(var(--sb) + 18px);width:calc(var(--btn)*.8);height:calc(var(--btn)*.8);font-size:13px}
#pause{right:calc(var(--sr) + 8px);top:auto;bottom:auto;position:absolute;pointer-events:auto}
.stick{position:absolute;bottom:calc(var(--sb) + 14px);width:var(--st);height:var(--st);border-radius:50%;border:2px solid rgba(235,229,211,.22);background:rgba(8,12,20,.22)}
.stick i{position:absolute;left:50%;top:50%;width:42%;height:42%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(235,229,211,.38)}
.stick b{position:absolute;left:0;right:0;bottom:calc(100% + 2px);text-align:center;font-size:10px;font-weight:400;color:var(--dim)}
#stL{left:calc(var(--sl) + 14px)} #stR{right:calc(var(--sr) + 14px)}
#toast{position:absolute;left:50%;top:calc(var(--stp) + 30%);transform:translateX(-50%);font-size:14px;background:rgba(8,12,20,.6);padding:6px 14px;border-radius:16px;opacity:0;transition:opacity .3s;max-width:min(90vw,30em);text-align:center;line-height:1.5}
#talk{position:absolute;left:50%;bottom:calc(var(--sb) + var(--st) + 34px);transform:translateX(-50%);font-size:14px;color:var(--ink);opacity:0;transition:opacity .5s;white-space:nowrap}
#rot{position:absolute;left:0;right:0;top:calc(var(--stp) + 96px);text-align:center;font-size:12px;color:var(--dim);display:none}
#flash{position:absolute;inset:0;background:var(--bad);opacity:0;pointer-events:none;transition:opacity .25s}
@media (orientation:portrait){ #rot{display:block} }
@media (pointer:fine){ .stick,#glide,#suck{opacity:.55} }
</style>
</head>
<body>
<div id="hud">
  <div class="top">
    <div class="box">
      <div class="row"><span id="clock">23:00</span><span id="where" style="color:var(--dim)"></span></div>
      <div class="row">高さ <span id="alt">0</span>　速さ <span id="spd">0</span></div>
      <div class="row">血　<div class="bar"><i id="blood"></i></div></div>
      <div class="row">体力 <div class="bar"><i id="hp"></i></div></div>
      <div class="row">羽音 <div class="bar"><i id="noise"></i></div></div>
    </div>
    <canvas id="att" width="120" height="120"></canvas>
    <div class="box" id="people"></div>
  </div>
  <div id="rot">横向きにすると遊びやすい</div>
  <div id="toast"></div>
  <div id="talk"></div>
  <div class="stick" id="stL"><b>上下・向き</b><i></i></div>
  <div class="stick" id="stR"><b>前後・横</b><i></i></div>
  <div id="glide" class="btn">滑空</div>
  <div id="suck" class="btn">吸う</div>
  <div id="flash"></div>
  <div id="msg"></div>
</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ============ テキスト（OmniRoute writer の下書き → Claude 点検済み。omni/出力/v1_テキスト.json） ============
const TEXT = /*TEXT_START*/{"stages": [{"id": 1, "intro": "中ノ町市、23時00分、気温25℃。6畳の和室。蚊取り線香は出してあるが、火はついていない", "people": [{"role": "grandpa", "sleeptalk": ["明日の回覧板は、ひとまたぎ先だろ……", "酢の瓶、ひさしに上げとけ……", "……ん、まるやすは水曜が安い……", "風見間には置くな、風が入る……"], "itch": ["{place}が赤くなっとる。線香出しといたのになあ", "なんだ、{place}を食われたか。ぬるい夜だったからな", "{place}がかゆい。ことづけ窓、開けっぱなしだったか"]}]}, {"id": 2, "intro": "下川原市、23時00分、気温27℃。団地の6畳間に布団が4つ。扇風機が首を振っている", "people": [{"role": "father", "sleeptalk": ["ヨコデン、もう30分待つのか……", "明日は工場のラインが止まる……", "……ぬる〜いのお茶、買っといて……", "もうほどけたのか、早いな……"], "itch": ["{place}かゆいな。団地の蚊はどこから入るんだ", "うわ、{place}刺された。扇風機止まってたか", "{place}が腫れてる。今日一日かゆいやつだ"]}, {"role": "mother", "sleeptalk": ["おっちらまでに買い物行かなきゃ……", "明日のゴミは燃えるやつ……", "ご飯、少なめにまするから……", "ねじ餅、固くなる前に食べてよ……"], "itch": ["{place}刺されてる。子どもたち大丈夫だった？", "{place}がかゆい。蚊取り線香切れてたみたい", "こんなところ。{place}にかゆみ止め塗らなきゃ"]}, {"role": "boy", "sleeptalk": ["……宿題、まだ48問残ってる……", "ますめし、味噌だけ残った……", "パス、こっち！　走れ……", "……プール、明日もあるの……"], "itch": ["{place}めっちゃかゆい。血が出そう", "うわ、{place}刺された。最悪", "{place}にバッテンつけた。まだかゆい"]}, {"role": "girl", "sleeptalk": ["……うさぎさん、もうねた……", "アイス、あしたたべる……", "……すずしくない……", "ママ、あっちいって……"], "itch": ["{place}いたい。かゆい", "ここ、{place}ぷくってしてる", "{place}かいちゃだめって言われた"]}]}], "tips": ["扇風機の風の中に入ると流される。首振りの向きを見て近づく", "蚊取り線香の煙がある場所は、体力が減り続けます。", "ことづけ窓の隙間から外へ出れば脱出完了です。", "目のマークが2つ赤くなったら、一度離れて落ち着くのを待つ", "血を吸いすぎると体が重くなり、飛ぶ速度が落ちます。", "5時になる前に、ことづけ窓から出る。吸った血はそれで持ち帰りになる"], "results": {"clear": ["ことづけ窓の隙間から外に出た。", "網戸の端をくぐって、外に出た。", "開いていた窓から外に出た。"], "out": ["手のひらで叩かれた。", "寝ぼけた手が、たまたま当たった。", "起きた人に、両手で挟まれた。"], "dawn": ["5時になって、部屋の明かりがついた。", "新聞配達のバイクの音がして、人が起きた。"]}}/*TEXT_END*/;

// ============ 数値（単位は cm・秒） ============
const NIGHT_SEC = 240;                          // 23:00→5:00
const MAX_SPD = 90, MAX_UP = 55, YAW_RATE = 2.2;
const LAND_SPD = 28;
const SWAT_R = 15;
const MOBILE = matchMedia('(pointer:coarse)').matches;

// ============ 描画の土台 ============
const renderer = new THREE.WebGLRenderer({antialias:!MOBILE, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c1220);
const cam = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.4, 2000);

// ---- 手描きの質感（canvas） ----
const rnd = (a=0,b=1)=>a+Math.random()*(b-a);
function tex(w, h, draw, rx=1, ry=1){const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'), w, h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry); t.anisotropy=4; return t;}
const T = {};
T.tatami = tex(256, 512, (g,w,h)=>{g.fillStyle='#8d8a5a'; g.fillRect(0,0,w,h);
  for(let x=0;x<w;x+=2){g.fillStyle=`rgba(${rnd(90,140)|0},${rnd(100,130)|0},${rnd(50,70)|0},.55)`; g.fillRect(x,0,1.4,h);}
  for(let y=0;y<h;y+=6){g.fillStyle='rgba(40,35,15,.12)'; g.fillRect(0,y,w,1);}
  g.fillStyle='#1f1c14'; g.fillRect(0,0,14,h); g.fillRect(w-14,0,14,h);
  g.fillStyle='rgba(180,160,90,.25)'; for(let y=0;y<h;y+=10){g.fillRect(3,y,8,4); g.fillRect(w-11,y,8,4);}});
const woodTex = (base, dark, rx=1, ry=1) => tex(256, 256, (g,w,h)=>{g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){g.strokeStyle=`rgba(${dark},${rnd(.08,.3)})`; g.lineWidth=rnd(.5,2.5); g.beginPath(); let y=rnd(0,h); g.moveTo(0,y);
    for(let x=0;x<=w;x+=16){y+=rnd(-2,2); g.lineTo(x,y);} g.stroke();}}, rx, ry);
const speckTex = (base, rx, ry) => tex(256, 256, (g,w,h)=>{g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){g.fillStyle=`rgba(${Math.random()<.5?'255,240,210':'40,30,20'},${rnd(.02,.1)})`; g.fillRect(rnd(0,w),rnd(0,h),rnd(1,3),rnd(1,3));}}, rx, ry);
T.plaster = speckTex('#8a7f68', 3, 2);
T.cloth = speckTex('#b8ad98', 4, 3);            // 団地の壁紙
T.sheet = tex(128, 128, (g,w,h)=>{g.fillStyle='#e9e3d4'; g.fillRect(0,0,w,h); for(let i=0;i<1500;i++){g.fillStyle=`rgba(120,110,90,${rnd(0,.06)})`; g.fillRect(rnd(0,w),rnd(0,h),2,2);}}, 4, 4);
const kasuri = (bg, fg) => tex(256, 256, (g,w,h)=>{g.fillStyle=bg; g.fillRect(0,0,w,h);
  g.fillStyle=fg; for(let y=8;y<h;y+=32) for(let x=(y/32%2)*16+8;x<w;x+=32){g.fillRect(x-5,y-1,10,2); g.fillRect(x-1,y-5,2,10);}}, 3, 3);
const stripe = (bg, fg, step=16, wd=3) => tex(128, 128, (g,w,h)=>{g.fillStyle=bg; g.fillRect(0,0,w,h); g.fillStyle=fg; for(let x=0;x<w;x+=step) g.fillRect(x,0,wd,h);}, 2, 2);
const dots = (bg, fg) => tex(128, 128, (g,w,h)=>{g.fillStyle=bg; g.fillRect(0,0,w,h); g.fillStyle=fg; for(let y=8;y<h;y+=20) for(let x=(y/20%2)*10+5;x<w;x+=20){g.beginPath(); g.arc(x,y,3.5,0,7); g.fill();}}, 2, 2);
T.screen = tex(64, 64, (g,w,h)=>{g.strokeStyle='rgba(40,40,40,.9)'; g.lineWidth=1; for(let i=0;i<w;i+=4){g.beginPath(); g.moveTo(i,0); g.lineTo(i,h); g.moveTo(0,i); g.lineTo(w,i); g.stroke();}}, 6, 4);
T.smoke = tex(64, 64, (g,w,h)=>{const r=g.createRadialGradient(32,32,0,32,32,32); r.addColorStop(0,'rgba(220,220,215,.55)'); r.addColorStop(1,'rgba(220,220,215,0)'); g.fillStyle=r; g.fillRect(0,0,w,h);});

const std = (o)=>new THREE.MeshStandardMaterial(Object.assign({roughness:.85, metalness:0}, o));
const mat = c => std({color:c});
const M = { wood: std({map:woodTex('#6a4a2c','40,25,10'), roughness:.7}), kiri: std({map:woodTex('#a07a52','60,40,20'), roughness:.75}),
  sheet: std({map:T.sheet}), metal: std({color:0x2a2a28, metalness:.8, roughness:.4}), white: std({color:0xe8e6df, roughness:.5}) };

// ---- いま作っている面のための add/box ----
let root = scene;   // 面ごとのグループ
function add(m, x, y, z, parent=root){m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;}
function box(w,h,d,c,x,y,z,parent){return add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d), c.isMaterial?c:mat(c)), x,y,z,parent);}
function rbox(w,h,d,r,m,x,y,z,parent){return add(new THREE.Mesh(new RoundedBoxGeometry(w,h,d,4,r), m), x,y,z,parent);}
const Y = new THREE.Vector3(0,1,0);
// a→b に伸びる部品を置く（geo は y 方向に長さ1で作っておく）
function between(mesh, a, b, parent){ const d = new THREE.Vector3().subVectors(b, a); mesh.scale.y = d.length();
  mesh.position.copy(a).addScaledVector(d, .5); mesh.quaternion.setFromUnitVectors(Y, d.normalize()); mesh.castShadow = mesh.receiveShadow = true; (parent||root).add(mesh); return mesh; }
// 先細りの手足（長さ1、半径 r0→r1、両端は丸い）
const limbCache = {};
function limbGeo(r0, r1){ const k = r0+'_'+r1; if(limbCache[k]) return limbCache[k];
  const pts = []; const N = 14;
  for(let i=0;i<=N;i++){ const t=i/N; const r = r0+(r1-r0)*t; const bulge = Math.sin(t*Math.PI)*.08*r0; pts.push(new THREE.Vector2(r+bulge, t-.5)); }
  pts.unshift(new THREE.Vector2(0.001, -.5)); pts.push(new THREE.Vector2(0.001, .5));
  return limbCache[k] = new THREE.LatheGeometry(pts, 20); }
function joint(r, m, p, parent){ return add(new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), m), p.x, p.y, p.z, parent); }
const V = (x,y,z)=>new THREE.Vector3(x,y,z);

// ============ 人 ============
// 仰向けに寝ている人。ローカル座標：布団の中心が原点、頭は -z、顔は +y。大人の大きさで作って s 倍する
const SKIN_TONES = {old:0xc08d72, adult:0xd4a184, kid:0xe0b096};
function makePerson(o){
  const g = new THREE.Group(); g.position.set(o.x, 0, o.z); g.scale.setScalar(o.s); root.add(g);
  const skin = std({color:SKIN_TONES[o.age], roughness:.62});
  const cloth = std({map:o.cloth, roughness:.9});
  const a = o.arm, f = o.foot;              // 布団から出ている腕と足の側（-1 左 / 1 右）
  const P = {o, g, skin, parts:{}};

  // --- 頭：頂点を動かして頭蓋・あご・頬を作り、頂点色で髪と肌を塗る
  const hg = new THREE.SphereGeometry(1, 48, 36); const hp = hg.attributes.position; const col = [];
  const hair = new THREE.Color(o.hair), sk = new THREE.Color(SKIN_TONES[o.age]), cheek = sk.clone().lerp(new THREE.Color(0xd07a6a), .25);
  for(let i=0;i<hp.count;i++){ let x=hp.getX(i), y=hp.getY(i), z=hp.getZ(i);  // y=顔の向き、z=あご(+)／頭頂(-)
    let sx = 8.2, sy = 9.6, sz = 11.2;
    if(z>0){ const k = z; sx *= 1 - .3*k*k*(y>-.2?1:.6); sy *= 1 - .12*k*k; }      // あごに向かって細く
    if(y>.3 && Math.abs(z)<.4) sx *= 1 + .04*(1-Math.abs(z)/.4);                 // 頬骨
    if(y>.55 && z>-.15 && z<.05) sy *= 1.02;                                     // 眉のふくらみ
    if(y>.6 && z>.05 && z<.3 && Math.abs(x)>.18 && Math.abs(x)<.5) sy *= .965;    // 目のくぼみ
    hp.setXYZ(i, x*sx, y*sy, z*sz);
    // 色：後頭部と横は髪。年寄りは頭頂がうすい
    let isHair = (y < .25 && z < .55) || (z < -.45 && y < .75);
    if(o.bald && z < -.55 && y > -.1) isHair = Math.random() < .25;
    if(o.longHair && y < .5 && z < .9) isHair = true;
    let c = isHair ? hair.clone().offsetHSL(0,0,rnd(-.04,.04)) : sk.clone();
    if(!isHair && y>.45 && Math.abs(x)>.35 && z>0 && z<.45) c.lerp(cheek, .8);
    if(!isHair && o.age==='old' && y>.5 && z>.5) c.lerp(new THREE.Color(0x9a9a92), .25);   // 白い無精ひげ
    col.push(c.r, c.g, c.b);
  }
  hg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); hg.computeVertexNormals();
  const headG = new THREE.Group(); headG.position.set(0, 22, -82); g.add(headG); P.parts.head = headG;
  const headM = std({vertexColors:true, roughness:.7}); add(new THREE.Mesh(hg, headM), 0, 0, 0, headG);
  // 鼻（三角の柱を丸めた形）
  const nose = new THREE.Mesh(new THREE.ConeGeometry(1.9, 5.4, 4), skin); nose.rotation.set(Math.PI/2+.35, Math.PI/4, 0); nose.scale.set(1, 1, .7);
  add(nose, 0, 9.5, 1.6, headG);
  add(new THREE.Mesh(new THREE.SphereGeometry(1.5, 12, 8), skin), 0, 9.6, 3.8, headG).scale.set(1.25,.9,1);
  // 閉じた目・眉・口・耳
  P.lids = []; P.eyes = [];
  for(const s of [-1,1]){
    const lid = add(new THREE.Mesh(new THREE.SphereGeometry(1.8, 14, 8, 0, Math.PI*2, 0, Math.PI/2), skin), s*3.6, 8.2, -.2, headG); lid.scale.set(1.1,.55,.8); P.lids.push(lid);
    const lash = add(new THREE.Mesh(new THREE.TorusGeometry(1.7, .16, 4, 16, Math.PI), std({color:0x2a1e18})), s*3.6, 8.9, .5, headG); lash.rotation.set(-Math.PI/2+.2, 0, 0); lash.scale.set(1.1,1,1);
    const eye = add(new THREE.Mesh(new THREE.SphereGeometry(1.4, 12, 8), std({color:0xf2eee6, roughness:.2})), s*3.6, 8.0, -.2, headG); eye.visible=false;
    add(new THREE.Mesh(new THREE.SphereGeometry(.7, 10, 8), std({color:0x1a1210, roughness:.1})), 0, 1.1, 0, eye); P.eyes.push(eye);
    const brow = add(new THREE.Mesh(new THREE.CapsuleGeometry(.55, 3.6, 4, 8), std({color:o.brow||o.hair, roughness:1})), s*3.8, 9.3, -2.6, headG); brow.rotation.set(0, 0, Math.PI/2 + s*.12);
    const ear = add(new THREE.Mesh(new THREE.SphereGeometry(2.6, 14, 10), skin), s*8.1, -.6, .2, headG); ear.scale.set(.45, 1, 1.45);
  }

function bodyH(P, x, z, breath){

}
function updateKake(P, breath){
  const kp = P.kake.geometry.attributes.position, b = P.kakeBase;
  for(let i=0;i<kp.count;i++){ const x=b[i*2], z=b[i*2+1];
    let y = 10 + bodyH(P, x, z, breath) + Math.sin(x*.21+z*.13)*.5;

}

function alertLevel(a){return Math.min(4, Math.floor(a));}
const STATE_TXT = ['寝ている','寝返り','かゆい','起きた','叩く'];
const pick = a => a && a.length ? a[Math.floor(Math.random()*a.length)] : '';

// ============ 1コマ ============
const fwd = V(), right = V(), tmp = V(), tmp2 = V();
function step(dt){
  if(!G || G.state!=='play') return;
  G.t += dt;
  const clamp = v=>Math.max(-1, Math.min(1, v));
  const ly = clamp(sticks.L.y + axis('KeyW','KeyS')), lx = clamp(sticks.L.x + axis('KeyD','KeyA'));
  const ry = clamp(sticks.R.y + axis('ArrowUp','ArrowDown')), rx = clamp(sticks.R.x + axis('ArrowRight','ArrowLeft'));
  const suck = btnSuck || key.Space, glide = btnGlide || key.ShiftLeft || key.ShiftRight;
  const heavy = 1 - 0.35*G.blood;
  fwd.set(-Math.sin(G.yaw),0,-Math.cos(G.yaw)); right.set(Math.cos(G.yaw),0,-Math.sin(G.yaw));

  // 扇風機の風
  G.wind.set(0,0,0);
  if(fan && fan.on){
    fan.phi = fan.base + Math.sin(G.t*.45)*fan.swing;
    const d = tmp2.set(Math.sin(fan.phi), 0, Math.cos(fan.phi));
    const windAt = (p, out)=>{ const rel = tmp.set(p.x-fan.x, p.y-fan.y, p.z-fan.z); const along = rel.dot(d);
      if(along<=0 || along>280) return out; const lat = rel.addScaledVector(d, -along).length(), spread = 16+along*.32;
      if(lat<spread) out.addScaledVector(d, 150*(1-along/280)*(1-lat/spread)); return out; };
    windAt(G.pos, G.wind);
    // 煙も流す
    for(const s of sp) if(s.life>0){ const w = windAt(s.p, V()); s.v.addScaledVector(w, dt*.6); }
  }
  // 蚊取り線香の煙
  if(coil && coil.lit){
    G.smokeT -= dt; if(G.smokeT<=0){ G.smokeT = .12; const s = sp.find(q=>q.life<=0); if(s){ s.life = 9; s.p.set(coil.x, 4, coil.z); s.v.set(rnd(-1.5,1.5), rnd(6,9), rnd(-1.5,1.5)); } }
  }
  let inSmoke = 0;
  for(const s of sp){ if(s.life<=0) continue; s.life -= dt; s.v.multiplyScalar(1 - .25*dt); s.v.y = Math.max(s.v.y, 3);
    s.p.addScaledVector(s.v, dt); if(s.life<=0 || s.p.y>S.room.h) { s.life=0; s.p.set(0,-999,0); continue; }
    const d = s.p.distanceTo(G.pos); if(d < 13) inSmoke += (1 - d/13); }
  G.hp = Math.min(1, Math.max(0, G.hp - inSmoke*.08*dt + .025*dt));
  if(inSmoke>.3 && !G.smokeWarned){ G.smokeWarned = true; toast('煙の中は体力が減る'); }

  let noise = 0;
  if(G.landed){
    const sk = G.landed;
    // 腕がかゆくて動いたら振り落とされる
    if(sk.onArm && sk.person.alert >= 2.4){ G.landed=null; G.noLand=.6; G.vel.set(rnd(-30,30), 40, rnd(-30,30)); buzz(30); toast('腕が動いた'); }
    else if(Math.abs(ly)+Math.abs(ry)+Math.abs(rx) > 0.3){ // 飛び立つ：倒した向きにはじく
      G.landed=null; G.noLand=0.6;
      G.vel.copy(fwd).multiplyScalar(ry*60).addScaledVector(right, rx*60); G.vel.y = 25 + Math.max(0,ly)*40; }
    else if(suck){
      G.blood = Math.min(1, G.blood + sk.rate*dt);
      G.bitten.set(sk.person, sk.name);
      sk.person.alert += sk.risk*dt*(0.6 + G.blood);
    }
  }
  if(!G.landed){
    G.yaw -= lx*YAW_RATE*dt;
    const target = tmp.copy(fwd).multiplyScalar(ry*MAX_SPD*heavy).addScaledVector(right, rx*MAX_SPD*0.7*heavy);
    target.y = ly*MAX_UP*heavy - G.blood*12;
    if(glide){ G.vel.y -= 60*dt; G.vel.x *= 1-0.4*dt; G.vel.z *= 1-0.4*dt; }
    else G.vel.lerp(target, 1 - Math.exp(-4.5*heavy*dt));
    G.vel.addScaledVector(G.wind, dt*1.8);
    G.pos.addScaledVector(G.vel, dt);
    const R = S.room, m=2;
    G.pos.x = Math.max(-R.w/2+m, Math.min(R.w/2-m, G.pos.x));
    G.pos.y = Math.max(1.5, Math.min(R.h-m, G.pos.y));
    G.pos.z = Math.max(-R.d/2+m, Math.min(R.d/2-m, G.pos.z));
    if(G.pos.y<=1.5 && G.vel.y<0) G.vel.y=0;
    const spd = G.vel.length();
    noise = glide ? 0 : 0.25 + 0.75*Math.min(1, spd/MAX_SPD);
    G.noLand = (G.noLand||0) - dt;
    G.nearSkin = null;
    if(G.noLand <= 0) for(const s of skins){
      const d = tmp.copy(s.pos).sub(G.pos);
      if(d.length() < s.r*2.2) G.nearSkin = s;
      if(d.length() < s.r && Math.abs(d.y) < 4){
        if(spd < LAND_SPD){ G.landed = s; G.vel.set(0,0,0); G.pos.set(G.pos.x, s.pos.y+1, G.pos.z); G.bites++; buzz(12); }
        else { G.vel.multiplyScalar(-0.6); s.person.alert += 0.6; G.noLand = 0.4; buzz(20); toast('速すぎて跳ねた。ゆっくり降りる'); }
        break;
      }
    }
    if(G.pos.z > WIN.z-4 && Math.abs(G.pos.x-WIN.x) < WIN.w/2 && Math.abs(G.pos.y-WIN.y) < WIN.h/2 && G.t > 3){
      return end(G.blood>0.02 ? 'clear' : 'empty');
    }
  }
  G.noise = 0;
  // 人ごとの警戒：耳もとの羽音・時間で少しずつ落ち着く
  for(const p of people){
    const dHead = G.pos.distanceTo(p.head);
    const near = Math.max(0, 1 - dHead/(70*p.o.hear));
    p.alert += noise*near*near*1.4*p.o.hear*dt;
    p.alert = Math.max(0, p.alert - 0.12*dt);
    G.noise = Math.max(G.noise, noise*(0.4+0.6*near));
    // 寝言
    p.talkT -= dt;
    if(p.talkT <= 0){ p.talkT = rnd(14, 26); const st = TEXT.stages.find(s=>s.id===S.id); const pt = st && st.people && st.people.find(q=>q.role===p.o.key);
      if(p.alert < 2 && pt && pt.sleeptalk && pt.sleeptalk.length) talk(`${p.o.label}「${pick(pt.sleeptalk)}」`); }
  }
  // 叩く（警戒4の人がいれば）
  G.cooldown -= dt;
  if(!G.swat && G.cooldown <= 0){ const p = people.find(q=>q.alert>=4); if(p){ G.swat = {t:0, at:G.pos.clone(), p, delay:p.o.swatDelay}; buzz([40,40,40]); } }
  if(G.swat){
    G.swat.t += dt;
    if(G.swat.t >= G.swat.delay){
      const flat = Math.hypot(G.pos.x-G.swat.at.x, G.pos.z-G.swat.at.z);
      if(flat < SWAT_R && Math.abs(G.pos.y-G.swat.at.y) < 30){ buzz(200); return end('out'); }
      G.swat.p.alert = 2.6; G.swat = null; G.cooldown = 2.5;
    }
  }
  if(G.hp <= 0) return end('smoke');
  if(G.t >= NIGHT_SEC) end('dawn');
  // 練習面の案内
  if(S.id===1){
    if(G.tut===0 && G.t>4.5){ G.tut=1; toast('左の指を上で上昇、右の指を上で前進'); }
    else if(G.tut===1 && G.nearSkin){ G.tut=2; toast('オレンジの輪へゆっくり降りる'); }
    else if(G.tut===2 && G.landed){ G.tut=3; toast('「吸う」を長押し。目が赤くなる前に離れる'); }
    else if(G.tut===3 && G.blood>.3 && !G.landed){ G.tut=4; toast('光っている窓から出ればクリア'); }
  }
}

function end(kind){

    empty:['素通り', '何も吸わずに出てしまった。', '', ''],

  }[kind];

  setTimeout(()=>show(`<h1>${D[0]}</h1><p>${D[1]}</p>${D[2]?`<p>${D[2]}</p>`:''}${D[3]?`<p class="q">${D[3]}</p>`:''}`,
    [['もうひと晩', ()=>reset(G.stage)], ...(G.stage+1<STAGES.length && kind==='clear' ? [['次の面', ()=>reset(G.stage+1)]] : []), ['面をえらぶ', title]]), kind==='out'?350:0);
}

const att = ui('att').getContext('2d');
function drawAtt(roll, pitch){
  const c = att, R = 56; c.clearRect(0,0,120,120); c.save(); c.translate(60,60);
  c.beginPath(); c.arc(0,0,R,0,Math.PI*2); c.clip();
  c.rotate(roll); c.fillStyle='#2c4a78'; c.fillRect(-80,-80,160,80+pitch); c.fillStyle='#5a4630'; c.fillRect(-80,pitch,160,80);
  c.strokeStyle='#ebe5d3'; c.lineWidth=1; for(let i=-2;i<=2;i++){ if(!i) continue; c.beginPath(); c.moveTo(-12,pitch+i*12); c.lineTo(12,pitch+i*12); c.stroke(); }
  c.restore(); c.strokeStyle='#e8a33a'; c.lineWidth=3; c.beginPath(); c.moveTo(30,60); c.lineTo(50,60); c.moveTo(70,60); c.lineTo(90,60); c.stroke();
  c.strokeStyle='rgba(235,229,211,.5)'; c.lineWidth=2; c.beginPath(); c.arc(60,60,R,0,Math.PI*2); c.stroke();
}
const back = V(), want = V();
function render(now, dt){
  if(!G){ renderer.render(scene, cam); return; }
  const tt = now/1000;
  // 人：息・寝返り・かゆがる・起きる
  for(const p of people){
    const lv = alertLevel(p.alert), br = Math.sin(tt*1.6 + p.o.x)*.5+.5;
    updateKake(p, br);
    p.anim += ((lv>=1?1:0) - p.anim)*Math.min(1, dt*2);
    p.parts.head.rotation.y = Math.sin(tt*.7+p.o.x)*.03 + p.anim*.22*(p.o.arm);
    const lift = lv>=3 ? .35 : 0; p.parts.head.rotation.x += (-lift - p.parts.head.rotation.x)*Math.min(1, dt*3);
    p.lids.forEach(l=>l.visible = lv<3); p.eyes.forEach(e=>e.visible = lv>=3);
    const sc = lv>=2 ? Math.sin(tt*14)*.08 + .1 : 0;   // かいている
    p.parts.arm.rotation.y += (sc*p.o.arm - p.parts.arm.rotation.y)*Math.min(1, dt*8);
    p.parts.arm.rotation.z += ((lv>=2? .12*p.o.arm : 0) - p.parts.arm.rotation.z)*Math.min(1, dt*4);
  }
  if(fan){ fan.fan.rotation.y = fan.phi; if(fan.on) fan.blades.rotation.z -= dt*28; }
  const sa = smokeGeo.attributes.position; sp.forEach((s,i)=>sa.setXYZ(i, s.p.x, s.p.y, s.p.z)); sa.needsUpdate = true;
  // 蚊
  mos.position.copy(G.pos);
  const lv = tmp.copy(G.vel).applyAxisAngle(Y, -G.yaw);
  G.roll += ((-lv.x/MAX_SPD)*0.6 - G.roll)*0.15; G.pitch += ((lv.z/MAX_SPD)*0.4 - G.pitch)*0.15;
  mos.rotation.set(G.pitch, G.yaw, G.roll, 'YXZ');
  const flap = G.landed ? 0 : Math.sin(now*0.09)*0.7;
  wL.rotation.z = flap; wR.rotation.z = -flap;
  const bk = 0.35 + G.blood*1.05; belly.scale.set(bk, bk, 2.2*bk);
  // カメラ：後ろ上から。縦画面は少し引いて広く
  const portrait = innerWidth < innerHeight;
  back.set(Math.sin(G.yaw), 0, Math.cos(G.yaw));
  want.copy(G.pos).addScaledVector(back, portrait?18:14).add(tmp.set(0, portrait?7:5, 0));
  const R = S.room;
  want.x = Math.max(-R.w/2+3, Math.min(R.w/2-3, want.x)); want.z = Math.max(-R.d/2+3, Math.min(R.d/2-3, want.z));
  want.y = Math.max(2, Math.min(R.h-3, want.y));
  cam.position.lerp(want, 0.2); cam.lookAt(G.pos.x, G.pos.y+1, G.pos.z);
  // 影と手
  if(G.swat){
    const k = Math.min(1, G.swat.t/G.swat.delay);
    shadow.position.set(G.swat.at.x, Math.max(0.3, G.swat.at.y-12), G.swat.at.z);
    shadow.material.opacity = 0.25 + 0.45*k;
    swatHand.visible = true; swatHand.position.set(G.swat.at.x, G.swat.at.y + 70*(1-k*k) + 6, G.swat.at.z);
  } else { shadow.material.opacity = 0; swatHand.visible = false; }
  rings.forEach((m,i)=>{ const s = skins[i]; m.material.opacity = G.landed===s ? .9 : (G.nearSkin===s ? .75 : .4); });
  // 計器
  const mins = Math.floor(G.t/NIGHT_SEC*360); const hh = (23 + Math.floor(mins/60))%24, mm = mins%60;
  ui('clock').textContent = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  ui('where').textContent = G.landed ? `${G.landed.person.o.label}の${G.landed.name}` : S.short;
  ui('alt').textContent = Math.round(G.pos.y)+'cm';
  ui('spd').textContent = Math.round(G.vel.length())+'cm/s';
  ui('blood').style.width = (G.blood*100)+'%'; ui('blood').style.background = G.blood>.75 ? 'var(--bad)' : 'var(--ok)';
  ui('hp').style.width = (G.hp*100)+'%'; ui('hp').style.background = G.hp<.35 ? 'var(--bad)' : 'var(--ok)';
  ui('noise').style.width = (G.noise*100)+'%'; ui('noise').style.background = G.noise>.6 ? 'var(--warn)' : 'var(--ok)';
  let worst = 0;
  people.forEach((p,k)=>{ const l = alertLevel(p.alert); worst = Math.max(worst, l); const el = ui('e'+k); if(!el) return;
    el.textContent = '●'.repeat(l) + '○'.repeat(4-l); el.style.color = l>=3 ? 'var(--bad)' : l>=2 ? 'var(--warn)' : 'var(--ink)'; });
  ui('state').textContent = G.swat ? `${G.swat.p.o.label}が叩く` : STATE_TXT[worst];
  ui('suck').classList.toggle('ready', !!G.landed);
  drawAtt(-G.roll*1.5, G.vel.y*0.5);
  if(toastT>0){ toastT -= dt; if(toastT<=0) ui('toast').style.opacity = 0; }
  if(talkT>0){ talkT -= dt; if(talkT<=0) ui('talk').style.opacity = 0; }
  renderer.render(scene, cam);
}
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  step(dt); render(now, dt); requestAnimationFrame(loop);
}
// 扇風機と線香を build から受け取る
makeFan = (o)=>{ const f = _makeFan(o); fan = f; return f; };
makeCoil = (o)=>{ const c = _makeCoil(o); coil = c; return c; };
function onResize(){ renderer.setSize(innerWidth, innerHeight); cam.aspect=innerWidth/innerHeight; cam.fov = cam.aspect<1 ? 82 : 70; cam.updateProjectionMatrix(); }
addEventListener('resize', onResize); onResize();
reset(0); G.state = 'title'; title();
requestAnimationFrame(loop);
window.__G = ()=>G; window.__people = ()=>people; window.__reset = reset; // 確認用
</script>
