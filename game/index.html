<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080F">
<meta name="description" content="暗い洞窟を、ついてくるホタルの群れごと導いて進む。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>トモシムレ</title>
<style>
  :root { --bg:#07080F; --cave:#1E2236; --fg:#F4F1EA; --accent:#FFC94A; --reward:#7FE0D4; --danger:#FF5A6E; --mut:#B8B4C8; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overscroll-behavior:none; touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; }
  #stage { position:fixed; inset:0; display:block; width:100vw; height:100dvh; }
  #ui { position:fixed; inset:0; pointer-events:none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #ui button { pointer-events:auto; min-width:44px; min-height:44px; cursor:pointer; }
  .hud { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; font-size:18px; font-weight:700; text-shadow:0 0 8px #000; }
  body:not(.playing) #hud { visibility:hidden; }
  .sub { font-size:13px; color:var(--mut); }
  .btn { font:inherit; font-size:16px; font-weight:700; padding:10px 18px; border-radius:999px; border:2px solid #3A4160; background:rgba(30,34,54,.9); color:var(--fg); }
  .btn:active { transform:scale(.97); }
  .btn.huge { font-size:24px; min-height:72px; width:100%; max-width:340px; border:0; background:var(--accent); color:#07080F; box-shadow:0 0 32px rgba(255,201,74,.45); }
  .btn.sm { min-height:44px; }
  .btn.warn { border-color:var(--danger); }
  .screen { position:absolute; inset:0; padding:inherit; display:flex; flex-direction:column; align-items:center; text-align:center; background:rgba(7,8,15,.62); pointer-events:auto; animation:fin .4s ease-out; box-sizing:border-box; }
  .screen .top { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:0 20px; }
  .screen .low { width:100%; padding:16px 20px 28px; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .logo { font-size:48px; font-weight:800; letter-spacing:.08em; color:var(--accent); text-shadow:0 0 24px rgba(255,201,74,.7), 0 0 4px #FFF3C4; }
  .tag { font-size:16px; color:var(--fg); }
  .orb { width:14px; height:14px; border-radius:50%; background:#FFF3C4; box-shadow:0 0 30px 14px rgba(255,201,74,.55); margin-top:24px; animation:breathe 4s ease-in-out infinite; }
  h2 { font-size:22px; margin:28px 0 8px; }
  .panels { flex:1; display:flex; flex-direction:column; gap:10px; width:100%; max-width:380px; padding:0 20px; box-sizing:border-box; overflow:auto; touch-action:pan-y; }
  .panel { display:flex; align-items:center; gap:14px; background:rgba(30,34,54,.8); border-radius:16px; padding:10px 14px; text-align:left; }
  .panel svg { width:72px; height:72px; flex:none; }
  .panel p { margin:0; font-size:15px; line-height:1.5; }
  .grid { flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:100%; max-width:380px; padding:0 16px; box-sizing:border-box; align-content:start; overflow:auto; touch-action:pan-y; }
  .cell { background:rgba(30,34,54,.7); border:2px dashed #3A4160; border-radius:14px; min-height:84px; padding:8px 6px; display:flex; flex-direction:column; justify-content:center; gap:4px; }
  .cell b { font-size:15px; color:var(--mut); } .cell small { font-size:12px; color:var(--mut); line-height:1.3; }
  .cell.on { border:2px solid var(--accent); background:rgba(255,201,74,.1); } .cell.on b { color:var(--accent); } .cell.on small { color:var(--fg); }
  .rows { flex:1; width:100%; max-width:380px; padding:0 20px; box-sizing:border-box; display:flex; flex-direction:column; gap:10px; }
  .srow { display:flex; justify-content:space-between; align-items:center; min-height:52px; font-size:17px; border-bottom:1px solid #2A3050; }
  .tgl { min-width:72px !important; min-height:44px; border-radius:999px; border:2px solid #3A4160; background:#1E2236; color:var(--fg); font:inherit; font-size:15px; font-weight:700; }
  .tgl[aria-checked="true"] { background:var(--accent); color:#07080F; border-color:var(--accent); }
  .confirm { background:rgba(255,90,110,.12); border:1px solid var(--danger); border-radius:14px; padding:12px; } .confirm p { margin:0 0 10px; font-size:15px; line-height:1.5; }
  .huge-num { font-size:72px; font-weight:800; color:var(--accent); text-shadow:0 0 28px rgba(255,201,74,.6); line-height:1; }
  .newbest { color:var(--reward); font-weight:700; font-size:16px; }
  .stats { margin:8px 0 0; display:flex; flex-direction:column; gap:6px; width:100%; max-width:320px; }
  .stats div { display:flex; justify-content:space-between; font-size:15px; border-bottom:1px solid #2A3050; padding-bottom:4px; } .stats dt { color:var(--mut); } .stats dd { margin:0; font-weight:700; }
  #hint { position:fixed; left:0; right:0; top:22%; text-align:center; font-size:18px; font-weight:700; text-shadow:0 0 10px #000, 0 0 3px #000; pointer-events:none; padding:0 24px; transition:opacity .4s; }
  #colors { display:flex; gap:6px; justify-content:center; }
  #colors button { width:44px; height:44px; border-radius:50%; border:3px solid #3A4160; background:var(--c); padding:0; }
  #colors button[aria-pressed="true"] { border-color:var(--fg); box-shadow:0 0 14px var(--c); }
  #colors button:disabled { opacity:.25; }
  [hidden] { display:none !important; }
  @keyframes fin { from { opacity:0 } to { opacity:1 } }
  @keyframes breathe { 50% { opacity:.55; transform:scale(.85) } }
  @media (prefers-reduced-motion: reduce) { .screen, .orb { animation:none } }
  html.calm .screen, html.calm .orb { animation:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="ui">
  <div id="hud"><div class="hud"><span>ひかり <span id="score">0</span></span><span id="layer"></span><span>群れ <span id="count">5</span></span></div>
  <div class="hud sub" style="padding-top:0"><span id="best">ベスト 0</span></div></div>
  <div id="hint" hidden aria-live="polite"></div>
  <div id="screens"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
