<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1C1915">
<meta name="description" content="暗い洞窟を、ついてくるホタルの群れごと導いて進む。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>トモシムレ</title>
<style>
  /* パレット: 墨 / 楮(こうぞ紙) / 蛍 / 朱 / 藍 / 薄紅。書体は同梱サブセット（外部通信なし）。読めなくても遊べるようフォールバックを書く */
  @font-face { font-family:"Yuji Boku"; src:url(fonts/yuji-boku.woff2) format("woff2"); font-display:swap; }
  @font-face { font-family:"Kiwi Maru"; font-weight:500; src:url(fonts/kiwi-maru-500.woff2) format("woff2"); font-display:swap; }
  :root {
    --sumi:#1C1915; --kozo:#DDD4B8; --hotaru:#C6DA3C; --shu:#D2432B; --ai:#2F4F7A; --usu:#E8A3A0;
    --kozo-d:#A39C84; --sumi-l:#5B5543; --paper-hi:#E6DFC9;
    --f-disp:"Yuji Boku","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    --f-body:"Kiwi Maru","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .11 0 0 0 0 .1 0 0 0 0 .08 .9 0 0 0 -.42'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    --squig:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='6' viewBox='0 0 60 6'><path d='M0 3.4 C6 1.4 10 5 17 3 S27 1.6 33 3.4 S45 5 52 2.6 S58 3 60 3' fill='none' stroke='%23A39C84' stroke-width='1.6' stroke-linecap='round'/></svg>");
    --squig-k:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='6' viewBox='0 0 60 6'><path d='M0 3.4 C6 1.4 10 5 17 3 S27 1.6 33 3.4 S45 5 52 2.6 S58 3 60 3' fill='none' stroke='%231C1915' stroke-width='1.6' stroke-linecap='round'/></svg>");
  }
  html,body { margin:0; height:100%; background:var(--sumi); color:var(--kozo); font-family:var(--f-body); font-synthesis:none;
    overscroll-behavior:none; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #stage { position:fixed; inset:0; display:block; width:100vw; height:100dvh; }
  #ui { position:fixed; inset:0; pointer-events:none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #ui button { pointer-events:auto; min-width:44px; min-height:44px; cursor:pointer; }
  button:focus-visible { outline:3px solid var(--hotaru); outline-offset:3px; }
  .paper button:focus-visible { outline-color:var(--shu); }
  /* HUD: 上端は常に墨の中。紙色の字 */
  .hud { display:flex; justify-content:space-between; align-items:baseline; padding:12px 18px 0; font-size:13px; text-shadow:0 0 6px var(--sumi), 0 0 2px var(--sumi); }
  .hud .n { font-family:var(--f-disp); font-size:26px; font-variant-numeric:tabular-nums; margin-left:4px; }
  #layer { font-family:var(--f-disp); font-size:18px; padding-bottom:3px; background:var(--squig) repeat-x bottom/60px 6px; }
  body:not(.playing) #hud { visibility:hidden; }
  .sub { font-size:13px; color:var(--kozo-d); }
  .hud.sub { padding-top:2px; }
  .paper .sub { color:var(--sumi-l); }
  #t-best { font-family:var(--f-disp); font-size:16px; margin-top:2px; }
  /* ボタン: 通常は字だけ（筆の下線）。主役の1つだけが蛍色の版。 */
  .btn { font:inherit; font-size:17px; padding:8px 12px; border:0; background:var(--squig) repeat-x bottom 6px center/60px 6px; color:inherit; border-radius:0; }
  .paper .btn { background-image:var(--squig-k); }
  .btn:active { transform:translateY(2px); }
  .btn.huge { font-family:var(--f-disp); font-size:30px; letter-spacing:.12em; min-height:72px; width:100%; max-width:320px; color:var(--sumi); background:var(--hotaru);
    border:2px solid var(--sumi); border-radius:5px 13px 6px 15px / 14px 6px 13px 5px; box-shadow:5px 6px 0 var(--kozo); }
  .btn.huge:active { transform:translate(4px,5px); box-shadow:1px 1px 0 var(--kozo); }
  .btn.sm { min-height:44px; }
  .btn.warn { color:var(--shu); background-image:none; border:2px solid var(--shu); border-radius:4px 10px 5px 9px; }
  .paper .btn.warn { color:#A8301C; border-color:#A8301C; }
  .screen { z-index:2; position:absolute; inset:0; padding:inherit; display:flex; flex-direction:column; align-items:center; text-align:center; background:var(--sumi) var(--grain); color:var(--kozo); pointer-events:auto; animation:fin .4s ease-out; box-sizing:border-box; }
  .screen.paper { background-color:var(--kozo); color:var(--sumi); align-items:stretch; text-align:left; }
  .screen.veil { background:rgba(28,25,21,.84) var(--grain); }
  .screen .top { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:0 20px; min-height:0; }
  .screen .low { width:100%; padding:16px 20px 28px; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .paper .low { align-items:flex-start; }
  .row { display:flex; gap:4px 10px; flex-wrap:wrap; justify-content:center; }
  /* タイトル: 墨の中に、光でぬぐわれた紙の輪。題字は縦書き */
  .lit { position:relative; height:min(400px,52dvh); aspect-ratio:320/400; }
  .lit svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .logo { position:absolute; right:17%; top:12%; margin:0; writing-mode:vertical-rl; font-family:var(--f-disp); font-weight:400; font-size:min(15vw,7.4dvh); letter-spacing:.06em; line-height:1; color:var(--sumi); }
  .tag { position:absolute; left:20%; top:20%; margin:0; writing-mode:vertical-rl; font-size:15px; letter-spacing:.14em; color:var(--sumi-l); }
  .orb { position:absolute; left:34%; bottom:11%; width:18px; height:18px; border-radius:50%; background:var(--hotaru); box-shadow:-3px 3px 0 0 var(--sumi); animation:breathe 4s ease-in-out infinite; }
  h2 { font-family:var(--f-disp); font-weight:400; font-size:32px; margin:28px 24px 12px; align-self:flex-start; padding-bottom:4px; background:var(--squig-k) repeat-x bottom/60px 6px; }
  .screen.veil h2 { align-self:center; background:none; }
  .panels { flex:1; display:flex; flex-direction:column; justify-content:center; gap:22px; width:100%; max-width:400px; align-self:center; padding:0 24px; box-sizing:border-box; overflow:auto; touch-action:pan-y; }
  .panel { display:flex; align-items:center; gap:16px; padding:6px 0; }
  .panel:nth-child(even) { flex-direction:row-reverse; text-align:right; margin-left:28px; }
  .panel:nth-child(odd) { margin-right:28px; }
  .panel svg { width:104px; height:104px; flex:none; }
  .panel p { margin:0; font-size:16px; line-height:1.7; text-wrap:pretty; }
  .grid { flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:12px 10px; width:100%; max-width:400px; align-self:center; padding:6px 22px 10px; box-sizing:border-box; align-content:start; overflow:auto; touch-action:pan-y; }
  .cell { background:transparent; border:2px dashed #8C8568; border-radius:2px; min-height:92px; padding:8px 6px; display:flex; flex-direction:column; justify-content:center; gap:4px; color:var(--sumi-l); transform:rotate(-1deg); }
  .cell:nth-child(3n+2) { transform:rotate(.7deg); } .cell:nth-child(3n) { transform:rotate(-.3deg); }
  .cell b { font-size:15px; font-weight:500; } .cell small { font-size:12px; line-height:1.4; }
  .cell.on { border:2px solid var(--sumi); background:var(--paper-hi); color:var(--sumi); box-shadow:3px 3px 0 var(--hotaru); }
  .cell.on b { font-family:var(--f-disp); font-size:16px; }
  .rows { flex:1; width:100%; max-width:400px; align-self:center; padding:0 24px; box-sizing:border-box; display:flex; flex-direction:column; gap:6px; }
  .srow { display:flex; justify-content:space-between; align-items:center; min-height:56px; font-size:18px; background:var(--squig-k) repeat-x bottom/60px 6px; }
  .tgl { min-width:72px !important; min-height:44px; border-radius:4px 10px 5px 9px; border:2px solid var(--sumi); background:transparent; color:var(--sumi); font:inherit; font-size:16px; }
  .tgl[aria-checked="true"] { background:var(--sumi); color:var(--kozo); box-shadow:3px 3px 0 var(--hotaru); }
  .confirm { border:2px solid #A8301C; border-radius:3px 12px 4px 10px; padding:12px; background:rgba(210,67,43,.1); } .confirm p { margin:0 0 8px; font-size:15px; line-height:1.6; }
  .huge-num { font-family:var(--f-disp); font-size:92px; color:var(--hotaru); line-height:1; font-variant-numeric:tabular-nums; }
  .newbest { display:inline-block; border:2px solid var(--shu); border-radius:3px; padding:5px 12px; font-size:15px; transform:rotate(-2.5deg); }
  .stats { margin:10px 0 0; display:flex; flex-direction:column; gap:8px; width:100%; max-width:320px; }
  .stats div { display:flex; align-items:baseline; gap:8px; font-size:15px; } .stats dt { color:var(--kozo-d); order:1; }
  .stats div::after { content:""; order:2; flex:1; border-bottom:2px dotted rgba(221,212,184,.3); }
  .stats dd { margin:0; order:3; font-family:var(--f-disp); font-size:20px; }
  .pbtn { position:fixed; right:calc(10px + env(safe-area-inset-right)); top:calc(64px + env(safe-area-inset-top)); width:44px; height:44px; border-radius:48% 52% 46% 54%; border:2px solid var(--kozo-d); background:var(--sumi); padding:0; display:flex; align-items:center; justify-content:center; }
  body:not(.playing) .pbtn { display:none; }
  #hint { z-index:0; position:fixed; left:0; right:0; top:22%; text-align:center; font-size:18px; color:var(--kozo); text-shadow:0 0 10px var(--sumi), 0 0 4px var(--sumi); pointer-events:none; padding:0 24px; transition:opacity .4s; }
  #colors { display:flex; gap:6px; justify-content:center; }
  #colors button { width:44px; height:44px; border-radius:52% 48% 55% 45%; border:2px solid var(--kozo-d); background:var(--c); padding:0; }
  #colors button[aria-pressed="true"] { border-color:var(--kozo); box-shadow:3px 3px 0 var(--kozo-d); }
  #colors button:disabled { opacity:.25; }
  [hidden] { display:none !important; }
  @keyframes fin { from { opacity:0 } to { opacity:1 } }
  @keyframes breathe { 50% { opacity:.55; transform:scale(.85) } }
  @media (prefers-reduced-motion: reduce) { .screen, .orb { animation:none } }
  html.calm .screen, html.calm .orb { animation:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="ui">
  <div id="hud"><div class="hud"><span>ひかり<span id="score" class="n">0</span></span><span id="layer"></span><span>群れ<span id="count" class="n">5</span></span></div>
  <div class="hud sub"><span id="best">ベスト 0</span></div></div>
  <button id="b-pause" class="pbtn" aria-label="ひとやすみ"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="8" cy="12" r="3.2" fill="#DDD4B8"/><circle cx="16" cy="12" r="3.2" fill="#DDD4B8" opacity=".6"/></svg></button>
  <div id="pause" class="screen veil" hidden role="dialog" aria-label="ひとやすみ"><div class="top"><h2>ひとやすみ</h2><button class="btn huge" id="p-resume">つづける</button><button class="btn sm" id="p-title">タイトルへ</button></div></div>
  <div id="hint" hidden aria-live="polite"></div>
  <div id="screens"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
