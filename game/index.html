<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080F">
<meta name="description" content="暗い洞窟を、ついてくるホタルの群れごと導いて進む。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>トモシムレ</title>
<style>
  :root { --bg:#07080F; --fg:#F4F1EA; --accent:#FFC94A; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overscroll-behavior:none; touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; }
  #stage { position:fixed; inset:0; display:block; width:100vw; height:100dvh; }
  #ui { position:fixed; inset:0; pointer-events:none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #ui button { pointer-events:auto; min-width:44px; min-height:44px; }
  .hud { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; font-size:18px; font-weight:700; }
  .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; background:rgba(7,8,15,.55); }
  .center .lower { margin-top:15vh; }
  .sub { font-size:12px; color:#B8B4C8; }
  .big { font-size:28px; font-weight:800; }
  .btn { font:inherit; font-size:20px; font-weight:700; padding:14px 32px; border-radius:999px; border:0; background:var(--accent); color:#07080F; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="ui">
  <div class="hud"><span>ひかり <span id="score">0</span></span><span id="layer"></span><span>群れ <span id="count">5</span></span></div>
  <div class="hud sub" style="padding-top:0"><span id="best">ベスト 0</span></div>
  <div class="center" id="title"><div class="big">トモシムレ</div><div>ひかりを つれて、おくへ。</div><div class="sub">画面をドラッグして、群れを導く</div><button class="btn lower" id="start">ともす</button></div>
  <div class="center" id="result" hidden><div class="big" id="final"></div><button class="btn lower" id="retry">もう一度 ともす</button></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
