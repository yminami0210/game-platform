<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101018">
<meta name="description" content="GAME_DESCRIPTION">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>GAME_TITLE</title>
<style>
  :root { --bg:#101018; --fg:#f4f1ea; --accent:#ffb000; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overscroll-behavior:none; touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; }
  #stage { position:fixed; inset:0; display:block; width:100vw; height:100dvh; }
  #ui { position:fixed; inset:0; pointer-events:none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #ui button { pointer-events:auto; min-width:44px; min-height:44px; }
  .hud { display:flex; justify-content:space-between; padding:12px 16px; font-size:18px; font-weight:700; }
  .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; }
  .big { font-size:28px; font-weight:800; }
  .btn { font:inherit; font-size:20px; font-weight:700; padding:14px 32px; border-radius:999px; border:0; background:var(--accent); color:#101018; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="ui">
  <div class="hud"><span id="score">0</span><span id="best">BEST 0</span></div>
  <div class="center" id="title"><div class="big">GAME_TITLE</div><div>画面の左右をタップしてよける</div><button class="btn" id="start">はじめる</button></div>
  <div class="center" id="result" hidden><div class="big" id="final"></div><button class="btn" id="retry">もう1回</button></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
