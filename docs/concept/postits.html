<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポストイット一覧</title>
<style>
:root{--bg:#ece7df;--ink:#2a2520;--sub:#6b6158;--y:#fff3a8;--p:#ffd3df;--b:#cfe8ff;--g:#d6f2c9;--o:#ffe0bd;--v:#e6dcff;--w:#f2f2f2;--star:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1816;--ink:#2a2520;--sub:#b3a89c}}
:root[data-theme="dark"]{--bg:#1a1816;--ink:#2a2520;--sub:#b3a89c}
body{margin:0;background:var(--bg);font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:1100px;margin:0 auto;padding:18px 16px 48px}
h1{font-size:20px;margin:0 0 4px;color:var(--sub)}
h2{font-size:15px;margin:22px 0 8px;color:var(--sub)}
.lead{font-size:13px;color:var(--sub);margin:0 0 10px}
.board{display:flex;flex-wrap:wrap;gap:8px}
.n{width:150px;min-height:70px;padding:8px 9px;font-size:12px;line-height:1.45;color:var(--ink);box-shadow:1px 2px 3px rgba(0,0,0,.18);position:relative}
.n .who{display:block;font-size:10px;opacity:.65;margin-top:4px}
.n.star{outline:2px solid var(--star)}
.n.star::after{content:"★";position:absolute;top:-8px;right:-6px;color:var(--star);font-size:16px}
@media (max-width:480px){.n{width:calc(50% - 4px);box-sizing:border-box}}
</style>
</head>
<body>
<main>
<h1>貼り出したポストイット（全量）</h1>
<p class="lead">色＝誰が出したか。★＝コンセプトにつながったもの。段階1は悪口、段階2は3つの悪口をズラして出た付箋。</p>
<div id="root"></div>
</main>

for(const [title,c,notes] of S){
 const h=document.createElement('h2');h.textContent=title+'（'+notes.length+'枚）';root.appendChild(h);
 const b=document.createElement('div');b.className='board';
