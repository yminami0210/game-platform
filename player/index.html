<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あそびば</title>
<meta name="description" content="毎朝ひとつ、新しい演目がかかるミニゲームの遊び場。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Potta+One&family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/player.css">
</head>
<body>
<main class="page" id="page">
  <section class="stage" id="stage" aria-label="舞台">
    <div class="pulled" id="pulled" aria-hidden="true"><img alt="" id="pulled-img"><span class="daiji" id="pulled-title"></span></div>
    <header class="beam wood">
      <div class="plank"><h1 class="sign" aria-label="あそびば"><span>あ</span><span>そ</span><span>び</span><span>ば</span></h1><i class="nail"></i><i class="nail r"></i></div>
      <p class="sub">毎朝ひとつ、新しい演目がかかります。</p>
      <span class="back-wrap"><button class="back" id="back" type="button">演目にもどる</button></span>
    </header>
    <div class="box wood">
      <div class="window" id="window">
        <div class="behind" id="behind"></div>
        <div class="card-out" id="stage-card">
          <img alt="" id="stage-img" hidden>
          <span class="new" id="stage-new" hidden>新作</span>
          <h2 class="daiji" id="stage-title">あそびば</h2>
        </div>
      </div>
      <div class="door l wood" aria-hidden="true"><i></i><i></i></div>
      <div class="door r wood" aria-hidden="true"><i></i><i></i></div>
    </div>
    <div class="script" id="script">
      <p id="script-text">演目を読み込んでいます。</p>
      <div class="act"><span class="stamp" id="stage-stamp" hidden>はじめて</span><button class="play" id="play" type="button" hidden>遊ぶ</button></div>
    </div>
  </section>

  <section class="stack" id="stack" aria-labelledby="h-stack" hidden>
    <h2 id="h-stack">これまでの演目<small id="stack-count"></small></h2>
    <ol id="stack-list"></ol>
  </section>
</main>
<p class="vh" id="live" aria-live="polite"></p>
<script>
// ファイルを直接開くと（file://）演目もモジュールも読めないので、開き方を出す
if (location.protocol === "file:") {
  document.getElementById("stage-title").textContent = "演目が読めません";
  document.getElementById("script-text").innerHTML =
    "このページはファイルを直接開くと演目を読めません。リポジトリのいちばん上のフォルダで <code>npx serve .</code> か <code>python3 -m http.server</code> を動かし、<code>http://localhost:&lt;番号&gt;/player/</code> を開いてください。";
}
</script>
<noscript><style>#script-text{display:none}</style><p style="margin:16px">あそびばは JavaScript を使います。ブラウザの設定で JavaScript を有効にしてください。</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
