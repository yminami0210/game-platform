<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あそびば</title>
<meta name="description" content="毎朝ひとつ、新しい演目がかかるミニゲームの遊び場。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Potta+One&family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/player.css">
</head>
<body>
<main class="page" id="page">
  <header class="beam marquee wood">
    <div class="plank"><h1 class="sign" aria-label="あそびば"><span>あ</span><span>そ</span><span>び</span><span>ば</span></h1><i class="nail"></i><i class="nail r"></i></div>
    <p class="sub">毎朝ひとつ、新しい演目がかかります。</p><!-- 梁の右に画鋲で留めた紙片 -->
  </header>

  <div class="script notice" id="notice"><p id="notice-text">演目を読み込んでいます。</p></div>

  <section class="board" aria-label="演目">
    <ol class="cards" id="cards"></ol>
  </section>
</main>

<!-- 舞台: 札を押すと現れ、扉が開いて札が抜かれ、奥でゲームが始まる -->
<div class="playroom" id="playroom">
  <section class="stage" id="stage" aria-label="舞台">
    <div class="pulled" id="pulled" aria-hidden="true"><div class="pic"><img alt="" id="pulled-img"><span class="tag" id="pulled-title"></span></div></div>
    <header class="beam wood">
      <span class="back-wrap"><button class="back" id="back" type="button">演目にもどる</button></span>
    </header>
    <div class="box wood">
      <div class="window" id="window">
        <div class="behind" id="behind"></div>
        <div class="oku" aria-hidden="true"></div>
        <!-- 一覧の札と同じ 4:3 の絵札（同じ絵・題字の札・貼り紙）。扉が開くと横へ抜かれる -->
        <div class="card-out" id="stage-card" aria-hidden="true">
          <div class="pic"><img alt="" id="stage-img" hidden><span class="new" id="stage-new" hidden>新作</span><span class="tag" id="stage-title"></span></div>
        </div>
      </div>
      <div class="door l wood" aria-hidden="true"><i></i><i></i></div>
      <div class="door r wood" aria-hidden="true"><i></i><i></i></div>
    </div>
  </section>
</div>
<p class="vh" id="live" aria-live="polite"></p>
<script>
// ファイルを直接開くと（file://）演目もモジュールも読めないので、開き方を出す
if (location.protocol === "file:") {
  document.getElementById("notice-text").innerHTML =
    "このページはファイルを直接開くと演目を読めません。リポジトリのいちばん上のフォルダで <code>npx serve .</code> か <code>python3 -m http.server</code> を動かし、<code>http://localhost:&lt;番号&gt;/player/</code> を開いてください。";
}
</script>
<noscript><style>#notice-text{display:none}</style><p style="margin:16px">あそびばは JavaScript を使います。ブラウザの設定で JavaScript を有効にしてください。</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
